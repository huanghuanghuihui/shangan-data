function showImportPreview(parsed, srcName, warns, ctx){
  const warnList = (warns || []).filter(Boolean);
  const _ctx = ctx || {};
  /* 每题的图片数量（含 imgs[] 与 expImgs[] 多图） */
  const imgCountOf = p => ((p.imgs && p.imgs.length) ? p.imgs.length : (p.img ? 1 : 0));
  const expImgCountOf = p => ((p.expImgs && p.expImgs.length) ? p.expImgs.length : (p.expImg ? 1 : 0));
  const preview = parsed.slice(0, 12).map((p,i)=>(
    '<div style="padding:8px 10px;border-bottom:1px dashed #eee;font-size:calc(var(--fs-btn) - 1px);">'+
      '<b>'+(i+1)+'.</b> '+esc((p.q||'(纯图片题)').slice(0,50))+
      (p.q && p.q.length > 50 ? '…' : '')+
      (imgCountOf(p) ? ' <span class="pill mint" style="font-size:10px;">题目图 '+imgCountOf(p)+'</span>' : '')+
      (expImgCountOf(p) ? ' <span class="pill lav" style="font-size:10px;">解析图 '+expImgCountOf(p)+'</span>' : '')+
      (p.right ? ' <span class="pill grey" style="font-size:10px;">答案 '+esc(String(p.right).slice(0,6))+'</span>' : '')+
      (p.exp ? ' <span class="pill" style="font-size:10px;">含解析</span>' : '')+
    '</div>'
  )).join('');
  const totalQ = parsed.reduce((s,p)=>s+imgCountOf(p),0);
  const totalE = parsed.reduce((s,p)=>s+expImgCountOf(p),0);
  const warnHtml = warnList.length
    ? '<div style="background:#FFF8E6;border:1.5px solid #F2DDA8;border-radius:14px;padding:9px 12px;margin-bottom:10px;font-size:calc(var(--fs-btn) - 1px);color:#8A6A12;line-height:1.7;">'+
        '⚠️ <b>解析提示（'+warnList.length+'）</b><br>'+
        warnList.slice(0,6).map(w=>'· '+esc(w)).join('<br>')+
        (warnList.length > 6 ? '<br>… 还有 '+(warnList.length-6)+' 条' : '')+
      '</div>'
    : '';
  openModal('📂 导入预览 · '+srcName,
    warnHtml+
    '<div style="font-size:var(--fs-btn);color:var(--text2);margin-bottom:10px;text-align:center;">'+
      '共识别到 <b style="color:var(--pinkDeep2);">'+parsed.length+'</b> 道错题 ｜ 题目图 '+
      '<b style="color:#3E8A68;">'+totalQ+'</b> 张 ｜ 解析图 <b style="color:#7A63C4;">'+totalE+'</b> 张'+
    '</div>'+
    '<div style="max-height:250px;overflow-y:auto;border:1.5px solid var(--line);border-radius:18px;padding:4px 10px;background:#FFFDFC;">'+
      preview + (parsed.length > 12 ? '<div style="text-align:center;color:var(--text3);font-size:var(--fs-btn);padding:8px;">… 还有 '+(parsed.length-12)+' 条</div>' : '')+
    '</div>'+
    '<div style="font-size:calc(var(--fs-btn) - 2px);color:var(--text3);margin-top:10px;">导入后可在「收集箱」中点击编辑继续完善板块、错因、解析等信息。</div>',
    [
      {text:'确认导入', primary:true, onClick:()=>{
        /* 【P1/P2+ 铁律 2、9】三段式 + 分批 + 断点续传：
             ① 图片分批写入 IDB（每批 50 张一事务）；失败整体中止，S 不动
             ② 全部成功后逐条追加到 S
             ③ 落盘 + 回读抽样校验，失败则回滚
           全程三阶段进度遮罩，写入进度持久化到 S._importProgress 支持断点续做。 */
        (async ()=>{
          const fp = _ctx.fp || null;
          const snapshot = JSON.parse(JSON.stringify(S.wrong));
          const snapAll = JSON.parse(JSON.stringify(S));   // 完整快照（含 _importProgress）
          const written = [];
          let cancelled = false;
          const startIdx = (_ctx.resume && _ctx.resume.stage === 'write' && _ctx.resume.done > 0)
            ? Math.min(_ctx.resume.done, parsed.length) : 0;

          try{
            const total = parsed.length;
            const IMG_BATCH = 50;    // 图片每批 50 张一事务
            const Q_BATCH = 100;     // 错题每批 100 条

            /* ---------- 阶段 1：解析（已完成，此处仅展示） ---------- */
            runImportOverlay(1, '解析完成，共 ' + total + ' 道错题');
            await new Promise(r=>setTimeout(r, 200));

            /* ---------- 阶段 2：写入图片（分批 + 可取消） ---------- */
            runImportOverlay(2, '正在写入图片…', 0, total, ()=>{ cancelled = true; });
            const appended = [];
            let pendingImgs = [];
            const flushImgs = async ()=>{
              if(!pendingImgs.length) return;
              const batch = pendingImgs.slice(0, IMG_BATCH);
              const ids = await imgStore.putMany(batch.map(b=>({base64OrBlob:b})));
              written.push(...ids);
              pendingImgs = pendingImgs.slice(IMG_BATCH);
            };
            for(let i=startIdx;i<total;i++){
              if(cancelled) throw new Error('__CANCELLED__');
              const p = parsed[i];
              const imgs    = (p.imgs && p.imgs.length) ? p.imgs.slice() : (p.img ? [p.img] : []);
              const expImgs = (p.expImgs && p.expImgs.length) ? p.expImgs.slice() : (p.expImg ? [p.expImg] : []);
              let imgIds = [], expImgIds = [];
              if(imgs.length){
                // 单题图片通常 ≤ 5 张，直接一次事务写；超大列表走分批
                if(imgs.length > IMG_BATCH){
                  for(let k=0;k<imgs.length;k+=IMG_BATCH){
                    const seg = imgs.slice(k, k+IMG_BATCH);
                    const ids = await imgStore.putMany(seg.map(b=>({base64OrBlob:b})));
                    imgIds.push(...ids); written.push(...ids);
                  }
                }else{
                  imgIds = await imgStore.putMany(imgs.map(b=>({base64OrBlob:b})));
                  written.push(...imgIds);
                }
              }
              if(expImgs.length){
                if(expImgs.length > IMG_BATCH){
                  for(let k=0;k<expImgs.length;k+=IMG_BATCH){
                    const seg = expImgs.slice(k, k+IMG_BATCH);
                    const ids = await imgStore.putMany(seg.map(b=>({base64OrBlob:b})));
                    expImgIds.push(...ids); written.push(...ids);
                  }
                }else{
                  expImgIds = await imgStore.putMany(expImgs.map(b=>({base64OrBlob:b})));
                  written.push(...expImgIds);
                }
              }
              appended.push({
                id: uid(), q: p.q,
                imgIds: imgIds, imgId: imgIds[0] || '',
                expImgIds: expImgIds, expImgId: expImgIds[0] || '',
                cat: p.cat, reason: p.reason, right: p.right, prev: p.prev,
                tags: p.tags, exp: p.exp, source: p.source, wrongType: p.wrongType,
                note: p.note || '',
                date: todayStr(), ts: Date.now(),
                reviewCount: 0, rightCount: 0, wrongCount: 0, vagueCount: 0, favorite: false, vagueNext: ''
              });
              if((i+1) % 10 === 0 || i === total-1){
                runImportOverlay(2, '正在写入错题 ' + (i+1) + ' / ' + total + '（图片 ' + written.length + ' 张）', i+1, total, ()=>{ cancelled = true; });
                // 断点持久化（每 10 条一次，避免过于频繁写盘）
                if(fp) importProgressSet(fp, 'write', i+1, total);
                await new Promise(r=>setTimeout(r, 0));
              }
            }
            if(cancelled) throw new Error('__CANCELLED__');

            /* ---------- 阶段 3：校验 + 提交 ---------- */
            runImportOverlay(3, '正在校验数据…');
            if(written.length){
              const sample = Array.from(new Set(written)).slice(0, 10);
              const m = await imgStore.getMany(sample);
              if(m.size !== sample.length) throw new Error('图片写入校验未通过');
            }
            appended.forEach(a=>{
              S.wrong.push(a);
              (a.tags||[]).forEach(t=>pushHistory('historyTags', t));
              pushHistory('historyReasons', a.reason);
              if(a.source) pushHistory('historySources', a.source);
              if(a.wrongType) pushHistory('historyWrongTypes', a.wrongType);
            });
            /* 随机抽 10 条比对文字完整性 */
            try{
              const picks = S.wrong.length > 10 ? S.wrong.slice().sort(()=>Math.random()-0.5).slice(0,10) : S.wrong;
              if(picks.some(w=>!w || typeof w.id !== 'string')) throw new Error('导入后抽样校验未通过');
            }catch(e){ console.warn('[导入] 抽样校验', e); }

            /* 【P2】safeSaveFull 已异步化，关键路径必须 await */
            const ok = await safeSaveFull();
            if(!ok){
              S.wrong = snapshot;                      // 回滚
              throw new Error('数据落盘失败，已回滚');
            }
            /* 清断点 */
            if(fp) importProgressClear();
            hideImportOverlay();
            // 【P1】记录可撤销的导入（24 小时）
            // ★ 必须存「完整状态快照」而非仅 S.wrong —— undoLastImport() 执行 S = snap，
            //   若只存数组会把整个 state 替换成数组导致数据损坏（务必用 snapAll）
            UNDO_IMPORT = { ts: Date.now(), kind:'wrong-' + srcName, snapshot: snapAll, written: written.slice() };
            renderPage();
            const skipped = startIdx > 0 ? ('（跳过已完成 ' + startIdx + ' 条）') : '';
            toast('已导入 ' + (parsed.length - startIdx) + ' 道错题 📥' + skipped + '（24 小时内可撤销）');
          }catch(err){
            console.error('[导入错题] 失败', err);
            const isCancel = err && err.message === '__CANCELLED__';
            S.wrong = snapshot;                        // 铁律 2：绝不留半新半旧
            /* 恢复完整快照（含 _importProgress，保留断点供下次续做） */
            S.studyLog = snapAll.studyLog; S.timerLog = snapAll.timerLog;
            S.historyTags = snapAll.historyTags; S.historyReasons = snapAll.historyReasons;
            S.historySources = snapAll.historySources; S.historyWrongTypes = snapAll.historyWrongTypes;
            /* 本次写入的图片清掉（避免孤儿）；断点进度保留，便于下次跳过已解析部分 */
            try{ await imgStore.deleteMany(written); }catch(e){}
            hideImportOverlay();
            try{ safeSaveFull(); }catch(e){}
            try{ renderPage(); }catch(e){}
            if(isCancel){
              openModal('⏸ 导入已取消', '<p style="line-height:1.9">导入已中止，<b>现有数据未受任何影响</b>。</p>'
                + '<p style="line-height:1.9;color:var(--muted)">下次选择同一个文件导入时，可以从上次位置继续。</p>',
                [{text:'我知道了', primary:true}]);
            }else{
              openModal('⚠️ 导入失败', '<p style="line-height:1.9">导入过程中出现错误，<b>已完整回滚</b>。</p>'
                + '<p style="line-height:1.9;color:var(--muted)">' + esc(err && err.message ? err.message : String(err)) + '<br>'
                + '你原有的错题数据<b>未受任何影响</b>。</p>', [
                {text:'下载诊断信息', onClick:()=>{ downloadImportDiag({name:srcName, size:0}, err); return false; } },
                {text:'我知道了', primary:true}
              ]);
            }
          }
        })();
      }},
      {text:'取消'}
    ]);
}

/* ============================================================
   沉浸式复习模式
   机制：所有题提交一次后 → 做错/模糊题重新排队
         → 每题直到某次选择"做对了"才移除
   ============================================================ */
/* ============================================================
   沉浸式复习模式
   机制：当天全部题目提交一次后 → 仅「模糊 / 做错了」的题重做
        → 每题直到某次选择"做对了"才移出重做队列
        → 重做队列清空后自动结束复习
        → 所有 做对/做错/模糊 次数均计入统计
   ============================================================ */
let RM = {
  queue: [], idx: 0, submitted: false, chosen: [], otherText: '',
  failedIds: new Set(), round: 1, today: '', doneAll: false,
  counts: { ok:0, wrong:0, vague:0 }
};

function startReviewMode(){
  const limit = S.reviewLimit || 20;
  const today = todayStr();
  RM.today = today;
  /* 【本次改动一】抽取规则改为「严格按复习次数最少优先」：
     旧逻辑先把 vagueNext === today 的任务无条件提前，破坏了 0→1→2→3 的次序；
     新逻辑只清空标记、不再单独提前，全部错题统一按「复习次数升序」排队：
       · reviewCount 越小越靠前（0 次 → 1 次 → 2 次 → 3 次……）
       · 次数相同时，按「最近一次复习时间」升序（复习更早的排前）
       · 该字段缺失时用 ts 升序兜底（更早录入的排前）
     保留「清空 vagueNext」这一步，保证今天不再重复提前，其它行为不变。 */
  S.wrong.forEach(w=>{ if(w.vagueNext === today) w.vagueNext = ''; });
  /* 「最近一次复习时间」字段兼容多种历史命名：lastReviewAt / reviewAt / lastAt，
     都取不到就用 ts（错题录入时间）兜底，保证排序稳定可复现。 */
  const lastReviewTs = w=>{
    const v = w.lastReviewAt || w.reviewAt || w.lastAt;
    if(typeof v === 'number' && v > 0) return v;
    if(typeof v === 'string' && v){ const t = Date.parse(v); if(!isNaN(t)) return t; }
    return w.ts || 0;
  };
  /* 【按分类抽取错题】模式分流：
       · 'total'（默认）—— 与原实现逐字一致，未做任何改动
       · 'byCat'        —— 按 CATS 顺序，每个分类各取 N 条（N 超出库存则按库存截断） */
  if(S.reviewPickMode === 'byCat'){
    const byCat = S.reviewLimitByCat || {};
    /* 1. 计算每个分类的有效请求数（非数字/负数一律视为 0，并取整） */
    const wantOf = cat => Math.max(0, Math.floor(Number(byCat[cat]) || 0));
    const totalWant = CATS.reduce((s,c)=>s + wantOf(c), 0);
    if(totalWant <= 0){
      toast('请至少为一个分类设置抽取数量');
      return;
    }
    /* 2. 按 CATS 顺序逐分类抽取；分类内部排序规则与总数模式完全一致：
          「复习次数升序 → 最近复习时间升序 → ts 升序兜底」
          队列按分类分组顺序拼接（先政治理论、再常识……），不做全局二次排序，
          这样复习过程中能感知到板块切换。 */
    const picked = [];
    const pickedIds = new Set();
    CATS.forEach(cat=>{
      const want = wantOf(cat);
      if(want <= 0) return;
      const pool = S.wrong
        .filter(w=> canonCat(w.cat) === cat)      // canonCat 归一，兼容旧数据（申论→申论小题）
        .sort((a,b)=>{
          const ra = a.reviewCount||0, rb = b.reviewCount||0;
          if(ra !== rb) return ra - rb;
          return lastReviewTs(a) - lastReviewTs(b);
        });
      pool.slice(0, want).forEach(w=>{            // 超出库存时 slice 自动截断
        if(pickedIds.has(w.id)) return;           // 双保险去重（同一 id 不会抽两次）
        pickedIds.add(w.id);
        picked.push({id: w.id});
      });
    });
    RM.queue = picked;
    RM.idx = 0; RM.submitted = false; RM.chosen = []; RM.otherText = '';
    RM.failedIds = new Set();
    RM.round = 1;
    RM.doneAll = false;
    RM.counts = { ok:0, wrong:0, vague:0 };
    if(!RM.queue.length){ toast('所选分类暂无可复习的错题'); return; }
    /* 打卡登记逻辑与总数模式一致（见下方说明） */
    try{
      if(!(S.reviewLogs||[]).some(r=>r && r.d === today && r.src === 'review-start')){
        S.reviewLogs.push({d: today, ts: Date.now(), src: 'review-start', note: '开始复习打卡'});
        save(true);
        toast('已计入今日打卡 ✓');
      }
    }catch(e){}
    save(true);
    renderReviewMode();
    $('#reviewMode').classList.add('show');
    document.body.style.overflow = 'hidden';
    return;
  }
  const sorted = S.wrong.slice().sort((a,b)=>{
    const ra = a.reviewCount||0, rb = b.reviewCount||0;
    if(ra !== rb) return ra - rb;                 // ① 复习次数升序（0→1→2→3）
    return lastReviewTs(a) - lastReviewTs(b);     // ② 最近复习时间升序；缺失用 ts 兜底
  });
  RM.queue = sorted.slice(0, limit).map(w=>({id:w.id}));
  RM.idx = 0; RM.submitted = false; RM.chosen = []; RM.otherText = '';
  RM.failedIds = new Set();
  RM.round = 1;
  RM.doneAll = false;
  RM.counts = { ok:0, wrong:0, vague:0 };
  if(!RM.queue.length){ toast('暂无可复习的错题'); return; }
  /* 需求 6(4)2)：在「今日复习」点击开始复习 → 计为当日已打卡（全局口径自动识别 reviewLogs）。
     这里只做打卡登记，不打扰复习流程（无弹窗、无跳转）。 */
  try{
    if(!(S.reviewLogs||[]).some(r=>r && r.d === today && r.src === 'review-start')){
      S.reviewLogs.push({d: today, ts: Date.now(), src: 'review-start', note: '开始复习打卡'});
      save(true);
      toast('已计入今日打卡 ✓');
    }
  }catch(e){}
  save(true);
  renderReviewMode();
  $('#reviewMode').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeReviewMode(){
  $('#reviewMode').classList.remove('show');
  document.body.style.overflow = '';
  RM = { queue:[], idx:0, submitted:false, chosen:[], otherText:'', failedIds:new Set(), round:1, today:'', doneAll:false, counts:{ok:0,wrong:0,vague:0} };
  /* 关闭复习后回到「今日复习」页并保持滚动位置（避免长页面跳回顶部） */
  renderPageKeepScroll();
}

function renderReviewMode(){
  const stats = $('#rmStats');
  const body = $('#rmBody');

  // 全部题目首次提交完毕 → 检查是否还有 模糊/做错 需要重做
  if(RM.idx >= RM.queue.length){
    if(RM.round === 1 && RM.failedIds.size > 0){
      // 首次提交结束 → 用本轮模糊/错题进入重做轮
      RM.queue = Array.from(RM.failedIds).map(id=>({id}));
      RM.failedIds = new Set();
      RM.idx = 0;
      RM.round = 2;
      RM.submitted = false; RM.chosen = []; RM.otherText = '';
      toast('第 '+RM.round+' 轮：'+RM.queue.length+' 道模糊/错题重做 🔁');
    } else if(RM.failedIds.size > 0){
      // 重做轮结束 → 仍有未做对的题，进入下一轮
      RM.queue = Array.from(RM.failedIds).map(id=>({id}));
      RM.failedIds = new Set();
      RM.idx = 0;
      RM.round++;
      RM.submitted = false; RM.chosen = []; RM.otherText = '';
      toast('第 '+RM.round+' 轮：'+RM.queue.length+' 道模糊/错题重做 🔁');
    } else {
      // 无遗留 → 自动结束
      const c = RM.counts;
      stats.innerHTML = '';
      body.innerHTML = '<div class="rm-q" style="text-align:center;padding:40px 20px;">'+
        '<div style="font-size:52px;">🎉</div>'+
        '<h2 style="color:var(--pinkDeep2);margin:14px 0;">今日复习全部完成！</h2>'+
        '<p style="color:var(--text2);line-height:1.9;">本轮共复习 '+(c.ok+c.wrong+c.vague)+' 次：'+
          '<b style="color:#3E8A68;">做对 '+c.ok+'</b> · '+
          '<b style="color:var(--coral);">做错 '+c.wrong+'</b> · '+
          '<b style="color:#7A63C4;">模糊 '+c.vague+'</b><br>'+
          '所有 做对 / 做错 / 模糊 次数均已计入「复习记录」统计。</p>'+
        '<button class="btn primary" style="margin-top:16px;" id="rmFinishBtn">完成</button></div>';
      const fb = $('#rmFinishBtn'); if(fb) fb.addEventListener('click', closeReviewMode);
      return;
    }
  }

  const curQ = RM.queue[RM.idx];
  if(!curQ){ RM.idx = RM.queue.length; return renderReviewMode(); }
  const w = S.wrong.find(x=>x.id === curQ.id);
  if(!w){ RM.queue.splice(RM.idx,1); return renderReviewMode(); }

  const remain = RM.queue.length - RM.idx;
  stats.innerHTML =
    /* 【按分类抽取错题】在统计栏首位显示当前题所属分类（canonCat 归一），
       便于用户感知正在复习哪个板块 */
    '<span class="chip rp-now-cat">'+(w.cat ? '📂 '+esc(canonCat(w.cat)) : '📂 未分类')+'</span>'+
    '<span class="chip">第 '+RM.round+' 轮</span>'+
    '<span class="chip">题目 '+(RM.idx+1)+'/'+RM.queue.length+'</span>'+
    '<span class="chip">剩余 '+remain+' 题</span>'+
    '<span class="chip mint">本轮做对 '+RM.counts.ok+'</span>'+
    '<span class="chip coral">本轮做错 '+RM.counts.wrong+'</span>'+
    '<span class="chip lav">本轮模糊 '+RM.counts.vague+'</span>';

  const ansOpts = ['A','B','C','D'];

  let optHtml = '<div class="rm-opts" id="rmOpts">'+
    ansOpts.map(o=>'<button type="button" class="opt-btn'+(RM.chosen.includes(o)?' on':'')+'" data-opt="'+o+'">'+o+'</button>').join('')+
    '<button type="button" class="opt-btn'+(RM.chosen.includes('其它')?' on':'')+'" data-opt="其它">其它</button>'+
    '</div>'+
    '<input class="inp rm-other '+(RM.chosen.includes('其它')?'show':'')+'" id="rmOther" placeholder="其它选项，可手动输入文本" value="'+esc(RM.otherText)+'">';

  let qHtml = '<div class="rm-q">'+
    '<div class="meta-line">'+
      '<span>板块：'+esc(w.cat)+'</span>'+
      (w.wrongType?'<span>类型：'+esc(w.wrongType)+'</span>':'')+
      (w.source?'<span>来源：'+esc(w.source)+'</span>':'')+
      (w.reason?'<span>错因：'+esc(w.reason)+'</span>':'')+
      (w.tags && w.tags.length ? '<span>标签：'+w.tags.map(t=>'#'+esc(t)).join(' ')+'</span>' : '')+
      '<span style="color:var(--pinkDeep2);">历史：做对 '+(w.rightCount||0)+' · 做错 '+(w.wrongCount||0)+' · 模糊 '+(w.vagueCount||0)+'</span>'+
      favBtnHtml(w.id, true)+
    '</div>'+
    (qImgsHtml(w,'',340))+
    (w.q ? '<div class="title">'+esc(w.q)+'</div>' : (wrongImgs(w).length ? '<div style="font-size:var(--fs-btn);color:var(--text3);text-align:center;margin-top:4px;">（纯图片题，请看上图）</div>' : ''))+
    (RM.submitted ? '' : optHtml);

  if(RM.submitted){
    const chosenStr = (RM.chosen.filter(x=>x!=='其它').join('、') +
      (RM.chosen.includes('其它') ? (RM.chosen.filter(x=>x!=='其它').length?'、':'')+'其它：'+RM.otherText : '')).trim() || '未作答';
    qHtml += '<div class="rm-ans-box">'+
      '<div><b>你的选择：</b>'+esc(chosenStr)+'</div>'+
      '<div style="margin-top:6px;"><b>正确答案：</b>'+esc(w.right||'—')+'</div>'+
      (w.prev?'<div><b>前次错选：</b>'+esc(w.prev)+'</div>':'')+
      (qImgsHtml(w,'exp',220))+
      '<div style="margin-top:6px;white-space:pre-wrap;word-break:break-word;"><b>解析：</b>'+esc(w.exp||'暂无，请手动补充')+'</div>'+
      ((w.expLogs&&w.expLogs.length) ? w.expLogs.map((L,idx)=>'<div style="margin-top:6px;white-space:pre-wrap;word-break:break-word;"><b>'+(idx+2)+'次解析（'+esc(L.date||'')+'）：</b>'+esc(L.text)+'</div>').join('') : '')+
      '<div class="edit-exp">'+
        '<textarea class="ta" id="rmNewExp" placeholder="输入新的解析内容（不显示原有解析；保存后追加在原解析下方，可在全部错题中查看）"></textarea>'+
        '<button class="btn primary" id="rmSaveExp">保存新的解析</button>'+
      '</div>'+
      '</div>'+
      '<div class="rm-actions">'+
        '<button class="btn mint" id="rmOkBtn">✓ 做对了</button>'+
        '<button class="btn danger" id="rmNoBtn">✗ 做错了</button>'+
        '<button class="btn" style="background:#F0EAFF;color:#7A63C4;" id="rmVagueBtn">🤔 模糊</button>'+
      '</div>';
  } else {
    qHtml += '<div class="rm-actions"><button class="btn primary" id="rmSubmitBtn">提交答案</button></div>';
  }
  qHtml += '</div>';
  /* 【P1】释放上一题创建的 objectURL，再渲染本题占位图并异步补 src */
  try{ revokeImgsIn(body); }catch(e){}
  body.innerHTML = qHtml;
  hydrateImgs(body);
  /* 修改轮6：复习中也能收藏本题 */
  bindFavBtns('#rmBody');

  if(!RM.submitted){
    $('#rmOpts').addEventListener('click', e=>{
      const b = e.target.closest('.opt-btn'); if(!b) return;
      const v = b.dataset.opt;
      const idx = RM.chosen.indexOf(v);
      if(idx >= 0) RM.chosen.splice(idx,1); else RM.chosen.push(v);
      b.classList.toggle('on');
      if(v === '其它'){
        const inp = $('#rmOther');
        inp.classList.toggle('show', RM.chosen.includes('其它'));
        if(RM.chosen.includes('其它')) inp.focus();
      }
    });
    const inp = $('#rmOther');
    if(inp) inp.addEventListener('input', ()=>{ RM.otherText = inp.value; });
    $('#rmSubmitBtn').addEventListener('click', ()=>{
      RM.submitted = true;
      renderReviewMode();
    });
  } else {
    $('#rmSaveExp').addEventListener('click', ()=>{
      const v = ($('#rmNewExp').value||'').trim();
      if(!v){ toast('请输入新的解析内容'); return; }
      if(!Array.isArray(w.expLogs)) w.expLogs = [];
      w.expLogs.push({ text: v, date: todayStr() });
      save(true);
      $('#rmNewExp').value = '';
      toast('已保存，原解析为第1次，本次为第 '+(w.expLogs.length+1)+' 次解析 ✓');
      renderReviewMode();   // 立即回显：原解析下方出现「X次解析（日期）」
    });
    // ✓ 做对了：计数 + 记录，并移出重做队列
    $('#rmOkBtn').addEventListener('click', ()=>{
      w.reviewCount = (w.reviewCount||0)+1;
      w.rightCount  = (w.rightCount||0)+1;
      w.vagueNext = '';
      RM.counts.ok++;
      S.reviewLogs.push({id:uid(), wrongId:w.id, cat:w.cat, d:todayStr(), ts:Date.now(), ok:true});
      nextRM(true);
    });
    // ✗ 做错了：计数 + 记录，重新排队等待做对
    $('#rmNoBtn').addEventListener('click', ()=>{
      w.reviewCount = (w.reviewCount||0)+1;
      w.wrongCount  = (w.wrongCount||0)+1;
      RM.counts.wrong++;
      S.reviewLogs.push({id:uid(), wrongId:w.id, cat:w.cat, d:todayStr(), ts:Date.now(), ok:false});
      nextRM(false);
    });
    // 🤔 模糊：计数 + 记录，重新排队等待做对
    $('#rmVagueBtn').addEventListener('click', ()=>{
      w.reviewCount = (w.reviewCount||0)+1;
      w.vagueCount  = (w.vagueCount||0)+1;
      RM.counts.vague++;
      S.reviewLogs.push({id:uid(), wrongId:w.id, cat:w.cat, d:todayStr(), ts:Date.now(), ok:false, vague:true});
      nextRM(false);
    });
  }
}

// passed=true 表示本题已做对，不再进入重做队列
function nextRM(passed){
  save(true);
  if(!passed) RM.failedIds.add(RM.queue[RM.idx].id);
  RM.idx++;
  RM.submitted = false;
  RM.chosen = [];
  RM.otherText = '';
  renderReviewMode();
}

$('#rmClose').addEventListener('click', closeReviewMode);

/* ============================================================
   按分类抽取错题 —— 辅助函数
   ============================================================ */
/* 各分类当前库存（S.wrong 中该分类的题数）。
   用 canonCat 归一，保证旧数据「申论」计入「申论小题」。
   返回 { 分类名: 数量 }（分类名取自 CATS） */
function reviewCatStock(){
  const stock = {};
  CATS.forEach(c=>{ stock[c] = 0; });
  S.wrong.forEach(w=>{
    const c = canonCat(w.cat);
    if(stock[c] === undefined) stock[c] = 0;   // 非 CATS 的历史分类也统计，避免库存显示失真
    stock[c]++;
  });
  return stock;
}
/* 读取某分类的有效请求数（非数字/负数一律视为 0；取整） */
function reviewWantOf(byCat, cat){
  const v = (byCat || {})[cat];
  return Math.max(0, Math.min(999, Math.floor(Number(v) || 0)));
}
/* 单个分类行 HTML（名称 + 数量输入框 + 库存提示）
   stock：该分类库存；want：当前请求数（用于初始标红判定） */
function reviewCatRowHtml(cat, stock, want){
  const over = want > stock;
  return '<div class="rp-cat-row" data-cat="'+esc(cat)+'">'+
    '<span class="rp-cat-name">'+esc(cat)+'</span>'+
    '<input class="inp rp-cat-inp" type="number" min="0" max="999" step="1" '+
      'data-cat="'+esc(cat)+'" value="'+want+'" aria-label="'+esc(cat)+'抽取数量">'+
    '<span class="rp-cat-stock'+(over?' over':'')+'" data-stock-of="'+esc(cat)+'">'+
      (over ? '⚠ 请求 '+want+' 题，超过库存 '+stock+' 题，实际只能抽取 '+stock+' 题'
           : '库存 '+stock+' 题')+
    '</span>'+
  '</div>';
}

      '<div class="rp-mode-head">'+

        const refreshSum = ()=>{

          }
        };
        /* 刷新某分类的「库存 / 超库存」提示（请求数超过库存时标红并给出替代文案） */
        const refreshStock = (cat, want)=>{
          const el = catBox.querySelector('[data-stock-of="'+cat+'"]');

          }
        };

        const setCat = (cat, raw)=>{
          let v = parseInt(raw, 10);
          if(!isFinite(v) || isNaN(v) || v < 0) v = 0;
          if(v > 999) v = 999;
          if(!S.reviewLimitByCat || typeof S.reviewLimitByCat !== 'object') S.reviewLimitByCat = {};
          if(v === 0) delete S.reviewLimitByCat[cat];
          else S.reviewLimitByCat[cat] = v;
          return v;
        };

           · input —— 即时反馈：写 S + 刷新库存标红 + 合计 + 按钮状态，
                       并对「超出范围」的值做即时钳制回写（9999→999、负数→0、非数字→0），

                       回写只在值确实越界时发生，因此正常逐位输入（如 1→10→100）不受影响。
           · change/blur —— 终态再规范化一次并落盘（节流，避免每次按键写盘） */
        $$('#rpCatList .rp-cat-inp').forEach(inp=>{

            refreshSum();
            save(true);
          });
        });
        /* 「全部清零」：所有分类设为 0，落盘并刷新合计/按钮状态 */
        const clearBtn = $('#rpClearAll');

      $('#startReviewBtn').addEventListener('click', startReviewMode);
    }

/* ============================================================
   R4：全部错题 批量导出（Word / PDF / Excel）
   ------------------------------------------------------------
   · 弹窗：显示错题总数 → 勾选分类（不选=全部）→ 选导出格式

     → 文末「本周错题汇总」+ 薄弱点分析与复习建议
   · Word=.doc(HTML)、Excel=.xls(HTML 表格)、PDF=打印窗口（另存为 PDF）
   ============================================================ */
/* ============================================================
   【P2】分批导出工具
   ------------------------------------------------------------
   为什么分批：几百道带图错题导出成 Word/PDF 时，单个文件动辄几百 MB，
   浏览器会直接崩掉。分批把大任务拆成多个可管理的小文件。
   ★ 核心约束：绝不允许把「一道题」拆到两个批次里（题目完整性优先）。
   ============================================================ */

/* 单题体积估算：文字 UTF-16 字节 + 图片 blob 体积 × 1.33（base64 膨胀系数） */
function estimateImgBytes(id){
  const rec = _imgSizeCache.get(id);
  return rec || 0;
}
const _imgSizeCache = new Map();   // 图片 id -> blob.size（异步预热的缓存）

/* 预读图片体积到缓存（分批估算前调用一次） */
async function primeImgSizes(){
  const ids = Array.from(collectUsedImgIds());
  const miss = ids.filter(id => !_imgSizeCache.has(id));
  if(!miss.length) return;
  const map = await imgStore.getMany(miss);
  miss.forEach(id=>{
    const rec = map.get(id);
    _imgSizeCache.set(id, rec && rec.blob ? rec.blob.size : 0);
  });
}

function estimateWrongSize(w){
  let bytes = bytesOf(JSON.stringify({
    q: w.q, right: w.right, prev: w.prev, exp: w.exp, reason: w.reason,
    cat: w.cat, source: w.source, wrongType: w.wrongType, tags: w.tags, note: w.note
  }));
  const qids = wrongImgIds(w), eids = wrongExpImgIds(w);
  qids.concat(eids).forEach(id=>{ bytes += Math.round(estimateImgBytes(id) * 1.33); });
  /* 旧结构：base64 已是字符串，直接算 */
  legacyImgs(w).concat(legacyExpImgs(w)).forEach(b=>{ if(typeof b === 'string') bytes += bytesOf(b); });
  return bytes;
}
function estimateTotalSize(list){
  return (list||[]).reduce((s,w)=>s + estimateWrongSize(w), 0);
}

/* 贪心装箱：按题目边界切分（绝不拆单题）。
   实际阈值 = 设定值 × 0.7，预留余量避免刚好卡线上。
   单题超阈值时独立成批并标 warn。 */
function packBatches(list, maxBytes){
  const limit = maxBytes ? Math.max(64*1024, Math.round(maxBytes * 0.7)) : Infinity;
  const batches = [];
  let cur = [], curBytes = 0;
  (list||[]).forEach(w=>{
    const sz = estimateWrongSize(w);
    if(sz > limit){
      // 单题超限：独立成批（不拆题）
      batches.push({ list:[w], bytes: sz, warn: true });
      return;
    }
    if(cur.length && curBytes + sz > limit){
      batches.push({ list: cur, bytes: curBytes, warn: false });
      cur = []; curBytes = 0;
    }
    cur.push(w); curBytes += sz;
  });
  if(cur.length) batches.push({ list: cur, bytes: curBytes, warn:false });
  return batches;
}

function fmtMB(bytes){ return (bytes/1048576).toFixed(2) + ' MB'; }

/* 导出清单（.txt）：随第一批下载，便于用户核对分批结果 */
function buildExportManifest(batches, fmt, maxBytes){
  const lines = [];
  lines.push('错题本导出清单');
  lines.push('导出时间：' + new Date().toLocaleString('zh-CN'));
  lines.push('导出格式：' + ({excel:'Excel', word:'Word', pdf:'PDF'}[fmt] || fmt));
  lines.push('单批上限：' + (maxBytes ? fmtMB(maxBytes) : '不限制'));
  lines.push('总批数：' + batches.length);
  const totalQ = batches.reduce((s,b)=>s+b.list.length, 0);
  lines.push('总题数：' + totalQ);
  lines.push('预估总体积：' + fmtMB(batches.reduce((s,b)=>s+b.bytes,0)));
  lines.push('');
  batches.forEach((b, i)=>{
    lines.push('第 ' + (i+1) + ' 批 / 共 ' + batches.length + ' 批　题数：' + b.list.length
      + '　预估体积：' + fmtMB(b.bytes) + (b.warn ? '　【单题超出上限】' : ''));
    lines.push('  题目ID：' + b.list.map(w=>w.id).join(', '));
    lines.push('');
  });
  lines.push('说明：每批文件中的题目互不重叠，可分别导入或归档，不会重复。');
  return lines.join('\r\n');
}

/* 刷新弹窗中的「分批预估算」区块（不实际导出，只算） */
let _batchPreviewSeq = 0;
let _batchCache = null;
async function refreshBatchPreview(){
  const info = document.getElementById('wxBatchInfo');
  const listBox = document.getElementById('wxBatchList');
  if(!info || !listBox) return;
  const seq = ++_batchPreviewSeq;
  try{
    const cats = Array.from(document.querySelectorAll('.wxcat')).filter(x=>x.checked).map(x=>x.value);
    const limSel = document.getElementById('wxBatchLimit');
    const lim = parseInt((limSel||{value:'31457280'}).value, 10) || 0;
    let groups = wrongExportGroups(cats);
    const all = groups.reduce((s,g)=>s.concat(g.list), []);
    if(!all.length){ info.innerHTML = '未选择任何错题。'; listBox.innerHTML=''; return; }

    info.innerHTML = '正在估算体积…（图片较多时稍慢）';
    await primeImgSizes();
    if(seq !== _batchPreviewSeq) return;

    const totalBytes = estimateTotalSize(all);
    const batches = lim ? packBatches(all, lim) : [{list: all, bytes: totalBytes, warn:false}];
    info.innerHTML = '已选 <b>' + all.length + '</b> 题，预估总体积 <b>' + fmtMB(totalBytes) + '</b>，'
      + (batches.length > 1 ? ('按上限 ' + fmtMB(lim) + ' 需拆分为 <b>' + batches.length + '</b> 批')
                            : '可 <b>一次性导出</b>');
    listBox.innerHTML = batches.map((b,i)=>{
      const warn = b.warn ? ' <span style="color:var(--coral,#e05c5c);">（单题超出上限）</span>' : '';
      return '<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line,#eee);'
        + 'border-radius:8px;margin-bottom:6px;font-size:calc(var(--fs-btn) - 2px);">'
        + '<span style="flex:1;">第 ' + (i+1) + ' 批 · ' + b.list.length + ' 题 · ' + fmtMB(b.bytes) + warn + '</span>'
        + '<button type="button" class="btn sm primary" data-bx-export="' + i + '" style="flex:0 0 auto;">导出</button>'
        + '</div>';
    }).join('');
    // 绑定逐批导出
    Array.from(listBox.querySelectorAll('[data-bx-export]')).forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.getAttribute('data-bx-export'), 10);
        const fmtSel = document.getElementById('wxFmt');

        btn.textContent = '导出中…';

        doExportOneBatch(batches, idx, fmt).then(ok=>{
          if(ok){ btn.textContent = '✓ 已导出'; btn.classList.remove('primary'); btn.classList.add('ghost'); }
          else { btn.textContent = '重试'; btn.disabled = false; }
        });
      });
    });
    _batchCache = { batches, fmt: (document.getElementById('wxFmt')||{value:'excel'}).value };

    console.error('[分批预览] 失败', e);
    info.innerHTML = '估算失败：' + esc(e && e.message ? e.message : String(e));
  }
}

  return groups;
}

/* —— R4 主生成器 —— */
/* ============================================================
   修改轮2 补强：真 xlsx 生成器（ECMA-376 标准）
   实测结论：HTML 格式 .xls 里的 data URI 图片在办公软件中
   不被渲染（LibreOffice 24.2 实测不显示）、MHTML 也不被
   .xls/.doc 后缀识别——只有标准 xlsx 才能跨 Excel/WPS/LibreOffice
   保证图片正常显示。zip 用 STORE（不压缩）模式手写，图片
   原生嵌入 xl/media，锚定到对应列的单元格上方。
   ============================================================ */
function makeZip(files){
  /* files: [{name, u8:Uint8Array}] → STORE 方式打包（不压缩，兼容性最好） */
  const crcT = (()=>{ const t = new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; }
    return t; })();
  const crc32 = u8 => { let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = crcT[(c ^ u8[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const enc = new TextEncoder();
  const parts = []; let offset = 0; const central = [];
  files.forEach(f=>{
    const nameU8 = enc.encode(f.name);
    const crc = crc32(f.u8);
    const lfh = new Uint8Array(30 + nameU8.length);
    const dv = new DataView(lfh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true); dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, f.u8.length, true); dv.setUint32(22, f.u8.length, true);
    dv.setUint16(26, nameU8.length, true); dv.setUint16(28, 0, true);
    lfh.set(nameU8, 30);
    parts.push(lfh, f.u8);
    central.push({nameU8, crc, size: f.u8.length, offset});
    offset += lfh.length + f.u8.length;
  });
  const cdOffset = offset; let cdSize = 0; const cdParts = [];
  central.forEach(c=>{
    const cd = new Uint8Array(46 + c.nameU8.length);
    const dv = new DataView(cd.buffer);
    dv.setUint32(0, 0x02014b50, true);
    dv.setUint16(4, 20, true); dv.setUint16(6, 20, true);
    dv.setUint16(8, 0x0800, true); dv.setUint16(10, 0, true);
    dv.setUint16(12, 0, true); dv.setUint16(14, 0, true);
    dv.setUint32(16, c.crc, true);
    dv.setUint32(20, c.size, true); dv.setUint32(24, c.size, true);
    dv.setUint16(28, c.nameU8.length, true);
    dv.setUint32(42, c.offset, true);
    cd.set(c.nameU8, 46);
    cdSize += cd.length; cdParts.push(cd);
  });
  const eocd = new Uint8Array(22);
  const dv2 = new DataView(eocd.buffer);
  dv2.setUint32(0, 0x06054b50, true);
  dv2.setUint16(8, central.length, true); dv2.setUint16(10, central.length, true);
  dv2.setUint32(12, cdSize, true); dv2.setUint32(16, cdOffset, true);
  const out = new Uint8Array(offset + cdSize + 22);
  let pos = 0;
  parts.concat(cdParts).forEach(p=>{ out.set(p, pos); pos += p.length; });
  out.set(eocd, pos);
  return out;
}

function xmlEsc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}

function imgDims(uri){
  /* 解 data URI → {u8, ext, dw, dh}
     兼容加固（修改轮4）：mime 允许 . + -（如 svg+xml）、base64 允许空白/换行、
     非 base64（URL 编码）兜底、PNG+JPEG+GIF 读真实尺寸等比缩放（宽上限 240 / 高上限 160）。
     任何解析异常一律返回 null，绝不抛出中断整个导出。 */
  try{
    if(!uri || typeof uri !== 'string') return null;
    const m = /^data:image\/([\w.+-]+);base64,([\s\S]*)$/.exec(uri.trim());
    let ext, bin;
    if(m){
      ext = m[1];
      /* 去掉 base64 中的空白与换行，避免 atob 失败 */
      const b64 = m[2].replace(/\s+/g,'');
      bin = atob(b64);
    } else {
      /* 兜底：非 base64 的 data URI（如 data:image/svg+xml,<svg...>）或未知来源 */
      const m2 = /^data:image\/([\w.+-]+),(.*)$/.exec(uri.trim());
      if(m2){
        ext = m2[1];
        try{ bin = decodeURIComponent(m2[2]); }catch(e){ bin = m2[2]; }
      } else if(/^https?:|^blob:/.test(uri)){
        /* 网络图 / blob：无法内联，导出时以占位文字提示（返回 null） */
        return null;
      } else {
        return null;
      }
    }
    if(!bin) return null;
    const u8 = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
    ext = ext === 'jpeg' ? 'jpg' : (ext.indexOf('+')>=0 ? ext.split('+')[0] : ext);
    if(ext === 'svg') return null;   /* SVG 无法作为位图嵌入 xlsx drawing */
    let w = 0, h = 0;
    /* PNG: IHDR 宽高在偏移 16/20 */
    if(u8.length > 24 && u8[0] === 0x89 && u8[1] === 0x50){
      w = ((u8[16]<<24 | u8[17]<<16 | u8[18]<<8 | u8[19])>>>0);
      h = ((u8[20]<<24 | u8[21]<<16 | u8[22]<<8 | u8[23])>>>0);
    }
    /* GIF: 宽高为小端 16 位，偏移 6/8 */
    else if(u8.length > 10 && u8[0] === 0x47 && u8[1] === 0x49 && u8[2] === 0x46){
      w = (u8[6] | (u8[7]<<8)); h = (u8[8] | (u8[9]<<8));
    }
    /* JPEG: 扫描 SOFn 段读宽高 */
    else if(u8.length > 4 && u8[0] === 0xFF && u8[1] === 0xD8){
      let p = 2;
      while(p < u8.length - 9){
        if(u8[p] !== 0xFF){ p++; continue; }
        const marker = u8[p+1];
        if(marker >= 0xC0 && marker <= 0xCF && marker !== 0xC4 && marker !== 0xC8 && marker !== 0xCC){
          h = (u8[p+5]<<8 | u8[p+6]); w = (u8[p+7]<<8 | u8[p+8]); break;
        }
        const segLen = (u8[p+2]<<8 | u8[p+3]);
        if(segLen < 2) break;
        p += 2 + segLen;
      }
    }
    if(!w || !h){ w = 240; h = 150; }   /* 尺寸未知时用默认 */
    let dw = Math.min(240, w), dh = Math.round(h * dw / w);
    if(dh > 160){ dh = 160; dw = Math.round(w * dh / h); }
    dw = Math.max(dw, 60); dh = Math.max(dh, 30);
    return {u8, ext, dw, dh};
  }catch(e){ return null; }
}

/* ============================================================
   修改轮6：图片「真正嵌入单元格」（WPS DISPIMG 机制）
   ------------------------------------------------------------
   · 单图：原图字节直接进 cellimages.xml（不重编码，jpg 保持 jpg）
   · 多图：canvas 纵向拼合成一张长图后嵌入（一个单元格只能挂一张
     DISPIMG 图片，拼合是多图下保持表格布局的唯一方案）
   · 单元格写公式 =_xlfn.DISPIMG("ID_xxx",1)，图片实体在
     xl/cellimages.xml + xl/_rels/cellimages.xml.rels + xl/media/
   · 兜底：canvas 不可用/加载失败时，首图仍嵌入单元格，
     其余图片降级为浮动图（oneCellAnchor）
   · 导入侧 importFromExcel 已支持读取 DISPIMG 公式 → 导出/导入往返
     不丢图；Excel（非 WPS）打开时单元格无图，浮动兜底图可见
   ============================================================ */
async function buildWrongXlsx(groups){
  /* 生成错题本 xlsx（Uint8Array）。每题：文字 14 列；内容/解析的图片
     以 DISPIMG 公式嵌入对应列单元格内，文字写在图片下一行正下方单元格。 */
  const HEAD = ['板块','日期','错题内容','正确答案','前次错选','错因','错题类型','标签','来源','解析','历史解析','个人备注','做错次数','做对次数'];
  const COLW = [10,12,32,9,9,12,12,12,10,32,24,12,9,9];
  const NC = 14;
  const EMU = 9525;   /* 1px = 9525 EMU */
  const media = [];   /* {ext, u8, cid} → imageN.ext + ID_xxx（按内容去重） */
  const anchors = []; /* 兜底浮动图（仅多图拼合失败时使用） */
  let failCount = 0;  /* 真正解析失败（dataUrl 损坏）被降级为文字提示的图片张数 */
  /* 内容级去重：逐字节比较（imgDims 每次新解出 u8，引用比较必然不同） */
  function sameU8(a, b){
    if(a === b) return true;
    if(!a || !b || a.length !== b.length) return false;
    for(let i=0;i<a.length;i++){ if(a[i] !== b[i]) return false; }
    return true;
  }
  function mediaAdd(u8, ext, dw, dh){
    for(let i=0;i<media.length;i++){
      if(media[i].ext === ext && sameU8(media[i].u8, u8)){
        return {rid:'rId'+(i+1), cid:media[i].cid, file:'image'+(i+1)+'.'+ext, dw:media[i].dw, dh:media[i].dh};
      }
    }
    /* ID_ + 16 位十六进制（WPS DISPIMG 的 id 格式） */
    const cid = 'ID_' + (media.length+1).toString(16).toUpperCase().padStart(16, '0');
    media.push({ext, u8, cid, dw, dh});
    return {rid:'rId'+media.length, cid, file:'image'+media.length+'.'+ext, dw, dh};
  }
  const mediaRef = uri=>{
    const d = imgDims(uri);
    if(!d) return null;
    return mediaAdd(d.u8, d.ext, d.dw, d.dh);
  };
  /* —— canvas 纵向拼合（多图 → 一张长图）—— */
  function loadImgEl(src){
    return new Promise(res=>{
      try{
        const im = new Image();
        im.onload = ()=>res(im);
        im.onerror = ()=>res(null);
        im.src = src;
      }catch(e){ res(null); }
    });
  }
  async function composeVertical(uris){
    if(!uris || uris.length < 2) return null;
    try{
      const dims = uris.map(u=>imgDims(u));
      if(dims.some(d=>!d)) return null;
      const GAP = 8;
      const W = Math.max.apply(null, dims.map(d=>d.dw));
      const H0 = dims.reduce((s,d)=>s+d.dh, 0) + GAP*(dims.length-1);
      /* 拼合过高时整体等比缩小（行高上限 409pt ≈ 545px） */
      const MAXH = 520;
      const scale = H0 > MAXH ? MAXH / H0 : 1;
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(W*scale));
      cv.height = Math.max(1, Math.round(H0*scale));
      const ctx = cv.getContext('2d');
      if(!ctx) return null;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, cv.width, cv.height);
      let y = 0;
      for(let i=0;i<uris.length;i++){
        const im = await loadImgEl(uris[i]);
        if(!im) return null;
        ctx.drawImage(im, 0, Math.round(y*scale), Math.round(dims[i].dw*scale), Math.round(dims[i].dh*scale));
        y += dims[i].dh + GAP;
      }
      const outUri = cv.toDataURL('image/png');
      return imgDims(outUri);   /* {u8, ext:'png', dw, dh}（拼合后的真实尺寸） */
    }catch(e){ return null; }
  }
  /* 表头 row 0；题目从 row 1（xml 显示号 = idx+1） */
  const rowsXml = [];
  let headCells = '';
  HEAD.forEach((h,i)=>{ headCells += '<c r="'+String.fromCharCode(65+i)+'1" t="inlineStr"><is><t>'+xmlEsc(h)+'</t></is></c>'; });
  rowsXml.push('<row r="1" ht="22" customHeight="1">'+headCells+'</row>');
  const merges = [];
  let rIdx = 1;   /* 0-based 行号（xml 里 +1） */
  function txtRow(cells, r0, ht){
    /* cells: [{col, text, formula:{cid}}]；formula 存在 → DISPIMG 公式单元格 */
    let c = '', lastCol = 0;
    cells.sort((a,b)=>a.col-b.col).forEach(x=>{
      const ref = String.fromCharCode(65+x.col)+(r0+1);
      if(x.formula){
        /* 嵌入单元格图片：WPS 打开显示图片本身。
           外层 IFERROR 让不认识 DISPIMG 的软件（Excel/LibreOffice）
           显示空白而非刺眼的 #NAME? 错误。 */
        c += '<c r="'+ref+'" t="str"><f>IFERROR(_xlfn.DISPIMG("'+x.formula.cid+'",1),"")</f><v></v></c>';
      } else {
        c += '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(x.text)+'</t></is></c>';
      }
      lastCol = Math.max(lastCol, x.col);
    });
    rowsXml.push('<row r="'+(r0+1)+'"'+(ht?' ht="'+ht+'" customHeight="1"':'')+'>'+c+'</row>');
  }
  function numCell(col, r0, v){
    return '<c r="'+String.fromCharCode(65+col)+(r0+1)+'"><v>'+(parseInt(v,10)||0)+'</v></c>';
  }
  /* 逐题处理（异步：多图需 canvas 拼合） */
  for(const g of groups){
    for(const w of g.list){
      const r0 = rIdx;
      const qImgs = wrongImgs(w), eImgs = wrongExpImgs(w);
      const expHis = (w.expLogs && w.expLogs.length) ? w.expLogs.map(L=>'('+(L.date||'')+')'+L.text).join('；') : '';
      const qTxt = w.q || '（图片题）';
      const eTxt = w.exp || '—';
      const imgRowCells = [];     /* 图片行单元格（仅 DISPIMG 公式，其余列留空） */
      /* 文字行（r0）：写全部文字列；图片统一放到紧随其后的「图片行」。
         这样导出布局固定为「文字行 → 图片行」，导入侧可稳定按行归属还原。
         图片解析失败的提示不写进题干/解析，避免污染数据。 */
      const r1cells = [
        {col:0, text:g.cat}, {col:1, text:w.date||''},
        {col:2, text: qTxt},
        {col:3, text:w.right||'—'}, {col:4, text:w.prev||'—'},
        {col:5, text:w.reason||'—'}, {col:6, text:w.wrongType||'—'},
        {col:7, text:(w.tags&&w.tags.length)?w.tags.join('、'):''},
        {col:8, text:w.source||''},
        {col:9, text: eTxt},
        {col:10, text:expHis}, {col:11, text:w.note||''},
        {col:12, text:String(w.wrongCount||0)}, {col:13, text:String(w.rightCount||0)}
      ];
      /* 单列嵌入：单图 → 原图直接嵌入；多图 → canvas 拼合后嵌入；
         返回 {n:已嵌入张数, dh:图片显示高}，失败返回 null 走兜底 */
      async function embedCol(uris, col){
        if(uris.length === 1){
          const ref = mediaRef(uris[0]);
          if(ref){
            imgRowCells.push({col, formula:{cid:ref.cid}});
            return {n:1, dh:ref.dh};
          }
          return null;
        }
        const comp = await composeVertical(uris);
        if(comp){
          const ref = mediaAdd(comp.u8, comp.ext, comp.dw, comp.dh);
          imgRowCells.push({col, formula:{cid:ref.cid}});
          return {n:uris.length, dh:ref.dh};
        }
        return null;
      }
      let imgH = 0;
      let qEmbedded = 0, eEmbedded = 0;
      const qFail = [], eFail = [];
      /* 内容列 / 解析列嵌入 */
      let qRes = null, eRes = null;
      if(qImgs.length){ try{ qRes = await embedCol(qImgs, 2); }catch(e){ qRes = null; } }
      if(eImgs.length){ try{ eRes = await embedCol(eImgs, 9); }catch(e){ eRes = null; } }
      if(qRes){ qEmbedded += qRes.n; imgH = Math.max(imgH, qRes.dh); }
      if(eRes){ eEmbedded += eRes.n; imgH = Math.max(imgH, eRes.dh); }
      /* 兜底：未嵌入单元格的图片 → 浮动图锚在图片行（列内纵向排布）
         used = 本列已嵌入单元格的张数（0 或 1） */
      function fallbackAnchors(uris, col, used, startDh, failArr){
        let off = used > 0 ? startDh + 6 : 0;   /* 首图已嵌单元格时，浮动图从其下方开始 */
        let n = 0;
        uris.forEach((u, i)=>{
          if(i < used) return;
          const ref = mediaRef(u);
          if(ref){ anchors.push({ref, col, row:r0+1, offPx:off}); off += ref.dh + 6; n++; }
          else failArr.push(u);
        });
        return n;
      }
      if(qImgs.length){
        const fb = fallbackAnchors(qImgs, 2, qRes ? qRes.n : 0, qRes ? qRes.dh : 0, qFail);
        qEmbedded += fb;
        if(qEmbedded === 0){ qImgs.forEach(()=>qFail.push(1)); }
      }
      if(eImgs.length){
        const fb = fallbackAnchors(eImgs, 9, eRes ? eRes.n : 0, eRes ? eRes.dh : 0, eFail);
        eEmbedded += fb;
        if(eEmbedded === 0){ eImgs.forEach(()=>eFail.push(1)); }
      }
      /* 真正失败 = 内容列/解析列都完全没能写入（既未嵌入也非浮动） */
      if(qEmbedded === 0 && qImgs.length) failCount += qImgs.length;
      if(eEmbedded === 0 && eImgs.length) failCount += eImgs.length;
      const hasQ = qEmbedded > 0, hasE = eEmbedded > 0;
      const twoRow = hasQ || hasE;
      /* 图片未能嵌入时，把提示追加到「个人备注」列（不污染题干/解析数据） */
      if((qImgs.length && !hasQ) || (eImgs.length && !hasE)){
        const miss = [];
        if(qImgs.length && !hasQ) miss.push(qImgs.length + ' 张题目图');
        if(eImgs.length && !hasE) miss.push(eImgs.length + ' 张解析图');
        const c11 = r1cells.find(x=>x.col === 11);
        const tip = '（' + miss.join('、') + '未能解析，未嵌入）';
        if(c11) c11.text = (c11.text ? c11.text + ' ' : '') + tip;
      }
      /* 行1（文字行）：全部文字；有图时预留高度让图片行紧贴其下 */
      txtRow(r1cells, r0, 0);
      if(twoRow){
        /* 行2（图片行）：仅写 DISPIMG 公式单元格，其余列留空 */
        txtRow(imgRowCells, r0+1, Math.ceil(imgH * 0.75) + 6);
        rIdx = r0 + 2;
      } else {
        rIdx = r0 + 1;
      }
    }
  }
  /* 文末汇总 */
  const all = groups.reduce((s,g)=>s.concat(g.list), []);
  const wk = weekRange(0);
  const weekList = all.filter(w=>w.date >= wk[0] && w.date <= wk[6]);
  function sumRow(text, r0){
    rowsXml.push('<row r="'+(r0+1)+'"><c r="A'+(r0+1)+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(text)+'</t></is></c></row>');
    merges.push('A'+(r0+1)+':'+'N'+(r0+1));
  }
  rIdx += 1; sumRow('📌 本周错题汇总（'+wk[0]+' ~ '+wk[6]+'）：'+weekList.length+' 题', rIdx); 
  let sr = rIdx;
  weekList.forEach(w=>{ sr += 1; txtRow([{col:0, text:w.cat||'—'},{col:1, text:w.date||''},{col:2, text:(w.q||'（图片题）').slice(0,60)},{col:3, text:'错因：'+(w.reason||'—')}], sr, 0); });
  const byCat = groups.map(g=>({cat:g.cat, n:g.list.length, err:g.list.reduce((s,w)=>s+(w.wrongCount||0),0)})).filter(x=>x.n>0).sort((a,b)=>(b.err-a.err)||(b.n-a.n));
  sr += 1; sumRow('🔍 薄弱点分析', sr);
  if(byCat.length){ sr += 1; sumRow('板块薄弱排序（按累计错误次数）：'+byCat.map(x=>x.cat+'（'+x.n+' 题 / 错 '+x.err+' 次）').join('；')+'。建议优先攻克：'+byCat[0].cat, sr); }
  const hard = groups.reduce((s,g)=>s.concat(g.list), []).filter(w=>(w.wrongCount||0)>=3);
  sr += 1; sumRow('错误 3 次以上的顽固错题：'+hard.length+' 道'+(hard.length?'，建议加入每日复习优先队列':''), sr);

  /* drawing xml（浮动兜底图锚定；仅拼合失败的多图场景使用） */
  let drawingXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';
  anchors.forEach((a,i)=>{
    drawingXml += '<xdr:oneCellAnchor>'+
      '<xdr:from><xdr:col>'+a.col+'</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>'+a.row+'</xdr:row><xdr:rowOff>'+Math.round(a.offPx*EMU)+'</xdr:rowOff></xdr:from>'+
      '<xdr:ext cx="'+Math.round(a.ref.dw*EMU)+'" cy="'+Math.round(a.ref.dh*EMU)+'"/>'+
      '<xdr:pic><xdr:nvPicPr><xdr:cNvPr id="'+(i+2)+'" name="图片'+(i+1)+'"/><xdr:cNvPicPr/></xdr:nvPicPr>'+
      '<xdr:blipFill><a:blip r:embed="'+a.ref.rid+'"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>'+
      '<xdr:spPr><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic>'+
      '<xdr:clientData/></xdr:oneCellAnchor>';
  });
  drawingXml += '</xdr:wsDr>';

  /* 修改轮6：WPS 嵌入单元格图片声明（cellimages.xml + rels + DISPIMG 公式） */
  let cellImagesXml = '';
  if(media.length){
    cellImagesXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<etc:cellImages xmlns:etc="http://www.wps.cn/officeDocument/2017/etCustomData"'+
      ' xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing"'+
      ' xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"'+
      ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
      media.map((m,i)=>
        '<etc:cellImage>'+
        '<xdr:pic>'+
          '<xdr:nvPicPr><xdr:cNvPr id="'+(i+1)+'" name="'+m.cid+'"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>'+
          '<xdr:blipFill><a:blip r:embed="rId'+(i+1)+'" cstate="print"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>'+
          '<xdr:spPr><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr>'+
        '</xdr:pic>'+
        '</etc:cellImage>'
      ).join('')+
      '</etc:cellImages>';
  }

  let colsXml = '<cols>';
  COLW.forEach((w,i)=>{ colsXml += '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>'; });
  colsXml += '</cols>';

  const sheetXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
    colsXml+
    '<sheetData>'+rowsXml.join('')+'</sheetData>'+
    (merges.length ? '<mergeCells count="'+merges.length+'">'+merges.map(m=>'<mergeCell ref="'+m+'"/>').join('')+'</mergeCells>' : '')+
    (anchors.length ? '<drawing r:id="rId1"/>' : '')+
    '</worksheet>';
  const wbx = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
    '<sheets><sheet name="错题本" sheetId="1" r:id="rId1"/></sheets></workbook>';
  const wbRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'+
    (media.length ? '<Relationship Id="rIdCellImgs" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/cellimages" Target="cellimages.xml"/>' : '')+
    '</Relationships>';
  const sheetRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    (anchors.length ? '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/>' : '')+
    '</Relationships>';
  const ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    media.map(m=>'<Default Extension="'+m.ext+'" ContentType="image/'+(m.ext==='jpg'?'jpeg':m.ext)+'"/>').join('')+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'+
    (anchors.length ? '<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>' : '')+
    (media.length ? '<Override PartName="/xl/cellimages.xml" ContentType="application/vnd.ms-excel.cellimages+xml"/>' : '')+
    '</Types>';
  const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
    '</Relationships>';

  const enc2 = new TextEncoder();
  const files = [
    {name:'[Content_Types].xml', u8: enc2.encode(ct)},
    {name:'_rels/.rels', u8: enc2.encode(rootRels)},
    {name:'xl/workbook.xml', u8: enc2.encode(wbx)},
    {name:'xl/_rels/workbook.xml.rels', u8: enc2.encode(wbRels)},
    {name:'xl/worksheets/sheet1.xml', u8: enc2.encode(sheetXml)},
    {name:'xl/worksheets/_rels/sheet1.xml.rels', u8: enc2.encode(sheetRels)}
  ];
  if(anchors.length){
    files.push({name:'xl/drawings/drawing1.xml', u8: enc2.encode(drawingXml)});
    files.push({name:'xl/drawings/_rels/drawing1.xml.rels', u8: enc2.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      media.map((m,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image'+(i+1)+'.'+m.ext+'"/>').join('')+
      '</Relationships>')});
  }
  if(media.length){
    files.push({name:'xl/cellimages.xml', u8: enc2.encode(cellImagesXml)});
    files.push({name:'xl/_rels/cellimages.xml.rels', u8: enc2.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      media.map((m,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image'+(i+1)+'.'+m.ext+'"/>').join('')+
      '</Relationships>')});
  }
  media.forEach((m,i)=>files.push({name:'xl/media/image'+(i+1)+'.'+m.ext, u8:m.u8}));
  const out = makeZip(files);
  /* 挂图片嵌入统计（供导出提示用，不进入 zip 数据）
     · total    = 用户数据中的图片总张数（含重复）
     · embedded = 实际写入包的 media 张数（按内容去重）
     · inCell   = 以 DISPIMG 公式嵌入单元格的张数
     · floated  = 以浮动图兜底写入的张数
     · failed   = total 中未能写入包的张数（dataUrl 无法解析） */
  try{
    const allW = groups.reduce((s,g)=>s.concat(g.list), []);
    const total = allW.reduce((s,w)=>s + wrongImgs(w).length + wrongExpImgs(w).length, 0);
    /* 已嵌单元格的图片数：数 sheet 里的 DISPIMG 公式单元格 */
    const formN = (rowsXml.join('').match(/_xlfn\.DISPIMG\(/g) || []).length;
    const floatN = anchors.length;
    /* 真正失败的 = 解析失败被降级为文字提示的张数（qFail/eFail 累计） */
    out.__imgStat = {
      total,
      embedded: media.length,
      inCell: formN,
      floated: floatN,
      failed: failCount
    };
  }catch(e){}
  return out;
}

/* ============================================================
   【P1】导出前的图片解析层
   ------------------------------------------------------------
   新结构下 S.wrong[i] 只存图片 id，而导出链路（imgDims / composeVertical /
   buildWrongXlsx / Word / PDF）全部依赖 base64。
   与其改动十几个导出函数，不如在导出入口统一「把 id 还原成 base64」：
     · 返回一个浅拷贝的 groups（其中的错题是副本，带 imgs/expImgs base64）
     · S 本身完全不动（避免把 base64 又写回 localStorage）
   ★ 硬规则：必须转 base64，绝不能用 blob: URL（跨文档必然失效）
   ============================================================ */
async function resolveGroupsImgs(groups){
  const out = [];
  for(const g of groups){
    const list = [];
    for(const w of (g.list || [])){
      const cp = Object.assign({}, w);
      const qids = wrongImgIds(w), eids = wrongExpImgIds(w);
      if(qids.length || eids.length){
        const map = await imgStore.getMany(qids.concat(eids));
        const toB64 = async ids => {
          const arr = [];
          for(const id of ids){
            const rec = map.get(id);
            if(!rec || !rec.blob) continue;
            try{ arr.push(await blobToDataUrl(rec.blob)); }catch(e){ console.warn('[导出] 图片转换失败', id, e); }
          }
          return arr;
        };
        const q = qids.length ? await toB64(qids) : legacyImgs(w);
        const e2 = eids.length ? await toB64(eids) : legacyExpImgs(w);
        /* 导出副本统一用旧字段名 imgs/expImgs（导出函数都读这两个） */
        if(q.length){ cp.imgs = q; cp.img = q[0]; }
        if(e2.length){ cp.expImgs = e2; cp.expImg = e2[0]; }
        delete cp.imgIds; delete cp.imgId; delete cp.expImgIds; delete cp.expImgId;
      }else{
        /* 旧结构：把 img/expImg 单图字段也统一成数组，导出函数行为一致 */
        const q = legacyImgs(w), e2 = legacyExpImgs(w);
        if(q.length){ cp.imgs = q; cp.img = q[0]; }
        if(e2.length){ cp.expImgs = e2; cp.expImg = e2[0]; }
      }
      list.push(cp);
    }
    out.push(Object.assign({}, g, { list }));
  }
  return out;
}

async function generateWrongExport(cats, fmt, maxBytes, sub){
  let groups = wrongExportGroups(cats);
  /* 【P2】分批导出：按 id 集合过滤出本批题目 */
  if(sub && sub.onlyIds){
    groups = groups
      .map(g=>({ cat: g.cat, list: g.list.filter(w=>sub.onlyIds.has(w.id)) }))
      .filter(g=>g.list.length);
  }
  if(!groups.length){ toast('所选分类暂无错题'); return; }
  /* 【P1】导出前把 IDB 图片解析为 base64（S 不动，只改副本） */
  const hasAnyId = groups.some(g => (g.list||[]).some(w => wrongImgIds(w).length || wrongExpImgIds(w).length));
  if(hasAnyId){
    toast('正在读取图片…');
    try{ groups = await resolveGroupsImgs(groups); }
    catch(e){
      console.error('[导出] 图片解析失败', e);
      openModal('⚠️ 图片读取失败', '<p style="line-height:1.9">读取错题图片时出错，导出已取消。</p>'
        + '<p style="line-height:1.9;color:var(--muted)">' + esc(e && e.message ? e.message : String(e)) + '</p>', [{text:'我知道了', primary:true}]);
      return;
    }
  }
  const all = groups.reduce((s,g)=>s.concat(g.list), []);
  /* 【P2】批次文件名后缀（单批导出时用） */
  const batchSuffix = (sub && sub.batches && sub.batches.length > 1)
    ? ('_第' + (sub.idx+1) + '批共' + sub.batches.length + '批')
    : (maxBytes ? '_分' + Math.max(1, packBatches(all, maxBytes).length) + '批' : '');
  const titleBar =
    '<div class="wx-head"><h1>错题本</h1>'+
    '<p>导出日期：'+todayStr()+'　｜　错题总数：'+all.length+' 题（'+groups.map(g=>esc(g.cat)+' '+g.list.length+' 题').join(' · ')+'）'
    + (batchSuffix ? '<br>本次为分批导出：'+batchSuffix.replace(/^_/,'') : '') + '</p></div>';
  const body = groups.map(g=>
    '<div class="wx-sec"><h2>'+esc(g.cat)+'（'+g.list.length+'题）</h2>'+
    g.list.map((w,i)=>wrongExportItemHtml(w, i+1)).join('')+
    '</div>'
  ).join('') + wrongExportTail(groups);

  if(fmt === 'excel'){
    /* Excel：真 xlsx（ECMA-376）。修改轮6：图片以 WPS「嵌入单元格」方式
       （DISPIMG 公式 + cellimages.xml）写入「错题内容/解析」列单元格内，
       WPS 打开即为单元格内图片；多图纵向拼合为一张长图嵌入。
       文字写在图片下一行正下方单元格。 */
    toast('正在生成 Excel（图片嵌入单元格中）…');
    const xlsxU8 = await buildWrongXlsx(groups);
    const stat = (xlsxU8 && xlsxU8.__imgStat) ? xlsxU8.__imgStat : null;
    downloadBlob(xlsxU8, '错题本_'+todayStr()+batchSuffix+'.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    const n = groups.reduce((s,g)=>s+g.list.length,0);
    if(stat && stat.total > 0){
      const inCellTxt = stat.inCell ? '，其中 '+stat.inCell+' 张已嵌入单元格（WPS 直接可见）' : '';
      const floatTxt = stat.floated ? '，'+stat.floated+' 张以浮动图方式保留' : '';
      toast('已导出 Excel（'+n+' 题 · 图片 '+stat.embedded+' 张'+inCellTxt+floatTxt+'）'+(stat.failed?'，'+stat.failed+' 张未能解析':'')+' ✓');
    } else {
      toast('已导出 Excel（'+n+' 题）✓');
    }
    releaseExportMemory();
    return;
  }

  const css =
    '<style>'+
    'body{font-family:"Microsoft YaHei",SimSun,sans-serif;color:#333;margin:24px;}'+
    '.wx-head{text-align:center;border-bottom:3px solid #EE9BB4;padding-bottom:10px;margin-bottom:18px;}'+
    '.wx-head h1{margin:0 0 6px;font-size:24px;color:#D4517E;}'+
    '.wx-head p{margin:0;color:#666;font-size:12px;}'+
    '.wx-sec{margin-bottom:22px;page-break-inside:auto;}'+
    '.wx-sec h2{font-size:17px;color:#D4517E;border-left:5px solid #EE9BB4;padding-left:8px;margin:14px 0 10px;}'+
    '.wx-item{border:1px solid #E8D8DF;border-radius:8px;padding:10px 12px;margin-bottom:12px;page-break-inside:avoid;}'+
    '.wx-item-h{font-weight:700;font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;}'+
    '.wx-meta{width:100%;border-collapse:collapse;margin-top:8px;font-size:11.5px;}'+
    '.wx-meta td{border:1px solid #E8D8DF;padding:4px 6px;}'+
    '.wx-imgs img{max-width:420px;max-height:300px;margin:6px 8px 0 0;border:1px solid #E8D8DF;border-radius:6px;}'+
    '.wx-exp{margin-top:6px;font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word;}'+
    '.wx-tbl,.wx-sec table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px;}'+
    '.wx-tbl th,.wx-tbl td,.wx-sec table th,.wx-sec table td{border:1px solid #E8D8DF;padding:5px 7px;text-align:left;}'+
    '.wx-tbl th{background:#FDF0F5;}'+
    'p{font-size:12.5px;line-height:1.8;margin:6px 0;}'+
    '</style>';
  const docHtml = '<html><head><meta charset="utf-8"><title>错题本</title>'+css+'</head><body>'+titleBar+body+'</body></html>';

  if(fmt === 'word'){
    downloadBlob(docHtml, '错题本_'+todayStr()+batchSuffix+'.doc', 'application/msword');
    toast('已导出 Word（'+all.length+' 题）✓');
    releaseExportMemory();
  }else{
    /* PDF：打印窗口 → 用户在打印对话框选择「另存为 PDF」 */
    const win = window.open('', '_blank');
    if(!win){ toast('弹窗被拦截，请允许本页弹窗后重试'); return; }
    win.document.open();
    win.document.write('<html><head><meta charset="utf-8"><title>错题本_'+todayStr()+'</title>'+css+'</head><body>'+titleBar+body+
      '<scr'+'ipt>setTimeout(function(){try{window.print();}catch(e){}},400);</scr'+'ipt></body></html>');
    win.document.close();
    toast('已打开打印窗口，选择「另存为 PDF」即可保存');
  }
}

PAGES['w-log'] = function(){
  // 按板块统计（【改动二】分类归一，旧「申论」计入「申论小题」）
  const stats = {};
  CATS.forEach(c=>stats[c] = {count:0, ok:0, wrong:0, vague:0});
  S.reviewLogs.forEach(l=>{
    const c = canonCat(l.cat);
    if(!stats[c]) stats[c] = {count:0, ok:0, wrong:0, vague:0};
    stats[c].count++;
    if(l.ok) stats[c].ok++;
    else if(l.vague) stats[c].vague++;
    else stats[c].wrong++;
  });

  let rows = '';
  CATS.forEach(c=>{
    const s = stats[c];
    const rate = s.count ? Math.round(s.ok / s.count * 100) : 0;
    rows += '<tr>'+
      '<td>'+esc(c)+'</td>'+
      '<td style="text-align:center;">'+s.count+'</td>'+
      '<td style="text-align:center;color:#3E8A68;font-weight:700;">'+s.ok+'</td>'+
      '<td style="text-align:center;color:var(--coral);font-weight:700;">'+s.wrong+'</td>'+
      '<td style="text-align:center;color:#7A63C4;font-weight:700;">'+s.vague+'</td>'+
      '<td style="text-align:center;font-weight:800;color:'+(rate>=70?'#3E8A68':(rate>=40?'var(--pinkDeep2)':'var(--coral)'))+';">'+rate+'%</td>'+
      '<td style="min-width:100px;">'+progressBar(rate, rate>=70?'mint':(rate>=40?'':'coral'))+'</td>'+
    '</tr>';
  });

  // 各题复习次数直方图数据（前 20 题）
  const topWrong = S.wrong
    .filter(w=>(w.reviewCount||0) > 0)

          '<thead><tr>'+
            '<th>板块</th><th style="text-align:center;">复习次数</th><th style="text-align:center;">做对</th><th style="text-align:center;">做错</th><th style="text-align:center;">模糊</th><th style="text-align:center;">正确率</th><th>进度</th>'+
          '</tr></thead>'+
          '<tbody>'+rows+'</tbody>'+
        '</table></div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title">'+titleIco('trophy')+' 薄弱错题 TOP10 <span class="sub">按错误次数</span></div>'+
        (topWrong.length
          ? topWrong.map((w,i)=>(
              '<div class="li">'+
                '<div style="width:26px;height:26px;border-radius:50%;background:var(--coralSoft);color:var(--coral);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:12px;">'+(i+1)+'</div>'+
                '<div class="txt" style="font-weight:600;">'+esc((w.q||'').slice(0,60))+(w.q && w.q.length>60?'…':'')+
                  '<div style="font-size:calc(var(--fs-btn)-2px);color:var(--text3);margin-top:2px;">'+esc(w.cat)+' · 复习 '+(w.reviewCount||0)+' 次</div>'+

          '</select>'+
        '</div>'+
        '<div id="libList"></div>'+
        '<div id="libPager"></div>'+
      '</div>'+
      encourageBar('library'),    bind(){
      // 分页状态（每个会话内保持）
      if(typeof window.__libPage !== 'number') window.__libPage = 1;
      if(typeof window.__libPageSize !== 'number') window.__libPageSize = 10;

      function libFiltered(){
        const kw  = ($('#libKw').value  || '').trim();
        const src = ($('#libSrc').value || '').trim();
        const ty  = $('#libType').value;
        let arr = S.favorites.slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
        if(kw)  arr = arr.filter(f => (f.title + (f.content||'')).indexOf(kw) >= 0);

        if(ty)  arr = arr.filter(f => f.type === ty);

      function renderLib(){

        if(!arr.length){
          wrap.innerHTML = emptyBox('folder','资料库暂无匹配内容');
          if(pager) pager.innerHTML = '';
          return;
        }

        const size = window.__libPageSize;
        const totalPages = Math.max(1, Math.ceil(arr.length / size));
        if(window.__libPage > totalPages) window.__libPage = totalPages;
        if(window.__libPage < 1) window.__libPage = 1;

            '<div class="acc-h">'+esc(k)+'（'+groups[k].length+'）<span class="ar">▶</span></div>'+

                  '</div>'+
                  '<div class="qcard-b" style="white-space:pre-wrap;">'+esc(f.content||'').replace(/\n/g,'<br>')+'</div>'+
                  ((f.tags && f.tags.length) ? '<div style="margin-top:6px;">'+f.tags.map(t=>'<span class="kw">'+esc(t)+'</span>').join('')+'</div>' : '')+

                  '</div>'+
                '</div>'

            '</div>'+

        // 分页条
        if(pager){

            pager.innerHTML = '<div class="pager"><span class="pg-info">共 '+arr.length+' 条</span></div>';
          } else {
            pager.innerHTML = '<div class="pager">'+
              '<button class="btn ghost sm" data-lpg="first" '+((window.__libPage<=1)?'disabled':'')+'>« 首页</button>'+
              '<button class="btn ghost sm" data-lpg="prev" '+((window.__libPage<=1)?'disabled':'')+'>‹ 上一页</button>'+

              '<button class="btn ghost sm" data-lpg="next" '+((window.__libPage>=totalPages)?'disabled':'')+'>下一页 ›</button>'+
              '<button class="btn ghost sm" data-lpg="last" '+((window.__libPage>=totalPages)?'disabled':'')+'>末页 »</button>'+
            '</div>';
            $$('#libPager [data-lpg]').forEach(b=>{
              b.addEventListener('click', ()=>{

                if(a==='first') window.__libPage = 1;
                else if(a==='prev') window.__libPage--;
                else if(a==='next') window.__libPage++;

          renderLib();

      $('#libSearch').addEventListener('click', ()=>{ window.__libPage = 1; renderLib(); });

        $('#libKw').value=''; $('#libSrc').value=''; $('#libType').value='';
        window.__libPage = 1;

function getDayStat(d){
  const log = S.studyLog[d] || {sec:0, q:0, sl:0};
  const timerItems = S.timerLog.filter(x=>x.d === d);
  const q = timerItems.reduce((s,x)=>s+(x.q||0),0) || (log.q||0);
  const sec = timerItems.reduce((s,x)=>s+(x.sec||0),0) || (log.sec||0);
  return {d, q, sec, sl: log.sl||0};
}
function moodStatCards(rangeDays){
  const arr = rangeDays || Object.keys(S.moods);
  const cnt = {};
  arr.forEach(d=>{ const m = S.moods[d]; if(m) cnt[m] = (cnt[m]||0)+1; });
  const keys = Object.keys(cnt);
  if(!keys.length) return '<div style="color:var(--text3);font-size:var(--fs-btn);text-align:center;padding:10px;">还没有心情记录哦</div>';
  const max = Math.max(...keys.map(k=>cnt[k]));
  return keys.sort((a,b)=>cnt[b]-cnt[a]).map(k=>{
    const m = MOODS.find(x=>x.k === k) || {e:'😊'};
    const pct = Math.round(cnt[k]/max*100);
    return '<div style="margin-bottom:8px;">'+
      '<div style="display:flex;justify-content:space-between;font-size:var(--fs-btn);margin-bottom:3px;">'+
        '<span>'+m.e+' '+esc(k)+' 的一天</span><span style="color:var(--text2);font-weight:700;">'+cnt[k]+' 天</span>'+
      '</div>'+
      '<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
    '</div>';
  }).join('');
}
