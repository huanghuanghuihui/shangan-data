<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF9F5">
<title>上岸打卡系统</title>
<style>
:root{
  --pink:#F9D5DE; --pinkSoft:#FDEBF0; --pinkMid:#F7C3D2;
  --pinkDeep:#EE9BB4; --pinkDeep2:#E4779A;
  --coral:#F58B7A; --coralSoft:#FFE6E0;
  --mint:#9FDCBE; --lav:#CFC3F0;
  --text:#5B4B52; --text2:#9C8890; --text3:#C4B2BA;
  --line:#F7E3E9; --white:#fff;
  --r:26px; --r2:18px; --r3:14px;
  --shadow:0 6px 20px rgba(233,175,192,.16);
  --fs-title:36px; --fs-card:17px; --fs-body:14px; --fs-btn:13px; --fs-num:36px;
  --fs-frozen:14px;
  --sbw:230px;
}
/* 内容实际可用宽度（用于冻结栏/标题/座右铭/心情栏字号自适应）：
   定义在 body 上，侧边栏展开时扣除侧边栏宽度，折叠时为整屏宽。
   这样 body.sb-closed 的覆盖才能生效并被所有子元素继承 */
body{ --cw:calc(100vw - var(--sbw)); }
body.sb-closed{ --cw:100vw; }
body[data-font="small"]{--fs-title:30px;--fs-card:15px;--fs-body:13px;--fs-btn:12px;--fs-num:30px;--fs-frozen:13px;}
body[data-font="large"]{--fs-title:42px;--fs-card:19px;--fs-body:16px;--fs-btn:15px;--fs-num:42px;--fs-frozen:16px;}
/* ============================================================
   【需求 2 / 5】自适应控件字号变量
   ------------------------------------------------------------
   --fs-gantt-ctl   ：甘特图快捷跳转按钮 + 3 个筛选 select
   --fs-rvcal-search：复习月历搜索框提示文字
   均按内容可用宽度 --cw 线性插值（窄屏取下限、宽屏取上限，
   中间平滑过渡），并随设置里的字体档位 small / medium / large 浮动。
   注意：必须与 --cw 同层声明（都放在 body 上），否则 var(--cw)
   会在 :root 层解析为空 → clamp 失效、字号被丢弃。 */
body{
  --fs-gantt-ctl:clamp(13px, calc(11.5px + (var(--cw) - 360px) * 0.0035), 15px);
  --fs-rvcal-search:clamp(12px, calc(10.6px + (var(--cw) - 360px) * 0.0032), 14px);
}
body[data-font="small"]{
  --fs-gantt-ctl:clamp(12px, calc(10.8px + (var(--cw) - 360px) * 0.0030), 13px);
  --fs-rvcal-search:clamp(11px, calc(10.0px + (var(--cw) - 360px) * 0.0028), 13px);
}
body[data-font="large"]{
  --fs-gantt-ctl:clamp(15px, calc(13.4px + (var(--cw) - 360px) * 0.0040), 17px);
  --fs-rvcal-search:clamp(13px, calc(11.6px + (var(--cw) - 360px) * 0.0036), 15px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:linear-gradient(165deg,#FFF9F5 0%,#FFF1F4 45%,#FDF4FF 100%);
  background-attachment:fixed;color:var(--text);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:var(--fs-body);line-height:1.6;min-height:100vh;
  transition:padding-left .3s ease;overflow-x:hidden;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--pink);border-radius:99px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============ 侧边栏 ============ */
#sidebar{
  position:fixed;left:0;top:0;bottom:0;width:var(--sbw);
  background:linear-gradient(180deg,#FFF6F0 0%,#FFF0F4 100%);
  border-right:3px solid #FBD9E4;display:flex;flex-direction:column;
  z-index:90;transition:transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow:2px 0 18px rgba(238,155,180,.08);
}
body.sb-closed #sidebar{transform:translateX(-100%);}
.sb-top{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px;flex:none;}
.sb-title{font-size:calc(var(--fs-card) - 2px);font-weight:800;color:var(--pinkDeep2);letter-spacing:.5px;display:flex;align-items:center;gap:6px;}
.pin-btn{border:none;background:transparent;font-size:18px;cursor:pointer;padding:4px 6px;border-radius:10px;transition:.2s;line-height:1;filter:grayscale(1) opacity(.45);}
.pin-btn.on{filter:none;}
.pin-btn:hover{background:var(--pinkSoft);}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 10px 12px;display:flex;flex-direction:column;}
/* 在线状态：纯文本置于导航栏最下方（无胶囊外框/背景，12px） */
.sb-net{margin-top:auto;padding:10px 6px 2px;text-align:center;font-size:12px;color:var(--text3);font-weight:600;line-height:1.5;}
.sb-nav::-webkit-scrollbar{width:5px;}
.sb-group{margin-bottom:6px;}
.sb-ghead{
  width:100%;display:flex;align-items:center;gap:7px;
  padding:9px 10px;border:none;background:transparent;cursor:pointer;
  border-radius:var(--r3);font-family:inherit;font-size:var(--fs-body);
  color:var(--text);font-weight:700;transition:.2s;text-align:left;
}
.sb-ghead:hover{background:var(--pinkSoft);}
.sb-ghead.active{background:linear-gradient(135deg,#FDEBF0,#FBDDE8);color:var(--pinkDeep2);box-shadow:0 2px 8px rgba(238,155,180,.15);}
.sb-ghead.exit-ghead{background:#FFC1CC !important;border:1.5px solid #FFA8BB;color:#8A3B52;}
.sb-ghead.exit-ghead:hover{background:#FFB1C0 !important;}
.sb-ghead.exit-ghead .gicon,.sb-ghead.exit-ghead .gname{color:#8A3B52;}
.sb-ghead .gicon{display:flex;align-items:center;color:var(--pinkDeep2);flex:none;}
.sb-ghead .gname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-ghead .garrow{font-size:10px;color:var(--text3);transition:transform .25s;flex:none;}
.sb-group.open .garrow{transform:rotate(90deg);}
.sb-items{display:none;padding:2px 0 4px 6px;}
.sb-group.open .sb-items{display:block;}
.sb-item{
  width:100%;display:flex;align-items:center;gap:7px;
  padding:7px 10px;border:none;background:transparent;cursor:pointer;
  border-radius:12px;font-family:inherit;font-size:calc(var(--fs-body) - 1px);
  color:var(--text2);transition:.18s;text-align:left;margin-bottom:1px;
}
.sb-item:hover{background:var(--pinkSoft);color:var(--pinkDeep2);}
.sb-item.active{background:linear-gradient(135deg,#FDEBF0,#FBDDE8);color:var(--pinkDeep2);font-weight:700;box-shadow:0 2px 8px rgba(238,155,180,.18);}
.sb-item .iicon{display:flex;align-items:center;flex:none;}
.sb-item .iname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-bottom{flex:none;padding:10px 12px 16px;border-top:1px solid var(--line);}
.sb-set{
  width:100%;display:flex;align-items:center;gap:8px;justify-content:center;
  padding:9px;border:1.5px solid var(--line);background:#fff;cursor:pointer;
  border-radius:999px;font-family:inherit;font-size:var(--fs-btn);
  color:var(--pinkDeep2);font-weight:700;transition:.2s;
}
.sb-set:hover{background:var(--pinkSoft);border-color:var(--pink);}
.font-panel{display:none;margin-top:10px;padding:10px;background:#fff;border-radius:var(--r3);border:1.5px solid var(--line);}
.font-panel.show{display:block;}
.fp-danger{width:100%;margin-top:6px;padding:8px 10px;border:1.5px solid #F9B6A6;background:var(--coralSoft);color:var(--coral);border-radius:10px;font-family:inherit;font-size:calc(var(--fs-btn) - 1px);font-weight:700;cursor:pointer;transition:.2s;text-align:center;}
.fp-danger:hover{background:#FFDAD2;}

/* ============ 套卷拖拽排序 ============ */
.p-row{transition:opacity .15s, box-shadow .15s;}
.p-row.dragging{opacity:.4;}
.p-row.drag-over{box-shadow:inset 0 0 0 2px var(--pinkMid);}
.drag-handle{cursor:grab;color:var(--text3);font-weight:900;user-select:none;padding:0 2px;flex:none;}
.drag-handle:active{cursor:grabbing;}

/* ============ 甘特图：行拖拽排序（改动二） ============ */
.g-row{transition:opacity .15s, box-shadow .15s, background .15s;}
.g-row.dragging{opacity:.4;}
.g-row.drag-over{box-shadow:inset 0 0 0 2px var(--pinkMid);background:#FFF5F8;}
.g-row .drag-handle{cursor:grab;font-size:12px;line-height:1;padding:0 3px;opacity:.55;}
.g-row .drag-handle:hover{opacity:1;color:var(--pinkDeep2);}
/* 触摸拖拽时禁止页面滚动 */
.g-dragging-touch{touch-action:none;}
/* 分块渲染占位块（改动一） */
.g-tick-ph{border-left:1px solid var(--line);}
/* 快捷跳转条（改动一）
   【需求 2】按钮字号改用自适应变量 --fs-gantt-ctl（随 --cw 与字体档位线性缩放）；
   不换行：nowrap + 窄屏收紧 padding，极端情况下允许该行自身横向滚动兜底。 */
.g-jump{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;}
.g-jump .btn.sm{padding:3px 8px;font-size:var(--fs-gantt-ctl);white-space:nowrap;flex:none;}
.g-jump .g-jump-note{font-size:var(--fs-gantt-ctl);color:var(--text3);margin-left:auto;flex:none;white-space:nowrap;}
/* 【需求 2】3 个筛选 select 同步使用自适应字号，窄屏收紧内边距避免换行 */
.g-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.g-filters .sel{flex:1;min-width:96px;max-width:190px;font-size:var(--fs-gantt-ctl);padding:5px 8px;}
@media(max-width:430px){
  .g-jump{gap:4px;}
  .g-jump .btn.sm{padding:3px 6px;}
  .g-filters{gap:5px;}
  .g-filters .sel{min-width:80px;padding:4px 5px;}
}
/* 【需求 5】复习月历搜索框：左侧「图标+提示」独立 label，字号自适应不换行 */
.rvcal-search-lab{flex:none;font-size:var(--fs-rvcal-search);color:var(--text3);
  white-space:nowrap;line-height:1;user-select:none;}
@media(max-width:430px){
  .rvcal-search{gap:5px !important;}
  .rvcal-search-lab{font-size:var(--fs-rvcal-search);letter-spacing:-0.2px;}
  .rvcal-search .btn.sm{padding:3px 6px;}
}
/* ============================================================
   【需求 3 / 4】甘特图多任务条行（复习轮次条 / 同内容合并条）
   ============================================================ */
/* 多条的容器：相对定位，absolute 逐条定位 */
.g-bars{flex:none;position:relative;height:100%;}
/* 单条通用样式 */
.g-bar{position:absolute;border-radius:999px;overflow:hidden;display:flex;align-items:center;
  cursor:pointer;transition:filter .15s;}
.g-bar:hover{filter:brightness(1.05);}
/* 进度浅色层（普通计划条） */
.g-bar-inner{position:absolute;left:0;top:0;bottom:0;border-radius:999px 0 0 999px;
  background:rgba(255,255,255,.42);}
/* 条内文字 */
.g-bar-txt{position:relative;font-size:9px;font-weight:800;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;padding:0 5px;line-height:16px;}
/* 【需求 3】复习轮次条：默认淡柠檬黄 #FFFACD，条很浅 → 深色文字 + 细边框 */
.g-bar.rv-bar{background:#FFFACD;border:1px solid rgba(0,0,0,.08);color:#7A6420;
  box-shadow:0 1px 4px rgba(200,170,90,.20);}
.g-bar.rv-bar.done{opacity:.55;text-decoration:line-through;background:#F6F3E4;}
.g-bar.rv-bar.ovd{border:1.5px solid #F58B7A;box-shadow:0 0 0 1px rgba(245,139,122,.30);}
.g-bar.rv-bar .g-bar-txt{color:#7A6420;}
/* 【需求 4】同内容合并行：条按各自颜色渲染 */
.g-name .g-count{flex:none;font-size:8px;font-weight:800;color:var(--pinkDeep2);
  background:#FDEDF3;border-radius:6px;padding:0 4px;line-height:13px;}
@media(max-width:430px){
  .g-bar-txt{font-size:8px;line-height:14px;}
}

/* ============ 甘特图：颜色选择器浮层（改动三） ============ */
.gc-swatch{width:26px;height:26px;border-radius:8px;border:1.5px solid rgba(0,0,0,.08);cursor:pointer;position:relative;flex:none;}
.gc-swatch:hover{transform:scale(1.08);}
.gc-swatch.sel{box-shadow:0 0 0 2.5px var(--pinkDeep2);}
.gc-del{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--text3);color:#fff;
  font-size:10px;line-height:14px;text-align:center;cursor:pointer;font-weight:800;display:none;}
.gc-swatch:hover .gc-del{display:block;}

/* ============ 退出系统 ============ */
.sb-item.exit-item{background:#FFC1CC !important;border:1.5px solid #FFA8BB;color:#8A3B52;}
.sb-item.exit-item:hover{background:#FFB1C0 !important;}
.sb-item.exit-item .iicon, .sb-item.exit-item .iname{color:#8A3B52;}
#exitOverlay{position:fixed;inset:0;background:rgba(60,35,45,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:900;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease;padding:20px;}
#exitOverlay.show{opacity:1;pointer-events:auto;}
.exit-card{background:#fff;border-radius:32px;padding:40px 36px 32px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.22);max-width:420px;width:100%;transform:scale(.9);transition:transform .3s ease;}
#exitOverlay.show .exit-card{transform:scale(1);}
.exit-card h2{font-size:calc(var(--fs-title) * .78);font-weight:900;color:var(--pinkDeep2);margin:14px 0 8px;}
.exit-card p{font-size:var(--fs-card);color:var(--text2);font-weight:600;margin:0 0 22px;}
.exit-btns{display:flex;gap:12px;}
.exit-btns .btn{flex:1;padding:12px 10px;font-size:var(--fs-body);}
@keyframes tailWag{0%,100%{transform:rotate(-10deg);}50%{transform:rotate(16deg);}}
.tail-wag{transform-origin:85px 90px;animation:tailWag 1.1s ease-in-out infinite;}
@keyframes catBlink{0%,92%,100%{transform:scaleY(1);}96%{transform:scaleY(.08);}}
.exit-eyes{transform-origin:60px 55px;animation:catBlink 3.4s infinite;}
.fp-title{font-size:calc(var(--fs-btn) - 1px);color:var(--text2);margin-bottom:8px;text-align:center;}
.fp-opts{display:flex;gap:6px;}
.fp-opts button{flex:1;padding:7px 0;border:1.5px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;font-family:inherit;font-size:var(--fs-btn);color:var(--text2);font-weight:600;transition:.2s;}
.fp-opts button.on{background:linear-gradient(135deg,#F7A8C0,#EE9BB4);color:#fff;border-color:transparent;}
/* ============ 设置面板自适应（需求 3）============
   · 面板高度自适应：超出可视高度时内部滚动（细滚动条 + 惯性隔离），
     彻底修复浏览器缩放后面板底部被裁掉、看不到的问题
   · --fs-panel：面板统一字号变量，随页面宽度 --cw 线性插值，
     clamp 下限锁死 10px（任何缩放比例下文字都清晰可辨）；
     小/中/大 三档字体档各有独立区间 → 档位响应不被破坏
   · 按钮文字窄面板下不换行，用省略号兜底（不撑破容器）       */
#fontPanel{
  --fs-panel: clamp(10px, calc(10.5px + (var(--cw, 100vw) - 360px) * 0.004), 13px);
  max-height: calc(100vh - 150px);   /* 预留 sb-top + 设置按钮自身高度 */
  overflow-y: auto;
  overscroll-behavior: contain;      /* 滚到头不把滚动传给页面 */
}
body[data-font="small"] #fontPanel{ --fs-panel: clamp(10px, calc(10px   + (var(--cw, 100vw) - 360px) * 0.004), 12px); }
body[data-font="large"] #fontPanel{ --fs-panel: clamp(11px, calc(11.5px + (var(--cw, 100vw) - 360px) * 0.004), 14px); }
#fontPanel::-webkit-scrollbar{width:5px;}
#fontPanel::-webkit-scrollbar-thumb{background:#F3D7E2;border-radius:3px;}
#fontPanel::-webkit-scrollbar-track{background:transparent;}
/* 面板内各元素字号 / 间距 / 按钮高度随 --fs-panel 缩放 */
#fontPanel .fp-title{font-size:var(--fs-panel);margin-bottom:clamp(5px, calc(var(--fs-panel) * 0.62), 8px);}
#fontPanel .fp-opts button{font-size:var(--fs-panel);padding:clamp(5px, calc(var(--fs-panel) * 0.55), 7px) 0;}
#fontPanel .fp-danger{
  font-size:var(--fs-panel);
  padding:clamp(5px, calc(var(--fs-panel) * 0.55), 8px) 8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;  /* 窄面板文字不换行 */
}
#fontPanel .fp-hint{font-size:clamp(10px, calc(var(--fs-panel) - 1px), 12px);color:var(--text3);line-height:1.6;}
/* 【需求 2】数据管理 4 按钮：同宽同高同字号同圆角，纵向左右边缘严格对齐；
   按钮高度随 --fs-panel 缩放（需求 3d），文字超长省略号兜底 */
.dm-btns{display:flex;flex-direction:column;gap:6px;}
.dm-btns .fp-danger{
  width:100%;height:clamp(30px, calc(18px + var(--fs-panel) * 1.6), 38px);
  margin-top:0;display:flex;align-items:center;justify-content:center;
}
#edgeHandle{
  position:fixed;left:0;top:50%;transform:translateY(-50%);
  width:22px;height:70px;border:none;border-radius:0 16px 16px 0;
  background:linear-gradient(135deg,#F7C3D2,#EE9BB4);color:#fff;
  font-size:18px;cursor:pointer;z-index:120;display:none;
  box-shadow:2px 2px 12px rgba(238,155,180,.4);
}
body.sb-closed #edgeHandle{display:block;}

/* ============ 主区域 ============ */
#main{padding-left:var(--sbw);transition:padding-left .3s ease;min-height:100vh;}
body.sb-closed #main{padding-left:0;}
#content{max-width:1100px;margin:0 auto;padding:6px 18px 70px;}

/* ============ 顶部 ============ */
/* 修改轮5：禁用浏览器原生滚动锚定（overflow-anchor:none）。
   否则 topbar 的 max-height 变化会被浏览器判定为"内容重排"，
   自动把 scrollY 拉回，表现为滚轮上滑时页面抖动并下滑一段距离。 */
html{ overflow-anchor:none; }
body{ overflow-anchor:none; }
#content{ overflow-anchor:none; }
#topbar{
  display:grid;
  grid-template-columns:minmax(110px,1fr) minmax(0,2.4fr) minmax(110px,1fr);
  gap:10px;align-items:start;padding:16px 18px 10px;max-width:1100px;margin:0 auto;
  /* 页面上部折叠：点侧边栏菜单后只显示主要内容区；持续上滑到顶才重新展开 */
  overflow:hidden;
  max-height:520px;
  transition:max-height .34s ease, opacity .26s ease, padding .34s ease, margin .34s ease;
}
body.tb-hidden #topbar{max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin-top:0;}
/* 滚动触发的展开/折叠：不做高度过渡，避免"边滚边被拉扯"——
   高度瞬间到位，页面不产生可见滑动，从根本上消除滚动抖动。 */
body.tb-noanim #topbar{ transition:none !important; }
/* 上滑展开提示把手：默认完全隐藏，仅鼠标移到页面顶部边缘时滑出。
   位置固定在冻结栏"上方"，鼠标悬停时冻结栏自动下移给它让位。
   折叠态显示「⌄ 展开 ⌄」；展开态显示「^ 隐藏 ^」 */
/* 顶部把手：浮在冻结栏上沿之外（页面最顶端），不改变冻结栏位置。
   折叠态显示「⌄ 展开 ⌄」，展开态显示「^ 隐藏 ^」 */
#tbPeek{
  position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-100%);
  z-index:97;padding:3px 14px 4px;border-radius:0 0 11px 11px;
  background:rgba(255,255,255,.98);border:1.5px solid var(--pinkMid);border-top:none;
  color:var(--pinkDeep2);font-size:11px;font-weight:800;cursor:pointer;
  box-shadow:0 4px 12px rgba(233,175,192,.24);
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:opacity .22s ease, transform .24s cubic-bezier(.34,1.3,.64,1);
}
body.tb-peek-show #tbPeek{
  opacity:1;pointer-events:auto;
  transform:translateX(-50%) translateY(0);
}
/* 把手让位规则（区分两种状态）：
   · 折叠态：冻结栏吸附在视口顶端 top:0，把手正好压在它的上沿，需要给冻结栏加顶部内边距让位。
   · 展开态：冻结栏位于页面上部（topbar）之下，与顶端把手本就不重叠，
             此时【不做任何让位】，冻结栏的高度、位置、文字基线全部保持原样。 */
body.tb-peek-show.tb-hidden .sticky-cd{ padding-top:24px; }
/* 顶部感应热区：极窄透明条，不遮挡任何内容 */

}

/* ---- 猫狗 Idle 动画：平时自动眨眼/动耳，悬停眨眼+扇耳，点击弹跳 ---- */
.pet .pet-eyes{transform-origin:32px 37px;animation:petIdleBlink 4.6s ease-in-out infinite;}

@keyframes petIdleBlink{0%,91%,100%{transform:scaleY(1)} 94.5%{transform:scaleY(.12)} 98%{transform:scaleY(1)}}
@keyframes petBlinkOnce{0%,100%{transform:scaleY(1)} 45%{transform:scaleY(.1)}}
@keyframes petEarIdleL{0%,88%,100%{transform:rotate(0)} 92%{transform:rotate(-9deg)} 96%{transform:rotate(5deg)}}
@keyframes petEarIdleR{0%,84%,100%{transform:rotate(0)} 90%{transform:rotate(9deg)} 95%{transform:rotate(-5deg)}}
@keyframes petEarL{0%,100%{transform:rotate(0)} 40%{transform:rotate(-16deg)} 72%{transform:rotate(7deg)}}
@keyframes petEarR{0%,100%{transform:rotate(0)} 40%{transform:rotate(16deg)} 72%{transform:rotate(-7deg)}}
@keyframes petPoke{0%{transform:scale(1)} 30%{transform:scale(.82,.9) rotate(-8deg)} 62%{transform:scale(1.16,1.08) rotate(6deg)} 100%{transform:scale(1)}}
.tb-motto{

/* ============ 心情打卡栏（重写版） ============
   三级降级：初始(带图标·单行) → mood-noico(去图标·单行) → mood-split(两行)
   两行结构：第一行 = 前 4 个选项；第二行 = 后 3 个选项 + 「的一天」
   要点：
   · 用 flex + 在第 5 项前强制换行，不用 grid —— 避免列宽互相撑开
   · 「的一天」紧贴第 7 项右侧，宽度只由自身文字决定
   · 所有 chip 宽度只由自身文字决定（flex:0 0 auto），不受同行其它项影响
   ============================================ */
/* ---- 方案：级 2 用 grid 精确 4 列，第 5 项自动落到第二行第 1 列 ----
     grid 的好处：列宽由本列最宽项决定，「的一天」所在列不会被同行其它项拉宽；
     第二行从第 1 列开始，天然与第一行的「努力」（第 4 列）左边缘对齐。 */
.mood-wrap{margin-top:10px;text-align:center;padding-bottom:2px;overflow:visible;}
/* 用 overflow:visible 而非 hidden —— 拆行态下「的一天」的「天」字需要溢出到「努力」列之外，不能被容器裁掉，也不应因此出现滚动条。
   （注意：不能用 overflow-y:hidden + overflow-x:visible 的组合，浏览器会把 visible 强制改为 auto 从而可能产生滚动条。） */

/* ================================================================
   心情栏字号（--fs-mood）：由 JS 按「心情栏可用宽度」逐段写入
   ----------------------------------------------------------------
   最大 17px、最小 12px；可用宽度变宽则字号变大，变窄则变小，
   段内线性平滑，段间按降级断点切换（420 / 380 / 340 / 260）。
   JS 未接管时（首帧）回落到下面的默认值，避免字号为 0。
   ================================================================ */
.mood-wrap{ --fs-mood:13px; }
/* 两行态（末级）字号恒为降级全过程的最小值 12px。
   注意：这里【不能】用 !important ——
   · !important 会压过 JS 写在元素上的内联 --fs-mood（内联样式默认优先级低于 !important），
     导致两行态字号被永久钉死在 12px、且 probe 测量字号与真实渲染不一致；
   · 改为由 JS 在两行态时把 --fs-mood 统一写为 MOOD_FS_MIN(12px)，
     并以 CSS 选择器作为"JS 未接管时"的兜底，即可保证两条路径字号一致。 */
.mood-wrap.mood-split{ --fs-mood:12px; }
/* 拖拽窗口时暂停字号过渡，保证跟手（否则会有 0.16s 的滞后感） */
body.mood-resizing, body.mood-resizing .mood-chip, body.mood-resizing .mood-tail{
  transition:none !important;
}
/* 离屏测量探针：禁用一切过渡，保证测量读到的是"最终值"而非动画中间值 */
.mood-probe, .mood-probe *, .mood-probe *::before, .mood-probe *::after{
  transition:none !important; animation:none !important;
}
.mood-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  column-gap:5px;row-gap:4px;line-height:2;max-width:100%;}
.mood-last{display:inline-flex;flex-direction:row;align-items:center;gap:0;
  white-space:nowrap;flex:0 0 auto;}
/* 「的一天」：字号 = 心情标签字号 + 2px，并按"字符级"与第一行的「努力」对齐 ——
   「的」左缘对齐「努」左缘、「一」左缘对齐「力」左缘（「天」允许向右超出）。
   字号比标签大 2px，故单字宽多 2px；用 letter-spacing:-2px 把"的→一"的字距
   收回到与"努→力"一致，即可实现两处起点同时对齐（该值与字号无关，
   因为字号差恒为 2px，且本文件使用等宽中文字体）。
   布局宽度按"两字"占位（overflow:visible），第三字「天」溢出显示，
   这样它不会把 Grid 列宽撑开，也就不会连累第一行的标签被拉宽。 */
.mood-tail{
  white-space:nowrap;
  /* 字号 = 心情标签字号 + 1px（标签 = calc(var(--fs-mood) - 1px)，故此处即 var(--fs-mood)），
     延续上一版「的一天比标签大 1px」的约定；随 --fs-mood 同步缩放。
     注意：这里【不加】font-size 过渡 —— 字号随宽度逐像素连续更新本就平滑，
     若再加 CSS 过渡，级别切换瞬间标签会"先变大后缩回"，造成行数闪动。 */
  font-size:var(--fs-mood);
  font-weight:800;
  color:var(--pinkDeep2);
  letter-spacing:0;
  overflow:visible;
  display:inline-block;
  flex:0 0 auto;
  text-align:left;
  /* 布局占位宽度与精确左偏移由 alignMoodTail() 按真实排版动态计算后写入 */
}
/* ② 去掉小图标（单行仍放不下时） */
.mood-wrap.mood-noico .mood-emo{display:none;}
/* ③ 拆两行：grid 4 列；第一行 = 前 4 项，第二行 = 后 3 项 + 「的一天」 */
.mood-wrap.mood-split .mood-row{
  display:grid;
  grid-template-columns:repeat(4, max-content);
  justify-content:center;
  align-content:center;
  column-gap:5px;
  row-gap:5px;
  line-height:2;
}
.mood-wrap.mood-split .mood-row > *{margin:0;}
/* 第 5 项强制从第二行第 1 列开始（与第一行「努力」列左缘对齐） */
.mood-wrap.mood-split .mood-chip:nth-child(5){grid-column:1;}
/* 「幸运+的一天」整体占第 3~4 列并靠左排布：
   第 3 列宽 = 本列最宽项(幸运 42px)，故「的一天」自然从第 4 列起，
   左缘与第一行第 4 列的「努力」精确对齐。
   同时避免「的一天」把第 3 列撑宽而连累第二行的「忙碌」被拉长。 */
.mood-wrap.mood-split .mood-last{
  grid-column:3 / 5;
  justify-self:start;
  justify-content:flex-start;
}
.mood-chip{
  border:1.5px solid var(--line);background:#fff;border-radius:999px;
  padding:4px 12px;font-family:inherit;
  /* 标签字号 = --fs-mood − 1px（实际落在 11~16px），随可用宽度平滑缩放；
     不加 font-size 过渡：字号随宽度逐像素更新本就平滑，CSS 过渡反而会在
     级别切换瞬间造成"先溢出换行再缩回"的闪动。 */
  font-size:calc(var(--fs-mood) - 1px);
  transition:.2s;
  color:var(--text2);cursor:pointer;white-space:nowrap;font-weight:600;
  display:inline-flex;align-items:center;gap:3px;flex:none;
}
/* 窄屏降级①：隐藏表情图标 */

.mood-chip:hover{background:var(--pinkSoft);border-color:var(--pinkMid);color:var(--pinkDeep2);}
.mood-chip.on{background:linear-gradient(135deg,#F7A8C0,#EE9BB4);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(238,155,180,.35);}
.mood-chip:disabled{cursor:default;opacity:.55;}
.mood-chip.on:disabled{opacity:1;}



/* ============ 倒计时胶囊 ============ */
.cd-chip{
  display:inline-flex;flex-direction:column;align-items:center;gap:1px;
  padding:8px 16px;border-radius:22px;
  background:linear-gradient(135deg,#FDEBF0,#F9D5DE);
  border:2px solid #F7C3D2;box-shadow:0 4px 14px rgba(238,155,180,.22);
  cursor:pointer;transition:.2s;white-space:nowrap;
}
.cd-chip:hover{transform:translateY(-2px);}
.cd-chip.warn{background:linear-gradient(135deg,#FFE6E0,#FFD3C9);border-color:#F9B6A6;box-shadow:0 4px 14px rgba(245,139,122,.3);}
.cd-num{font-size:clamp(22px,5vw,var(--fs-num));font-weight:900;color:var(--pinkDeep2);line-height:1.05;letter-spacing:-.5px;}
.cd-chip.warn .cd-num{color:var(--coral);}
.cd-lbl{font-size:11px;color:var(--text2);font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;}
.cd-chip.warn .cd-lbl{color:#D9756A;}

/* ============ 打卡统计 ============ */
.stk-chip{
  display:inline-flex;flex-direction:column;gap:4px;
  padding:8px 12px;border-radius:22px;
  background:linear-gradient(135deg,#FDEBF0,#F9D5DE);
  border:2px solid #F7C3D2;
  box-shadow:0 4px 14px rgba(238,155,180,.22);
  white-space:nowrap;
}
.stk-row{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);font-weight:600;}
.stk-row b{color:var(--pinkDeep2);font-size:14px;font-weight:900;}

/* ============ 冻结栏 ============ */
/* 字号自适应：以设置里的字号（--fs-frozen）为最大可选字号，最小 11px，
   随"内容实际可用宽度"（--cw，已扣除侧边栏）自动收缩，
   内容始终单行不换行。
   注意：必须与 --cw 同层声明（都放在 body 上），否则 var(--cw) 会在 :root 层解析为空 */
body{ --fs-frozen-cur:clamp(10.5px, calc(10px + (var(--cw) - 700px) * 0.0065), var(--fs-frozen)); }
.sticky-cd{
  position:sticky;top:0;z-index:80;display:flex;gap:7px;flex-wrap:nowrap;
  justify-content:center;align-items:center;padding:8px 12px;
  margin:0 auto 10px;max-width:1100px;
  background:rgba(255,249,245,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1.5px solid var(--line);
  box-shadow:0 4px 12px rgba(233,175,192,.10);
  overflow:hidden;white-space:nowrap;   /* 不换行、不出现左右滚动条 */
}
.sticky-cd>*{flex:0 0 auto;}
/* 考试倒计时胶囊：仅在 lv5 兜底时启用内部省略，避免溢出 */
body.sticky-tight .mini-cd.mini-exam{max-width:min(48vw, 320px);}
body.sticky-tight .mini-cd.mini-exam>span.mx-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.mini-cd{
  display:inline-flex;align-items:center;gap:5px;padding:5px 14px;
  border-radius:999px;background:var(--pinkSoft);font-size:var(--fs-frozen-cur);
  font-weight:700;color:var(--pinkDeep2);border:1.5px solid var(--pink);white-space:nowrap;
}
.mini-cd.warn{background:var(--coralSoft);color:var(--coral);border-color:#F9B6A6;}
.mini-cd.online{background:#E4F7EE;color:#3E8A68;border-color:#B4E6CD;}
.mini-cd.offline{background:#F4F0F2;color:var(--text2);border-color:#E4DEE2;}

/* ============ 兔头跳转导航 ============ */
/* 始终固定在主要内容页面左上角：贴住内容区（最大 1100px 居中）左缘、
   位于顶部冻结栏下方；列表展开在兔头正下方（纵向排列） */
.bunny-nav{
  position:fixed;z-index:95;
  left:max(12px, calc((100vw - 1248px)/2));top:64px;
  display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  transition:left .32s cubic-bezier(.34,1.3,.64,1), top .32s ease;
  pointer-events:none;
}
body:not(.sb-closed) .bunny-nav{
  left:max(calc(var(--sbw) + 4px), calc(var(--sbw) + (100vw - var(--sbw) - 1248px)/2));
}
.bunny-nav>*{pointer-events:auto;}
.bunny-head{
  width:62px;height:62px;flex:none;cursor:pointer;position:relative;
  transition:transform .28s cubic-bezier(.34,1.4,.64,1);
  transform-origin:50% 72%;
}
.bunny-head:hover{transform:scale(1.09) rotate(-4deg);}
.bunny-head:active{transform:scale(.94);}
.bunny-head svg{display:block;overflow:visible;}
/* 漂浮动画挂在内层，避免与外层 hover 的 transform 互相覆盖造成弹跳 */
.bunny-inner{width:100%;height:100%;animation:bunnyFloat 3.4s ease-in-out infinite;}
/* 耳朵摆动（左右异相位，自然） */
.bn-ear{transform-box:fill-box;}
.bn-ear-l{transform-origin:50% 92%;animation:bunnyEarL 4.2s ease-in-out infinite;}
.bn-ear-r{transform-origin:50% 92%;animation:bunnyEarR 4.2s ease-in-out infinite .35s;}
/* 眨眼：整组眼睛纵向压缩，自然呼吸节奏 */
.bn-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:bunnyBlink 4.8s ease-in-out infinite;}
/* 嘴巴轻微动，像在呼吸 */
.bn-mouth{transform-box:fill-box;transform-origin:50% 10%;animation:bunnyMouth 3.4s ease-in-out infinite;}
@keyframes bunnyFloat{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-5px) scale(1.015);}}
@keyframes bunnyBreathe{0%,100%{transform:scale(1);}50%{transform:scale(1.025);}}
@keyframes bunnyEarL{0%,100%{transform:rotate(0);}30%{transform:rotate(-6deg);}70%{transform:rotate(2deg);}}
@keyframes bunnyEarR{0%,100%{transform:rotate(0);}30%{transform:rotate(6deg);}70%{transform:rotate(-2deg);}}
@keyframes bunnyBlink{0%,90%,100%{transform:scaleY(1);}94%{transform:scaleY(.1);}97%{transform:scaleY(1);}}
@keyframes bunnyMouth{0%,100%{transform:translateY(0);}50%{transform:translateY(1px) scaleY(.94);}}
/* 悬停兔头 → 触发一次完整眨眼+动耳 */
.bunny-head:hover .bn-eyes{animation:bunnyBlinkOnce .6s ease;}
.bunny-head:hover .bn-ear-l{animation:bunnyEarWaveL .7s ease;}
.bunny-head:hover .bn-ear-r{animation:bunnyEarWaveR .7s ease .1s;}
@keyframes bunnyBlinkOnce{0%,100%{transform:scaleY(1);}45%{transform:scaleY(.08);}}
@keyframes bunnyEarWaveL{0%,100%{transform:rotate(0);}40%{transform:rotate(-14deg);}72%{transform:rotate(4deg);}}
@keyframes bunnyEarWaveR{0%,100%{transform:rotate(0);}40%{transform:rotate(14deg);}72%{transform:rotate(-4deg);}}
/* 列表：位于兔头下方，纵向排列 */
.bunny-list{
  display:flex;flex-direction:column;gap:5px;
  padding:9px 10px;border-radius:18px;
  background:rgba(255,255,255,.97);border:1.5px solid var(--line);
  box-shadow:0 12px 30px rgba(233,175,192,.30);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  max-height:min(58vh,430px);overflow-y:auto;
  opacity:0;visibility:hidden;transform:translateY(-10px) scale(.96);
  transform-origin:top left;
  transition:opacity .22s ease, transform .26s cubic-bezier(.34,1.3,.64,1), visibility .22s;
}
.bunny-nav.open .bunny-list{opacity:1;visibility:visible;transform:translateY(0) scale(1);}
.bunny-item{
  display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:11px;
  border:1.5px solid transparent;background:transparent;font-family:inherit;
  font-size:13px;font-weight:700;color:var(--text2);cursor:pointer;
  transition:.18s;white-space:nowrap;text-align:left;
}
.bunny-item:hover{background:var(--pinkSoft);border-color:var(--pink);color:var(--pinkDeep2);}
.bunny-item.active{background:linear-gradient(135deg,#F7A8C0,#EE9BB4);color:#fff;border-color:transparent;}
.bunny-item .bn-dot{
  width:6px;height:6px;border-radius:50%;flex:none;
  background:var(--pink);transition:.18s;
}
.bunny-item:hover .bn-dot{background:var(--pinkDeep2);transform:scale(1.25);}
.bunny-item.active .bn-dot{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35);}
@media (max-width:900px){
  .bunny-nav{left:8px;top:64px;}
  body:not(.sb-closed) .bunny-nav{left:calc(var(--sbw) + 4px);}
  .bunny-head{width:52px;height:52px;}
  .bunny-list{max-height:50vh;}
}

/* ============ 卡片 ============ */
.card{background:#fff;border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);border:1.5px solid var(--line);margin-bottom:16px;}
.card-title{font-size:var(--fs-card);font-weight:800;color:var(--pinkDeep2);display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.card-title .ttl-ico{display:flex;align-items:center;flex:none;}
.card-title .sub{font-size:calc(var(--fs-btn) - 1px);color:var(--text3);font-weight:500;margin-left:auto;}
/* 标题右侧操作按钮（导入/导出） */
.card-title .ttl-acts{display:inline-flex;gap:6px;margin-left:10px;flex:none;}
.act-btn{
  border:1.5px solid var(--line);background:#fff;border-radius:999px;
  padding:4px 12px;font-family:inherit;font-size:calc(var(--fs-btn) - 1px);
  font-weight:700;color:var(--text2);cursor:pointer;transition:.2s;
  position:relative;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
}
.act-btn:hover{background:var(--pinkSoft);border-color:var(--pink);color:var(--pinkDeep2);}
/* 悬停提示（支持多行，显示在按钮上方） */
/* —— 悬停提示：统一以「浮层叠加」方式呈现，不占用布局高度 —— */
.tip-host{position:relative;display:inline-flex;align-items:center;}
.tip-host .tip-pop{
  position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);
  background:rgba(91,75,82,.96);color:#fff;font-size:11px;font-weight:500;line-height:1.75;
  padding:8px 12px;border-radius:12px;white-space:nowrap;text-align:left;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s;z-index:9999;
  box-shadow:0 8px 24px rgba(0,0,0,.22);
}
.tip-host .tip-pop b{color:#FFD9E4;font-weight:700;}
.tip-host:hover .tip-pop{opacity:1;visibility:visible;}
/* 悬停时提升容器层级，确保浮层压过同页其它内容（避免被后续 DOM 覆盖） */
.tip-host:hover{z-index:9998;}
.tip-host .tip-pop::after{
  content:'';position:absolute;left:50%;bottom:100%;transform:translateX(-50%);
  border:6px solid transparent;border-bottom-color:rgba(91,75,82,.96);
}
/* 向上弹出（靠近页面底部时使用，避免被视口下沿裁切） */
.tip-host .tip-pop.tip-up{top:auto;bottom:calc(100% + 8px);}
.tip-host .tip-pop.tip-up::after{
  content:'';position:absolute;left:50%;top:100%;bottom:auto;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:rgba(91,75,82,.96);
}
/* 弹窗内的行内提示：样式与「悬停小猫头」提示一致（深灰底/白字/11px），无旋转等动画；
   改为 absolute 浮层叠加，不再占位，保证「手动导入」「从 Excel/Word 导入」两个按钮完全等高 */
.tip-host.tip-inline{display:inline-flex;align-items:center;justify-content:center;position:relative;}
.tip-host .tip-pop.tip-pop-solid{
  top:auto;bottom:calc(100% + 8px);transform:translateX(-50%);
  background:rgba(91,75,82,.94);color:#fff;font-size:11px;font-weight:500;line-height:1.75;
  padding:5px 12px;border-radius:99px;box-shadow:0 6px 18px rgba(60,35,45,.22);
}
.tip-host .tip-pop.tip-pop-solid::after{display:none;}
/* 导入弹窗：两个按钮强制等高同字号 */
#ciManual,#ciFile{height:52px !important;box-sizing:border-box;font-size:var(--fs-body) !important;line-height:1.1;}
.tip-host.tip-inline{height:52px;}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));}

/* ============ 按钮 ============ */
.btn{
  border:none;border-radius:999px;padding:8px 18px;
  font-size:var(--fs-btn);font-weight:700;cursor:pointer;
  font-family:inherit;transition:.2s;background:var(--pinkSoft);
  color:var(--pinkDeep2);white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px;justify-content:center;
}
.btn:hover{background:var(--pink);}
.btn:active{transform:scale(.96);}
.btn.primary{background:linear-gradient(135deg,#F7A8C0,#EE9BB4);color:#fff;box-shadow:0 4px 12px rgba(238,155,180,.35);}
.btn.primary:hover{box-shadow:0 6px 18px rgba(238,155,180,.45);}
.btn.mint{background:linear-gradient(135deg,#B4E6CD,#9FDCBE);color:#2E6B50;box-shadow:0 4px 12px rgba(159,220,190,.35);}
.btn.danger{background:var(--coralSoft);color:var(--coral);}
.btn.danger:hover{background:#FFD5CB;}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--text2);}
.btn.ghost:hover{background:var(--pinkSoft);border-color:var(--pink);}
.btn.sm{padding:5px 12px;font-size:calc(var(--fs-btn) - 2px);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ============ 标签 ============ */
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:4px 12px;
  border-radius:999px;background:var(--pinkSoft);color:var(--pinkDeep2);
  font-size:calc(var(--fs-btn) - 1px);font-weight:700;
}
.pill.coral{background:var(--coralSoft);color:var(--coral);}
.pill.mint{background:#E4F7EE;color:#3E8A68;}
.pill.lav{background:#F0EAFF;color:#7A63C4;}
.pill.grey{background:#F4F0F2;color:var(--text2);}

/* ============ 表单 ============ */
.inp,.sel,.ta{
  width:100%;padding:9px 14px;border:1.5px solid var(--line);
  border-radius:999px;background:#FFFDFC;font-family:inherit;
  font-size:var(--fs-body);color:var(--text);outline:none;transition:.2s;
}
.ta{border-radius:var(--r2);resize:vertical;min-height:70px;line-height:1.6;}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--pinkMid);background:#fff;box-shadow:0 0 0 3px rgba(249,213,222,.4);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:calc(var(--fs-btn) - 1px);color:var(--text2);font-weight:700;margin-bottom:5px;padding-left:4px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.row > *{flex:1;min-width:130px;}

/* ============ 进度条 ============ */
.pbar{height:10px;background:#F6EDF1;border-radius:99px;overflow:hidden;}
.pbar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F7C3D2,#EE9BB4);transition:width .5s;}
.pbar.mint > i{background:linear-gradient(90deg,#B4E6CD,#9FDCBE);}
.pbar.coral > i{background:linear-gradient(90deg,#FBC0B4,#F58B7A);}
/* 马卡龙柔和彩虹进度条（学习时长超出目标时）—— 降低饱和度 + 缓慢流动动画（需求 12） */
.pbar.rainbow{height:12px;}
.pbar.rainbow > i{
  background:linear-gradient(90deg,
    #F7C6C7,#F9DCE4,#CFEADD,#D8E2F2,#F7D6D1,#F8E5CC,#F2F3D2,#F7C6C7);
  background-size:300% 100%;
  animation:rainbowFlow 7s linear infinite;
}
@keyframes rainbowFlow{
  0%{background-position:0% 50%;}
  100%{background-position:300% 50%;}
}
/* 「今日打卡」可点击卡片 */
.stat-a.ck-today{cursor:pointer;transition:.2s;user-select:none;}
.stat-a.ck-today:hover{border-color:var(--pinkMid);transform:translateY(-1px);}
.stat-a.ck-today .num{color:var(--text3);}
.stat-a.ck-today.on{background:linear-gradient(135deg,#FFE3EC,#FFD1DE);border-color:var(--pinkMid);}
.stat-a.ck-today.on .num{color:var(--pinkDeep2);}
.stat-a.ck-today.on .lb{color:var(--pinkDeep2);}
/* 计时器标签卡（本次小题记录 / 历史记录）—— 默认折叠，可点击展开 */
.tm-tabs{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1.5px dashed var(--line);background:#FFFAFB;flex-wrap:nowrap;}
.tm-tab{
  border:1.5px solid transparent;background:transparent;border-radius:999px;
  padding:5px 12px;font-family:inherit;font-size:calc(var(--fs-btn) - 1px);
  color:var(--text2);font-weight:700;cursor:pointer;transition:.2s;white-space:nowrap;
}
.tm-tab:hover{color:var(--pinkDeep2);}
.tm-tab.on{background:#fff;border-color:var(--pinkMid);color:var(--pinkDeep2);}
.tm-fold{flex:none;}
.tm-tab-body{max-height:420px;overflow:auto;}
/* 年报热力图：按月格子（点击下钻每日）
   R4：单行 12 列；月份标签移到热力框外下方；框内只留紧凑时长值 */
.yr-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;}
.yr-col{min-width:0;text-align:center;}
.yr-mon{
  border-radius:var(--r2);padding:16px 2px;text-align:center;cursor:pointer;
  border:1.5px solid var(--line);transition:.2s;min-width:0;
}
.yr-mon:hover{transform:translateY(-2px);border-color:var(--pinkMid);box-shadow:0 4px 14px rgba(238,155,180,.25);}
.yr-mon.on{border-color:var(--pinkDeep2);}
.yr-mon .ym-v{font-size:calc(var(--fs-btn) - 2px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.yr-lb{font-size:calc(var(--fs-btn) - 2px);color:var(--text3);margin-top:4px;}
@media (max-width:520px){
  .yr-mon .ym-v{font-size:9px;}
  .yr-lb{font-size:8px;margin-top:2px;}
}

/* R2：计划弹窗 日历式选周 / 选月 */
.pcal{border:1.5px dashed var(--line);border-radius:var(--r2);background:#FFFDFC;padding:10px;margin-bottom:10px;}
.pcal-hd{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.pcal-hd b{flex:1;text-align:center;font-size:var(--fs-btn);color:var(--pinkDeep2);}
.pcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.pcal-grid .hd{font-size:calc(var(--fs-btn) - 2px);color:var(--text3);text-align:center;padding:3px 0;font-weight:700;}
.pcal-grid .cell{
  border:1.5px solid transparent;border-radius:8px;background:#fff;
  font-family:inherit;font-size:calc(var(--fs-btn) - 2px);color:var(--text2);
  padding:6px 0;text-align:center;cursor:pointer;transition:.15s;min-width:0;
}
.pcal-grid .cell:hover{background:#FFE9F0;border-color:var(--pinkMid);color:var(--pinkDeep2);}
.pcal-grid .cell.dim{color:#E3D3DA;background:#FFFAFB;}
.pcal-grid .cell.today{border-color:var(--pinkMid);font-weight:800;color:var(--pinkDeep2);}
/* 修改轮2：单日期点选日历的选中态 */
.pcal-grid .cell.sel{background:var(--pinkDeep2);border-color:var(--pinkDeep2);color:#fff;font-weight:800;}
/* 修改轮3：日期搜索控件（输入框 + 右端日历按钮合为一个整体） */
.date-search{position:relative;display:inline-flex;align-items:center;flex:1 1 180px;max-width:240px;min-width:150px;}
.date-search .inp{padding-right:38px;width:100%;}
.date-search .ds-cal{
  position:absolute;right:3px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;justify-content:center;
  width:30px;height:30px;border:none;border-radius:8px;cursor:pointer;
  background:var(--pinkSoft);color:var(--pinkDeep2);transition:.15s;
}
.date-search .ds-cal:hover{background:var(--pinkMid);color:#fff;}
.pcal-mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.pcal-mgrid .mcell{
  border:1.5px solid var(--line);border-radius:var(--r2);background:#fff;
  font-family:inherit;font-size:var(--fs-btn);color:var(--text2);font-weight:700;
  padding:12px 0;text-align:center;cursor:pointer;transition:.15s;
}
.pcal-mgrid .mcell:hover{background:#FFE9F0;border-color:var(--pinkMid);color:var(--pinkDeep2);}
.pcal-mgrid .mcell.today{border-color:var(--pinkDeep2);color:var(--pinkDeep2);}
.pcal-tip{font-size:calc(var(--fs-btn) - 2px);color:var(--text3);margin-top:8px;text-align:center;}

/* ============ 统计块 ============ */
.stat{background:linear-gradient(135deg,#FFF7FA,#FFF1F5);border-radius:var(--r2);padding:14px 12px;text-align:center;border:1.5px solid var(--line);}
.stat .num{font-size:calc(var(--fs-num) * .72);font-weight:900;color:var(--pinkDeep2);line-height:1.1;}
.stat .lb{font-size:calc(var(--fs-btn) - 1px);color:var(--text2);margin-top:3px;font-weight:600;}

/* ============================================================
   ★ 自适应统计卡片行（需求 4/5/7）
   ------------------------------------------------------------
   · 「同一行」：grid 固定 N 列（--statN），永不换行
   · 卡片随宽度缩放：每列 1fr，列内 padding/圆角随之收紧
   · 数字字号：clamp(板块标题字号 --fs-card, 按列宽的插值, 上限)
       下限锁死为 --fs-card（需求：最小缩小至与板块标题相同）
   · 标签字号：随数字同步缩放，下限 --lb-min（默认 10px，保证清晰可辨）
   用 --colW（每列可用宽度，由 JS 写入或 CSS 估算）驱动插值。
   ============================================================ */
.stat-row{
  display:grid;
  grid-template-columns:repeat(var(--statN,3), minmax(0,1fr));
  gap:8px;margin-bottom:12px;
}
/* 标题右侧操作区（导入/导出等）—— 需求 4-2 / 7 */
.card-title .ttl-actions{
  margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;
  /* 【体检修复】窄屏+大字档下按钮总宽可能超过标题行可用宽：
     flex 子项默认 min-width:auto 会被 nowrap 内容撑破容器（实测 gantt 页 375px 溢出 4px）。
     加 min-width:0 + max-width:100% + 换行兜底 —— 宽屏无感知，窄屏按钮自动流到第二行。 */
  min-width:0;max-width:100%;flex-wrap:wrap;row-gap:4px;
}
.card-title .ttl-actions .btn{padding:4px 9px;font-size:calc(var(--fs-btn) - 2px);white-space:nowrap;}
/* 已完成内容明细列表（需求 4-2） */
.done-detail{
  margin-top:10px;background:#FFFDFC;border:1.5px dashed var(--line);
  border-radius:var(--r3);padding:8px 10px;
  max-height:240px;overflow:auto;
}
.done-detail .dd-item{
  display:flex;align-items:center;gap:6px;padding:4px 0;
  font-size:calc(var(--fs-btn) - 1px);color:var(--text2);
  border-bottom:1px dashed #F3E7EC;
}
.done-detail .dd-item:last-child{border-bottom:none;}
.done-detail .dd-ico{color:var(--mint,#7DC4A5);flex:none;display:inline-flex;}
.done-detail .dd-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.done-detail .dd-cnt{flex:none;color:var(--pinkDeep2);font-weight:700;}
.stat-a{
  background:linear-gradient(135deg,#FFF7FA,#FFF1F5);
  border-radius:var(--r2);padding:10px 6px;text-align:center;
  border:1.5px solid var(--line);
  min-width:0;overflow:hidden;
}
.stat-a .num{
  font-weight:900;color:var(--pinkDeep2);line-height:1.12;
  /* 数字字号：以板块标题字号(--fs-card)为下限，随内容可用宽度线性放大，
     上限与普通 stat 卡片一致（--fs-num * .72），保证视觉统一。
     clamp 的三段：下限 / 线性插值 / 上限 —— 天然平滑、无跳变。 */
  font-size:clamp(var(--fs-card),
                  calc(var(--fs-card) + (var(--cw) - 420px) * 0.0145),
                  calc(var(--fs-num) * .72));
  white-space:nowrap;
}
.stat-a .lb{
  color:var(--text2);margin-top:2px;font-weight:600;line-height:1.25;
  /* 标签字号随数字同步缩放（约为数字的 0.52），下限 --lb-min（默认 10px）保证清晰可辨 */
  font-size:clamp(var(--lb-min, 10px),
                  calc((var(--fs-card) + (var(--cw) - 420px) * 0.0145) * 0.52),
                  calc(var(--fs-btn) - 1px));
  word-break:break-word;
}

/* ============================================================
   【本次改动三 / 四】复习月历（复习计划页第二块卡片）
   ------------------------------------------------------------
   7 列固定网格（周一起始），格子随宽度自适应；
   任务项三种状态色：已完成=无背景+浅灰删除线 / 未完成=#FFFACD / 逾期=#FFE4E1；
   字号与内边距在手机端（<430px）收窄，保证 7 列不换行、文字仍可辨。
   ============================================================ */
.rvcal-head{
  display:grid;grid-template-columns:repeat(7, minmax(0,1fr));gap:4px;margin-bottom:4px;
}
.rvcal-head span{
  text-align:center;font-size:11px;color:var(--text3);font-weight:700;padding:2px 0;
}
.rvcal-grid{
  display:grid;grid-template-columns:repeat(7, minmax(0,1fr));gap:4px;
}
.rvcal-cell{
  min-height:86px;border:1.5px solid var(--line);border-radius:10px;
  padding:4px 5px;background:#FFFDFC;cursor:pointer;overflow:hidden;
  transition:border-color .15s, background .15s;
}
.rvcal-cell:hover{border-color:var(--pinkMid);}
.rvcal-cell.out{                      /* 本月之外的补位格：弱化、不可点 */
  background:#FBF7F9;border-style:dashed;cursor:default;opacity:.5;
}
.rvcal-cell.out:hover{border-color:var(--line);}
.rvcal-cell.today{                    /* 今天：粉色边框高亮 */
  border-color:var(--pinkDeep2);background:#FFF4F8;
  box-shadow:0 0 0 1.5px rgba(228,161,182,.30) inset;
}
.rvcal-d{
  font-size:11px;color:var(--text2);font-weight:800;line-height:1.2;margin-bottom:2px;
}
.rvcal-cell.today .rvcal-d{color:var(--pinkDeep2);}
.rvcal-cell.out .rvcal-d{color:var(--text3);font-weight:600;}
.rvcal-task{
  font-size:11px;line-height:1.45;border-radius:5px;padding:1px 4px;margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;
  cursor:pointer;transition:opacity .15s;
}
/* 【改动四】三种状态背景色（与内联 class 保持同一份定义） */
.rvcal-task.pending{background:#FFFACD;color:#7A6420;}                       /* 淡柠檬黄=待复习 */
.rvcal-task.overdue{background:#FFE4E1;color:#A64A55;}                       /* 淡粉红=逾期未完成 */
.rvcal-task.done{                                                            /* 已完成=无背景+删除线 */
  background:transparent;color:#B9B2BC;text-decoration:line-through;
}
.rvcal-task.dim{opacity:.25;}                                                /* 搜索不匹配：变淡不隐藏 */
.rvcal-more{
  font-size:10px;color:var(--pinkDeep2);font-weight:800;cursor:pointer;
  padding:1px 4px;border-radius:5px;background:#FDEDF3;
}
.rvcal-legend{
  display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--text3);margin-top:8px;
}
.rvcal-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;
  vertical-align:-1px;border:1px solid rgba(0,0,0,.06);}
@media(max-width:430px){
  .rvcal-head span{font-size:9px;}
  .rvcal-grid{gap:3px;}
  .rvcal-cell{min-height:60px;padding:3px 3px;border-radius:8px;}
  .rvcal-d{font-size:9px;}
  .rvcal-task{font-size:9px;padding:1px 3px;margin-bottom:1px;border-radius:4px;}
  .rvcal-more{font-size:8px;padding:0 3px;}
  /* 【本次改动三】手机端月份切换按钮收窄，保证四个按钮 + 月份标题一行放下 */
  .rvcal-ctl{gap:5px;}
  .rvcal-ctl .btn{padding:4px 7px;font-size:10px;}
  .rvcal-ctl b{font-size:11px;min-width:0;}
}
/* 窄屏兜底：--cw 变量在极小宽度下仍保证不溢出
   【本次改动二】极小屏（<430px）下把标签最小字号压到 9px，
   确保 4 列卡片（如「今日复习」的 4+4 统计行）在手机上仍不换行、不挤压文字。 */
@media(max-width:430px){
  .stat-row{gap:6px;grid-template-columns:repeat(var(--statN,3), minmax(0,1fr));}
  .stat-a{padding:8px 3px;}
  .stat-a .lb{
    font-size:clamp(9px,
                    calc((var(--fs-card) + (var(--cw) - 420px) * 0.0145) * 0.52),
                    calc(var(--fs-btn) - 2px));
  }
}

/* ============ 列表项 ============ */
.li{
  display:flex;align-items:center;gap:10px;padding:11px 14px;
  background:#FFFDFC;border:1.5px solid var(--line);border-radius:var(--r2);
  margin-bottom:8px;transition:.2s;flex-wrap:wrap;
}
.li:hover{border-color:var(--pinkMid);background:#fff;}
.li.overdue{border-color:#F9C3B5;background:#FFF8F6;}
.li .txt{flex:1;min-width:120px;font-weight:600;word-break:break-word;}
.li .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

/* ============ 悬浮 + ============ */
.fab{
  position:fixed;right:24px;bottom:28px;width:58px;height:58px;border-radius:50%;
  border:none;background:linear-gradient(135deg,#F7A8C0,#EE9BB4);color:#fff;
  font-size:28px;font-weight:300;cursor:pointer;z-index:70;
  box-shadow:0 8px 24px rgba(238,155,180,.45);transition:.25s;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.fab:hover{transform:scale(1.08) rotate(90deg);}
.fab:active{transform:scale(.94);}

/* ============ 一键滚动 ============ */
.scroll-fab{
  position:fixed;right:24px;bottom:100px;z-index:69;
  display:flex;flex-direction:column;gap:8px;
  opacity:0;pointer-events:none;transform:translateY(8px);
  transition:opacity .3s, transform .3s;
}
.scroll-fab.show{opacity:1;pointer-events:auto;transform:translateY(0);}
.scroll-btn{
  width:44px;height:44px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#F7A8C0,#EE9BB4);color:#fff;
  font-size:16px;cursor:pointer;transition:.2s;
  box-shadow:0 6px 18px rgba(238,155,180,.4);
  display:flex;align-items:center;justify-content:center;
}
.scroll-btn:hover{transform:scale(1.1);}

/* ============ 弹窗 ============ */
.modal-mask{
  position:fixed;inset:0;background:rgba(91,75,82,.35);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  padding:18px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;
}
.modal-mask.show{opacity:1;pointer-events:auto;}
.modal-box{
  background:#FFFDFC;border-radius:var(--r);padding:22px;
  width:100%;max-width:620px;max-height:86vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(180,120,145,.28);border:2px solid var(--line);
  transform:scale(.94);transition:transform .25s;
}
.modal-mask.show .modal-box{transform:scale(1);}
.modal-head{font-size:var(--fs-card);font-weight:800;color:var(--pinkDeep2);margin-bottom:16px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;}
.modal-foot{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
.mbtn{
  border:none;border-radius:999px;padding:9px 22px;font-family:inherit;
  font-size:var(--fs-btn);font-weight:700;cursor:pointer;transition:.2s;
  background:var(--pinkSoft);color:var(--pinkDeep2);
}
.mbtn.primary{background:linear-gradient(135deg,#F7A8C0,#EE9BB4);color:#fff;box-shadow:0 4px 12px rgba(238,155,180,.35);}
.mbtn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--text2);}

/* ============ Toast ============ */
#toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(16px);
  background:rgba(91,75,82,.94);color:#fff;padding:10px 22px;border-radius:999px;
  font-size:var(--fs-body);font-weight:600;z-index:300;opacity:0;
  pointer-events:none;transition:.3s;white-space:nowrap;max-width:90vw;
  overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 24px rgba(0,0,0,.18);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 小猫/小狗点击提示：电子木鱼式浮字 —— 在页面正中心局限范围内自下往上飘动，
   文字与底色淡入后淡出。字号随页面宽度自适应（clamp 12px ~ 28px）。
   深浅上限：文字背景最深 #e4a1b6，文字最深白色。 */
#petMsg{
  position:fixed;left:50%;top:50%;
  width:min(92vw, 560px);height:min(52vh, 420px);
  transform:translate(-50%,-50%);
  pointer-events:none;z-index:950;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
#petMsg .pm-item{
  position:absolute;left:50%;bottom:14%;
  transform:translate(-50%,0);
  /* 字号随视口宽度线性缩放，限制在 12px ~ 28px */
  font-size:clamp(12px, calc(8px + 1.25vw), 28px);
  font-weight:900;letter-spacing:1px;line-height:1;
  padding:.42em 1.5em;border-radius:999px;white-space:nowrap;
  /* 背景最深 #e4a1b6，文字最深白色（起始更浅，随动画到位后淡出） */
  background:rgba(228,161,182,.0);
  color:rgba(255,255,255,.0);
  box-shadow:0 10px 26px rgba(200,130,155,0);
  will-change:transform,opacity,background-color,color;
  animation:petFloat 1500ms cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes petFloat{
  0%   { transform:translate(-50%, 26px) scale(.86);
         opacity:0; color:rgba(255,255,255,0); background-color:rgba(228,161,182,0); box-shadow:0 10px 26px rgba(200,130,155,0); }
  22%  { transform:translate(-50%, 6px) scale(1);
         opacity:1; color:rgba(255,255,255,1); background-color:rgba(228,161,182,.96); box-shadow:0 12px 30px rgba(200,130,155,.34); }
  62%  { transform:translate(-50%, -26px) scale(1);
         opacity:1; color:rgba(255,255,255,1); background-color:rgba(228,161,182,.9); box-shadow:0 12px 30px rgba(200,130,155,.30); }
  100% { transform:translate(-50%, -78px) scale(.96);
         opacity:0; color:rgba(255,255,255,0); background-color:rgba(228,161,182,0); box-shadow:0 10px 26px rgba(200,130,155,0); }
}
@media (prefers-reduced-motion:reduce){
  #petMsg .pm-item{ animation-duration:.9s; }
}

/* ============ 计时器 ============ */
.tm-clock{
  font-size:calc(var(--fs-num) * 1.5);font-weight:900;text-align:center;
  color:var(--pinkDeep2);letter-spacing:2px;line-height:1.1;
  font-variant-numeric:tabular-nums;margin:14px 0;
  font-family:"SF Mono","JetBrains Mono",Consolas,monospace;
}
.tm-clock.neg{color:var(--coral);}
.tm-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
.tm-stat{text-align:center;font-size:var(--fs-btn);color:var(--text2);margin-top:12px;}
.tm-stat b{color:var(--pinkDeep2);}

/* ============ 图表 ============ */
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding:8px 0;overflow-x:auto;}
.bar-wrap{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;}
.bar{width:100%;max-width:34px;min-height:3px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#F7C3D2,#EE9BB4);transition:height .5s;}
.bar.mint{background:linear-gradient(180deg,#B4E6CD,#9FDCBE);}
.bar-lb{font-size:10px;color:var(--text3);margin-top:5px;white-space:nowrap;}
/* 热力图（需求 1）：最深色统一为 #FF6961，按范围最大值归一化着色（不再固定阈值分级）
   —— 由 JS 通过 background 内联色写入；此处仅保留空态底色。 */
.heat{display:grid;grid-template-columns:repeat(auto-fill,13px);gap:4px;}
.heat i{width:13px;height:13px;border-radius:4px;background:#F6EDF1;display:block;}

/* ============ 表格 ============ */
.tbl{width:100%;border-collapse:collapse;font-size:calc(var(--fs-body) - 1px);}
.tbl th{background:var(--pinkSoft);color:var(--pinkDeep2);font-weight:700;padding:9px 10px;text-align:left;white-space:nowrap;}
.tbl th:first-child{border-radius:12px 0 0 12px;}
.tbl th:last-child{border-radius:0 12px 12px 0;}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);}
.tbl tr:last-child td{border-bottom:none;}
.tbl-wrap{overflow-x:auto;border-radius:var(--r2);}

/* ============ 空状态 ============ */
.empty{text-align:center;padding:26px 10px;color:var(--text3);font-size:var(--fs-body);}
.empty .eico{font-size:36px;display:block;margin-bottom:8px;opacity:.7;}

/* ============ 折叠块 ============ */
.acc{border:1.5px solid var(--line);border-radius:var(--r2);margin-bottom:10px;overflow:hidden;background:#FFFDFC;}
.acc-h{padding:11px 14px;cursor:pointer;font-weight:700;color:var(--pinkDeep2);display:flex;align-items:center;gap:8px;font-size:var(--fs-body);}
.acc-h:hover{background:var(--pinkSoft);}
.acc-h .ar{margin-left:auto;font-size:10px;transition:transform .25s;color:var(--text3);}
.acc.open .acc-h .ar{transform:rotate(90deg);}
.acc-b{display:none;padding:4px 14px 14px;font-size:calc(var(--fs-body) - .5px);line-height:1.8;}
.acc.open .acc-b{display:block;}
/* 需求：默认折叠并显示「收起解析等信息」；点击后显示「展开查看解析等信息」并展开内容
   （!important 用于覆盖外层分组 .acc.open .acc-b 的后代选择器影响） */
.wexp .acc-b{display:none !important;}
.wexp.open .acc-b{display:block !important;}
.wexp .w-open-txt{display:none;}
.wexp .w-close-txt{display:inline;color:var(--pinkDeep2);font-weight:700;}
.wexp.open .w-open-txt{display:inline;}
.wexp.open .w-close-txt{display:none;}
.kw{display:inline-block;background:#FFF3EE;color:#D9756A;padding:1px 9px;border-radius:99px;font-size:calc(var(--fs-btn) - 2px);font-weight:700;margin:2px 4px 2px 0;}

/* ============ 错题卡片 ============ */
.qcard{background:#FFFDFC;border:1.5px solid var(--line);border-radius:var(--r2);padding:14px;margin-bottom:12px;}
.qcard-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.qcard-t{font-weight:700;flex:1;min-width:100px;word-break:break-word;font-size:calc(var(--fs-body) + 1px);}
.qcard-b{font-size:calc(var(--fs-body) - .5px);color:var(--text2);line-height:1.7;}
.qcard-b b{color:var(--text);}
/* 收藏按钮（修改轮6）：未收藏=幽灵灰，已收藏=金色实心 */
.btn.wfav{background:#FFF6E0;color:#B98A16;border:1.5px solid #F2DDA8;}
.btn.wfav:hover{background:#FFEFCC;}
.btn.wfav.on{background:linear-gradient(135deg,#FFD86B,#F0B429);color:#7A5510;border-color:#E8B33A;font-weight:800;}
.btn.wfav.on svg{fill:currentColor;}
.qimg{max-width:100%;max-height:280px;border-radius:var(--r3);border:1.5px solid var(--line);margin-top:8px;display:block;cursor:zoom-in;transition:opacity .15s;}
@media (hover:hover){ .qimg:hover{opacity:.88;} }
/* ============ 错题图片查看浮层（修改轮6） ============ */
#imgViewer{position:fixed;inset:0;z-index:9999;background:rgba(18,14,16,.94);
  display:none;flex-direction:column;opacity:0;transition:opacity .18s;}
#imgViewer.show{display:flex;opacity:1;}
.iv-bar{display:flex;align-items:center;gap:6px;padding:10px 14px;flex-wrap:wrap;
  background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.iv-spacer{flex:1;}
.iv-info{color:#fff;font-size:13px;font-weight:700;opacity:.9;letter-spacing:.5px;}
.iv-pct{color:#fff;font-size:12px;font-weight:700;min-width:48px;text-align:center;opacity:.85;}
.iv-btn{border:none;background:rgba(255,255,255,.14);color:#fff;font-family:inherit;
  font-size:13px;font-weight:700;padding:7px 13px;border-radius:999px;cursor:pointer;
  line-height:1;transition:background .15s,transform .1s;white-space:nowrap;}
.iv-btn:hover{background:rgba(255,255,255,.28);}
.iv-btn:active{transform:scale(.94);}
.iv-btn:disabled{opacity:.3;cursor:default;}
.iv-close{background:rgba(232,90,110,.85);}
.iv-close:hover{background:rgba(232,90,110,1);}
.iv-stage{flex:1;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;
  touch-action:none;cursor:grab;}
.iv-stage.dragging{cursor:grabbing;}
#ivImg{max-width:92%;max-height:92%;user-select:none;-webkit-user-drag:none;
  transform-origin:center center;will-change:transform;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.5);}
@media (max-width:600px){
  .iv-bar{padding:8px 8px;gap:4px;}
  .iv-btn{padding:6px 10px;font-size:12px;}
  .iv-reset-txt{display:none;}
}
a.src-link{color:var(--pinkDeep2);font-weight:600;text-decoration:none;border-bottom:1px dashed var(--pinkMid);word-break:break-all;}

/* ============ 分页 ============ */
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.pager .pg-info{font-size:var(--fs-btn);color:var(--text2);font-weight:600;}
.pager select{padding:5px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:var(--fs-btn);color:var(--text2);cursor:pointer;}

/* ============ 分段控件 ============ */
.seg{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;}
.seg button{border:none;background:transparent;font-family:inherit;font-size:calc(var(--fs-btn) - 1px);font-weight:700;color:var(--text2);padding:5px 14px;border-radius:999px;cursor:pointer;transition:.2s;white-space:nowrap;}
.seg button.on{background:linear-gradient(135deg,#F7A8C0,#EE9BB4);color:#fff;box-shadow:0 3px 10px rgba(238,155,180,.3);}

/* ============ 历史标签 ============ */
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-height:120px;overflow-y:auto;padding:4px;border:1.5px dashed var(--line);border-radius:14px;}
.chip-list .chip-item{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 6px 3px 10px;font-size:calc(var(--fs-btn)-2px);color:var(--text2);}
.chip-list .chip-item button.sel{border:none;background:transparent;font-family:inherit;color:inherit;cursor:pointer;padding:0;font-size:inherit;}
.chip-list .chip-item button.rm{border:none;background:var(--coralSoft);color:var(--coral);border-radius:50%;width:18px;height:18px;line-height:1;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;justify-content:center;}

/* ============ 答案选项 ============ */
.opt-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.opt-btn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 16px;font-size:var(--fs-btn);font-weight:700;color:var(--text2);cursor:pointer;font-family:inherit;transition:.2s;}
.opt-btn.on{background:linear-gradient(135deg,#F7A8C0,#EE9BB4);color:#fff;border-color:transparent;}
.opt-btn:hover:not(.on){background:var(--pinkSoft);border-color:var(--pinkMid);color:var(--pinkDeep2);}

/* ============ 沉浸式复习 ============ */
#reviewMode{position:fixed;inset:0;background:linear-gradient(165deg,#FFF9F5,#FFF1F4 60%,#FDF4FF);z-index:500;display:none;overflow-y:auto;}
#reviewMode.show{display:block;}
.rm-inner{max-width:820px;margin:0 auto;padding:18px 18px 80px;}
.rm-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:rgba(255,249,245,.96);backdrop-filter:blur(10px);padding:10px 0;z-index:10;border-bottom:1.5px solid var(--line);margin-bottom:14px;flex-wrap:wrap;}
.rm-stats{display:flex;gap:6px;flex-wrap:wrap;}
.rm-stats .chip{padding:4px 10px;background:var(--pinkSoft);color:var(--pinkDeep2);border-radius:999px;font-size:calc(var(--fs-btn)-1px);font-weight:700;border:1.5px solid var(--pink);}
.rm-stats .chip.coral{background:var(--coralSoft);color:var(--coral);border-color:#F9B6A6;}
.rm-stats .chip.mint{background:#E4F7EE;color:#3E8A68;border-color:#B4E6CD;}
.rm-stats .chip.lav{background:#F0EAFF;color:#7A63C4;border-color:#D9CCF5;}
.rm-q{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--shadow);border:1.5px solid var(--line);margin-bottom:14px;}
.rm-q .meta-line{font-size:calc(var(--fs-btn)-1px);color:var(--text3);margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;}
.rm-q .title{font-size:calc(var(--fs-body) + 2px);font-weight:700;line-height:1.8;margin-bottom:12px;word-break:break-word;white-space:pre-wrap;}
.rm-opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.rm-opts .opt-btn{padding:8px 20px;font-size:var(--fs-body);}
.rm-other{width:100%;margin-top:8px;display:none;}
.rm-other.show{display:block;}
.rm-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px;}
.rm-ans-box{background:#F0FBF5;border-radius:var(--r2);padding:14px;margin-top:14px;line-height:1.9;}
.rm-ans-box b{color:#3E8A68;}
.rm-ans-box .edit-exp{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;}
.rm-ans-box .edit-exp textarea{flex:1;min-width:200px;}

/* ============ 按分类抽取错题（今日复习页） ============ */
/* 模式切换行：label + seg，居中排列 */
.rp-mode-head{display:flex;align-items:center;gap:10px;margin:14px 0 6px;flex-wrap:wrap;}
.rp-mode-label{font-size:var(--fs-btn);color:var(--text2);font-weight:700;flex:none;white-space:nowrap;}
/* 模式配置区（total / byCat 共用容器）：切换时仅切 display，DOM 与输入值保留 */
.rp-box{margin-top:2px;}
.rp-total-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.rp-total-unit{font-size:var(--fs-btn);color:var(--text2);font-weight:700;flex:none;}
/* 分类列表容器 */
.rp-cat-list{
  display:flex;flex-direction:column;gap:6px;
  background:#FFF9FB;border:1.5px solid var(--line);border-radius:var(--r2);
  padding:10px 12px;
}
/* 单个分类行：名称(固定宽) + 输入框(固定宽) + 库存提示(右对齐) */
.rp-cat-row{display:flex;align-items:center;gap:10px;min-width:0;}
.rp-cat-name{
  flex:none;width:90px;font-size:var(--fs-btn);color:var(--text2);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rp-cat-row .rp-cat-inp{
  flex:none;width:64px;padding:5px 8px;text-align:center;
  font-size:var(--fs-btn);
  /* 隐藏数字输入框的上下箭头（各浏览器），保持与其他输入框一致的简洁外观 */
  -moz-appearance:textfield;
}
.rp-cat-row .rp-cat-inp::-webkit-outer-spin-button,
.rp-cat-row .rp-cat-inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.rp-cat-stock{
  margin-left:auto;text-align:right;flex:1 1 auto;min-width:0;
  font-size:calc(var(--fs-btn) - 1px);color:var(--text3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* 请求数超过库存：标红提示（允许提交，实际按库存截断） */
.rp-cat-stock.over{color:#D2542F;font-weight:700;}
/* 合计行 */
.rp-sum-line{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
.rp-sum-text{font-size:var(--fs-btn);color:var(--text2);font-weight:700;flex:1 1 auto;}
.rp-sum-text b{color:var(--pinkDeep2);font-size:calc(var(--fs-btn) + 2px);}
.rp-sum-line .btn{margin-left:auto;flex:none;}
.rp-tip{font-size:calc(var(--fs-btn) - 1px);color:var(--text3);margin-top:8px;line-height:1.7;}
/* 合计为 0 时的按钮提示 */
.rp-btn-hint{
  text-align:center;margin-top:8px;
  font-size:calc(var(--fs-btn) - 1px);color:#D2542F;font-weight:700;
}
/* 复习界面统计栏：当前题分类标签 */
.rm-stats .chip.rp-now-cat{background:#EDE4F7;color:#7E5FA8;font-weight:700;}

/* ============ 响应式 ============ */
@media(max-width:1024px){
  body{--sbw:170px;}
  .sb-title{font-size:calc(var(--fs-card) - 4px);}
}
@media(max-width:700px){
  #topbar{grid-template-columns:1fr 1fr;grid-template-areas:"left right" "center center";gap:8px;padding:12px 12px 6px;}
  .tb-left{grid-area:left;justify-self:start;}
  .tb-right{grid-area:right;justify-self:end;}
  .tb-center{grid-area:center;}
  .stk-chip{padding:6px 10px;}
  .stk-row{font-size:10px;}
  .stk-row b{font-size:12px;}
}
@media(max-width:640px){
  body{--sbw:140px;}
  #content{padding:6px 12px 80px;}
  .card{padding:15px 14px;border-radius:22px;}
  .modal-box{padding:18px 16px;border-radius:22px;}
  .fab{right:16px;bottom:20px;width:52px;height:52px;font-size:25px;}
  .scroll-fab{right:16px;bottom:84px;}
  .scroll-btn{width:40px;height:40px;font-size:14px;}
  .sb-title{font-size:11px;}
  .sb-item{font-size:11px;padding:6px 7px;}
  .sb-ghead{font-size:12px;padding:8px 7px;}
  .g2,.g3,.g4{grid-template-columns:1fr;}
  /* 心情栏字号不再在此断点被写死：改由 JS 按「心情栏可用宽度」逐段写入 --fs-mood
     （420/380/340/260 四级降级 + 两行态 12px 最小字号），保证拉宽放大、变窄缩小 */
  .mood-chip{padding:3px 9px;}
}
@media(max-width:380px){
  body{--sbw:132px;}

/* 【按分类抽取错题】手机窄屏（<430px）紧凑排版：

<!-- ========== 侧边栏 ========== -->
<aside id="sidebar">
  <div class="sb-top">
    <span class="sb-title" id="sbTitle"></span>
    <button class="pin-btn" id="pinBtn" title="固定 / 收起侧边栏">📌</button>
  </div>
  <nav class="sb-nav" id="sbNav"></nav>
  <div class="sb-bottom">
    <button class="sb-set" id="fontBtn"><span id="fontBtnIco"></span><span>设置</span></button>
    <div class="font-panel" id="fontPanel">
      <div class="fp-title">字体大小</div>
      <div class="fp-opts" id="fpOpts">
        <button data-f="small">小</button>
        <button data-f="medium">中</button>
        <button data-f="large">大</button>
      </div>
      <div class="fp-title" style="margin-top:10px;">数据备份</div>
      <!-- 【需求 1】两个备份入口文案明确区分：各自导出什么、什么时候用 -->
      <button class="fp-danger" id="exportAllBtn" style="background:var(--pinkSoft);border-color:var(--pink);color:var(--pinkDeep2);">📦 完整备份（含图片）</button>
      <button class="fp-danger" id="exportQuickBtn" style="background:var(--pinkSoft);border-color:var(--pink);color:var(--pinkDeep2);">⚡ 快速备份（不含图片）</button>
      <button class="fp-danger" id="importAllBtn" style="background:var(--pinkSoft);border-color:var(--pink);color:var(--pinkDeep2);">📥 导入全部备份数据</button>
      <input type="file" id="importAllFile" accept=".json,application/json" style="display:none;">
      <div class="fp-hint" style="margin-top:5px;text-align:center;">
        完整备份=全部数据+错题图片（文件大，换设备/长期归档用）<br>
        快速备份=仅文字数据秒导出（日常每周例行）
      </div>
      <!-- 【远程数据】填 GitHub 数据地址即可在手机/iPad 自动读到云端最新新闻数据。
           留空 = 不启用。本地址存在浏览器的固定位置（key 固定为 wb_data_url），
           ★ 与 HTML 文件叫什么名字完全无关 —— 想给工作台改名，这里不用重新填。 -->
      <div class="fp-title" style="margin-top:10px;">远程数据地址</div>
      <input type="text" id="remoteDataUrl" class="inp" style="width:100%;box-sizing:border-box;"
             placeholder="留空则不启用" autocomplete="off" spellcheck="false">
      <div class="fp-hint" style="margin-top:5px;overflow-wrap:anywhere;word-break:break-word;">
        填写 GitHub 数据地址，例如：<br>
        <span style="overflow-wrap:anywhere;word-break:break-all;">https://cdn.jsdelivr.net/gh/你的用户名/仓库名@main/workbench_data.js</span>
      </div>
      <div style="display:flex;gap:6px;margin-top:6px;width:100%;box-sizing:border-box;">
        <button class="fp-danger" id="remoteDataTestBtn" style="flex:1 1 0;min-width:0;margin-top:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--pinkSoft);border-color:var(--pink);color:var(--pinkDeep2);">🔗 测试连接</button>
        <button class="fp-danger" id="remoteDataClearBtn" style="flex:0 1 auto;min-width:0;margin-top:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">🧹 清除</button>
      </div>
      <div class="fp-hint" id="remoteDataHint" style="margin-top:4px;text-align:center;"></div>
      <div class="fp-title" style="margin-top:10px;">数据管理</div>
      <!-- 【P0】存储占用实时显示：>70% 橙色预警，>85% 红色 -->
      <div id="storageMeterBox" style="margin:4px 0 8px;">
        <div class="fp-hint" style="display:flex;justify-content:space-between;align-items:center;">
          <span>存储占用</span>
          <span id="storageMeterTxt" style="font-variant-numeric:tabular-nums;">统计中…</span>
        </div>
        <div style="height:7px;border-radius:4px;background:var(--line,#eee);overflow:hidden;margin-top:5px;">
          <div id="storageMeterBar" style="height:100%;width:0%;border-radius:4px;background:var(--green,#7bc47f);transition:width .3s,background .3s;"></div>
        </div>
        <!-- 【需求 1c】应急入口：仅存储空间告急时使用的辅助性小按钮（字号/内边距均小于主备份按钮） -->
        <button class="fp-danger" id="storageExportBtn" style="margin-top:6px;padding:3px 8px;font-size:clamp(10px, calc(var(--fs-panel, 12px) - 2px), 12px);background:#FFF6E8;border-color:#F2DDA8;color:#8A6A12;">⚠ 存储告急？应急导出备份</button>
        <div id="storageMeterHint" class="fp-hint" style="margin-top:5px;"></div>
      </div>
      <!-- 【需求 2】数据管理 4 按钮统一尺寸：纵向排列、左右边缘严格对齐 -->
      <div class="dm-btns">
        <button class="fp-danger" id="storageRefreshBtn">↻ 刷新占用统计</button>
        <button class="fp-danger" id="cleanupOrphansBtn">🧹 清理孤立图片</button>
        <!-- 【P2 存储架构升级】历史快照：误操作（导入/清除/迁移）前的自动留档，可恢复或下载 -->
        <button class="fp-danger" id="snapshotsBtn">🕘 查看历史快照</button>
        <button class="fp-danger" id="clearTodayBtn">🗑 清除今日全部数据</button>
        <button class="fp-danger" id="clearAllBtn">☠️ 清除全部数据</button>
      </div>
      <span id="dataManagerAnchor"></span>
    </div>
  </div>
</aside>

<script>
(function(){
'use strict';

/* ============================================================
   工具函数
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayStr = () => dstr(new Date());
const tomorrowStr = () => { const d=new Date(); d.setDate(d.getDate()+1); return dstr(d); };
const nowStr = () => { const d=new Date(); return dstr(d)+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes()); };
function daysUntil(ds){
  if(!ds) return null;
  const t = new Date(ds+'T00:00:00');
  if(isNaN(t)) return null;
  const n = new Date(); n.setHours(0,0,0,0);
  return Math.round((t - n)/86400000);
}
const dayOfYear = () => { const d=new Date(); return Math.floor((d - new Date(d.getFullYear(),0,0))/86400000); };
function fmtClock(sec){
  sec = Math.max(0, Math.floor(sec));
  return pad2(Math.floor(sec/3600))+':'+pad2(Math.floor((sec%3600)/60))+':'+pad2(sec%60);
}
// 按 X分X秒 显示（保留 1 位小数到秒，整数则不带小数）
function fmtMS(sec){
  sec = Math.max(0, Number(sec) || 0);
  const total = Math.round(sec * 10) / 10;
  const m = Math.floor(total / 60);
  const s = Math.round((total - m * 60) * 10) / 10;
  return m + '分' + s + '秒';
}
function shortDate(ds){ if(!ds) return ''; const p = ds.split('-'); return p.length===3 ? (+p[1])+'/'+(+p[2]) : ds; }
function lastNDays(n, offset){
  offset = Number(offset) || 0;
  const out=[]; const d=new Date();
  for(let i=n-1;i>=0;i--){ const x=new Date(d); x.setDate(d.getDate()-i-offset); out.push(dstr(x)); } return out;
}
/* 需求 8：一周 = 周一 → 周日
   offsetWeeks = 0 → 本周（本周一 ~ 本周日）；1 → 上周；以此类推 */
function weekRange(offsetWeeks){
  offsetWeeks = Math.max(0, Number(offsetWeeks) || 0);
  const now = new Date(); now.setHours(0,0,0,0);
  const dow = now.getDay();                 // 0=周日, 1=周一 ... 6=周六
  const backToMon = (dow === 0 ? 6 : dow - 1);   // 距离本周一的天数
  const mon = new Date(now); mon.setDate(now.getDate() - backToMon - offsetWeeks*7);
  const out = [];
  for(let i=0;i<7;i++){ const d = new Date(mon); d.setDate(mon.getDate()+i); out.push(dstr(d)); }
  return out;                                // [周一 ... 周日]
}
function downloadBlob(content, filename, mime, noBom){
  try{
    /* 可靠性修复：BOM（\ufeff）只有 xls/doc 需要（Excel 识别 UTF-8）；
       JSON 备份绝不能带 BOM，否则导入时 JSON.parse 直接失败，备份救不回来；
       二进制内容（xlsx 的 Uint8Array）直接打包，不加 BOM */
    const isU8 = content && typeof content === 'object' && content.byteLength !== undefined;
    const needBom = !isU8 && !noBom && (/excel|msword/i.test(mime) || /\.(xls|doc)$/i.test(filename));
    const blob = new Blob([isU8 ? content : (needBom ? '\ufeff' : '') + content], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
  }catch(e){ toast('导出失败'); }
}
function loadScript(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector('script[src="'+src+'"]')) return resolve();
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
function findEls(root, localName){
  const out = [];
  try{
    const all = root.getElementsByTagName('*');
    for(let i=0;i<all.length;i++) if(all[i].localName === localName) out.push(all[i]);
  }catch(e){}
  return out;
}
function srcUrl(src, kw){
  switch(src){
    case '央视网': return 'https://www.cctv.com/';
    case '人民网': return 'http://www.people.com.cn/GB/59476/index.html';
    case '学习强国': return 'https://www.xuexi.cn/';
    case '新华网': return 'https://www.news.cn/politics/index.html';
    case '半月谈': return 'http://www.banyuetan.org/byt/jinritan/index.html';
    case '今日重庆': return 'https://www.cq.gov.cn/ywdt/jrcq/index.html';
    default: return 'https://www.xuexi.cn/';
  }
}

/* ============================================================
   本地工作台数据接入（collector.py 产出，与下方爬取引擎自动结合）
   ------------------------------------------------------------
   数据源优先级：
     ① 本地数据服务  collector.py --serve（127.0.0.1:8765）
        ——「立即爬取」按钮可一键触发全量采集（8 来源）并自动读回
     ② workbench_data.js 静态注入（collector.py 每次采集后生成，
        与本 HTML 放同目录即可，双击打开 file:// 也能读）
     ③ 【远程数据】用户在「设置 → 远程数据地址」中填写的网址
        （典型用法：GitHub Actions 定时采集后，手机 / iPad 从这里读云端数据）
     ④ API Key / 公共代理级联（下方原链路）
     ⑤ 内置兜底素材库
   ============================================================ */
const WB_SERVICE = 'http://127.0.0.1:8765';
const WB_TIMEOUT_MS = 1500;      // 服务探测超时（本机服务响应极快，1.5s 足够）
const WB_POLL_MS = 5000;         // 采集进度轮询间隔
const WB_POLL_MAX_MS = 45 * 60 * 1000;  // 轮询上限 45 分钟

function wbMapItems(articles){
  /* workbench_data 的 articles → 新闻条目（字段对齐 parseSourceHtml 输出） */
  const out = [];
  for(const a of (articles || [])){
    const t = String(a.title || '').replace(/\s+/g, ' ').trim();
    const u = String(a.url || '').trim();
    if(!t || !u || !/^https?:/i.test(u)) continue;
    const src = String(a.source || '').trim() || '本地数据';
    const sec = String(a.section || '').trim() || '时政';
    let s = String(a.summary || '').replace(/\s+/g, ' ').trim();
    if(s.length > 140) s = s.slice(0, 140) + '…';
    const pub = String(a.publish_time || '').trim();
    const day = pub.slice(0, 10);
    const ts = (pub && Date.parse(pub)) || 0;
    out.push({
      t: t, u: u, src: src, sec: sec,
      d: '【' + src + ' · ' + sec + (day ? ' · ' + day : '') + '】' + t + '。' + (s || '点击下方来源链接查看原文详情。'),
      k: [src, sec],
      date: day || todayStr(),
      ts: ts || Date.now(),
      live: true
    });
  }
  // 按发布时间降序，最新在前
  out.sort((a,b)=>(b.ts||0)-(a.ts||0));
  return out;
}

async function wbFetch(url, timeoutMs){
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const to = setTimeout(()=>{ if(ctrl) try{ctrl.abort();}catch(e){} }, timeoutMs || 8000);
  try{
    const r = await fetch(url, ctrl ? { signal: ctrl.signal } : {});
    if(!r.ok) throw new Error('http ' + r.status);
    return await r.json();
  } finally { clearTimeout(to); }
}

/* 探测本地数据服务：在线返回 /status 对象，离线返回 null（不报错） */

/* ============================================================
   【远程数据 · 固定存储位置】
   ------------------------------------------------------------
   远程数据地址存在浏览器的 localStorage 里，位置（key）固定为 wb_data_url。
   ★ key 里不拼接任何文件名 —— 所以你把工作台 HTML 改成什么名字，
     这个地址都还在，不用重新填。
   ★ 同时会同步一份到 S.remoteDataUrl（随主数据持久化），
     兼容早期版本写入的数据，两者取其一即可。
   ============================================================ */
const WB_KEY_REMOTE_URL = 'wb_data_url';   // 固定 key，禁止拼接文件名

/* 读取远程数据地址：localStorage 优先，其次回退 S 里的旧值 */
function wbGetRemoteUrl(){
  try{
    const v = localStorage.getItem(WB_KEY_REMOTE_URL);
    if(v != null && String(v).trim()) return String(v).trim();
  }catch(e){ /* localStorage 不可用（隐私模式等）→ 回退 S */ }
  try{ return (S && S.remoteDataUrl) ? String(S.remoteDataUrl).trim() : ''; }catch(e){ return ''; }
}

/* 写入远程数据地址：双写（localStorage + S），任一失败不影响另一个 */
function wbSetRemoteUrl(url){
  const v = String(url == null ? '' : url).trim();
  try{
    if(v) localStorage.setItem(WB_KEY_REMOTE_URL, v);
    else  localStorage.removeItem(WB_KEY_REMOTE_URL);
  }catch(e){ console.warn('[远程数据] 写入本地存储失败（不影响本次使用）', e); }
  try{ if(S) S.remoteDataUrl = v; }catch(e){}
}

/* 【远程数据】从用户填写的 GitHub 数据地址读取（手机 / iPad 云端数据通道）
   ------------------------------------------------------------
   用途：同目录没有 workbench_data.js 时（典型场景：手机上单独打开 HTML），
        从远程地址读取 GitHub Actions 定时采集的结果。
   地址形如：
     https://cdn.jsdelivr.net/gh/用户名/仓库名@main/workbench_data.js
   兼容两种返回内容：
     · window.WB_DATA = {...};   ← collector.py 生成的就是这种
     · {...}                     ← 纯 JSON（例如 GitHub Raw 直链、或 .json 文件）
   ★ 全程 try-catch：任何失败（未配置 / 网络不通 / 内容不是数据）
     都只写一条 console.warn 并返回空数组，绝不抛出、绝不中断主流程。 */
async function wbDataFromRemote(){
  try{
    const url = wbGetRemoteUrl();
    if(!url) return [];                      // 未配置 → 静默跳过
    if(!/^https?:\/\//i.test(url)){          // 协议不合法 → 跳过（避免误填本地路径）
      console.warn('[远程数据] 地址需以 http:// 或 https:// 开头，已跳过：', url);
      return [];
    }

    let txt = '';
    try{
      const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      const to = setTimeout(()=>{ if(ctrl) try{ ctrl.abort(); }catch(e){} }, 15000);
      let r;
      try{
        /* cache:'no-store' — 定时任务是更新同一网址，必须绕过缓存拿最新 */
        r = await fetch(url, { cache:'no-store', credentials:'omit',
                               signal: ctrl ? ctrl.signal : undefined });
      } finally { clearTimeout(to); }
      if(!r || !r.ok) throw new Error('http ' + (r ? r.status : '?'));
      txt = await r.text();
    }catch(e){
      console.warn('[远程数据] 下载失败：', (e && e.message) ? e.message : e);
      return [];
    }
    if(!txt || !txt.length) return [];

    /* 剥掉可能的 `window.WB_DATA =` 前缀与结尾分号，取出 JSON 正文 */
    let body = txt.trim();
    const m = body.match(/window\.WB_DATA\s*=\s*([\s\S]*?);?\s*$/);
    if(m) body = m[1].trim();
    body = body.replace(/\/\*[\s\S]*?\*\//g, '').trim();   // 去注释（collector 会写文件头注释）
    if(body.charAt(body.length - 1) === ';') body = body.slice(0, -1).trim();

    let data = null;
    try{
      data = JSON.parse(body);
    }catch(e){
      console.warn('[远程数据] 内容不是合法数据格式，已跳过：', (e && e.message) ? e.message : e);
      return [];
    }
    if(!data || !Array.isArray(data.articles) || !data.articles.length) return [];

    const items = wbMapItems(data.articles);
    if(items.length){
      /* 记录来源信息，供「抓取诊断」面板展示 */
      window.__WB_REMOTE_INFO = { url: url, updatedAt: data.updated_at || '', total: items.length };
    }
    return items;
  }catch(e){
    /* 兜底：本条通道的任何意外都不得影响原有流程 */
    console.warn('[远程数据] 读取异常，已跳过：', e);
    return [];
  }
}

/* 【同目录 JSON 兜底通道】读同目录 workbench_data.json（.js 缺失时的补充）
   ------------------------------------------------------------
   使用场景：只把 workbench_data.json 复制到 HTML 同目录（没放 .js）时，
            浏览器直接打开也能读到数据。
   ★ file:// 下可能被浏览器安全策略拦截 → try-catch 后静默返回空数组；
   ★ 这条通道只在「同目录 .js 读不到」之后才被调用，
     所以电脑端原来的行为完全不变。 */
async function wbDataFromJson(){
  try{
    const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const to = setTimeout(()=>{ if(ctrl) try{ ctrl.abort(); }catch(e){} }, 8000);
    let r;
    try{
      r = await fetch('./workbench_data.json', { cache:'no-store',
                                                 signal: ctrl ? ctrl.signal : undefined });
    } finally { clearTimeout(to); }

    return [];
