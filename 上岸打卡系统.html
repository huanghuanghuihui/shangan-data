/* 【远程数据】测试连接：先保存地址，再单独试读一次，返回结构化结果
   ★ 供设置面板按钮与自动化测试共用，不抛异常。 */
async function wbTestRemoteUrl(url){
  const out = { ok:false, count:0, updatedAt:'', error:'' };
  try{
    const v = String(url == null ? '' : url).trim();
    if(!v){ out.error = '未填写地址'; return out; }
    if(!/^https?:\/\//i.test(v)){ out.error = '地址需以 http:// 或 https:// 开头'; return out; }
    wbSetRemoteUrl(v);
    const items = await wbDataFromRemote();
    if(items.length){
      const ri = window.__WB_REMOTE_INFO || {};
      out.ok = true; out.count = items.length; out.updatedAt = ri.updatedAt || '';
    }else{
      out.error = '没读到数据，请检查地址是否写错、仓库是否公开';
    }
  }catch(e){
    out.error = (e && e.message) ? e.message : '未知错误';
  }
  return out;
}

/* 一键采集：触发本地服务全量采集并轮询进度；onProgress(文案) 可选 */
async function wbCollectOnService(onProgress){
  const started = Date.now();
  await wbFetch(WB_SERVICE + '/collect', 8000);
  while(Date.now() - started < WB_POLL_MAX_MS){
    await new Promise(res => setTimeout(res, WB_POLL_MS));
    let st = null;
    try{ st = await wbFetch(WB_SERVICE + '/status', 5000); }catch(e){ /* 服务瞬时卡顿，继续等 */ }
    if(st && st.running === false){
      if(onProgress) onProgress('采集完成，正在载入数据…');
      return true;   // 完成（无论成功失败，数据以 /data.json 实际内容为准）
    }
    if(onProgress){
      // 从日志尾部向前找最近一条有意义的状态行（跳过「收到 /collect」等技术行）
      let tail = '';
      if(st && st.log && st.log.length){
        for(let i = st.log.length - 1; i >= 0; i--){
          const ln = st.log[i].replace(/^\[\d\d:\d\d:\d\d\]\s*/, '');
          if(/采集中|篇|筛选|跳过|保留|合并/.test(ln)){ tail = ln; break; }
        }
      }
      const mins = Math.floor((Date.now() - started) / 60000);
      onProgress('采集中 ' + mins + ' 分钟…' + (tail ? ' ' + tail.slice(0, 42) : ''));
    }
  }
  return false;      // 超时
}

/* ============================================================

/* ---- 免费官方新闻 API 接入（天行数据） ----
   使用方式：在「设置 → 时政数据源」中填入你自己的 API Key（免费注册：tianapi.com）。
   Key 仅保存在浏览器本地存储，不会外传；未填写时自动走代理抓取 + 本地素材库。 */
const TIAN_API_HANDLERS = {
  // 综合新闻（支持分类：gn 国内 / gj 国际 / sh 社会 / kj 科技 / yl 娱乐 / ty 体育）

// 天行数据返回的 newslist 字段 → 本系统统一结构
function parseTianApi(json, srcLabel){
  const out = [];
  const list = (json && json.result && (json.result.newslist || json.result.list)) || [];
  list.forEach(it=>{
    const title = it.title || it.name || '';
    if(!title) return;
    const url = it.url || it.link || 'https://www.xuexi.cn/';
    const desc = it.description || it.digest || '';
    out.push({
      t: title,
      u: url,
      src: it.source || srcLabel || '新闻API',
      sec: it.ctime ? String(it.ctime).slice(0,10) : '最新时政',
      d: '【' + (it.source || srcLabel) + '】' + title + '。' + (desc ? desc.slice(0,80) : '点击下方来源链接查看原文详情。'),
      k: [it.source || srcLabel, '时政'],
      date: todayStr(), ts: Date.now(), live: true
    });

  return out;
}
// 通过用户配置的 API Key 抓取
async function fetchViaApi(){
  const key = (S && S.newsApiKey) ? String(S.newsApiKey).trim() : '';
  if(!key) return { ok:false, reason:'未配置 API Key', items:[] };
  const handlers = [TIAN_API_HANDLERS.news, TIAN_API_HANDLERS.social, TIAN_API_HANDLERS.domestic];
  for(let i=0;i<handlers.length;i++){
    try{
      const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      const to = setTimeout(()=>{ if(ctrl) try{ctrl.abort();}catch(e){} }, 9000);
      const opts = { method:'GET', credentials:'omit' };
      if(ctrl) opts.signal = ctrl.signal;
      const r = await fetch(handlers[i](key, 20), opts);
      clearTimeout(to);
      if(!r.ok) continue;
      const json = await r.json();
      if(json && json.code && json.code !== 200) continue;
      const items = parseTianApi(json, '时政新闻');
      if(items.length) return { ok:true, reason:'', items };
    }catch(e){ /* 尝试下一个接口 */ }
  }
  return { ok:false, reason:'API 调用失败', items:[] };
}

// 标题黑名单（导航/栏目类噪音）
const TITLE_BLOCK = ['更多','首页','下一版','上一版','返回','登录','注册','下载','English','客户端','设为首页','加入收藏','网站地图','联系我们','版权声明','关于我们'];

function decodeHtml(str){
  return String(str||'')
    .replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&ldquo;/g,'“').replace(/&rdquo;/g,'”')
    .replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(+n))
    .replace(/\s+/g,' ').trim();
}
function cleanTitle(t){
  t = decodeHtml(t).replace(/^[·•\-—\s]+/,'').replace(/[\s]+$/,'');
  if(!t) return '';
  if(t.length < 6 || t.length > 60) return '';
  if(TITLE_BLOCK.some(b => t === b || t.indexOf(b) >= 0)) return '';
  if(!/[\u4e00-\u9fa5]/.test(t)) return '';
  return t;
}
function absUrl(href, base){
  if(!href) return '';
  href = href.trim();
  if(/^https?:\/\//i.test(href)) return href;
  if(href.indexOf('//') === 0) return 'https:' + href;
  if(href.indexOf('./') === 0) href = href.slice(2);
  if(href.indexOf('/') === 0) return base.replace(/\/[^/]*$/,'') + href;
  return base + href;
}

function fetchViaProxies(url, timeoutMs){
  timeoutMs = timeoutMs || 8000;
  const tryOne = (proxyFn) => new Promise((resolve, reject)=>{
    let done = false;
    const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const to = setTimeout(()=>{ done = true; if(ctrl) try{ctrl.abort();}catch(e){}; reject(new Error('timeout')); }, timeoutMs);
    const opts = { method:'GET', headers:{ 'Accept':'text/html,*/*' }, credentials:'omit' };
    if(ctrl) opts.signal = ctrl.signal;
    fetch(proxyFn(url), opts).then(r=>{
      if(!r.ok) throw new Error('http ' + r.status);
      return r.text();
    }).then(txt=>{
      if(done) return;
      clearTimeout(to);
      if(!txt || txt.length < 300) throw new Error('empty');
      resolve(txt);
    }).catch(e=>{ if(done) return; clearTimeout(to); reject(e); });
  });
  return (async ()=>{
    for(let i=0;i<CORS_PROXIES.length;i++){
      try{ return await tryOne(CORS_PROXIES[i]); }catch(e){ /* 尝试下一个代理 */ }
    }
    throw new Error('all proxies failed');
  })();
}

function parseSourceHtml(html, conf){
  const out = [];
  const seen = {};
  let doc = null;
  try{ doc = new DOMParser().parseFromString(html, 'text/html'); }catch(e){ doc = null; }
  const anchors = doc ? Array.prototype.slice.call(doc.querySelectorAll('a')) : [];
  const push = (rawHref, rawText)=>{
    const t = cleanTitle(rawText);
    if(!t) return;
    const u = absUrl(rawHref, conf.base || conf.url);
    if(!u || !/^https?:/i.test(u)) return;
    if(!conf.pattern.test(u)) return;
    if(seen[u]) return;
    seen[u] = 1;
    out.push({ t, u, src: conf.src, sec: conf.sec,
      d: '【' + conf.src + ' · ' + conf.sec + '】' + t + '。点击下方来源链接查看原文详情。',
      k: [conf.src, conf.sec], date: todayStr(), ts: Date.now(), live: true });
  };
  if(anchors.length){
    anchors.forEach(a=>{
      const href = a.getAttribute('href') || '';
      if(!href || href.charAt(0) === '#' || /^javascript:/i.test(href)) return;
      push(href, a.textContent || '');
    });
  } else {
    // 兜底：正则提取
    const re = /<a[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;
    let m;
    while((m = re.exec(html))){
      push(m[1], m[2].replace(/<[^>]+>/g,''));
    }
  }
  return out.slice(0, conf.limit || 6);
}

// 抓取全部源站：本地工作台数据（服务/文件）→ API → 代理级联 → 静默兜底（并发，带整体超时）
async function crawlAllSources(force){
  const diag = [];

  // ⓪ 本地数据服务（collector.py --serve，优先级最高）
  try{
    const svc = await wbProbe();
    if(svc){
      if(force || svc.running){
        // 手动「立即爬取」或服务正在采集 → 触发/等待全量采集完成（服务端自带防重入）
        if(typeof window.__WB_ONPROG === 'function'){
          try{ await wbCollectOnService(window.__WB_ONPROG); }catch(e){ /* 采集失败仍尝试读取现有数据 */ }
        }
      }
      const items = await wbDataFromService();
      if(items.length){
        diag.push({ src:'本地数据服务', ok:items.length, err:'' });
        window.__CRAWL_DIAG = diag;
        window.__WB_INFO = { from:'service', updatedAt:(svc.updated_at||''), total:items.length };
        return items;
      }
      diag.push({ src:'本地数据服务', ok:0, err:'服务在线但暂无数据' });
    }
  }catch(e){ /* 服务离线/异常 → 走下一级 */ }

  // ⓪' 同目录 workbench_data.js 静态数据（双击 file:// 打开时的本地数据通道）
  try{
    const items = wbDataFromScript();
    if(items.length){
      diag.push({ src:'本地数据文件', ok:items.length, err:'' });
      window.__CRAWL_DIAG = diag;
      window.__WB_INFO = { from:'file', updatedAt:((window.WB_DATA && window.WB_DATA.updated_at)||''), total:items.length };
      return items;
    }
  }catch(e){ /* 文件缺失 → 走原链路 */ }

  // ⓪'' 【同目录 JSON】workbench_data.json 兜底（没放 .js 只放了 .json 时可用）
  //      ★ 排在「同目录 .js」之后 —— 电脑端原来先读 .js 的顺序完全没变。
  try{
    const items = await wbDataFromJson();
    if(items.length){
      diag.push({ src:'本地JSON文件', ok:items.length, err:'' });
      window.__CRAWL_DIAG = diag;
      window.__WB_INFO = { from:'file-json', updatedAt:'', total:items.length };
      return items;
    }
  }catch(e){ /* 文件不存在 / 被浏览器拦截 → 静默走下一级 */ }

  // ⓪''' 【远程数据】用户填写的 GitHub 数据地址（手机 / iPad 云端数据通道）
  //      放在同目录两条本地通道之后，保证电脑端（有同目录数据文件时）体验完全不变。
  try{
    const items = await wbDataFromRemote();
    if(items.length){
      const ri = window.__WB_REMOTE_INFO || {};
      diag.push({ src:'远程数据地址', ok:items.length, err:'' });
      window.__CRAWL_DIAG = diag;
      window.__WB_INFO = { from:'remote', updatedAt:(ri.updatedAt || ''), total:items.length };
      return items;
    }
  }catch(e){ /* 未配置 / 网络失败 / 格式异常 → 静默走下一级 */ }
  window.__WB_INFO = null;

  // ① 优先尝试已配置的官方新闻 API
  try{
    const apiRes = await fetchViaApi();
    if(apiRes.ok && apiRes.items.length){
      diag.push({ src:'新闻API', ok: apiRes.items.length, err:'' });
      window.__CRAWL_DIAG = diag;
      window.__WB_INFO = { from:'api', updatedAt:'', total:apiRes.items.length };
      return apiRes.items;
    }
    if((S && S.newsApiKey)){
      diag.push({ src:'新闻API', ok:0, err: apiRes.reason || '调用失败' });
    }
  }catch(e){ /* 继续走代理 */ }

  // ② 代理级联抓取各源站
  const tasks = FETCH_SOURCES.map(async conf=>{
    try{
      const html = await fetchViaProxies(conf.url, 12000);
      const list = parseSourceHtml(html, conf);
      diag.push({ src:conf.src, ok:list.length, err: list.length ? '' : '未解析到匹配链接' });
      return list;
    }catch(e){
      diag.push({ src:conf.src, ok:0, err: (e && e.message) ? e.message : '网络失败' });
      return [];
    }
  });
  let results = [];
  try{
    const settled = await Promise.all(tasks);
    results = settled.reduce((a,b)=>a.concat(b), []);
  }catch(e){ results = []; }
  window.__CRAWL_DIAG = diag;
  return results;
}

let FALLBACK_NEWS_CACHE = null;

function bindCrawlControls(sfx){
  const rc = $('#recrawl'+sfx);
  if(rc) rc.addEventListener('click', ()=>{
    rc.disabled = true; rc.innerHTML = icon('refresh',10)+' 抓取中…';
    // 本地服务采集较久（15~25 分钟），进度实时写回按钮
    window.__WB_ONPROG = function(txt){
      const btns = document.querySelectorAll('[id^="recrawl"]');
      btns.forEach(b=>{ b.disabled = true; b.innerHTML = icon('refresh',10)+' '+esc(txt||'抓取中…'); });
    };
    ensureTodayCrawl(true).then(()=>{
      window.__WB_ONPROG = null;
      document.querySelectorAll('[id^="recrawl"]').forEach(b=>{
        b.disabled = false; b.innerHTML = icon('refresh',10)+' 立即爬取';
      });
      toast('已重新抓取今日时政 🛰️');
    });
  });
  const ch = $('#crawlHelp'+sfx);
  if(ch) ch.addEventListener('click', ()=>{
    const box = $('#crawlHelpBox'+sfx);

}

// 统一出口：优先返回当日爬取结果，否则用兜底库按日期轮换
function getNewsPool(){
  const cache = S && S.crawlCache;
  if(cache && cache.date === todayStr() && Array.isArray(cache.items) && cache.items.length){
    return { items: cache.items, live: true };
  }
  // 兜底：按日期从本地池轮换 12 条
  const d = dayOfYear();
  const pool = fallbackNews();
  const items = [];
  for(let i=0;i<12 && pool.length;i++){
    const n = pool[(d*3 + i) % pool.length];
    items.push({ t:n.t, u:srcUrl(n.src, n.t), src:n.src, sec:n.sec||'',
      d:n.d, k:n.k||[], date: todayStr(), ts: Date.now(), live:false });
  }
  return { items, live:false };
}

// 热门案例素材池：优先用当日爬取结果，失败用作文库案例兜底
function getEssayCases(){
  const d = dayOfYear();
  const poolObj = getNewsPool();
  const idx = (S.essayIndex||0);
  const SHOW = 6;
  let base = [];
  if(poolObj.live && poolObj.items.length){
    base = poolObj.items.map(n=>({ t:n.t, src:n.src, sec:n.sec||'', u:n.u, kw:n.t, live:true }));
  }
  if(base.length < SHOW){
    // 补充作文库自带经典案例（这两个池子在文件后部定义，运行时已就绪）
    if(typeof SL_ESSAY_POOL !== 'undefined') SL_ESSAY_POOL.forEach(e=>{ e.cases.forEach(c=>base.push({ t:c.t, src:c.src, sec:c.sec||'', u:srcUrl(c.src,c.kw), kw:c.kw, live:false })); });
    if(typeof ESSAY_CASES !== 'undefined') ESSAY_CASES.forEach(c=>base.push({ t:c.t, src:c.src, sec:c.sec||'案例素材', u:srcUrl(c.src,c.kw), kw:c.kw, live:false }));
  }
  const out = [];
  const n = base.length;
  for(let i=0;i<SHOW && n;i++) out.push(base[(idx*SHOW + i + d) % n]);
  return out;
}

function getOfficialQuotes(n){
  n = n || 1;
  const d = dayOfYear();
  const start = ((S.quoteIndex||0) + d) % OFFICIAL_QUOTES.length;
  const out = [];
  for(let i=0;i<n;i++) out.push(OFFICIAL_QUOTES[(start + i) % OFFICIAL_QUOTES.length]);
  return out;

// 触发一次当日爬取（每日仅一次，结果写入 S.crawlCache）
let __crawling = false;
async function ensureTodayCrawl(force){
  if(__crawling) return;
  if(!S) return;
  const fresh = S.crawlCache && S.crawlCache.date === todayStr() && !force;
  if(fresh) return;
  __crawling = true;
  try{
    const items = await crawlAllSources(!!force);
    if(items.length){
      const info = window.__WB_INFO || null;
      /* R2：「数据生成于」按本次爬取完成时刻更新（格式兼容展示层 slice(5,16) → MM-DD HH:MM） */
      const fin = new Date();
      const finAt = fin.getFullYear()+'-'+pad2(fin.getMonth()+1)+'-'+pad2(fin.getDate())+
                    ' '+pad2(fin.getHours())+':'+pad2(fin.getMinutes());
      S.crawlCache = { date: todayStr(), items, ts: Date.now(),
                       from: (info && info.from) || 'proxy',
                       updatedAt: finAt };
      save(true);
      if(cur === 'politics' || cur === 'sl-essay' || cur === 'sl-material') renderPageKeepScroll();
    }
  }catch(e){ /* 静默失败，保留兜底 */ }
  finally{ __crawling = false; }
}

const KEY = 'shangan_db_v10';
let S = null;
let saveTimer = null;
/* 【P1】可撤销导入的快照（仅内存、当次会话有效，24 小时过期） */
let UNDO_IMPORT = null;

function defaultState(){

       学习时长 = paper + page + timer（三源合并，互不重复计入）
       旧数据（studyLog）在迁移时整体归入 \'xc\' 板块，保证历史延续 */
    boardLog:{},

    reviewPickMode:'total',

    reviewLimitByCat:{},

    historyTags:[], historyReasons:[], historySources:[], historyWrongTypes:[],
    totalTrendMode:'week', totalHeatMode:'year', totalDetailPage:1, totalDetailSize:10,
    pastNews:[], newsIndex:0, essayIndex:0, materialIndex:0, quoteIndex:0,
    crawlCache:null, crawlEnabled:true, timerIdealSec:120,
    newsApiKey:'',
    idealByCat:{}, tmHistPage:{},
    /* 【改动三】甘特图自定义颜色的记忆色号（最多 20 个 #RRGGBB，大写去重） */
    ganttColorMemory:[],
    /* 【复习计划】艾宾浩斯记忆曲线复习任务（不写入 S.plans，渲染时实时映射） */

    /* 【P0/P1 存储架构】storageVersion 数据版本号（铁律 8）
       1 = 图片以 base64 内联在 S.wrong[i].imgs 中（旧结构）
       2 = 图片迁移至 IndexedDB，S 中只保留 id 引用（新结构）
       迁移严格按版本号判断，保证幂等（重复加载不会重复迁移） */
    storageVersion:1,
    /* 最近一次写盘失败信息 {ts,size,quota,msg}，成功后置 null。仅内存态，随 S 持久化无害 */
    _lastSaveError:null,
    /* 【P2+ 断点续传】导入进度 {hash,stage,done,total,ts}，导入完成后清除 */
    _importProgress:null,
    /* 【P1】导入后 24 小时内可撤销的内存快照（不持久化，仅当次会话有效） */
    _undoImport:null,
    /* 【P2 存储架构升级】是否启用 IndexedDB 主存储。
       true  = 正常（主数据存 IDB，容量无瓶颈）
       false = 降级（浏览器不支持 IDB / 隐私模式 → 回退 localStorage 5MB 老逻辑）
       注意：该字段随 S 一起持久化，但 loadState 会用 window.__useIdbGlobal 覆盖，
             避免「在支持 IDB 的机器上存了 false、导致新机器也降级」 */
    __useIdb:true,
    /* 最近一次成功写盘时间戳（仅内存参考，随 S 持久化无害） */
    _lastSaveTs:0,

       用途：手机 / iPad 打开 HTML 时，若同目录没有 workbench_data.js，
             就从这个网址读取云端定时采集的最新新闻数据。 */
    remoteDataUrl:''
  };
}
/* ============================================================
   【P0 铁律 3】loadState 全兜底
   目标：无论 localStorage 里存的是 JSON 损坏、类型错乱、还是超大对象，
   页面都必须能打开。策略：
     1) 读取+解析包 try-catch，失败记录损坏原文（供下载）
     2) S 先落为 defaultState()，再逐字段 try-catch 合并（单字段坏不影响其他）
     3) 整体失败时：下载「损坏数据.txt」+ 弹窗询问是否重置
   ============================================================ */
let _loadDamageRaw = null;   // 损坏的原始字符串（供一键下载）
let _loadDamageErr = null;   // 损坏原因

/* 逐字段「安全合并」：只把合法类型的字段并入 S，非法字段直接丢弃用默认值。
   每个字段独立判断，任何一个字段异常都不会中断整体加载。 */
function mergeStateFieldwise(target, obj){
  const numKeys  = ['cat','dog','reviewLimit','inboxPage','inboxPageSize','newsIndex','essayIndex',
                    'materialIndex','quoteIndex','reviewPage','storageVersion','boardGoalSecRaw',
                    'timerIdealSec','totalDetailPage','totalDetailSize'];
  const strKeys  = ['font','motto','lastMood','totalTrendMode','totalHeatMode','pinnedExamId','newsApiKey',
                    /* 【按分类抽取错题】抽取模式：'total' | 'byCat' */
                    'reviewPickMode',
                    /* 【远程数据】GitHub 数据地址（留空=不启用） */
                    'remoteDataUrl'];
  const boolKeys = ['pinned','crawlEnabled','boardLogMigrated','dwellPlanCleaned'];
  const arrKeys  = ['exams','wrong','reviewLogs','resources','favorites','timerLog','pastNews',
                    'historyTags','historyReasons','historySources','historyWrongTypes',
                    'ganttColorMemory','reviewTasks'];
  const objKeys  = ['plans','studyLog','moods','boardLog','boardGoalSec','idealByCat','tmHistPage',
                    /* 【按分类抽取错题】各分类抽取数量表（对象形态，由 loadState 再做逐项清洗） */
                    'reviewLimitByCat'];
  const each = (keys, test) => keys.forEach(k=>{
    try{ if(test(obj[k])) target[k] = obj[k]; }
    catch(e){ console.warn('[loadState] 字段合并跳过：' + k, e); }
  });
  each(numKeys,  v => typeof v === 'number' && isFinite(v));
  each(strKeys,  v => typeof v === 'string');
  each(boolKeys, v => typeof v === 'boolean');
  each(arrKeys,  v => Array.isArray(v));
  each(objKeys,  v => v && typeof v === 'object' && !Array.isArray(v));
  /* crawlCache 既可能是 null 也可能是对象，单独处理 */
  try{ if(obj.crawlCache === null || (obj.crawlCache && typeof obj.crawlCache === 'object')) target.crawlCache = obj.crawlCache; }catch(e){}
}

/* 【P2 存储架构升级】loadState 改为异步：
   ★ 读取来源优先级：
     ① IndexedDB 的 'state/main'（新存储，容量无瓶颈）
     ② localStorage 的旧 key（老数据；由 migrateStateToIdb 在 init 阶段先搬进 IDB）
     ③ 两者都没有 → defaultState() 全新开始
   ★ 拿到的 obj 之后，仍然走原有的「逐字段容错归一化」（mergeStateFieldwise + 结构归一化），
     这一部分一行未改，继续保证任何脏数据都能打开页面。
   ★ 降级：S.__useIdb === false（浏览器不支持 IDB）时，回退到 localStorage 读取。 */
async function loadState(){
  let raw = null, obj = null, parseErr = null;

  /* ① 优先从 IndexedDB 读（新存储）
     ★ 关键：此处不能依赖 S（首屏时 S 仍为 null，会短路跳过 IDB 读取，
       导致「刷新后读到空数据、再用空数据反写覆盖 IDB」的数据事故）。
       判定依据统一用 init 传入的全局开关 window.__useIdbGlobal。 */
  const useIdb = (typeof window.__useIdbGlobal === 'boolean')
    ? window.__useIdbGlobal
    : !(S && S.__useIdb === false);
  if(useIdb){
    try{
      const fromIdb = await idbStateLoad();
      if(fromIdb && typeof fromIdb === 'object' && !Array.isArray(fromIdb)){
        obj = fromIdb;
      }
    }catch(e){
      /* IDB 读失败（损坏 / 版本异常）→ 记录并回退 localStorage，不让页面打不开 */
      console.error('[loadState] 从 IndexedDB 读取失败，回退 localStorage', e);
      _loadDamageErr = 'IndexedDB 读取失败：' + (e && e.message ? e.message : e);
    }
  }

  /* ② IDB 无数据（或读取失败）→ 回退 localStorage 旧数据 */
  if(!obj){
    try{
      raw = localStorage.getItem(KEY);
      if(raw) obj = JSON.parse(raw);
    }catch(e){
      parseErr = e;
      _loadDamageRaw = raw;
      _loadDamageErr = 'JSON 解析失败：' + (e && e.message ? e.message : e);
      console.error('[loadState] JSON 解析失败', e);
    }
  }

  const d = defaultState();
  S = d;
  if(obj && typeof obj === 'object' && !Array.isArray(obj)){
    try{ mergeStateFieldwise(d, obj); }
    catch(e){
      // 理论上不该发生（每字段都独立 try），兜底再包一层
      console.error('[loadState] 字段合并整体异常', e);
      S = defaultState();
    }
  }
  /* 保留降级开关与脏标记（仅内存态，不参与持久化语义） */
  try{
    if(typeof window.__useIdbGlobal === 'boolean') S.__useIdb = window.__useIdbGlobal;
  }catch(e){}

  /* 以下为「结构归一化」阶段：每一步独立 try-catch，任一步失败只跳过该步，
     绝不允许中断 loadState（否则页面打不开） —— 铁律 3 */

  /* 1) plans 容器防御 */
  try{
    if(!S.plans || typeof S.plans !== 'object') S.plans = {daily:[],weekly:[],monthly:[],overall:[]};
    ['daily','weekly','monthly','overall'].forEach(k=>{
      if(!Array.isArray(S.plans[k])) S.plans[k] = [];
    });
  }catch(e){ console.warn('[loadState] plans 归一化失败', e); S.plans = {daily:[],weekly:[],monthly:[],overall:[]}; }

  /* 2) 数组字段防御 */
  try{
    ['wrong','reviewLogs','resources','favorites','exams','timerLog',
     'historyTags','historyReasons','historySources','historyWrongTypes',
     'pastNews'].forEach(k=>{ if(!Array.isArray(S[k])) S[k] = []; });
  }catch(e){ console.warn('[loadState] 数组字段归一化失败', e); }

  /* 3) 【复习计划】reviewTasks 逐条结构防御 */
  try{
    if(!Array.isArray(S.reviewTasks)) S.reviewTasks = [];
    S.reviewTasks = S.reviewTasks.filter(t=>t && typeof t === 'object').map(t=>{
      try{
        t.id = t.id || uid();
        t.sourceType = t.sourceType || 'daily';
        t.sourceText = t.sourceText || '（未命名复习任务）';
        t.sourceCat = t.sourceCat || '';
        t.sourceStage = t.sourceStage || '';
        t.createdAt = t.createdAt || Date.now();
        t.curveIndex = typeof t.curveIndex === 'number' ? t.curveIndex : 0;
        if(!Array.isArray(t.reviewPlan)) t.reviewPlan = [];
        t.reviewPlan = t.reviewPlan.filter(r=>r && r.date).map((r,i)=>({
          round: r.round || (i+1),
          date: r.date,
          status: r.status === 'done' ? 'done' : 'pending',
          doneAt: r.status === 'done' ? (r.doneAt || null) : null
        }));
        t.active = t.active !== false;
      }catch(e2){ console.warn('[loadState] reviewTask 归一化跳过', e2); }
      return t;
    });
  }catch(e){ console.warn('[loadState] reviewTasks 归一化失败', e); S.reviewTasks = []; }

  /* 4~9) 其余字段归一化（各自独立，失败只跳过） */
  try{ if(typeof S.reviewPage !== 'number' || S.reviewPage < 1) S.reviewPage = 1; }catch(e){}
  try{ if(!S.studyLog || typeof S.studyLog !== 'object') S.studyLog = {}; }catch(e){ S.studyLog = {}; }
  try{ if(!S.moods || typeof S.moods !== 'object') S.moods = {}; }catch(e){ S.moods = {}; }
  try{
    if(!Array.isArray(S.ganttColorMemory)) S.ganttColorMemory = [];
    S.ganttColorMemory = S.ganttColorMemory
      .map(x=>{ try{ return ganttNormColor(x); }catch(e){ return null; } })
      .filter(Boolean)
      .filter((x,i,arr)=>arr.indexOf(x) === i)
      .slice(0, 20);
  }catch(e){ console.warn('[loadState] 色号归一化失败', e); S.ganttColorMemory = []; }

  try{
    if(!S.boardLog || typeof S.boardLog !== 'object') S.boardLog = {};
    if(!S.boardGoalSec || typeof S.boardGoalSec !== 'object') S.boardGoalSec = {};
    if(!S.boardLogMigrated){
      Object.keys(S.studyLog).forEach(d2=>{
        const x = S.studyLog[d2] || {};
        const sec = Math.round(x.sec || 0);
        const q = x.q || 0;
        if(!sec && !q) return;
        if(!S.boardLog.xc) S.boardLog.xc = {};
        const b = S.boardLog.xc[d2] || (S.boardLog.xc[d2] = {ck:0,q:0,paper:0,page:0,timer:0});
        b.q = (b.q||0) + q;
        b.paper = (b.paper||0) + sec;
        if(sec > 0 || q > 0) b.ck = 1;
      });
      S.boardLogMigrated = true;
    }
  }catch(e){ console.warn('[loadState] boardLog 迁移失败', e); }

  try{
    if(typeof S.cat !== 'number') S.cat = 0;
    if(typeof S.dog !== 'number') S.dog = 0;
    if(typeof S.reviewLimit !== 'number' || S.reviewLimit < 1) S.reviewLimit = 20;
    if(typeof S.inboxPage !== 'number' || S.inboxPage < 1) S.inboxPage = 1;
    if(typeof S.inboxPageSize !== 'number') S.inboxPageSize = 10;
  }catch(e){ console.warn('[loadState] 数值字段归一化失败', e); }

  /* 【按分类抽取错题】字段防御性兜底（铁律：脏数据不得导致抽取异常）
     1) reviewPickMode 不是 'total'/'byCat' 之一 → 重置为 'total'（老用户默认行为）
     2) reviewLimitByCat 不是对象 → 重置为 {}
     3) 逐项清洗：值必须为有限数字且 >= 0，否则删除该项；数字统一取整并钳制到 0~999
     注意：只删除非法项，合法项原样保留；不清空 reviewLimit（两模式配置互不干扰） */
  try{
    if(S.reviewPickMode !== 'total' && S.reviewPickMode !== 'byCat') S.reviewPickMode = 'total';
    if(!S.reviewLimitByCat || typeof S.reviewLimitByCat !== 'object' || Array.isArray(S.reviewLimitByCat)){
      S.reviewLimitByCat = {};
    }else{
      Object.keys(S.reviewLimitByCat).forEach(k=>{
        const v = S.reviewLimitByCat[k];
        if(typeof v !== 'number' || !isFinite(v) || v < 0){ delete S.reviewLimitByCat[k]; return; }
        const n = Math.max(0, Math.min(999, Math.floor(v)));
        if(n === 0) delete S.reviewLimitByCat[k];   // 0 视为未设置，保持对象精简
        else S.reviewLimitByCat[k] = n;
      });
    }
  }catch(e){
    console.warn('[loadState] 按分类抽取字段归一化失败', e);
    S.reviewPickMode = 'total';
    S.reviewLimitByCat = {};
  }

  /* 心情数据迁移 */
  try{
    const moodMap = {'开心的一天':'开心','平静的一天':'平静','忙碌的一天':'忙碌','努力的一天':'努力','摸鱼的一天':'摸鱼','幸运的一天':'幸运','糟糕的一天':'糟糕'};
    Object.keys(S.moods).forEach(k=>{ if(moodMap[S.moods[k]]) S.moods[k] = moodMap[S.moods[k]]; });
  }catch(e){ console.warn('[loadState] 心情迁移失败', e); }

  /* R1 存量清理（幂等）—— 见下方原注释 */
  try{
    if(!S.dwellPlanCleaned){
      ['cd','plan'].forEach(b=>{ if(S.boardLog && S.boardLog[b]) delete S.boardLog[b]; });
      ['countdown','daily','review','weekly','monthly','overall'].forEach(b=>{
        const days = (S.boardLog || {})[b];
        if(!days || typeof days !== 'object') return;
        Object.keys(days).forEach(d2=>{
          const x = days[d2];
          if(!x){ delete days[d2]; return; }
          if((x.page||0) > 0) x.page = 0;
          if(!boardDayActive(x)) delete days[d2];
        });
        if(!Object.keys(days).length) delete S.boardLog[b];
      });
      S.dwellPlanCleaned = true;
    }
  }catch(e){ console.warn('[loadState] 停留清理失败', e); }

  /* 存储版本号兜底（铁律 8）：无版本号视为 1 */
  try{ if(typeof S.storageVersion !== 'number' || S.storageVersion < 1) S.storageVersion = 1; }catch(e){ S.storageVersion = 1; }

  /* ★ 标记「数据已成功加载落位」——后续任何写盘动作（尤其是图片结构迁移
     migrateToV2 的自动落盘）必须先看到这个标记，避免用默认空状态覆盖真实数据。
     仅内存态，不参与持久化语义。 */
  try{ S.__loaded = true; }catch(e){}
  /* ★ 数据安全闸门：本次加载是否「读到过损坏数据」。
     为 true 时禁止一切自动落盘（否则会用默认空状态覆盖用户尚存的原始数据），
     只能靠用户主动操作（导出备份 / 确认重置）突破。 */
  try{ S.__damaged = !!(parseErr || _loadDamageErr); }catch(e){}
  /* 数据由本次加载从外部读到（IDB 或 localStorage 有真实内容）——用于区分
     「全新用户」与「读失败被当成全新」两种情况，避免后者被自动落盘覆盖。 */
  try{ S.__fromStore = !!obj; }catch(e){}

  /* 整体损坏时：提示用户（不阻塞页面打开） */
  if(parseErr) showLoadDamageDialog();
}

/* ============================================================
   【P0 数据安全基础加固】统一写入入口
   铁律 1：禁止静默吞异常 —— 任何写盘失败都必须让用户看得见
   铁律 7：配额相关失败必须可见并给出可执行的下一步
   ============================================================ */

/* 统计字符串在 localStorage 中的近似占用字节数（UTF-16 → 每字符 2 字节） */
function bytesOf(str){ return (str ? String(str).length : 0) * 2; }

/* 判断一个异常是否为「存储配额已满」类异常
   各浏览器表现不一：Chrome/Edge 抛 DOMException name=QuotaExceededError；
   Firefox 抛 code=1014；旧版 Safari 抛 code=22（QUOTA_EXCEEDED_ERR） */
function isQuotaError(e){
  if(!e) return false;
  return e.name === 'QuotaExceededError'
      || e.name === 'NS_ERROR_DOM_QUOTA_REACHED'
      || e.code === 22 || e.code === 1014;
}

/* localStorage 总占用（字节）—— 遍历所有 key 累加 key+value 的 UTF-16 字节数。
   注意：这是「本应用所在域」的全部占用，不含 IndexedDB（IDB 单独统计）。 */
function storageUsage(){
  let total = 0;
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k == null) continue;
      const v = localStorage.getItem(k);
      total += bytesOf(k) + bytesOf(v == null ? '' : v);
    }
  }catch(e){
    // 遍历本身失败（隐私模式等）不能让调用方崩，返回已统计到的部分
    console.error('[storageUsage] 统计失败', e);
  }
  return total;
}

/* 【P2】序列化前剔除「仅内存态」字段（不写入持久化文件）：
   __dirty / __loaded / __damaged / __fromStore 是运行期开关与安全闸门，
   不应被写进备份文件或数据库（否则回滚/跨设备会带来语义漂移）。
   注意：__useIdb 本身仍保留在 S 中（历史行为），由全局开关在 loadState 时覆盖。 */
function serializeState(){
  const MEM_ONLY = ['__dirty','__loaded','__damaged','__fromStore'];
  let stash = null;
  try{
    stash = {};
    MEM_ONLY.forEach(k=>{ if(k in S){ stash[k] = S[k]; try{ delete S[k]; }catch(e){} } });
    return JSON.stringify(S);
  }finally{
    /* 无论序列化成败，都把内存态字段还原（S 始终是完整的内存真实数据源） */
    try{ if(stash) Object.keys(stash).forEach(k=>{ S[k] = stash[k]; }); }catch(e){}
  }
}

/* 【核心】统一写入口 —— 返回 Promise<boolean>，绝不静默吞异常
   【P2 存储架构升级】写盘目标由 localStorage 换为 IndexedDB：
     · S.__useIdb === false（不支持 IDB / 用户降级）→ 走 localStorage（原逻辑保留）
     · 否则 → 序列化后写入 IDB 的 'state/main'
   - 成功：清空 _lastSaveError 与脏标记，更新 S._lastSaveTs，resolve(true)
   - 失败：记录 S._lastSaveError={ts,size,msg}，调用 onSaveError 让用户可见，resolve(false)
   ★ 无论成功失败都不 throw：save() 的调用点遍布业务代码（多为同步调用），
     这里统一把失败转成「可见提示 + resolve(false)」，避免产生未捕获的 Promise 异常。
     调用方若需要知道结果，可以 await；不 await 也绝不会出现 unhandledrejection。 */
async function safeSaveFull(){
  let json = '';
  try{
    json = serializeState();
  }catch(e){
    // 序列化失败（循环引用 / 极端内存不足）—— 也算写入失败，必须可见
    S._lastSaveError = { ts: Date.now(), size: 0, msg: '数据序列化失败：' + (e && e.message ? e.message : e) };
    console.error('[safeSaveFull] 序列化失败', e);
    onSaveError(S._lastSaveError, false);
    return false;
  }
  const size = bytesOf(json);

  /* 降级分支：继续用 localStorage（原实现，一字未改） */
  if(S.__useIdb === false){
    try{
      localStorage.setItem(KEY, json);
      S._lastSaveError = null;
      S._lastSaveTs = Date.now();
      S.__dirty = false;
      return true;
    }catch(e){
      const quota = isQuotaError(e);
      S._lastSaveError = {
        ts: Date.now(), size: size, quota: quota,
        msg: quota ? '存储空间已满（本次未保存）' : ('写入失败：' + (e && e.message ? e.message : e))
      };
      console.error('[safeSaveFull] localStorage 写入失败', e);
      onSaveError(S._lastSaveError, quota);
      return false;
    }
  }

  /* 主分支：写入 IndexedDB（异步） */
  try{
    await idbStateSave(json);
    S._lastSaveError = null;
    S._lastSaveTs = Date.now();
    S.__dirty = false;
    return true;
  }catch(e){
    const quota = isQuotaError(e);
    S._lastSaveError = {
      ts: Date.now(),
      size: size,
      quota: quota,
      msg: quota ? '存储空间已满（本次未保存）' : ('写入数据库失败：' + (e && e.message ? e.message : e))
    };
    console.error('[safeSaveFull] IndexedDB 写入失败', e);
    onSaveError(S._lastSaveError, quota);
    return false;
  }
}

/* 写盘失败的用户提示（配额类给三按钮；非配额类给重试/导出）
   用节流避免定时保存连点导致弹窗堆叠 */
let _saveErrModalAt = 0;
function onSaveError(err, quota){
  const now = Date.now();
  if(now - _saveErrModalAt < 8000) return;   // 8 秒内同类问题只提示一次
  _saveErrModalAt = now;
  const used = storageUsage();
  const mb = (used / 1048576).toFixed(2);
  const body = quota
    ? '<p style="line-height:1.9">本次数据<b>未能保存</b>：浏览器本地存储空间已满。</p>'
      + '<p style="line-height:1.9;color:var(--muted)">当前占用约 <b>' + mb + ' MB</b>（浏览器上限通常约 5 MB）。<br>'
      + '建议先导出备份，再到「数据管理」清理不需要的数据。</p>'
      + '<p style="line-height:1.9;color:var(--muted)">本次未写入的数据仍保留在页面中，暂不会丢失——请在关闭页面前处理。</p>'
    : '<p style="line-height:1.9">本次数据<b>未能保存</b>。</p>'
      + '<p style="line-height:1.9;color:var(--muted)">' + (err && err.msg ? err.msg : '未知错误') + '</p>';
  openModal('⚠️ 数据未能保存', body, [
    { text:'立即导出备份', primary:true, onClick:()=>{ doEmergencyExport(); return false; } },
    { text:'打开数据管理', onClick:()=>{ gotoDataManager(); return false; } },
    { text:'我知道了' }
  ]);
}

/* 保存前预检阈值：单次待写入超过该体积先确认（避免写一半失败留下半新半旧） */
const SAVE_PREWARN_BYTES = 4.5 * 1024 * 1024;

/* 【P2 存储架构升级】save() 改为「脏标记 + 防抖后台写盘」：
   · 内存里的 S 永远是真实数据源，所有业务逻辑照旧读写 S 对象（一行未改）
   · save(immediate) 只做两件事：置 S.__dirty = true + 排一次写盘
     - immediate=true  → 立即异步写盘（不 await，不阻塞调用点）
     - immediate 省略  → 防抖 180ms 后写盘（沿用原节流时长）
   · 写盘成功后由 safeSaveFull 内部清脏标记；失败走 onSaveError 弹窗提示
   · 调用点全部保持原样（业务代码里到处都在调 save() / save(true)） */
function save(immediate){
  clearTimeout(saveTimer);
  try{ S.__dirty = true; }catch(e){}
  const doIt = () => {
    /* ★ 数据安全闸门：本次加载读到过损坏数据、用户还没做选择时，
       禁止任何自动写盘——否则会用「默认空状态」覆盖掉用户尚存的原始数据。
       用户仍可主动导出备份或点「确认重置」来解除（那两条路径会清 __damaged）。 */
    if(S && S.__damaged){
      console.warn('[save] 检测到数据加载异常，已跳过自动写盘以防覆盖原始数据');
      return;
    }
    /* 预检：体积接近「旧 localStorage 上限」时给一次提示（默认走 IDB 后仅作参考）。
       注意：使用 IDB 时不阻断保存，只提示；降级到 localStorage 时才沿用原确认弹窗。 */
    let size = 0;
    try{ size = bytesOf(JSON.stringify(S)); }catch(e){ size = 0; }
    if(S.__useIdb === false && size > SAVE_PREWARN_BYTES){
      openModal('⚠️ 数据体积较大', '<p style="line-height:1.9">本次待保存数据约 <b>' + (size/1048576).toFixed(2) + ' MB</b>，'
        + '已接近浏览器上限（约 5 MB）。</p><p style="line-height:1.9;color:var(--muted)">建议先导出备份并清理数据；'
        + '继续保存可能失败。</p>', [
        { text:'仍然保存', primary:true, onClick:()=>{ safeSaveFull(); } },
        { text:'先导出备份', onClick:()=>{ doEmergencyExport(); return false; } },
        { text:'取消保存' }
      ]);
      return;
    }
    /* 异步写盘；不 await —— 业务调用点是同步的，写盘在后台完成。
       失败已在 safeSaveFull 内部转成可见提示，不会产生未捕获异常。 */
    try{ safeSaveFull(); }catch(e){ console.error('[save] 写盘调度异常', e); }
  };
  if(immediate) doIt(); else saveTimer = setTimeout(doIt, 180);
}
function pushHistory(key, val){

/* ============================================================
   【P1 存储架构升级】IndexedDB 图片仓库
   ------------------------------------------------------------
   为什么需要：错题图片以 base64 内联在 localStorage 里，而 localStorage
   只有约 5MB。几十张图片就能把空间吃光（一次配额失败就可能丢数据）。
   方案：图片二进制存 IndexedDB（容量通常几百 MB~数 GB），
        S 中只保留轻量 id 引用，彻底解除 localStorage 的体积瓶颈。

   数据结构：
     库 shangan_imgs（version 1）
       Object Store: images   keyPath: 'id'
       记录: { id, blob, type, size, w, h, createdAt }
       索引: createdAt（用于按时间清理）
   ============================================================ */
const IDB_NAME = 'shangan_imgs';
const IDB_VER  = 1;
const IDB_STORE = 'images';
let _idbPromise = null;   // 数据库连接的单例 Promise（避免重复 open）

/* Promise 包装 IDBRequest：成功 resolve(result)，失败 reject(error) */
function reqP(rq){
  return new Promise((resolve, reject)=>{
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror   = () => reject(rq.error || new Error('IndexedDB 请求失败'));
  });
}

/* 获取数据库连接（懒加载单例）。
   注意：不判断 indexedDB 是否存在——不支持时直接 reject，
   调用方需处理降级（图片功能不可用时给用户提示，而不是静默失败）。*/
function idbOpen(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject)=>{
    if(typeof indexedDB === 'undefined'){
      reject(new Error('当前浏览器不支持 IndexedDB'));
      return;
    }
    let rq;
    try{ rq = indexedDB.open(IDB_NAME, IDB_VER); }
    catch(e){ reject(e); return; }
    rq.onupgradeneeded = ev => {
      const db = ev.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)){
        const os = db.createObjectStore(IDB_STORE, { keyPath:'id' });
        os.createIndex('createdAt', 'createdAt', { unique:false });
      }
    };
    rq.onsuccess = () => {
      const db = rq.result;
      /* 其他标签页升级版本时主动让路，避免阻塞 */
      db.onversionchange = () => { try{ db.close(); }catch(e){} _idbPromise = null; };
      resolve(db);
    };
    rq.onerror = () => { _idbPromise = null; reject(rq.error || new Error('打开图片库失败')); };
    rq.onblocked = () => { console.warn('[idbOpen] 被其他标签页阻塞'); };
  });
  /* 连接失败后允许下次重试 */
  _idbPromise.catch(()=>{ _idbPromise = null; });
  return _idbPromise;
}

/* 在指定 mode 下执行一次事务；业务失败由调用方在 fn 内抛出，
   此处统一把「事务 abort」也转成 reject，保证不会出现"没报错但没写进去" */
async function idbTx(mode, fn){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    let tx, store, result, done = false;
    const fail = err => { if(done) return; done = true; reject(err || new Error('图片库事务失败')); };
    try{
      tx = db.transaction(IDB_STORE, mode);
      store = tx.objectStore(IDB_STORE);
    }catch(e){ fail(e); return; }
    tx.onabort = () => fail(tx.error || new Error('图片库事务被中止'));
    tx.onerror = () => fail(tx.error);
    tx.oncomplete = () => { if(done) return; done = true; resolve(result); };
    Promise.resolve()
      .then(()=>fn(store, tx))
      .then(r=>{ result = r; })
      .catch(err=>{ fail(err); try{ tx.abort(); }catch(e2){ console.warn('[appIdbTx] 中止失败事务时异常', e2); } });
  });
}

/* ---------- 图片仓库对外接口 ---------- */
const imgStore = {
  /* 写入单张：dataURI 或 Blob 皆可，返回 id */
  async put(base64OrBlob, meta){
    const rec = await makeImgRecord(base64OrBlob, meta);
    await idbTx('readwrite', st => reqP(st.put(rec)).then(()=>true));
    return rec.id;
  },
  /* 批量写入（同一事务，全成或全败）—— 迁移与批量导入使用 */
  async putMany(items){
    // items: [{data, meta}] 或 [{blob, meta}]
    const recs = [];
    for(const it of items){
      recs.push(await makeImgRecord(it.base64OrBlob != null ? it.base64OrBlob : it.blob, it.meta));
    }
    await idbTx('readwrite', st => {
      recs.forEach(r => st.put(r));
      return true;
    });
    return recs.map(r=>r.id);
  },
  async get(id){
    if(!id) return null;
    try{ return await idbTx('readonly', st => reqP(st.get(id))); }
    catch(e){ console.warn('[imgStore.get] 失败', id, e); return null; }
  },
  /* 批量读取（单事务，快且一致）；返回 id -> record 的 Map（缺失的 id 不在 Map 中） */
  async getMany(ids){
    const list = Array.from(new Set((ids||[]).filter(Boolean)));
    const map = new Map();
    if(!list.length) return map;
    try{
      const recs = await idbTx('readonly', st => Promise.all(list.map(id => reqP(st.get(id)))));
      recs.forEach(r => { if(r) map.set(r.id, r); });
    }catch(e){ console.warn('[imgStore.getMany] 失败', e); }
    return map;
  },
  async delete(id){
    if(!id) return;
    try{ await idbTx('readwrite', st => reqP(st.delete(id)).then(()=>true)); }
    catch(e){ console.warn('[imgStore.delete] 失败', id, e); }
  },
  async deleteMany(ids){
    const list = Array.from(new Set((ids||[]).filter(Boolean)));
    if(!list.length) return;
    try{ await idbTx('readwrite', st => { list.forEach(id=>st.delete(id)); return true; }); }
    catch(e){ console.warn('[imgStore.deleteMany] 失败', e); }
  },
  /* 全部 id 列表（用于孤儿清理） */
  async allIds(){
    try{ return await idbTx('readonly', st => reqP(st.getAllKeys())); }
    catch(e){ console.warn('[imgStore.allIds] 失败', e); return []; }
  },
  /* 占用估算：累加 blob.size（无 blob 记录回退用 size 字段） */
  async usage(){
    try{
      const recs = await idbTx('readonly', st => reqP(st.getAll()));
      let bytes = 0, count = 0;
      recs.forEach(r=>{ if(!r) return; count++; bytes += (r.blob && r.blob.size) || r.size || 0; });
      return { count, bytes };
    }catch(e){ console.warn('[imgStore.usage] 失败', e); return { count:0, bytes:0 }; }
  },
  /* 【P1】孤儿图片清理：删除 IDB 中存在但 S 中已无引用的记录。
     返回 {removed, freed}。用于「数据管理 → 清理孤立图片」。 */
  async cleanupOrphans(){
    const used = collectUsedImgIds();
    const all = await this.allIds();
    const orphans = all.filter(id => !used.has(id));
    let freed = 0;
    if(orphans.length){
      try{
        const recs = await this.getMany(orphans);
        recs.forEach(r => { freed += (r.blob && r.blob.size) || r.size || 0; });
      }catch(e){}
      await this.deleteMany(orphans);
    }
    return { removed: orphans.length, freed };
  }
};

/* 把 base64 / Blob 统一构造成 IDB 记录（含宽高探测，失败则宽高为 0） */
async function makeImgRecord(base64OrBlob, meta){
  let blob, type = 'image/png';
  if(base64OrBlob instanceof Blob){
    blob = base64OrBlob;
    type = blob.type || type;
  }else if(typeof base64OrBlob === 'string'){
    const m = base64OrBlob.match(/^data:([\w.+-]+\/[\w.+-]+);base64,(.*)$/);
    if(!m) throw new Error('图片数据格式不正确（不是 base64 DataURL）');
    type = m[1];
    blob = dataUrlToBlob(base64OrBlob, type);
  }else{
    throw new Error('图片数据为空');
  }
  const dim = await probeImgSize(blob);
  const m2 = meta || {};
  return {
    id: m2.id || ('img_' + uid()),
    blob: blob,
    type: type,
    size: blob.size || 0,
    w: dim.w || 0,
    h: dim.h || 0,
    createdAt: Date.now()
  };
}

/* base64 DataURL → Blob（不依赖 fetch，兼容 file:// 与离线环境） */
function dataUrlToBlob(dataUrl, typeHint){
  const m = String(dataUrl).match(/^data:([\w.+-]+\/[\w.+-]+);base64,(.*)$/);
  if(!m) throw new Error('不是合法的 base64 DataURL');
  const type = typeHint || m[1];
  const bin = atob(m[2]);
  const len = bin.length;
  const u8 = new Uint8Array(len);
  for(let i=0;i<len;i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type: type });
}

/* Blob → base64 DataURL（导出时必须内联，跨文档不能带 blob: URL） */
function blobToDataUrl(blob){
  return new Promise((resolve, reject)=>{
    if(!blob) { reject(new Error('空图片')); return; }
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error || new Error('图片读取失败'));
    r.readAsDataURL(blob);
  });
}

/* 探测图片宽高（失败不抛错，返回 {w:0,h:0}——尺寸只影响排版估算，不影响存图） */
function probeImgSize(blob){
  return new Promise(resolve=>{
    if(typeof createImageBitmap === 'function'){
      createImageBitmap(blob).then(bmp=>{
        const r = { w: bmp.width || 0, h: bmp.height || 0 };
        try{ bmp.close && bmp.close(); }catch(e){}
        resolve(r);
      }).catch(()=>resolve({w:0,h:0}));
      return;
    }
    // 回退：Image + objectURL
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { resolve({w:img.naturalWidth||0, h:img.naturalHeight||0}); URL.revokeObjectURL(url); };
    img.onerror = () => { resolve({w:0,h:0}); URL.revokeObjectURL(url); };
    img.src = url;
  });
}

/* ============================================================
   【P1】objectURL 统一注册表
   ------------------------------------------------------------
   IDB 里的图片转成 URL.createObjectURL 后才能给 <img src> 用，
   而 objectURL 不手动 revoke 会一直占内存（图片多了页面会卡死）。
   这里集中登记所有由本应用创建的 objectURL，在页面切换时统一释放。
   ============================================================ */
const urlRegistry = {
  _map: new Map(),     // url -> { el:WeakRef|null, ts }
  register(url, el){
    if(!url) return url;
    this._map.set(url, { el: el || null, ts: Date.now() });
    return url;
  },
  revokeOne(url){
    if(!url) return;
    if(this._map.has(url)){ this._map.delete(url); }
    try{ URL.revokeObjectURL(url); }catch(e){}
  },
  /* 释放全部并清空注册表（页面切换 / 进入复习模式前调用） */
  revokeAll(){
    const n = this._map.size;
    this._map.forEach((v, url)=>{ try{ URL.revokeObjectURL(url); }catch(e){} });
    this._map.clear();
    return n;
  },
  size(){ return this._map.size; }
};

/* 把 IDB 记录转成 objectURL 并登记 */
function recToUrl(rec){
  if(!rec || !rec.blob) return '';
  const url = URL.createObjectURL(rec.blob);
  return urlRegistry.register(url);
}

/* ============================================================
   【P2 存储架构升级】IndexedDB 主数据库（存放主数据 S）
   ------------------------------------------------------------
   为什么需要：主数据 S（错题文字/计划/收藏/复习任务/统计/心情）
   原先存在 localStorage（key = shangan_db_v10），受浏览器约 5MB 上限，
   目标 5000+ 道错题时必然撑爆。改用 IndexedDB（配额通常几百 MB~数 GB）。

   设计（与图片库 shangan_imgs 完全独立，互不影响）：
     库 shangan_app（version 1）
       · store 'state'      无 keyPath，固定字符串 key 'main'
           记录 { key:'main', json:'<S 的 JSON>', updatedAt }
           —— 整个 S 序列化成一条记录，简单、原子、够用
       · store 'meta'       keyPath 'key'
           记录 { key, value }
           用途：storageVersion / 迁移标志 / 上次备份时间等元信息
       · store 'snapshots'  keyPath 'ts'
           记录 { ts, json, reason }
           保留最近 5 条（写入时自动清理更旧的），供误操作恢复

   ★ 铁律：所有操作必须用事务包起来，事务失败必须 throw（绝不静默吞异常）。
     事务的 onabort / onerror / oncomplete 三个事件全部处理。
   ============================================================ */
const APP_IDB_NAME = 'shangan_app';
const APP_IDB_VER  = 1;
const APP_STORE_STATE = 'state';
const APP_STORE_META  = 'meta';
const APP_STORE_SNAP  = 'snapshots';
const APP_STATE_KEY   = 'main';
const SNAPSHOT_KEEP   = 5;          // 快照保留条数上限
let _appIdbPromise = null;          // 主数据库连接的单例 Promise

/* 获取主数据库连接（懒加载单例）。
   不支持 IndexedDB 时直接 reject，调用方需处理降级（回退 localStorage）。 */
function appIdbOpen(){
  if(_appIdbPromise) return _appIdbPromise;
  _appIdbPromise = new Promise((resolve, reject)=>{
    if(typeof indexedDB === 'undefined'){
      reject(new Error('当前浏览器不支持 IndexedDB'));
      return;
    }
    let rq;
    try{ rq = indexedDB.open(APP_IDB_NAME, APP_IDB_VER); }
    catch(e){ reject(e); return; }
    rq.onupgradeneeded = ev => {
      const db = ev.target.result;
      if(!db.objectStoreNames.contains(APP_STORE_STATE)){
        db.createObjectStore(APP_STORE_STATE);         // 无 keyPath，外部传 key
      }
      if(!db.objectStoreNames.contains(APP_STORE_META)){
        db.createObjectStore(APP_STORE_META, { keyPath:'key' });
      }
      if(!db.objectStoreNames.contains(APP_STORE_SNAP)){
        db.createObjectStore(APP_STORE_SNAP, { keyPath:'ts' });
      }
    };
    rq.onsuccess = () => {
      const db = rq.result;
      /* 其他标签页升级版本时主动让路，避免阻塞 */
      db.onversionchange = () => { try{ db.close(); }catch(e){ console.warn('[appIdbOpen] 关闭旧连接失败', e); } _appIdbPromise = null; };
      resolve(db);
    };
    rq.onerror = () => { _appIdbPromise = null; reject(rq.error || new Error('打开应用数据库失败')); };
    rq.onblocked = () => { console.warn('[appIdbOpen] 被其他标签页阻塞'); };
  });
  /* 连接失败后允许下次重试 */
  _appIdbPromise.catch(()=>{ _appIdbPromise = null; });
  return _appIdbPromise;
}

/* 在指定 store 上执行一次事务；三个事件（abort/error/complete）全部处理。
   业务失败由调用方在 fn 内抛出 → 统一 reject，保证不会「没报错但没写进去」。
   mode: 'readonly' | 'readwrite'
   storeName: APP_STORE_STATE | APP_STORE_META | APP_STORE_SNAP（可传数组） */
async function appIdbTx(storeName, mode, fn){
  const db = await appIdbOpen();
  return new Promise((resolve, reject)=>{
    let tx, result, done = false;
    const fail = err => { if(done) return; done = true; reject(err || new Error('应用数据库事务失败')); };
    try{
      tx = db.transaction(storeName, mode);
    }catch(e){ fail(e); return; }
    tx.onabort   = () => fail(tx.error || new Error('应用数据库事务被中止'));
    tx.onerror   = () => fail(tx.error || new Error('应用数据库事务出错'));
    tx.oncomplete= () => { if(done) return; done = true; resolve(result); };
    Promise.resolve()
      .then(()=>fn(tx))
      .then(r=>{ result = r; })
      .catch(err=>{ fail(err); try{ tx.abort(); }catch(e2){ console.warn('[appIdbTx] 中止失败事务时异常', e2); } });
  });
}

/* ---------- 主数据读写（store 'state'，固定 key 'main'） ---------- */

/* 从 IDB 读 S 的 JSON 字符串，返回解析后的对象；无数据返回 null。
   ★ 解析失败会 throw（由调用方决定降级策略），不静默返回空对象。 */
async function idbStateLoad(){
  const rec = await appIdbTx(APP_STORE_STATE, 'readonly', tx=>{
    return new Promise((resolve, reject)=>{
      const rq = tx.objectStore(APP_STORE_STATE).get(APP_STATE_KEY);
      rq.onsuccess = () => resolve(rq.result || null);
      rq.onerror   = () => reject(rq.error || new Error('读取主数据失败'));
    });
  });
  if(!rec || typeof rec.json !== 'string' || !rec.json) return null;
  return JSON.parse(rec.json);
}

/* 读取主数据的原始 JSON 字符串（不解析）——供快照与体积统计使用 */
async function idbStateLoadRaw(){
  const rec = await appIdbTx(APP_STORE_STATE, 'readonly', tx=>{
    return new Promise((resolve, reject)=>{
      const rq = tx.objectStore(APP_STORE_STATE).get(APP_STATE_KEY);
      rq.onsuccess = () => resolve(rq.result || null);
      rq.onerror   = () => reject(rq.error || new Error('读取主数据失败'));
    });
  });
  return rec && typeof rec.json === 'string' ? rec.json : null;
}

/* 把 JSON 字符串写入 IDB 的 'state' store（key='main'）。
   写入前先把 value 算好（避免在事务内 await 其他异步导致事务提前结束）。 */
async function idbStateSave(jsonString){
  const json = String(jsonString == null ? '' : jsonString);
  const updatedAt = Date.now();
  await appIdbTx(APP_STORE_STATE, 'readwrite', tx=>{
    return new Promise((resolve, reject)=>{
      tx.objectStore(APP_STORE_STATE).put({ key: APP_STATE_KEY, json: json, updatedAt: updatedAt }, APP_STATE_KEY);
      resolve(true);
    });
  });
  return true;
}

/* 清空主 state（用于「清除全部数据」） */
async function idbStateClear(){
  await appIdbTx(APP_STORE_STATE, 'readwrite', tx=>{
    return new Promise((resolve, reject)=>{
      tx.objectStore(APP_STORE_STATE).delete(APP_STATE_KEY);
      resolve(true);
    });
  });
  return true;
}

/* ---------- 快照（store 'snapshots'，keyPath 'ts'） ---------- */

/* 写入一条快照，并自动清理更旧的（只保留最近 SNAPSHOT_KEEP 条）。
   reason 例：'migrate' | 'import' | 'manual_clear' | 'restore' | 'before_clear'
   ★ 失败不阻塞主流程——调用方负责 catch 后只 console.warn */
async function idbSnapshotsAdd(json, reason){
  const body = String(json == null ? '' : json);
  const ts = Date.now();
  /* 全部读写放在同一事务内：先 put 新快照，再把超出的旧快照删掉 */
  await appIdbTx(APP_STORE_SNAP, 'readwrite', tx=>{
    const store = tx.objectStore(APP_STORE_SNAP);
    store.put({ ts: ts, json: body, reason: String(reason || 'manual') });
    return new Promise((resolve, reject)=>{
      const rq = store.getAll();
      rq.onsuccess = () => {
        try{
          const all = (rq.result || []).slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
          all.slice(SNAPSHOT_KEEP).forEach(s=>{ try{ store.delete(s.ts); }catch(e){ console.warn('[idbSnapshotsAdd] 清理旧快照失败', s.ts, e); } });
          resolve(true);
        }catch(e){ reject(e); }
      };
      rq.onerror = () => reject(rq.error || new Error('读取快照列表失败'));
    });
  });
  return ts;
}

/* 列出所有快照（按时间倒序），只返回元信息（不含 json 正文，避免弹窗卡顿） */
async function idbSnapshotsList(){
  const all = await appIdbTx(APP_STORE_SNAP, 'readonly', tx=>{
    return new Promise((resolve, reject)=>{
      const rq = tx.objectStore(APP_STORE_SNAP).getAll();
      rq.onsuccess = () => resolve(rq.result || []);
      rq.onerror   = () => reject(rq.error || new Error('读取快照列表失败'));
    });
  });
  return all.map(s=>({
    ts: s.ts,
    reason: s.reason || 'manual',
    size: bytesOf(s.json || ''),
    at: new Date(s.ts || 0).toLocaleString('zh-CN')
  })).sort((a,b)=>b.ts - a.ts);
}

/* 读某条快照的完整记录（含 json 正文） */
async function idbSnapshotsGet(ts){
  const rec = await appIdbTx(APP_STORE_SNAP, 'readonly', tx=>{
    return new Promise((resolve, reject)=>{
      const rq = tx.objectStore(APP_STORE_SNAP).get(Number(ts));
      rq.onsuccess = () => resolve(rq.result || null);
      rq.onerror   = () => reject(rq.error || new Error('读取快照失败'));
    });
  });
  return rec || null;
}

/* ---------- 元信息（store 'meta'） ---------- */

/* 读元信息；不存在返回 null */
async function idbMetaGet(key){
  const rec = await appIdbTx(APP_STORE_META, 'readonly', tx=>{
    return new Promise((resolve, reject)=>{
      const rq = tx.objectStore(APP_STORE_META).get(String(key));
      rq.onsuccess = () => resolve(rq.result || null);
      rq.onerror   = () => reject(rq.error || new Error('读取元信息失败'));
    });
  });
  return rec ? rec.value : null;
}

/* 写元信息（任意可结构化克隆的值） */
async function idbMetaSet(key, value){
  const k = String(key);
  await appIdbTx(APP_STORE_META, 'readwrite', tx=>{
    return new Promise((resolve, reject)=>{
      tx.objectStore(APP_STORE_META).put({ key: k, value: value });
      resolve(true);
    });
  });
  return true;
}

/* ============================================================
   【P2 存储架构升级】存量迁移：localStorage → IndexedDB
   ------------------------------------------------------------
   四阶段（幂等，可中断续做）：
     A 预检    —— localStorage 有无旧 key？meta.migrated_to_idb 是否已完成？
     B 读取校验 —— 读旧 JSON；parse 失败 → 下载 .txt 备份 + 中止（不清旧数据）
     C 写入 IDB —— idbStateSave(旧JSON) → 读回校验（wrong 长度一致）；失败清理并中止
     D 标记完成 —— meta.migrated_to_idb='1' + 打一条快照 + toast 提示

   ★ 铁律：localStorage 里的旧 key 一律保留不删（最后保险），
     哪怕迁移逻辑写错，用户的旧数据仍在原处可抢救。
   ★ 返回值：{ ok:boolean, reason:string }，调用方据此决定是否降级 localStorage。
   ★ 绝不 throw —— 任何失败都转成 { ok:false } + 用户可见提示。 */
const MIGRATE_FLAG_KEY = 'migrated_to_idb';

async function migrateStateToIdb(){
  /* ---------- 阶段 A 预检 ---------- */
  let legacyRaw = null;
  try{ legacyRaw = localStorage.getItem(KEY); }catch(e){ legacyRaw = null; }

  /* 已迁移过 → 直接跳过（幂等：重复打开页面不会重复迁移） */
  try{
    const done = await idbMetaGet(MIGRATE_FLAG_KEY);
    if(done === '1' && legacyRaw) return { ok:true, reason:'already' };
  }catch(e){
    /* meta 读不出来（IDB 不可用等）→ 交给调用方降级 */
    console.warn('[migrateStateToIdb] 读取迁移标志失败', e);
    return { ok:false, reason:'meta_error' };
  }

  /* 没有旧数据 → 无需迁移（全新用户直接用 IDB） */
  if(!legacyRaw || !legacyRaw.length){
    try{ await idbMetaSet(MIGRATE_FLAG_KEY, '1'); }catch(e){ console.warn('[migrateStateToIdb] 写迁移标志失败', e); }
    return { ok:true, reason:'no_legacy' };
  }

  /* IDB 已有主数据（例如上次中断在 C 阶段之后、D 之前）→ 只补标记，不覆盖 */
  try{
    const exist = await idbStateLoadRaw();
    if(exist && exist.length){
      await idbMetaSet(MIGRATE_FLAG_KEY, '1');
      return { ok:true, reason:'idb_existing' };
    }
  }catch(e){ console.warn('[migrateStateToIdb] 检查已有主数据失败', e); }

  /* ---------- 阶段 B 读取 + 校验 ---------- */
  let legacyObj = null;
  try{
    legacyObj = JSON.parse(legacyRaw);
  }catch(e){
    /* 解析失败：不删旧数据，下载原始字符串供人工抢救，然后中止迁移 */
    console.error('[migrateStateToIdb] 旧数据解析失败', e);
    try{
      downloadBlob(legacyRaw, '旧数据_迁移失败原始文件_' + todayStr() + '.txt', 'text/plain;charset=utf-8');
    }catch(e2){ console.error('[migrateStateToIdb] 下载原始数据失败', e2); }
    toast('旧数据格式异常，已下载原始文件；当前继续使用旧存储', 3600);
    return { ok:false, reason:'parse_error' };
  }
  if(!legacyObj || typeof legacyObj !== 'object' || Array.isArray(legacyObj)){
    return { ok:false, reason:'bad_shape' };
  }

  /* ---------- 阶段 C 写入 IDB + 读回校验 ---------- */
  const legacyWrongLen = Array.isArray(legacyObj.wrong) ? legacyObj.wrong.length : 0;
  try{
    await idbStateSave(legacyRaw);

    /* 读回校验：优先比对错题条数（最能反映「有没有丢数据」） */
    const back = await idbStateLoad();
    if(!back || typeof back !== 'object'){
      throw new Error('读回校验失败：IDB 中没有读到数据');
    }
    const backWrongLen = Array.isArray(back.wrong) ? back.wrong.length : 0;
    if(backWrongLen !== legacyWrongLen){
      throw new Error('读回校验失败：错题数量不一致（原 ' + legacyWrongLen + ' 条，回读 ' + backWrongLen + ' 条）');
    }
  }catch(e){
    console.error('[migrateStateToIdb] 写入/校验失败', e);
    /* 清理本次可能写坏的数据，保证下次打开能重新尝试迁移 */
    try{ await idbStateClear(); }catch(e2){ console.warn('[migrateStateToIdb] 清理失败', e2); }
    toast('数据升级未完成（' + (e && e.message ? e.message : '未知错误') + '），已继续使用旧存储', 3600);
    return { ok:false, reason:'write_error' };
  }

  /* ---------- 阶段 D 标记完成 ---------- */
  try{ await idbMetaSet(MIGRATE_FLAG_KEY, '1'); }
  catch(e){ console.warn('[migrateStateToIdb] 写迁移标志失败（不影响数据）', e); }

  /* 迁移前留一条快照，便于误操作回溯（失败不阻塞） */
  try{ await idbSnapshotsAdd(legacyRaw, 'migrate'); }
  catch(e){ console.warn('[migrateStateToIdb] 快照写入失败', e); }

  /* ★ localStorage 的旧 key 一律不删（最后保险），仅提示用户 */
  try{ toast('数据已升级到新存储（旧数据仍保留）', 3200); }catch(e){ console.warn('[migrateStateToIdb] toast 提示失败', e); }
  return { ok:true, reason:'migrated' };
}

/* ============================================================
   【P1】图片读取适配层（异步）
   ------------------------------------------------------------
   ★ 重要约束：renderPage() 内部是同步调用页面函数的
     （const r = fn(); content.innerHTML = r.html;），
     因此页面函数不能改成 async。这里采用：
       ① 同步产出 <img data-imgid="ID"> 占位符（不含 src）
       ② 渲染完成后由 hydrateImgs(rootEl) 异步批量补 src
     —— 既拿到 IDB 的性能优势，又不破坏既有同步渲染链路。
   ============================================================ */

/* 同步：从错题对象取出「题目图片 id 列表」（向后兼容旧数据）
   新结构：w.imgIds[]；旧结构：w.imgs[]（base64 内联）
   注意：旧结构返回的是 base64 原文数组，调用方需自行区分——
   用 isBase64List() 判断后走不同渲染分支。 */
function wrongImgIds(w){
  if(!w) return [];
  if(Array.isArray(w.imgIds) && w.imgIds.length) return w.imgIds.filter(Boolean);
  return [];
}
function wrongExpImgIds(w){
  if(!w) return [];
  if(Array.isArray(w.expImgIds) && w.expImgIds.length) return w.expImgIds.filter(Boolean);
  return [];
}
/* 旧结构兼容：未迁移的数据仍有 base64 数组 */
function legacyImgs(w){
  if(!w) return [];
  return Array.isArray(w.imgs) ? w.imgs.filter(Boolean) : [];
}
function legacyExpImgs(w){
  if(!w) return [];
  return Array.isArray(w.expImgs) ? w.expImgs.filter(Boolean) : [];
}
/* 收集 S 中所有被引用的图片 id（用于孤儿清理） */
function collectUsedImgIds(){
  const set = new Set();
  (S.wrong || []).forEach(w=>{
    if(!w) return;
    wrongImgIds(w).forEach(id=>set.add(id));
    wrongExpImgIds(w).forEach(id=>set.add(id));
    if(w.imgId) set.add(w.imgId);
    if(w.expImgId) set.add(w.expImgId);
  });
  return set;
}

/* 同步生成图片占位 HTML（含 data-imgid，由 hydrateImgs 补齐 src）
   列表为空时返回空串 */
function imgPlaceholderHtml(ids, maxH){
  const list = (ids||[]).filter(Boolean);
  if(!list.length) return '';
  const h = maxH ? ('max-height:' + maxH + 'px;') : '';
  return '<div class="qimgs" style="margin-top:7px;display:flex;flex-wrap:wrap;gap:6px;">'
    + list.map(id => '<img class="qimg" data-iv="1" data-imgid="' + esc(id) + '" alt="" '
        + 'style="' + h + 'max-width:100%;border-radius:8px;border:1px solid var(--line,#eee);background:var(--soft,#faf9fb);">')
      .join('')
    + '</div>';
}

/* ★ 同步渲染入口（替代旧的 qImgsHtml）——
   新结构走占位符；旧结构（base64）直接内联，保证迁移前也能正常显示 */
function qImgsHtml(w, which, maxH){
  const ids = which === 'exp' ? wrongExpImgIds(w) : wrongImgIds(w);
  if(ids.length) return imgPlaceholderHtml(ids, maxH);
  const legacy = which === 'exp' ? legacyExpImgs(w) : legacyImgs(w);
  if(legacy.length) return legacy.map(s=>'<img class="qimg" data-iv="1" src="'+s+'" style="max-width:100%;'+(maxH?('max-height:'+maxH+'px;'):'')+'border-radius:8px;border:1px solid var(--line,#eee);">').join('');
  return '';
}
/* 兼容旧调用签名 qImgsHtml(list) —— 传数组时按原始数组渲染 */
function qImgsHtmlList(list, maxH){
  const arr = (list||[]).filter(Boolean);
  if(!arr.length) return '';
  // 判断是 id 列表还是 base64 列表
  const isBase64 = arr.some(x => typeof x === 'string' && x.slice(0,5) === 'data:');
  if(isBase64) return arr.map(s=>'<img class="qimg" data-iv="1" src="'+s+'" style="max-width:100%;'+(maxH?('max-height:'+maxH+'px;'):'')+'border-radius:8px;border:1px solid var(--line,#eee);">').join('');
  return imgPlaceholderHtml(arr, maxH);
}

/* 【核心】把 rootEl 内所有 [data-imgid] 占位图异步补上 src。
   分块处理（每批 60）避免一次创建过多 objectURL 造成内存峰值。 */
let _hydrateGen = 0;
async function hydrateImgs(rootEl){
  if(!rootEl) return;
  const gen = ++_hydrateGen;
  let nodes;
  try{ nodes = Array.from(rootEl.querySelectorAll('img[data-imgid]')); }
  catch(e){ console.warn('[hydrateImgs] 查询失败', e); return; }
  if(!nodes.length) return;
  const CHUNK = 60;
  for(let i=0;i<nodes.length;i+=CHUNK){
    if(gen !== _hydrateGen) return;   // 页面已切换，放弃本次补齐
    const chunk = nodes.slice(i, i+CHUNK);
    const ids = chunk.map(n => n.getAttribute('data-imgid')).filter(Boolean);
    if(!ids.length) continue;
    let map;
    try{ map = await imgStore.getMany(ids); }
    catch(e){ console.warn('[hydrateImgs] 读取失败', e); continue; }
    if(gen !== _hydrateGen) return;
    chunk.forEach(node=>{
      const id = node.getAttribute('data-imgid');
      const rec = map.get(id);
      if(!rec || !rec.blob){ node.style.display = 'none'; return; }
      if(!node.isConnected) return;                 // 已从 DOM 移除
      const url = recToUrl(rec);
      node.setAttribute('data-objurl', url);
      node.src = url;
      node.removeAttribute('data-imgid');           // 标记已补齐，避免重复处理
    });
  }
}

/* 释放 rootEl 内（或全局）所有已创建的 objectURL —— 切页时调用 */
function revokeImgsIn(rootEl){
  if(rootEl){
    try{
      rootEl.querySelectorAll('img[data-objurl]').forEach(n=>{
        const u = n.getAttribute('data-objurl');
        if(u) urlRegistry.revokeOne(u);
        n.removeAttribute('data-objurl');
      });
      return;
    }catch(e){ console.warn('[revokeImgsIn]', e); }
  }
  urlRegistry.revokeAll();
}

let toastTimer = null;
function toast(msg, ms){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), ms||2000);
}
/* 小猫/小狗点击提示：电子木鱼式浮字（可连击叠加，每条独立上飘后淡出） */
function showPetMsg(msg){
  const box = $('#petMsg');
  const it = document.createElement('div');
  it.className = 'pm-item';
  it.textContent = msg;
  // 同一时刻连击时做轻微横向错位，避免完全重叠
  const n = box.querySelectorAll('.pm-item').length;
  if(n){ it.style.marginLeft = ((n % 2 ? 1 : -1) * Math.min(n, 3) * 10) + 'px'; }
  box.appendChild(it);
  const done = ()=>{ if(it.parentNode) it.parentNode.removeChild(it); };
  it.addEventListener('animationend', done);
  setTimeout(done, 2200);   // 兜底清理（动画被中断时）
}
function openModal(head, bodyHtml, buttons){
  $('#mHead').innerHTML = head;
  $('#mBody').innerHTML = bodyHtml || '';
  const foot = $('#mFoot'); foot.innerHTML = '';
  const btns = buttons || [{text:'关闭', primary:true, onClick:()=>true}];
  btns.forEach(b=>{
    const btn = document.createElement('button');
    btn.className = 'mbtn ' + (b.primary ? 'primary' : 'ghost');
    btn.textContent = b.text;
    btn.onclick = () => {
      const r = b.onClick ? b.onClick() : true;
      if(r !== false) closeModal();
    };
    foot.appendChild(btn);
  });
  $('#modal').classList.add('show');
}
function closeModal(){ $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });

/* ============================================================
   ★ 分块打卡统计引擎（需求 6）
   ------------------------------------------------------------
   核心：每个功能菜单（board）各自记账，互不影响。
     · boardLog[board] = { 'YYYY-MM-DD': {ck,q,paper,page,timer} }
     · board 为菜单 id（'math' / 'sl-small' / 'w-today' / 'library' …）
   提供四个层次：
     ① boardDayStat(board, day)        —— 单个菜单某天的原始账
     ② boardStats(board)               —— 单个菜单的 连续/最长/累计（只算自己）
     ③ globalCheckinStats()            —— 全局汇总口径（顶部右侧用）
     ④ boardsDayStat(boards, day)      —— 若干菜单合并后的某天账
   ============================================================ */
const BOARD_BLANK = () => ({ck:0, q:0, paper:0, page:0, timer:0});

/* 取某板块某天账（不存在返回空白，不改数据） */
function boardDay(board, day){
  const b = S.boardLog && S.boardLog[board];
  const x = b && b[day];
  return x || {ck:0, q:0, paper:0, page:0, timer:0};
}
/* 确保某板块某天账存在并返回引用（写路径专用） */
function boardDayRef(board, day){
  if(!S.boardLog) S.boardLog = {};
  if(!S.boardLog[board]) S.boardLog[board] = {};
  if(!S.boardLog[board][day]){
    S.boardLog[board][day] = {ck:0, q:0, paper:0, page:0, timer:0};
  }
  return S.boardLog[board][day];
}
/* 某天账是否「有效」——有打卡标记，或有任一形式的学习痕迹 */
function boardDayActive(x){
  return !!(x && (x.ck || (x.q||0) > 0 || (x.paper||0) > 0 || (x.page||0) > 0 || (x.timer||0) > 0));
}
/* 某板块某天的总学习时长（秒）= 套卷 + 页面停留 + 刷题计时器 */
function boardDaySec(x){
  if(!x) return 0;
  return Math.round((x.paper||0) + (x.page||0) + (x.timer||0));
}

/* 从「天集合」算 连续/最长/累计 —— 与旧 calcCheckinStats 同一算法，
   只是输入换成了任意 board 组合产生的天集合。 */
function statsFromDaySet(daySet){
  const days = Array.from(daySet).sort();
  const total = days.length;
  let maxStreak = 0, curStk = 0, prev = null;
  days.forEach(d=>{
    if(prev){
      const pd = new Date(prev), nd = new Date(d);
      const diff = Math.round((nd - pd)/86400000);
      curStk = (diff === 1) ? curStk + 1 : 1;
    } else curStk = 1;
    if(curStk > maxStreak) maxStreak = curStk;
    prev = d;
  });
  let streak = 0;
  const set = daySet;
  const check = new Date();
  if(!set.has(dstr(check))) check.setDate(check.getDate() - 1);
  while(set.has(dstr(check))){ streak++; check.setDate(check.getDate() - 1); }
  return {total, maxStreak, streak, days};
}

/* ② 单个菜单的统计（只算本菜单自己的账）
   需求 4：连续/最长打卡只统计「ck=1 且未被取消」的天
   —— 取消打卡后 ck 归 0，当日不再计入，连续/最长天数即时扣除。 */
function boardStats(board){
  return statsFromDaySet(boardCheckedDaySet(board));
}
/* 某板块「已打卡」天集合（ck=1 且非零，取消打卡即剔除） */
function boardCheckedDaySet(board){
  const b = (S.boardLog && S.boardLog[board]) || {};
  const set = new Set();
  Object.keys(b).forEach(d=>{ if(b[d] && b[d].ck) set.add(d); });
  return set;
}
/* 若干菜单合并统计（如「行测专区」整个大类） */
function boardsStats(boards){
  const set = new Set();
  boards.forEach(board=>{
    boardCheckedDaySet(board).forEach(d=>set.add(d));
  });
  return statsFromDaySet(set);
}

/* ③ 全局汇总口径（顶部右侧）
   需求 3：当日已打卡 = 「此刻」仍满足任一：
     · 任意功能菜单当前 ck=1（点了今日打卡且未取消）
     · 错题本「今日复习」点过开始复习（reviewLogs 有当日记录）
   取消打卡后 ck 归 0 → 当日若再无任何已打卡板块，则该日自动从
   全局统计中扣除（连续/最长/累计即时回落）。
   兼容旧数据：studyLog 有记录计入（历史连续天数不断档）。 */
function globalCheckedDaySet(){
  const set = new Set();
  Object.keys(S.boardLog || {}).forEach(board=>{
    const b = S.boardLog[board] || {};
    Object.keys(b).forEach(d=>{
      const x = b[d];
      if(x && x.ck) set.add(d);
      else if(boardDayActive(x) && board === 'xc') set.add(d); // 兼容迁移来的旧账
    });
  });
  // 错题本「今日复习」：点了开始复习即算当日已打卡
  (S.reviewLogs || []).forEach(r=>{ if(r && r.d) set.add(r.d); });
  // 旧 studyLog 兜底
  Object.keys(S.studyLog || {}).forEach(d=>{
    const x = S.studyLog[d] || {};
    if((x.sec||0) > 0 || (x.q||0) > 0 || (x.sl||0) > 0) set.add(d);
  });
  return set;
}
function globalCheckinStats(){
  return statsFromDaySet(globalCheckedDaySet());
}
/* 全局口径：某天是否已打卡 */
function globalCheckedOn(day){
  return globalCheckedDaySet().has(day);
}

/* ④ 某菜单当日是否已打卡（仅看该菜单自己的 ck 标记） */
function boardCheckedToday(board){
  return !!boardDay(board, todayStr()).ck;
}
/* 切换某菜单的「今日打卡」状态，返回切换后的状态 */
function toggleBoardCheckin(board){
  const ref = boardDayRef(board, todayStr());
  ref.ck = ref.ck ? 0 : 1;
  save(true);
  return !!ref.ck;
}

/* 分块记账写入助手（批次 3/4 会用）
   addBoardQ / addBoardPaper / addBoardPage / addBoardTimer */
function addBoardQ(board, n){
  const ref = boardDayRef(board, todayStr());
  ref.q = (ref.q || 0) + (n || 1);
  save();
}
function addBoardSec(board, field, sec){
  if(!(sec > 0)) return;
  const ref = boardDayRef(board, todayStr());
  ref[field] = (ref[field] || 0) + Math.round(sec);
  save();
}

  const g = (S.boardGoalSec && S.boardGoalSec[board]) || 0;

}

/* ============================================================
   热力图着色（需求 1 / R4）
   ------------------------------------------------------------
   · 最深色统一为 #e4a1b6（所有热力图一致）
   · 不再用固定阈值分级，而是按「当前范围内最大时长」归一化着色，
     使同一张热力图内部深浅分布始终充分（年报按月不会整体过深）
   · 空态保持 #F6EDF1（由 CSS 提供，此处返回 ''）
   ============================================================ */
const HEAT_DEEP = '#e4a1b6';      // 最深（R4：由 #FF6961 调整）
const HEAT_EMPTY = '#F6EDF1';     // 无记录
const HEAT_BASE  = {r:0xF9, g:0xE2, b:0xE9};   // 中间浅粉（浅→深插值起点，R4 同步调浅）

/* sec: 该格时长（秒）；maxSec: 本张热力图的最大时长（秒）
   返回背景色 rgb()（无记录返回空字符串） */
function heatColorOf(sec, maxSec){
  sec = Math.max(0, Number(sec) || 0);
  if(sec <= 0) return '';
  const m = Math.max(1, Number(maxSec) || 1);
  // 归一化：从最小比例 0.12 起，避免最小值几乎不可见
  const t = Math.max(0.12, Math.min(1, sec / m));
  const r = Math.round(HEAT_BASE.r + (0xE4 - HEAT_BASE.r) * t);
  const g = Math.round(HEAT_BASE.g + (0xA1 - HEAT_BASE.g) * t);
  const b = Math.round(HEAT_BASE.b + (0xB6 - HEAT_BASE.b) * t);
  return 'rgb('+r+','+g+','+b+')';
}
/* label: tooltip 文案；返回 <i> 的 HTML */
function heatCell(sec, maxSec, label){
  const bg = heatColorOf(sec, maxSec);
  if(!bg) return '<i title="'+esc(label||'')+'"></i>';
  return '<i style="background:'+bg+';" title="'+esc(label||'')+'"></i>';
}
/* 从一组时长里取最大（用作归一化基准）；空则返回 0（用 1 兜底） */
function heatMaxOf(secArr){
  let mx = 0;
  (secArr || []).forEach(s=>{ const v = Math.max(0, Number(s)||0); if(v > mx) mx = v; });
  return mx || 1;
}
/* R4：紧凑时长格式（年报 12 列单行热力框内专用，防溢出）：
   18h / 1h30m / 45分 / <1分 / — */
function fmtClockShort(sec){
  sec = Math.max(0, Math.round(Number(sec) || 0));
  if(sec <= 0) return '—';
  const h = Math.floor(sec / 3600);
  const m = Math.round((sec % 3600) / 60);
  if(h > 0) return m > 0 ? h+'h'+m+'m' : h+'h';
  if(m > 0) return m+'分';
  return '<1分';
}

/* 单日全板块汇总（需求 9(4) 口径）：
   总学习时长 = 行测专区 + 申论专区 + 错题本 + 资料库 全部时长 */
function dayAgg(d){
  let sec = 0, q = 0, ck = 0;
  Object.keys(S.boardLog || {}).forEach(b=>{
    const x = (S.boardLog[b] || {})[d];
    if(x){ sec += boardDaySec(x); q += (x.q || 0); if(boardDayActive(x)) ck = 1; }
  });
  // 兜底：极老数据（未经迁移标记）——从 studyLog/timerLog 取（与 boardLog 取大者，防重复）
  const log = S.studyLog[d] || {};
  const timerItems = (S.timerLog||[]).filter(x=>x.d === d);
  const secTimer = timerItems.reduce((s,x)=>s+(x.sec||0),0);
  const qTimer = timerItems.reduce((s,x)=>s+(x.q||0),0);
  const sec2 = Math.max(sec, secTimer, log.sec||0), q2 = Math.max(q, qTimer, log.q||0);
  return { d, sec: sec2, q: q2, sl: log.sl||0, ck: (sec2>0 || q2>0 || ck) ? 1 : 0 };
}
/* 区间 [d1, d2]（含端点）内逐日聚合 */
function daysInRange(d1, d2){
  const out = [];
  if(!d1 || !d2) return out;
  const cur = new Date(d1), end = new Date(d2);
  if(isNaN(cur) || isNaN(end) || cur > end) return out;
  while(cur <= end){ out.push(dstr(cur)); cur.setDate(cur.getDate()+1); }
  return out;
}
/* 区间内总时长/总题数（dayAgg 求和） */
function aggInRange(d1, d2){
  let sec = 0, q = 0, days = 0;
  daysInRange(d1, d2).forEach(d=>{
    const x = dayAgg(d);
    sec += x.sec; q += x.q;
    if(x.sec > 0 || x.q > 0) days++;
  });
  return {sec, q, days};
}
/* 区间内全局口径打卡天数（需求 9(3)：按所属周/月/年计算） */
function checkedCountInRange(d1, d2){
  const set = globalCheckedDaySet();
  let n = 0;
  daysInRange(d1, d2).forEach(d=>{ if(set.has(d)) n++; });
  return n;
}
/* 各板块时长明细（需求 9(2)）：区间内按板块聚合 paper/page/timer */
function boardSecDetailInRange(d1, d2){
  const map = {};
  Object.keys(S.boardLog || {}).forEach(b=>{
    /* R1 双保险：计划类/统计类菜单的停留不参与板块明细（正常也不该有 page 数据） */
    if(dwellExcluded(b)) return;
    const days = S.boardLog[b] || {};
    Object.keys(days).forEach(d=>{
      if(d < d1 || d > d2) return;
      const x = days[d];
      if(!boardDayActive(x)) return;
      if(!map[b]) map[b] = {board:b, paper:0, page:0, timer:0};
      map[b].paper += (x.paper||0);
      map[b].page  += (x.page||0);
      map[b].timer += (x.timer||0);
    });
  });
  return Object.values(map).map(r=>({board:r.board, paper:r.paper, page:r.page, timer:r.timer,
    sec: r.paper + r.page + r.timer})).sort((a,b)=>b.sec-a.sec);
}
/* 时长明细表 HTML（各统计页共用） */
function boardSecDetailTable(d1, d2){
  const rows = boardSecDetailInRange(d1, d2);
  if(!rows.length){
    return '<div style="font-size:var(--fs-btn);color:var(--text3);text-align:center;padding:10px;">该时间段暂无学习时长记录</div>';
  }
  return '<div class="tbl-wrap"><table class="tbl">'+
    '<thead><tr><th>板块</th><th style="text-align:center;">套卷计时</th><th style="text-align:center;">页面停留</th><th style="text-align:center;">刷题计时器</th><th style="text-align:center;">合计</th></tr></thead>'+
    '<tbody>'+rows.map(r=>
      '<tr><td>'+esc(boardName(r.board))+'</td>'+
      '<td style="text-align:center;">'+(r.paper?fmtClock(r.paper):'--')+'</td>'+
      '<td style="text-align:center;">'+(r.page?fmtClock(r.page):'--')+'</td>'+
      '<td style="text-align:center;">'+(r.timer?fmtClock(r.timer):'--')+'</td>'+
      '<td style="text-align:center;font-weight:800;color:var(--pinkDeep2);">'+fmtClock(r.sec)+'</td></tr>'
    ).join('')+'</tbody></table></div>';
}

   一次性解决「目标列表」在每日/周/月/整体四页的简称分歧。 */
function sectionShort(title, cur){
  const t = String(title||'').replace(/\s+/g,'');
  for(const [re, sh] of SECTION_SHORT_RULES){
    if(re.test(t)) return (typeof sh === 'function') ? sh(cur) : sh;
  }
  return t.slice(0, 3);
}
let BUNNY_OPEN = false;       // 是否固定展开（点击锁定）
let BUNNY_HOVER = false;      // 是否悬停中
let BUNNY_LOCK_UNTIL = 0;     // 跳转后的高亮锁定截止时间戳（避免旧滚动位置覆盖）
let BUNNY_SECS = [];          // 当前页面已识别的板块锚点

/* 为当前页面每个板块卡片打上锚点 id（不改动各页面源码，渲染后统一加工） */
function bunnyIndexSections(){
  const content = $('#content');
  if(!content) return [];
  const titles = content.querySelectorAll('.card-title');
  const out = [];
  titles.forEach((el, i)=>{
    const card = el.closest('.card');
    if(!card) return;
    const clone = el.cloneNode(true);
    /* 【本次改动五】剥离副标题与标题右侧操作区，避免按钮文字（「导出/导入」等）
       混进标题正文导致简称规则匹配失败（原选择器漏了实际的 .ttl-actions 类名）。 */
    ['.sub','.ttl-actions','.ttl-acts','svg','.ttl-ico','button','.seg'].forEach(s=>{
      clone.querySelectorAll(s).forEach(x=>x.remove());
    });
    const full = clone.textContent.replace(/\s+/g,' ').trim();
    if(!full) return;
    const id = 'bn-sec-' + i;
    card.id = id;
    card.dataset.bnSec = '1';
    out.push({ id, full, short: sectionShort(full, cur) });   /* 【本次改动五】传入 cur 供规则做上下文区分 */
  });
  BUNNY_SECS = out;
  return out;
}

function bunnyPrime(){
  const nav = $('#bunnyNav');
  const list = $('#bunnyList');
  if(!nav || !list) return;
  // 页面刚渲染完，先识别板块
  const secs = bunnyIndexSections();
  if(!secs.length){
    nav.style.display = 'none';
    return;
  }
  nav.style.display = '';
  list.innerHTML = secs.map((s, i)=>
    '<button class="bunny-item" data-bnsec="'+s.id+'" title="'+esc(s.full)+'">'+
      '<span class="bn-dot"></span><span>'+esc(s.short)+'</span></button>'
  ).join('');
  // 高亮当前可视板块
  bunnyHighlight();
}
function bunnyHighlight(){
  const nav = $('#bunnyNav');
  if(!nav || !BUNNY_SECS.length) return;
  if(BUNNY_LOCK_UNTIL > Date.now()) return;   // 跳转后就锁定，避免被旧的滚动位置覆盖
  const items = nav.querySelectorAll('.bunny-item');
  if(!items.length) return;
  const line = window.scrollY + (document.documentElement.clientHeight * 0.32);
  let best = 0;
  BUNNY_SECS.forEach((s, i)=>{
    const el = document.getElementById(s.id);
    if(el && el.offsetTop <= line + 40) best = i;
  });
  items.forEach((it, i)=> it.classList.toggle('active', i === best));
}
/* 跳转后按"视口内最靠上的板块"重新判定高亮，保证点击谁就高亮谁 */
function bunnyHighlightTop(){
  const nav = $('#bunnyNav');
  if(!nav || !BUNNY_SECS.length) return;
  const items = nav.querySelectorAll('.bunny-item');
  if(!items.length) return;
  const sticky = $('.sticky-cd');
  const stickyH = sticky ? sticky.getBoundingClientRect().height : 0;
  const line = stickyH + 8;          // 冻结栏下沿：第一个可见板块的判定线
  let best = 0;
  BUNNY_SECS.forEach((s, i)=>{
    const el = document.getElementById(s.id);
    if(!el) return;
    const t = el.getBoundingClientRect().top;
    if(t <= line + 4) best = i;
  });
  items.forEach((it, i)=> it.classList.toggle('active', i === best));
}
function bunnyScrollTo(id){
  const el = document.getElementById(id);
  if(!el) return;
  const sticky = $('.sticky-cd');
  const stickyH = sticky ? sticky.getBoundingClientRect().height : 0;
  const top = window.scrollY + el.getBoundingClientRect().top - stickyH - 12;
  window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
}
function bunnySet(open){
  const nav = $('#bunnyNav');
  if(!nav) return;
  nav.classList.toggle('open', !!open);
}
function applyBunnyPos(){
  const nav = $('#bunnyNav');
  if(!nav) return;
  nav.classList.toggle('open', BUNNY_OPEN || BUNNY_HOVER);
}
(function bindBunny(){
  const nav = $('#bunnyNav');
  const head = $('#bunnyHead');
  if(!nav || !head) return;
  let hoverLeaveTimer = null;
  const showByHover = ()=>{ BUNNY_HOVER = true; clearTimeout(hoverLeaveTimer); bunnySet(true); };
  const hideByHover = ()=>{ BUNNY_HOVER = false; if(!BUNNY_OPEN) bunnySet(false); };
  head.addEventListener('mouseenter', showByHover);
  nav.addEventListener('mouseenter', showByHover);
  nav.addEventListener('mouseleave', ()=>{ clearTimeout(hoverLeaveTimer); hideByHover(); });
  head.addEventListener('click', e=>{
    e.stopPropagation();
    BUNNY_OPEN = !BUNNY_OPEN;
    bunnySet(BUNNY_OPEN || BUNNY_HOVER);
  });
  // 点击板块简称 → 平滑滚动定位到该板块，并按"跳转后第一个可见板块"高亮
  nav.addEventListener('click', e=>{
    const it = e.target.closest('[data-bnsec]');
    if(!it) return;
    const targetId = it.dataset.bnsec;
    // 立即按目标板块高亮，并锁定一段时间，避免被滚动过程中的旧位置覆盖
    BUNNY_LOCK_UNTIL = Date.now() + 900;
    const items = nav.querySelectorAll('.bunny-item');
    items.forEach(x=> x.classList.toggle('active', x.dataset.bnsec === targetId));
    bunnyScrollTo(targetId);
    // 滚动结束后再按实际首个可见板块校准一次
    setTimeout(()=>{
      BUNNY_LOCK_UNTIL = Date.now() + 1500;
      bunnyHighlightTop();
      BUNNY_LOCK_UNTIL = 0;
    }, 780);
    if(!BUNNY_OPEN){ BUNNY_HOVER = false; bunnySet(false); }
  });
  // 滚动时高亮当前所处板块
  window.addEventListener('scroll', ()=>{ if(typeof bunnyHighlight==='function') bunnyHighlight(); }, {passive:true});
  // 点击页面其他位置关闭固定列表
  document.addEventListener('click', e=>{
    if(!BUNNY_OPEN) return;
    if(e.target.closest('#bunnyNav')) return;
    BUNNY_OPEN = false; bunnySet(BUNNY_HOVER);
  });
  // 触摸设备：点按兔头切换
  head.addEventListener('touchstart', e=>{ e.stopPropagation(); }, {passive:true});
})();
