/* 图片组 HTML：显示规则——文字与图片同时存在时，图片在上、文字在下 */
/* 修改轮6：输出图片统一带 class="qimg" + data-iv="1"（供全局事件委托点击放大）
   【P1 改造】本函数已迁移到文件前部（状态管理区），此处不再重复定义。
   新签名 qImgsHtml(w, which, maxH)：which 为 '' 表示题目图、'exp' 表示解析图。
   新结构输出 <img data-imgid> 占位符，由 hydrateImgs 异步补 src；
   旧结构（base64 内联）仍直接输出 src，保证迁移前兼容。 */

/* ============================================================
   修改轮6：错题图片查看浮层（全屏 / 缩放 / 平移 / 下载）
   ------------------------------------------------------------
   · 触发：全局事件委托监听 img.qimg 点击 —— 一次绑定覆盖
     「收集箱 / 全部错题 / 沉浸式复习」三处全部图片
   · 同一组图片（同一次 qImgsHtml 连续输出）自动视为一组，支持 ‹ › 翻页
   · 下载统一为 jpg 或 png（其他格式经 canvas 重绘为 png）
   ============================================================ */
const IV = { list: [], idx: 0, scale: 1, tx: 0, ty: 0,
  dragging: false, sx: 0, sy: 0, pinchDist: 0, pinchScale: 1 };
const IV_MIN = 0.2, IV_MAX = 8;

function ivApply(){
  const img = $('#ivImg');
  if(!img) return;
  img.style.transform = 'translate('+IV.tx+'px,'+IV.ty+'px) scale('+IV.scale+')';
  const pct = $('#ivPct');
  if(pct) pct.textContent = Math.round(IV.scale * 100) + '%';
  const prev = $('#ivPrev'), next = $('#ivNext');
  if(prev) prev.disabled = IV.list.length <= 1;
  if(next) next.disabled = IV.list.length <= 1;
  const info = $('#ivInfo');
  if(info) info.textContent = (IV.idx + 1) + ' / ' + IV.list.length;
}
function ivReset(){
  IV.scale = 1; IV.tx = 0; IV.ty = 0;
  ivApply();
}
function ivOpen(list, idx){
  IV.list = (list||[]).slice();
  if(!IV.list.length) return;
  IV.idx = Math.max(0, Math.min(idx||0, IV.list.length - 1));
  const img = $('#ivImg');
  img.src = IV.list[IV.idx];
  ivReset();
  const v = $('#imgViewer');
  v.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function ivCloseViewer(){
  const v = $('#imgViewer');
  v.classList.remove('show');
  document.body.style.overflow = '';
  const img = $('#ivImg');
  if(img) img.src = '';
  IV.list = []; IV.idx = 0;
  ivReset();
}
function ivGoto(n){
  if(!IV.list.length) return;
  IV.idx = (n + IV.list.length) % IV.list.length;
  const img = $('#ivImg');
  if(img) img.src = IV.list[IV.idx];
  ivReset();
}
function ivZoom(factor, cx, cy){
  const next = Math.max(IV_MIN, Math.min(IV_MAX, IV.scale * factor));
  const k = next / IV.scale;
  /* 以 (cx, cy) 为锚点缩放（相对视口中心） */
  if(cx !== undefined && cy !== undefined){
    IV.tx = cx - k * (cx - IV.tx);
    IV.ty = cy - k * (cy - IV.ty);
  }
  IV.scale = next;
  ivApply();
}

/* 收集同一组图片：向前后扫描紧邻的 img.qimg（中间只有空白/换行文本） */
function ivCollectGroup(img){
  const all = Array.from(document.querySelectorAll('img.qimg'));
  const pos = all.indexOf(img);
  if(pos < 0) return { list: [img.src], idx: 0 };
  const group = [img];
  const isBridge = node=>{
    if(node.nodeType === 1){
      return node.tagName === 'BR' ||
        (node.classList && (node.classList.contains('qimg') || node.classList.contains('img-grid')));
    }
    return node.nodeType === 3 && !node.textContent.trim();
  };
  /* 向前 */
  let n = img.previousSibling;
  while(n){
    if(n.nodeType === 1 && n.tagName === 'IMG' && n.classList.contains('qimg')){ group.unshift(n); n = n.previousSibling; }
    else if(isBridge(n)){ n = n.previousSibling; }
    else break;
  }
  /* 向后 */
  n = img.nextSibling;
  while(n){
    if(n.nodeType === 1 && n.tagName === 'IMG' && n.classList.contains('qimg')){ group.push(n); n = n.nextSibling; }
    else if(isBridge(n)){ n = n.nextSibling; }
    else break;
  }
  const list = group.map(g=>g.src);
  return { list, idx: group.indexOf(img) };
}

/* 下载：dataUrl → Blob（统一 jpg / png） */
function ivExtOf(dataUrl, mime){
  const m = mime || (/^data:([^;,]+)/.exec(dataUrl) || [])[1] || 'image/png';
  if(/jpe?g/i.test(m)) return 'jpg';
  return 'png';
}
function ivDownload(){
  const src = IV.list[IV.idx];
  if(!src){ toast('没有可下载的图片'); return; }
  const stem = '错题图片_' + String(Date.now()).slice(-6) + '_' + (IV.idx + 1);
  const finish = (blob, e2)=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = stem + '.' + e2;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
    toast('已下载 ' + stem + '.' + e2);
  };
  /* 【P1 适配】IndexedDB 轮后页面上图片可能以 objectURL（blob:）呈现：
     blob: URL 没有 base64 段，旧代码 atob('') 会导出 0 字节损坏文件。
     统一先 fetch 成 Blob，再按真实 MIME 走 快存 / canvas 转 PNG 两条路。 */
  if(/^blob:/i.test(src)){
    (async ()=>{
      try{
        const blob = await (await fetch(src)).blob();
        const mime = blob.type || 'image/png';
        if(/jpe?g/i.test(mime)){ finish(blob, 'jpg'); return; }
        if(/png/i.test(mime)){ finish(blob, 'png'); return; }
        /* gif/webp/bmp… → canvas 重绘为 PNG */
        const im = new Image();
        im.onload = ()=>{
          try{
            const cv = document.createElement('canvas');
            cv.width = im.naturalWidth || im.width;
            cv.height = im.naturalHeight || im.height;
            cv.getContext('2d').drawImage(im, 0, 0);
            cv.toBlob(b=>{ if(b) finish(b, 'png'); else toast('图片转换失败'); }, 'image/png');
          }catch(e){ toast('图片下载失败'); }
        };
        im.onerror = ()=>toast('图片解码失败，无法下载');
        im.src = src;
      }catch(e){ toast('图片下载失败：' + (e && e.message ? e.message : e)); }
    })();
    return;
  }
  const dataUrl = src;
  const mime = (/^data:([^;,]+)/.exec(dataUrl) || [])[1] || 'image/png';
  const ext = ivExtOf(dataUrl, mime);
  if(ext === 'jpg' || ext === 'png'){
    /* jpg / png 直接转 Blob，不经 canvas → 无损、保留原始分辨率 */
    try{
      const b64 = dataUrl.split(',')[1] || '';
      const bin = atob(b64);
      const u8 = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
      /* 用 Uint8Array → Blob，绝不加 BOM */
      finish(new Blob([u8], {type: mime}), ext);
      return;
    }catch(e){ /* 落到 canvas 路径 */ }
  }
  /* 其他格式（gif/webp/bmp…）→ canvas 重绘为 PNG */
  const im = new Image();
  im.onload = ()=>{
    try{
      const cv = document.createElement('canvas');
      cv.width = im.naturalWidth || im.width;
      cv.height = im.naturalHeight || im.height;
      cv.getContext('2d').drawImage(im, 0, 0);
      cv.toBlob(b=>{ if(b) finish(b, 'png'); else toast('图片转换失败'); }, 'image/png');
    }catch(e){ toast('图片下载失败'); }
  };
  im.onerror = ()=>toast('图片解码失败，无法下载');
  im.src = dataUrl;
}

function bindImgViewer(){
  const v = $('#imgViewer');
  if(!v || v.__bound) return;
  v.__bound = true;
  const stage = $('#ivStage');
  const img = $('#ivImg');

  /* —— 工具栏 —— */
  $('#ivClose').addEventListener('click', ivCloseViewer);
  $('#ivPrev').addEventListener('click', e=>{ e.stopPropagation(); ivGoto(IV.idx - 1); });
  $('#ivNext').addEventListener('click', e=>{ e.stopPropagation(); ivGoto(IV.idx + 1); });
  $('#ivIn').addEventListener('click', e=>{ e.stopPropagation(); ivZoom(1.25); });
  $('#ivOut').addEventListener('click', e=>{ e.stopPropagation(); ivZoom(1/1.25); });
  $('#ivReset').addEventListener('click', e=>{ e.stopPropagation(); ivReset(); });
  $('#ivDl').addEventListener('click', e=>{ e.stopPropagation(); ivDownload(); });

  /* 点遮罩（非图片、非工具栏）关闭 */
  v.addEventListener('click', e=>{
    if(e.target === v || e.target === stage) ivCloseViewer();
  });

  /* —— 滚轮缩放（以鼠标位置为锚点） —— */
  stage.addEventListener('wheel', e=>{
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    const cx = e.clientX - (r.left + r.width/2);
    const cy = e.clientY - (r.top + r.height/2);
    ivZoom(e.deltaY > 0 ? 0.9 : 1.1, cx, cy);
  }, {passive:false});

  /* —— 双击切换 1x / 2x —— */
  stage.addEventListener('dblclick', e=>{
    if(e.target !== img) return;
    if(IV.scale > 1.05) ivReset();
    else { const r = stage.getBoundingClientRect();
      ivZoom(2, e.clientX - (r.left+r.width/2), e.clientY - (r.top+r.height/2)); }
  });

  /* —— 鼠标拖拽平移 —— */
  stage.addEventListener('mousedown', e=>{
    if(e.target !== img) return;
    IV.dragging = true; IV.sx = e.clientX - IV.tx; IV.sy = e.clientY - IV.ty;
    stage.classList.add('dragging');
    e.preventDefault();
  });
  window.addEventListener('mousemove', e=>{
    if(!IV.dragging) return;
    IV.tx = e.clientX - IV.sx; IV.ty = e.clientY - IV.sy;
    ivApply();
  });
  window.addEventListener('mouseup', ()=>{
    if(!IV.dragging) return;
    IV.dragging = false; stage.classList.remove('dragging');
  });

  /* —— 触摸：单指平移 / 双指缩放 —— */
  stage.addEventListener('touchstart', e=>{
    if(e.touches.length === 1){
      IV.dragging = true; IV.sx = e.touches[0].clientX - IV.tx; IV.sy = e.touches[0].clientY - IV.ty;
    } else if(e.touches.length === 2){
      IV.dragging = false;
      IV.pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                                e.touches[0].clientY - e.touches[1].clientY);
      IV.pinchScale = IV.scale;
    }
  }, {passive:true});
  stage.addEventListener('touchmove', e=>{
    if(e.touches.length === 1 && IV.dragging){
      IV.tx = e.touches[0].clientX - IV.sx; IV.ty = e.touches[0].clientY - IV.sy;
      ivApply(); e.preventDefault();
    } else if(e.touches.length === 2 && IV.pinchDist){
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                           e.touches[0].clientY - e.touches[1].clientY);
      const next = Math.max(IV_MIN, Math.min(IV_MAX, IV.pinchScale * (d / IV.pinchDist)));
      IV.scale = next; ivApply(); e.preventDefault();
    }
  }, {passive:false});
  stage.addEventListener('touchend', ()=>{ IV.dragging = false; IV.pinchDist = 0; });

  /* —— ESC 关闭 —— */
  window.addEventListener('keydown', e=>{
    if(e.key === 'Escape' && $('#imgViewer').classList.contains('show')) ivCloseViewer();
    if(!$('#imgViewer').classList.contains('show')) return;
    if(e.key === 'ArrowLeft') ivGoto(IV.idx - 1);
    if(e.key === 'ArrowRight') ivGoto(IV.idx + 1);
    if(e.key === '=' || e.key === '+') ivZoom(1.25);
    if(e.key === '-') ivZoom(1/1.25);
  });
}

/* 全局事件委托：点击任意 img.qimg 打开浮层
   （收集箱 / 全部错题 / 沉浸式复习三处渲染均自动生效） */
document.addEventListener('click', e=>{
  const img = e.target && e.target.closest ? e.target.closest('img.qimg') : null;
  if(!img) return;
  /* 编辑器里的预览图不算（避免与编辑交互冲突） */
  if(img.closest && img.closest('#mBody')) return;
  e.preventDefault();
  e.stopPropagation();
  bindImgViewer();
  const g = ivCollectGroup(img);
  ivOpen(g.list, g.idx);
}, true);

    '<div class="field"><label>题目图片（可多选，同时支持文字+图片）</label>'+
      '<div id="wImgPreview">'+(imgArr.length ? imgArr.map((s,idx)=>'<div style="margin-bottom:8px;"><img src="'+s+'" style="max-width:100%;max-height:200px;border-radius:12px;display:block;"><button type="button" class="btn sm danger" data-imgdel="'+idx+'" style="margin-top:4px;">删除第 '+(idx+1)+' 张</button></div>').join('') : '<div style="color:var(--text3);font-size:var(--fs-btn);">未上传</div>')+'</div>'+
      '<input type="file" accept="image/*" id="wImg" class="inp" multiple style="padding:7px;margin-top:6px;"></div>'+
    '<div class="field"><label>正确答案</label>'+
      '<div class="opt-group" id="rightOpts">'+ansOpts.map(o=>'<button type="button" class="opt-btn'+(rightP.opts.includes(o)?' on':'')+'" data-opt="'+o+'">'+o+'</button>').join('')+'<button type="button" class="opt-btn'+(rightP.other?' on':'')+'" data-opt="其它">其它</button></div>'+
      '<input class="inp" id="rightOther" placeholder="其它答案，可手动输入文本" value="'+esc(rightP.other)+'" style="margin-top:6px;'+(rightP.other?'':'display:none;')+'"></div>'+
    '<div class="field"><label>前次错选</label>'+
      '<div class="opt-group" id="prevOpts">'+ansOpts.map(o=>'<button type="button" class="opt-btn'+(prevP.opts.includes(o)?' on':'')+'" data-opt="'+o+'">'+o+'</button>').join('')+'<button type="button" class="opt-btn'+(prevP.other?' on':'')+'" data-opt="其它">其它</button></div>'+
      '<input class="inp" id="prevOther" placeholder="其它选项，可手动输入文本" value="'+esc(prevP.other)+'" style="margin-top:6px;'+(prevP.other?'':'display:none;')+'"></div>'+
    '<div class="field"><label>解析</label><textarea class="ta" id="wExp" placeholder="解析内容">'+esc(w ? (w.exp||'') : '')+'</textarea></div>'+
    '<div class="field"><label>解析图片（可多选，同时支持文字+图片）</label>'+
      '<div id="wExpPreview">'+(expImgArr.length ? expImgArr.map((s,idx)=>'<div style="margin-bottom:8px;"><img src="'+s+'" style="max-width:100%;max-height:200px;border-radius:12px;display:block;"><button type="button" class="btn sm danger" data-expimgdel="'+idx+'" style="margin-top:4px;">删除第 '+(idx+1)+' 张</button></div>').join('') : '<div style="color:var(--text3);font-size:var(--fs-btn);">未上传</div>')+'</div>'+
      '<input type="file" accept="image/*" id="wExpImg" class="inp" multiple style="padding:7px;margin-top:6px;"></div>'+
    '<div class="field"><label>来源</label>'+
      '<input class="inp" id="wSource" value="'+esc(w ? (w.source||'') : '')+'" placeholder="如：粉笔模考 / 华图在线">'+
      '<div class="chip-list" id="sourceChips" style="display:none;">'+(historySources.length ? historySources.map(r=>'<span class="chip-item"><button type="button" class="sel" data-r="'+esc(r)+'">'+esc(r)+'</button><button type="button" class="rm" data-rm-source="'+esc(r)+'">×</button></span>').join('') : '<span style="color:var(--text3);font-size:calc(var(--fs-btn)-2px);">暂无历史</span>')+'</div>'+
      '<button type="button" class="btn ghost sm" id="sourceToggle" style="margin-top:6px;">'+icon('search',10)+' 历史来源</button></div>'+
    '<div class="field"><label>错题类型</label><select class="sel" id="wWrongType">'+typeOpts+'</select></div>'+
    '<div class="field"><label>错因（点击标签选择历史）</label>'+
      '<input class="inp" id="wReason" value="'+esc(w ? (w.reason||'') : '')+'" placeholder="如：粗心 / 知识点不熟">'+
      '<div class="chip-list" id="reasonChips" style="display:none;">'+(historyReasons.length ? historyReasons.map(r=>'<span class="chip-item"><button type="button" class="sel" data-r="'+esc(r)+'">'+esc(r)+'</button><button type="button" class="rm" data-rm-reason="'+esc(r)+'">×</button></span>').join('') : '<span style="color:var(--text3);font-size:calc(var(--fs-btn)-2px);">暂无历史</span>')+'</div>'+
      '<button type="button" class="btn ghost sm" id="reasonToggle" style="margin-top:6px;">'+icon('search',10)+' 历史错因</button></div>'+
    '<div class="field"><label>标签（逗号分隔，点击标签选择历史）</label>'+
      '<input class="inp" id="wTags" value="'+esc(w ? (w.tags||[]).join(',') : '')+'" placeholder="如：资料分析,增长率">'+
      '<div class="chip-list" id="tagChips" style="display:none;">'+(historyTags.length ? historyTags.map(t=>'<span class="chip-item"><button type="button" class="sel" data-t="'+esc(t)+'">'+esc(t)+'</button><button type="button" class="rm" data-rm-tag="'+esc(t)+'">×</button></span>').join('') : '<span style="color:var(--text3);font-size:calc(var(--fs-btn)-2px);">暂无历史</span>')+'</div>'+
      '<button type="button" class="btn ghost sm" id="tagToggle" style="margin-top:6px;">'+icon('search',10)+' 历史标签</button></div>';

  openModal((isNew?'＋ 添加错题':'✏️ 编辑错题'), body,
    [
      {text: isNew ? '保存' : '保存修改', primary:true, onClick:()=>{
        const q = ($('#wQ').value||'').trim();
        if(!q && !imgArr.length){ toast('请输入题目内容或上传图片'); return false; }
        function buildAns(sel, other){
          const opts = [];
          $$('#'+sel+' .opt-btn.on').forEach(b=>{ if(b.dataset.opt!=='其它') opts.push(b.dataset.opt); });
          const hasOther = $$('#'+sel+' .opt-btn.on').some(b=>b.dataset.opt==='其它');
          let str = opts.join('、');
          if(hasOther && other) str += (str?'、':'')+'其它：'+other;
          else if(hasOther) str += (str?'、':'')+'其它';
          return str;
        }
        const data = {
          q,
          cat: $('#wCat').value,
          reason: ($('#wReason').value||'').trim(),
          right: buildAns('rightOpts', $('#rightOther').value.trim()),
          prev:  buildAns('prevOpts',  $('#prevOther').value.trim()),
          tags: ($('#wTags').value||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean),
          exp: ($('#wExp').value||'').trim(),
          source: ($('#wSource').value||'').trim(),
          wrongType: $('#wWrongType').value,
          date: w ? w.date : todayStr(),
          ts: w ? w.ts : Date.now()
        };
        // 加入历史
        data.tags.forEach(t=>pushHistory('historyTags', t));
        pushHistory('historyReasons', data.reason);
        pushHistory('historySources', data.source);
        pushHistory('historyWrongTypes', data.wrongType);

        /* 【P1 铁律 4：先写新、验证、再删旧】
           图片先在 IDB 里落好并拿到 id，再更新 S 的引用；
           IDB 写入失败时 → 本次保存整体取消，S 保持原样（不产生半新半旧）。 */
        const finish = (imgIdList, expIdList) => {
          const payload = Object.assign({}, data, {
            imgIds: imgIdList, imgId: imgIdList[0] || '',
            expImgIds: expIdList, expImgId: expIdList[0] || ''
          });
          if(isNew){
            S.wrong.push(Object.assign({
              id: uid(),
              reviewCount:0, rightCount:0, wrongCount:0, vagueCount:0,
              favorite:false, vagueNext:''
            }, payload));
            save(true); toast('已添加到收集箱 📥');
          } else {
            Object.assign(w, payload);
            /* 引用已切换到 id 结构 → 清掉旧 base64 字段，避免双份占空间 */
            delete w.imgs; delete w.img; delete w.expImgs; delete w.expImg;
            save(true); toast('已保存修改 ✓');
          }
          if(onSaved) onSaved();
          renderPage();
        };

        // 复用已存在的 id：原 id 列表与当前 base64 数量一致且未改动时直接沿用，省一次写库
        const reuse = (oldIds, arr) => (oldIds.length === arr.length) ? oldIds.slice() : null;
        const rImg = imgRefIsId ? reuse(imgIds, imgArr) : null;
        const rExp = imgRefIsId ? reuse(expImgIds, expImgArr) : null;

        Promise.resolve()
          .then(async ()=>{
            let imgIdList, expIdList;
            if(rImg) imgIdList = rImg;
            else imgIdList = imgArr.length ? await imgStore.putMany(imgArr.map(b=>({base64OrBlob:b}))) : [];
            if(rExp) expIdList = rExp;
            else expIdList = expImgArr.length ? await imgStore.putMany(expImgArr.map(b=>({base64OrBlob:b}))) : [];
            // 回读校验（铁律 6）
            if(imgIdList.length){
              const m = await imgStore.getMany(imgIdList);
              if(m.size !== imgIdList.length) throw new Error('题目图片写入校验未通过');
            }
            if(expIdList.length){
              const m = await imgStore.getMany(expIdList);
              if(m.size !== expIdList.length) throw new Error('解析图片写入校验未通过');
            }
            return { imgIdList, expIdList };
          })
          .then(({imgIdList, expIdList})=>{
            finish(imgIdList, expIdList);
          })
          .catch(err=>{
            console.error('[错题保存] 图片入库失败', err);
            openModal('⚠️ 保存失败', '<p style="line-height:1.9">图片保存到本地图片库时出错，<b>本次保存已取消</b>。</p>'
              + '<p style="line-height:1.9;color:var(--muted)">' + esc(err && err.message ? err.message : String(err)) + '<br>'
              + '你的错题内容未做任何修改，可稍后重试或减少图片数量。</p>', [
              { text:'我知道了', primary:true }
            ]);
          });
      }},
      {text:'取消'}
    ]);

  setTimeout(()=>{
    /* 【P1】若图片以 ID 形式存储，异步读回 base64 供预览（编辑器内部统一用 base64）。
       注意 renderImgPreview/renderExpImgPreview 是下面用 function 声明的，
       函数声明提升到本作用域顶部，这里可以安全调用。 */
    if(imgRefIsId){
      (async ()=>{
        try{
          const map = await imgStore.getMany(imgIds.concat(expImgIds));
          const toB64 = async ids => {
            const out = [];
            for(const id of ids){
              const rec = map.get(id);
              if(!rec || !rec.blob) continue;
              try{ out.push(await blobToDataUrl(rec.blob)); }catch(e){ console.warn('图片读取失败', id, e); }
            }
            return out;
          };
          const q  = await toB64(imgIds);
          const ex = await toB64(expImgIds);
          /* 仅当用户尚未改动列表（数量一致）时替换，避免覆盖用户刚添加的图片 */
          if(q.length === imgIds.length)  { imgArr = q;  renderImgPreview(); }
          if(ex.length === expImgIds.length){ expImgArr = ex; renderExpImgPreview(); }

      let pending = files.length;
      files.forEach(f=>{
        if(f.size > 4*1024*1024){ toast('「'+f.name+'」超过 4MB，已跳过'); pending--; return; }
        const r = new FileReader();
        r.onload = e => { imgArr.push(e.target.result); pending--; if(pending===0) renderImgPreview(); };
        r.onerror = () => { pending--; if(pending===0) renderImgPreview(); };
        r.readAsDataURL(f);
      });
      fi.value = '';
    });
    if(fe) fe.addEventListener('change', ()=>{
      const files = Array.from(fe.files||[]);
      if(!files.length) return;
      let pending = files.length;
      files.forEach(f=>{
        if(f.size > 4*1024*1024){ toast('「'+f.name+'」超过 4MB，已跳过'); pending--; return; }
        const r = new FileReader();
        r.onload = e => { expImgArr.push(e.target.result); pending--; if(pending===0) renderExpImgPreview(); };
        r.onerror = () => { pending--; if(pending===0) renderExpImgPreview(); };
        r.readAsDataURL(f);
      });
      fe.value = '';
    });
  }, 60);
}

/* ============================================================
   导入：Excel / Word（含 WPS 嵌入单元格图片 DISPIMG + drawing 浮动图片）
   ============================================================ */
/* ============================================================
   【P2+】导入预检 + 断点续传
   ------------------------------------------------------------
   为什么需要：
     · 大文件（几十 MB、上百张图）解析时浏览器可能直接崩，
       必须先预检体积与图片数，让用户知道风险并确认。
     · 导入中途失败（关页面/卡死）后，用户不希望从头再来
       （铁律 9：分批操作必须保留进度，可断点续做）。
   ============================================================ */

/* 文件指纹：文件名 + 大小 + 修改时间 → 稳定哈希（用于断点续传识别同一文件） */
function fileFingerprint(file){
  const raw = (file.name || '') + '|' + (file.size || 0) + '|' + (file.lastModified || 0);
  let h = 5381;
  for(let i=0;i<raw.length;i++) h = ((h << 5) + h + raw.charCodeAt(i)) >>> 0;
  return 'fp_' + h.toString(36) + '_' + (file.size || 0).toString(36);
}

/* 导入前预检：返回 Promise<boolean>（true=继续导入） */
async function preImportCheck(file){
  const sizeMB = file.size / 1048576;
  // 图片数粗估：Excel/Word 中图片普遍 ≥ 200KB/张（保守下限）
  const estImgs = Math.round(file.size / (300*1024));
  let quotaTxt = '';
  let quotaWarn = false;
  try{
    if(navigator.storage && navigator.storage.estimate){
      const est = await navigator.storage.estimate();
      const usageMB = (est.usage || 0) / 1048576;
      const quotaMB = (est.quota || 0) / 1048576;
      quotaTxt = '浏览器可用存储：已用 ' + usageMB.toFixed(1) + ' MB / 配额 ' + quotaMB.toFixed(0) + ' MB';
      if(quotaMB > 0 && est.usage / est.quota > 0.8){ quotaWarn = true; }
    }
  }catch(e){ console.warn('[导入预检] 配额查询失败', e); }

  const lsInfo = storageUsageInfo();
  const rows = [
    ['文件', esc(file.name)],
    ['大小', sizeMB.toFixed(2) + ' MB'],
    ['预估图片数', '约 ' + estImgs + ' 张'],
    ['本机存储占用', (lsInfo.used/1048576).toFixed(2) + ' MB（' + lsInfo.pct + '%）'],
  ];
  if(quotaTxt) rows.push(['浏览器存储', quotaTxt]);

  let warnHtml = '';
  if(sizeMB > 60){
    warnHtml = '<p style="line-height:1.9;color:var(--coral,#e05c5c)">⚠️ 文件较大，解析时浏览器内存占用会明显上升。'
      + '若解析失败，请用 Excel 把文件拆成几个小文件后分别导入。</p>';
  }
  if(quotaWarn){
    warnHtml += '<p style="line-height:1.9;color:var(--coral,#e05c5c)">⚠️ 浏览器存储空间已接近上限，建议先导出备份并清理数据。</p>';
  }

  return await new Promise(resolve=>{
    openModal('📥 导入前确认',
      '<table style="width:100%;border-collapse:collapse;font-size:var(--fs-body);line-height:2;">'
      + rows.map(r=>'<tr><td style="color:var(--muted);width:110px;">' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('')
      + '</table>'
      + '<div style="margin-top:10px;">' + warnHtml + '</div>'
      + '<p style="line-height:1.9;color:var(--muted);font-size:calc(var(--fs-btn) - 2px);">导入会以「追加」方式合并（按题目内容去重），不会覆盖你现有的错题。若导入中断，可对同一文件重新导入并从上次位置继续。</p>', [
      { text:'开始导入', primary:true, onClick:()=>{ resolve(true); } },
      { text:'取消', onClick:()=>{ resolve(false); } }
    ]);
  });
}

/* 断点续传：读取/写入进度（存 S._importProgress，随 S 落盘） */
function importProgressGet(fp){
  const p = S && S._importProgress;
  if(!p || p.hash !== fp) return null;
  if(Date.now() - (p.ts || 0) > 48*3600*1000) return null;   // 超过 48 小时视为过期
  return p;
}
function importProgressSet(fp, stage, done, total){
  if(!S) return;
  S._importProgress = { hash: fp, stage, done, total, ts: Date.now() };
  safeSaveFull();
}
function importProgressClear(){
  if(!S) return;
  S._importProgress = null;
  safeSaveFull();
}

/* 询问是否继续上次导入 */
function askResume(fp, resume){
  return new Promise(resolve=>{
    openModal('⏸ 发现未完成的导入',
      '<p style="line-height:1.95">上次导入同一个文件进行到 <b>' + resume.done + ' / ' + resume.total + '</b>（阶段：'
      + esc(resume.stage === 'parse' ? '解析' : '写入') + '）。</p>'
      + '<p style="line-height:1.95;color:var(--muted)">可以选择继续（跳过已完成部分），或从头重新导入。</p>', [
      { text:'继续导入', primary:true, onClick:()=>{ resolve('resume'); } },
      { text:'重新导入', onClick:()=>{ resolve('restart'); } },
      { text:'取消', onClick:()=>{ resolve('cancel'); } }
    ]);
  });
}

/* 文件指纹与进度的「安全包装」：自包含、容错，便于在精简环境（自动化测试沙箱）
   中独立运行。任何缺失都静默降级，绝不影响导入主流程。 */
function safeFileFingerprint(file){
  try{ return fileFingerprint(file); }
  catch(e){
    const raw = ((file && file.name) || '') + '|' + ((file && file.size) || 0);
    let h = 5381;
    for(let i=0;i<raw.length;i++) h = ((h << 5) + h + raw.charCodeAt(i)) >>> 0;
    return 'fp_' + h.toString(36);
  }
}
function safeProgressSet(fp, stage, done, total){
  try{ importProgressSet(fp, stage, done, total); }catch(e){ console.warn('[进度记录] 失败', e); }
}

async function importWrongFile(file){
  const name = file.name.toLowerCase();
  const ext = name.split('.').pop();
  if(!['xlsx','xls','docx','doc'].includes(ext)) throw new Error('仅支持 .xls / .xlsx / .doc / .docx');
  /* ① 断点续传询问 */
  const fp = fileFingerprint(file);
  const resume = importProgressGet(fp);
  let mode = 'restart';
  if(resume && resume.total > 0){
    const choice = await askResume(fp, resume);
    if(choice === 'cancel') { toast('已取消导入'); return; }
    mode = choice;
  }

  /* ② 导入前预检 */
  const go = await preImportCheck(file);
  if(!go) { toast('已取消导入'); return; }

  importProgressSet(fp, 'parse', 0, 0);
  try{
    if(ext === 'xlsx' || ext === 'xls') return await importFromExcel(file, { fp, resume: mode === 'resume' ? resume : null });
    if(ext === 'docx') return await importFromDocx(file, { fp, resume: mode === 'resume' ? resume : null });
    if(ext === 'doc')  return await importFromDoc(file, { fp, resume: mode === 'resume' ? resume : null });
  }catch(err){
    /* 解析失败降级：给出具体原因 + 诊断信息下载入口 */
    console.error('[导入] 失败', err);
    const sizeMB = (file.size/1048576).toFixed(2);
    openModal('⚠️ 导入失败', '<p style="line-height:1.9">文件解析失败，<b>现有数据未受任何影响</b>。</p>'
      + '<p style="line-height:1.9;color:var(--muted)">文件：' + esc(file.name) + '（' + sizeMB + ' MB）<br>'
      + '原因：' + esc(err && err.message ? err.message : String(err)) + '</p>'
      + '<p style="line-height:1.9;color:var(--muted)">若是文件过大导致浏览器解析上限，建议用 Excel 拆分为多个小文件后分别导入。</p>', [
      { text:'下载诊断信息', onClick:()=>{ downloadImportDiag(file, err); return false; } },
      { text:'我知道了', primary:true }
    ]);
  }
}

/* 导出导入失败诊断信息（.txt），便于排查 */
function downloadImportDiag(file, err){
  try{
    const lines = [
      '导入失败诊断信息',
      '时间：' + new Date().toLocaleString('zh-CN'),
      '文件名：' + (file && file.name),
      '文件大小：' + (file && file.size) + ' 字节（' + ((file.size||0)/1048576).toFixed(2) + ' MB）',
      '最后修改：' + (file && file.lastModified ? new Date(file.lastModified).toLocaleString('zh-CN') : '未知'),
      '浏览器：' + navigator.userAgent,
      '错误信息：' + (err && err.message ? err.message : String(err)),
      '错误堆栈：' + (err && err.stack ? err.stack : '（无）'),
      '本机存储占用：' + (storageUsage()/1048576).toFixed(2) + ' MB',
    ];
    downloadBlob(lines.join('\r\n'), '导入失败诊断_' + todayStr() + '.txt', 'text/plain;charset=utf-8');
    toast('已下载诊断信息');
  }catch(e){
    console.error('[下载诊断] 失败', e);
    toast('下载失败');
  }
}

function guessColumn(headers, keys){
  for(let i=0;i<headers.length;i++){
    const h = String(headers[i]||'').trim();
    for(const k of keys) if(h.indexOf(k) >= 0) return i;
  }
  return -1;
}

async function importFromExcel(file, opt){
  const _opt = opt || {};
  await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
  if(typeof XLSX === 'undefined') throw new Error('Excel 解析库加载失败，请检查网络');
  const buf = await file.arrayBuffer();

  // ---------- 从 xlsx 内提取图片 ----------
  let drawingImages = {};   // rowIdx -> dataUrl（drawing 浮动图片）
  let cellImages = {};      // DISPIMG id -> dataUrl（WPS 单元格嵌入图片）
  let sheetCellMap = {};    // 单元格引用（如 "B2"）-> DISPIMG id

  try{
    if(typeof JSZip !== 'undefined'){
      const zip = await JSZip.loadAsync(buf);

      /* 解析关系 Target → zip 内真实路径。
         兼容三种写法：
           · "../media/image1.png"  （相对 drawing 目录，Excel 常见）
           · "/xl/media/image1.png"  （根绝对路径，WPS/openpyxl 常见）
           · "media/image1.png" / "image1.png"（无前缀）
         baseDir 为关系文件所在目录（如 "xl/drawings/"）。
         修复前只 strip "../"，遇到绝对路径会拼成 "xl//xl/media/…" 导致图片丢失。 */
      const resolveZipPath = (baseDir, target)=>{
        let t = String(target||'').replace(/\\/g,'/').trim();
        if(!t) return '';
        if(t.charAt(0) === '/') return t.replace(/^\/+/,'');   // 绝对路径：直接去根斜杠
        if(/^[a-zA-Z]+:/.test(t)) return t.replace(/^[a-zA-Z]+:/,'').replace(/^\/+/,'');
        // 相对路径：与 baseDir 拼接后做 ".." 归一化
        const parts = (baseDir + t).split('/');
        const stack = [];
        for(const seg of parts){
          if(seg === '' || seg === '.') continue;
          if(seg === '..'){ stack.pop(); continue; }
          stack.push(seg);
        }
        return stack.join('/');
      };
      /* 在一组候选路径中返回 zip 里真实存在的文件。
         兜底策略：若候选路径都命中不了，则按文件名（basename）在
         xl/media 下唯一匹配——兼容各类工具对 Target 前缀写法的不一致。 */
      const allZipNames = Object.keys(zip.files);
      const findZipFile = (baseDir, target)=>{
        const cands = [
          resolveZipPath(baseDir, target),
          resolveZipPath('xl/', target),
          resolveZipPath('', target),
          resolveZipPath('xl/drawings/', target),
          resolveZipPath('xl/media/', target)
        ];
        for(const c of cands){ if(c && zip.file(c)) return zip.file(c); }
        // basename 兜底
        const base = String(target||'').replace(/\\/g,'/').split('/').pop();
        if(base){
          const hits = allZipNames.filter(n=>{
            const seg = n.split('/').pop();
            return seg === base && /(^|\/)media\//.test(n);
          });
          if(hits.length === 1) return zip.file(hits[0]);
          if(hits.length > 1){
            const mediaHits = hits.filter(n=>n.indexOf('xl/media/') === 0);
            if(mediaHits.length) return zip.file(mediaHits[0]);
            return zip.file(hits[0]);
          }
        }
        return null;
      };
      /* 按扩展名推断 MIME，生成规范的 data:image/... URI。
         修复前用 readAsDataURL(blob)，blob 无 type → 得到
         "data:application/octet-stream;base64,…"，导致导出端 imgDims
         因不是 data:image/* 而拒绝解析 → 图片导出丢失。 */
      const MIME_BY_EXT = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg',
        gif:'image/gif', bmp:'image/bmp', webp:'image/webp',
        emf:'image/emf', wmf:'image/wmf', tif:'image/tiff', tiff:'image/tiff', svg:'image/svg+xml' };
      const fileToDataUrl = async (zipEntry, pathHint)=>{
        const u8 = await zipEntry.async('uint8array');
        let m = 0;
        for(let i=0;i<u8.length;i++){ m = (m*31 + u8[i])>>>0; }
        let bin = '';
        const CH = 0x8000;
        for(let i=0;i<u8.length;i+=CH){ bin += String.fromCharCode.apply(null, u8.subarray(i, i+CH)); }
        const b64 = btoa(bin);
        let ext = '';
        const pm = /\.([a-zA-Z0-9]+)$/.exec(pathHint || '');
        if(pm) ext = pm[1].toLowerCase();
        if(!ext){
          if(u8[0]===0x89 && u8[1]===0x50) ext='png';
          else if(u8[0]===0xFF && u8[1]===0xD8) ext='jpg';
          else if(u8[0]===0x47 && u8[1]===0x49) ext='gif';
          else if(u8[0]===0x42 && u8[1]===0x4D) ext='bmp';
          else ext='png';
        }
        const mime = MIME_BY_EXT[ext] || 'image/png';
        return 'data:'+mime+';base64,'+b64;
      };

      // (1) WPS 单元格嵌入图片：xl/cellimages.xml + xl/_rels/cellimages.xml.rels
      try{
        const cellImgFile = zip.file('xl/cellimages.xml');
        const relsFile = zip.file('xl/_rels/cellimages.xml.rels');
        if(cellImgFile && relsFile){
          const relMap = {};
          const rtext = await relsFile.async('text');
          const rdoc = new DOMParser().parseFromString(rtext, 'text/xml');
          findEls(rdoc, 'Relationship').forEach(r=>{
            relMap[r.getAttribute('Id')] = r.getAttribute('Target');
          });
          const xmlText = await cellImgFile.async('text');
          const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
          const pics = findEls(doc, 'pic');
          for(const pic of pics){
            const cNvPr = findEls(pic, 'cNvPr')[0];
            const blip = findEls(pic, 'blip')[0];
            if(!cNvPr || !blip) continue;
            const id = cNvPr.getAttribute('name');
            const rid = blip.getAttribute('r:embed')
                     || blip.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','embed');
            const target = relMap[rid];
            if(!id || !target) continue;
            const mf = findZipFile('xl/', target);
            if(mf){
              cellImages[id] = await fileToDataUrl(mf, target);
            }
          }
        }
      }catch(e){ console.warn('cellimages 解析失败', e); }

      // (2) 扫描 sheet1.xml，把 DISPIMG("id",cell) 公式映射到单元格
      try{
        const sheetFile = zip.file('xl/worksheets/sheet1.xml');
        if(sheetFile && Object.keys(cellImages).length){
          const sText = await sheetFile.async('text');
          const sDoc = new DOMParser().parseFromString(sText, 'text/xml');
          const cells = findEls(sDoc, 'c');
          for(const c of cells){
            const ref = c.getAttribute('r');
            const f = findEls(c, 'f')[0];
            if(f){
              const m = f.textContent.match(/DISPIMG\(\s*"([^"]+)"/);
              if(m && cellImages[m[1]]){
                sheetCellMap[ref] = cellImages[m[1]];
              }
            }
          }
        }
      }catch(e){ console.warn('sheet cell scan 失败', e); }

      // (3) 标准 drawing XML 中的浮动图片
      try{
        const drawingFiles = Object.keys(zip.files).filter(n=>/^xl\/drawings\/drawing\d+\.xml$/.test(n));
        for(const df of drawingFiles){
          const relsPath = df.replace(/drawings\//,'drawings/_rels/') + '.rels';
          const relsFile = zip.file(relsPath);
          const localMap = {};
          if(relsFile){
            const rtext = await relsFile.async('text');
            const rdoc = new DOMParser().parseFromString(rtext, 'text/xml');
            findEls(rdoc, 'Relationship').forEach(r=>{
              localMap[r.getAttribute('Id')] = r.getAttribute('Target');
            });
          }
          const xmlText = await zip.file(df).async('text');
          const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
          const anchors = findEls(doc, 'twoCellAnchor').concat(findEls(doc, 'oneCellAnchor'));
          for(const a of anchors){
            const fromRows = findEls(a, 'row');
            const fromCols = findEls(a, 'col');
            const blips = findEls(a, 'blip');
            if(!fromRows.length || !blips.length) continue;
            const rowIdx = parseInt(fromRows[0].textContent, 10);
            const blip = blips[0];
            const rid = blip.getAttribute('r:embed')
                     || blip.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','embed');
            const target = localMap[rid];
            if(!target || isNaN(rowIdx)) continue;
            const mf = findZipFile('xl/drawings/', target);
            if(mf){
              drawingImages[rowIdx] = await fileToDataUrl(mf, target);
            }
          }
        }
      }catch(e){ console.warn('drawing 解析失败', e); }
    }
  }catch(e){ console.warn('图片提取失败', e); }

  // ---------- 解析表格内容 ----------
  const wb = XLSX.read(buf, {type:'array', cellFormula:true, cellHTML:false});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false});
  if(!rows.length) throw new Error('表格为空');

  // 找表头
  let headerIdx = 0;
  for(let i=0;i<Math.min(5, rows.length);i++){
    const r = rows[i].map(x=>String(x||''));
    if(r.some(c=>/题目|题干|内容|问题|错题/.test(c)) || r.some(c=>/板块|分类|模块/.test(c))){ headerIdx = i; break; }
  }
  const headers = rows[headerIdx].map(x=>String(x||''));
  const cQ      = guessColumn(headers, ['题目','题干','内容','问题','错题内容']);
  const cCat    = guessColumn(headers, ['板块','分类','模块']);
  const cReason = guessColumn(headers, ['错因','原因']);
  const cRight  = guessColumn(headers, ['正确答案','答案']);
  const cPrev   = guessColumn(headers, ['前次错选','错选','前次']);
  const cTags   = guessColumn(headers, ['标签']);
  const cExp    = guessColumn(headers, ['解析']);
  const cSource = guessColumn(headers, ['来源']);
  const cType   = guessColumn(headers, ['错题类型','类型']);
  const cImg    = guessColumn(headers, ['图片','图像']);

  // 根据表头起始行计算 XLSX 的列字母映射，用于匹配 DISPIMG 单元格
  const colLetter = idx => {
    let s = '';
    idx = idx + 1;
    while(idx > 0){
      const m = (idx - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      idx = Math.floor((idx - 1) / 26);
    }
    return s;
  };

  /* —— 取某行某列的图片（DISPIMG 嵌入 或 单元格内 data:image 文本）—— */
  const cellImgAt = (r, ci, excelRowNum)=>{
    if(ci < 0) return '';
    const ref = colLetter(ci) + excelRowNum;
    if(sheetCellMap[ref]) return sheetCellMap[ref];
    const v = String(r[ci]||'').trim();
    if(v.startsWith('data:image')) return v;
    const dm = v.match(/DISPIMG\("([^"]+)"/);
    if(dm && cellImages[dm[1]]) return cellImages[dm[1]];
    return '';
  };
  /* ============ 行归并预处理 ============
     导出的 Excel 中，带图题目按两行书写，顺序固定为：
       · 文字行：题目列/解析列写文字，其余列写板块/答案等
       · 图片行：紧随其后，仅题目列/解析列为 DISPIMG 公式，其余列全空
     因此这里把「图片行」并入其上一「文字行」，还原为一条逻辑行后统一解析。
     兼容旧版导出（图片行在上、文字行在下）：若上一行也是图片行则向下寻找。 */
  const isSummaryRowFor = (r)=>{
    const joined = r.map(x=>String(x||'')).join(' ');
    if(/📌|🔍/.test(joined)) return true;
    if(/本周错题汇总|薄弱点|顽固错题|复习建议/.test(joined)) return true;
    const c0 = cCat >= 0 ? String(r[cCat]||'').trim() : '';
    return c0 === '—';
  };
  const rowTxt = (rr, ci)=> (rr && ci >= 0) ? String(rr[ci]||'').trim() : '';
  const stripF = s => String(s||'').replace(/=?DISPIMG\([^)]*\)/g, '').trim();
  /* 该行是否含图片单元格（题目列或解析列） */
  const imgColOfRow = (rr, rrIdx)=>{
    if(!rr) return -1;
    for(const ci of [cQ, cExp]){
      if(ci < 0) continue;
      const s = rowTxt(rr, ci);
      if(/DISPIMG\(/.test(s)) return ci;
      if(sheetCellMap[colLetter(ci) + (rrIdx+1)]) return ci;
    }
    return -1;
  };
  /* 该行是否有可读主文字 */
  const mainHasText = (rr)=>{
    if(!rr) return false;
    const q3 = stripF(cQ>=0 ? rowTxt(rr,cQ) : '');
    const e3 = stripF(cExp>=0 ? rowTxt(rr,cExp) : '');
    const c3 = cCat>=0 ? rowTxt(rr,cCat) : '';
    const r3 = cRight>=0 ? rowTxt(rr,cRight) : '';
    const d3 = rowTxt(rr, 1);   // 日期列
    return !!(q3 || e3 || c3 || r3 || d3);
  };

  const logicalRows = [];
  const bodyStart = headerIdx + 1;
  for(let i=bodyStart;i<rows.length;i++){
    const r = rows[i];
    if(!r || !r.length) continue;
    if(isSummaryRowFor(r)) continue;
    const isImg = imgColOfRow(r, i) >= 0;
    if(!isImg){
      // 文字行 / 普通行：直接作为一道题
      logicalRows.push({ cells:r.slice(), idx:i,
        imgQ: cQ>=0 ? cellImgAt(r, cQ, i+1) : '',
        imgE: cExp>=0 ? cellImgAt(r, cExp, i+1) : '' });
      continue;
    }
    /* 图片行：优先并入上一条逻辑行（新版布局：文字行在上一行）；
       若上一行不存在或也带图，则检查下一行（旧版布局：文字行在下一行）。 */
    const prevLR = logicalRows.length ? logicalRows[logicalRows.length-1] : null;
    const nextR  = (i+1 < rows.length) ? rows[i+1] : null;
    const nextIsText = nextR && nextR.length && !isSummaryRowFor(nextR)
                       && imgColOfRow(nextR, i+1) < 0 && mainHasText(nextR);
    const imgQv = cQ>=0 ? cellImgAt(r, cQ, i+1) : '';
    const imgEv = cExp>=0 ? cellImgAt(r, cExp, i+1) : '';
    if(prevLR && prevLR.idx === i-1 && !mainHasText(r)){
      /* 并入上一条（图片行自身无文字） */
      if(imgQv) prevLR.imgQ = imgQv;
      if(imgEv) prevLR.imgE = imgEv;
      // 图片行的非图片列若有值（旧版布局），回填给文字行
      for(let ci=0; ci<r.length; ci++){
        if(ci === cQ || ci === cExp) continue;
        const v = String(r[ci]||'').trim();
        if(v && !String(prevLR.cells[ci]||'').trim()) prevLR.cells[ci] = v;
      }
      continue;
    }
    if(nextIsText){
      /* 旧版布局：文字行在下一行 */
      const merged = rows[i+1].slice();
      for(let ci=0; ci<r.length; ci++){
        if(ci === cQ || ci === cExp) continue;
        const v = String(r[ci]||'').trim();
        if(v && !String(merged[ci]||'').trim()) merged[ci] = v;
      }
      logicalRows.push({ cells:merged, idx:i+1, imgQ:imgQv, imgE:imgEv });
      i++;   // 跳过已并入的文字行
      continue;
    }
    /* 纯图片题：本行自身成一题 */
    logicalRows.push({ cells:r.slice(), idx:i, imgQ:imgQv, imgE:imgEv });
  }

  const parsed = [];
  for(const lr of logicalRows){
    const r = lr.cells;
    const excelRowNum = lr.idx + 1;
    let q   = cQ   >= 0 ? String(r[cQ]  ||'').trim() : '';
    let exp = cExp >= 0 ? String(r[cExp]||'').trim() : '';
    q   = q.replace(/=?DISPIMG\([^)]*\)/g, '').trim();
    exp = exp.replace(/=?DISPIMG\([^)]*\)/g, '').trim();
    let img    = cQ   >= 0 ? (cellImgAt(r, cQ,   excelRowNum) || '') : '';
    let expImg = cExp >= 0 ? (cellImgAt(r, cExp, excelRowNum) || '') : '';
    if(lr.imgQ) img = lr.imgQ;
    if(lr.imgE) expImg = lr.imgE;
    // 兼容「图片」专列
    if(!img && cImg >= 0) img = cellImgAt(r, cImg, excelRowNum) || '';
    // 兜底：标准 drawing 浮动图片按行号匹配（内容图）
    if(!img && drawingImages[lr.idx]) img = drawingImages[lr.idx];

    if(!q && !img && !expImg) continue;
    parsed.push({
      q, img, expImg,
      cat: (cCat >= 0 ? String(r[cCat]||'').trim() : '') || '政治理论',
      reason: cReason >= 0 ? String(r[cReason]||'').trim() : '',
      right: cRight >= 0 ? String(r[cRight]||'').trim() : '',
      prev: cPrev >= 0 ? String(r[cPrev]||'').trim() : '',
      tags: cTags >= 0 ? String(r[cTags]||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean) : [],
      exp,
      source: cSource >= 0 ? String(r[cSource]||'').trim() : '',
      wrongType: cType >= 0 ? String(r[cType]||'').trim() : ''
    });
  }

  if(!parsed.length) throw new Error('未识别到有效错题数据，请检查表头（至少包含“板块”或“错题内容”）');
  /* 进度记录（内联防御：在精简环境中缺失相关函数时静默跳过，不影响解析） */
  try{ if(typeof importProgressSet === 'function'){ let _fp = _opt.fp || ''; if(!_fp && typeof safeFileFingerprint === 'function') _fp = safeFileFingerprint(file); importProgressSet(_fp, 'parse', parsed.length, parsed.length); } }catch(e){}
  showImportPreview(parsed, 'Excel', null, { fp: _opt.fp || (typeof safeFileFingerprint === 'function' ? safeFileFingerprint(file) : '') });
}

/* ============================================================
   修改轮6：Word 模板解析
   ------------------------------------------------------------
   模板规则（HTML 按以下规则识别字段分类）：
     每道题由 9 个「【字段】」区块构成，字段名外可加【】或[]，后可带冒号。
       【错题内容】必填  【正确答案】【前次错选】【错误原因】【错题类型】
       【来源】【标签】【解析】【个人备注】选填
     出现新的「【错题内容】」= 开始下一道题。
     连续未识别为字段的文本行 → 追加到「上一个已识别字段」。
     字段内的图片按文档流位置归属该字段 → 内容图进 imgs[]、解析图进 expImgs[]。
   ============================================================ */
const DOCX_FIELDS = [
  { key:'q',        names:['错题内容','题目','题干','题目内容','错题'] },
  { key:'right',    names:['正确答案','答案','正确选项','选对'] },
  { key:'prev',     names:['前次错选','错选','上次错选','易错选项'] },
  { key:'reason',   names:['错误原因','错因','原因','做错原因'] },
  { key:'wrongType',names:['错题类型','类型'] },
  { key:'source',   names:['来源','出处','题目来源'] },
  { key:'tags',     names:['标签','知识点','考点'] },
  { key:'exp',      names:['解析','分析','答案解析','题目解析','详解'] },
  { key:'note',     names:['个人备注','备注','笔记','小结'] }
];
/* 图例说明行特征：第二格以「必填/选填/格式/说明」开头 → 视为字段说明而非真实题目 */
function docxIsLegendRow(text){
  return /^[（(]?[必选]填|^格式[:：]|^说明[:：]|^字段名/.test(String(text||'').trim());
}
/* 由字段名查 key（容错：全角/半角括号、冒号、空格） */
function docxFieldKey(name){
  if(!name) return null;
  const n = String(name).replace(/\s+/g,'')
    .replace(/^[【\[（(]+/,'').replace(/[】\]）)]*[:：]?$/,'');
  if(!n) return null;
  for(const f of DOCX_FIELDS){
    if(f.names.indexOf(n) >= 0) return f.key;
  }
  /* 前缀/包含匹配（如「错题类型（可选）」） */
  for(const f of DOCX_FIELDS){
    for(const nm of f.names){ if(n.length >= 2 && n.indexOf(nm) === 0) return f.key; }
  }
  return null;
}
/* 匹配「【字段名】……」或「[字段名]……」或「字段名：……」 */
function docxMatchField(text){
  const s = String(text||'').trim();
  if(!s) return null;
  let m = /^([【\[][^\】\]]{1,12}[】\]])\s*[:：]?\s*([\s\S]*)$/.exec(s);
  if(m){
    const k = docxFieldKey(m[1]);
    if(k) return { key:k, rest:m[2] || '' };
  }
  m = /^([\u4e00-\u9FA5A-Za-z]{2,6})\s*[:：]\s*([\s\S]*)$/.exec(s);
  if(m){
    const k = docxFieldKey(m[1]);
    if(k) return { key:k, rest:m[2] || '' };
  }
  return null;
}
/* 从 zip 中按 media 文件名收集图片 → dataUrl（同时建立 rId → dataUrl 映射） */
async function docxCollectImages(zip, fileToDataUrl){
  const byName = {};        /* media/image1.png → dataUrl */
  const mediaFiles = Object.keys(zip.files)
    .filter(n=>/^word\/media\//.test(n) && /\.(png|jpg|jpeg|gif|bmp|webp|emf|wmf|tif|tiff)$/i.test(n))
    .sort();   /* image1, image2, image10 … 用自然序 */
  mediaFiles.sort((a,b)=>{
    const na = parseInt(/(\d+)/.exec(a.split('/').pop())?.[1] || '0', 10);
    const nb = parseInt(/(\d+)/.exec(b.split('/').pop())?.[1] || '0', 10);
    return na - nb;
  });
  for(const mf of mediaFiles){
    try{ byName[mf.replace(/^word\//,'')] = await fileToDataUrl(zip.file(mf), mf); }catch(e){}
  }
  /* rId → dataUrl（读 word/_rels/document.xml.rels） */
  const byRid = {};
  try{
    const relsEntry = zip.file('word/_rels/document.xml.rels');
    if(relsEntry){
      const rd = new DOMParser().parseFromString(await relsEntry.async('text'), 'text/xml');
      findEls(rd, 'Relationship').forEach(r=>{
        const id = r.getAttribute('Id'), tg = r.getAttribute('Target') || '';
        const name = tg.replace(/^\.\.\//,'').replace(/^\/?word\//,'');
        const hit = byName[name] || byName['media/'+name.split('/').pop()];
        if(id && hit) byRid[id] = hit;
      });
    }
  }catch(e){}
  return { byName, byRid, all: Object.keys(byName).map(k=>byName[k]) };
}
/* 按文档流（w:body 子节点顺序）展开为「块」序列：
   每块 = { text, imgs:[dataUrl] }；表格拆成多块（每格一块） */
function docxBlocks(doc, imgMap){
  const body = findEls(doc, 'body')[0] || doc.documentElement;
  const blocks = [];
  function textOf(node){ return findEls(node, 't').map(t=>t.textContent).join(''); }
  function imgsOf(node){
    const out = [];
    findEls(node, 'blip').forEach(b=>{
      const rid = b.getAttribute('r:embed')
        || b.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','embed');
      if(rid && imgMap.byRid[rid]) out.push(imgMap.byRid[rid]);
    });
    if(!out.length){
      /* 兜底：v:imagedata（旧式 VML） */
      findEls(node, 'imagedata').forEach(b=>{
        const rid = b.getAttribute('r:id')
          || b.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
        if(rid && imgMap.byRid[rid]) out.push(imgMap.byRid[rid]);
      });
    }
    return out;
  }
  function pushP(p){
    const t = textOf(p).trim();
    const im = imgsOf(p);
    if(t || im.length) blocks.push({ text:t, imgs:im });
  }
  function walk(node){
    for(const child of Array.from(node.childNodes)){
      if(child.nodeType !== 1) continue;
      const ln = child.localName;
      if(ln === 'p'){ pushP(child); }
      else if(ln === 'tbl'){
        /* 表格：逐行逐格；每格文本/图片各成一块（但保持先后顺序）
           图例行（如「错题内容 | 必填。题干正文…」）整体作为说明块跳过字段识别 */
        findEls(child, 'tr').forEach(tr=>{
          const tcs = findEls(tr, 'tc');
          const cellTexts = tcs.map(tc=>findEls(tc,'p').map(pp=>textOf(pp)).join('').trim());
          const isLegend = cellTexts.length >= 2 && docxIsLegendRow(cellTexts[1]);
          if(isLegend){
            tcs.forEach(tc=>{
              const t = findEls(tc,'p').map(pp=>textOf(pp)).join('').trim();
              if(t) blocks.push({ text:t, imgs:[], legend:true });
            });
            return;
          }
          tcs.forEach(tc=>{
            /* 单元格内可能有多个段落 */
            const ps = findEls(tc, 'p');
            if(ps.length){ ps.forEach(pp=>pushP(pp)); }
            else {
              const t = textOf(tc).trim(), im = imgsOf(tc);
              if(t || im.length) blocks.push({ text:t, imgs:im });
            }
          });
        });
      }
      else if(ln === 'sdt' || ln === 'sdtContent' || ln === 'body'){ walk(child); }
    }
  }
  walk(body);
  return blocks;
}

async function importFromDocx(file, opt){
  const _opt = opt || {};
  await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
  if(typeof JSZip === 'undefined') throw new Error('Word 解析库加载失败');
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  /* 按扩展名推断 MIME，生成规范 data:image/... URI。
     （与 Excel 导入同一修复：原 readAsDataURL(blob) 的 blob 无 type，
      会得到 data:application/octet-stream，导致导出端 imgDims 拒绝解析） */
  const MIME_BY_EXT = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg',
    gif:'image/gif', bmp:'image/bmp', webp:'image/webp' };
  const fileToDataUrl = async (zipEntry, pathHint)=>{
    const u8 = await zipEntry.async('uint8array');
    let bin = '';
    const CH = 0x8000;
    for(let i=0;i<u8.length;i+=CH){ bin += String.fromCharCode.apply(null, u8.subarray(i, i+CH)); }
    const b64 = btoa(bin);
    let ext = '';
    const pm = /\.([a-zA-Z0-9]+)$/.exec(pathHint || '');
    if(pm) ext = pm[1].toLowerCase();
    if(!ext){
      if(u8[0]===0x89 && u8[1]===0x50) ext='png';
      else if(u8[0]===0xFF && u8[1]===0xD8) ext='jpg';
      else if(u8[0]===0x47 && u8[1]===0x49) ext='gif';
      else if(u8[0]===0x42 && u8[1]===0x4D) ext='bmp';
      else ext='png';
    }
    return 'data:'+(MIME_BY_EXT[ext] || 'image/png')+';base64,'+b64;
  };
  /* 收集图片（含 rId 映射），供按文档流归属 */
  const imgMap = await docxCollectImages(zip, fileToDataUrl);
  const images = imgMap.all;

  const docFile = zip.file('word/document.xml');
  if(!docFile) throw new Error('未找到 Word 内容');
  const xmlText = await docFile.async('text');
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');

  const blocks = docxBlocks(doc, imgMap);
  const warn = [];

  /* —— 先判断是否为「模板格式」：是否出现 ≥1 个字段标记 —— */
  const hitAny = blocks.some(b=>!!docxMatchField(b.text));
  if(!hitAny){
    if(!blocks.length && !images.length) throw new Error('文档内容为空');
    /* 降级为旧行为：一段一题（保留兼容，但明确提示） */
    const lines = blocks.map(b=>b.text).filter(s=>s);
    const parsed = (lines.length ? lines : images.map(()=>'')).map((line,i)=>({
      q: line, img: (blocks[i] && blocks[i].imgs[0]) || '', cat: '政治理论',
      reason:'', right:'', prev:'', tags:[], exp:'', source:'', wrongType:'', note:'',
      imgs: (blocks[i] && blocks[i].imgs) ? blocks[i].imgs.slice() : [], expImgs: []
    }));
    if(!parsed.length) throw new Error('未识别到有效内容');
    /* 进度记录（内联防御：在精简环境中缺失相关函数时静默跳过，不影响解析） */
  try{ if(typeof importProgressSet === 'function'){ let _fp = _opt.fp || ''; if(!_fp && typeof safeFileFingerprint === 'function') _fp = safeFileFingerprint(file); importProgressSet(_fp, 'parse', parsed.length, parsed.length); } }catch(e){}
    showImportPreview(parsed, 'Word', ['未识别到模板字段标记（如【错题内容】），已按「一段一题」拆分。强烈建议点「下载 Word 模板」按模板填写后重新导入，才能正确识别每道题的各个组成部分。'], { fp: _opt.fp || (typeof safeFileFingerprint === 'function' ? safeFileFingerprint(file) : '') });
    return;
  }

  /* —— 状态机解析 —— */
  const list = [];
  let cur = null;         /* 当前题目对象 */
  let curField = null;    /* 当前字段 key（用于续行与图片归属）*/
  function newItem(){
    return { q:'', right:'', prev:'', reason:'', wrongType:'', source:'',
      tags:[], exp:'', note:'', imgs:[], expImgs:[] };
  }
  function appendText(fieldKey, text){
    if(!text) return;
    const t = String(text).trim();
    if(!t) return;
    if(fieldKey === 'tags'){
      t.split(/[、,，;；\s\/]+/).map(s=>s.trim().replace(/^#/,'')).filter(Boolean)
        .forEach(x=>{ if(cur.tags.indexOf(x) < 0) cur.tags.push(x); });
      return;
    }
    if(fieldKey === 'note'){ cur.note = cur.note ? cur.note + '\n' + t : t; return; }
    cur[fieldKey] = cur[fieldKey] ? cur[fieldKey] + '\n' + t : t;
  }
  function attachImgs(fieldKey, imgs){
    if(!imgs || !imgs.length) return;
    if(fieldKey === 'q'){ imgs.forEach(u=>cur.imgs.push(u)); }
    else if(fieldKey === 'exp'){ imgs.forEach(u=>cur.expImgs.push(u)); }
    else {
      /* 其他字段内图片：归属到「错题内容」（题目配图最常见），并提示 */
      imgs.forEach(u=>cur.imgs.push(u));
      warn.push('「' + fieldKey + '」字段内发现图片，已归入题目图片');
    }
  }
  let pendingImgs = [];   /* 尚未归属的图片（出现在字段标记之前） */
  blocks.forEach(b=>{
    const mf = docxMatchField(b.text);
    /* 图例/说明块：不参与字段识别，也不续行（避免污染题干） */
    if(b.legend && !mf){ return; }
    if(mf){
      if(mf.key === 'q'){
        /* 新题开始 */
        if(cur) list.push(cur);
        cur = newItem();
        curField = 'q';
        if(pendingImgs.length){ pendingImgs.forEach(u=>cur.imgs.push(u)); pendingImgs = []; }
        if(mf.rest) appendText('q', mf.rest);
        attachImgs('q', b.imgs);
      } else {
        if(!cur){ cur = newItem(); curField = null; }
        curField = mf.key;
        if(mf.rest) appendText(mf.key, mf.rest);
        attachImgs(mf.key, b.imgs);
      }
      return;
    }
    /* 非字段行 */
    if(!cur){ pendingImgs = pendingImgs.concat(b.imgs || []); return; }
    if(b.imgs && b.imgs.length) attachImgs(curField || 'q', b.imgs);
    if(b.text){
      /* 续行：追加到当前字段（无当前字段则视为题目内容续行） */
      appendText(curField || 'q', b.text);
    }
  });
  if(cur) list.push(cur);

  /* —— 预检 —— */
  const parsed = [];
  list.forEach((it,i)=>{
    if(!it.q && !it.imgs.length){
      warn.push('第 ' + (i+1) + ' 题缺少【错题内容】，已跳过');
      return;
    }
    parsed.push({
      q: it.q, exp: it.exp, note: it.note, cat: '政治理论',
      reason: it.reason, right: it.right, prev: it.prev,
      tags: it.tags, source: it.source, wrongType: it.wrongType,
      imgs: it.imgs.slice(), expImgs: it.expImgs.slice(),
      img: it.imgs[0] || '', expImg: it.expImgs[0] || ''
    });
  });
  if(!parsed.length) throw new Error('未识别到有效错题（请检查是否按模板填写了【错题内容】）');
  /* 进度记录（内联防御：在精简环境中缺失相关函数时静默跳过，不影响解析） */
  try{ if(typeof importProgressSet === 'function'){ let _fp = _opt.fp || ''; if(!_fp && typeof safeFileFingerprint === 'function') _fp = safeFileFingerprint(file); importProgressSet(_fp, 'parse', parsed.length, parsed.length); } }catch(e){}
  showImportPreview(parsed, 'Word', warn, { fp: _opt.fp || (typeof safeFileFingerprint === 'function' ? safeFileFingerprint(file) : '') });
}


async function importFromDoc(file, opt){
  /* 【修复 0】补上 opt 参数：函数体内 _opt.fp / safeFileFingerprint 依赖它，
     原签名只有 file → ReferenceError 被外层 try-catch 吞掉，断点续传失效。
     与 importFromExcel / importFromDocx 的调用约定保持一致。 */
  const _opt = opt || {};
  const buf = await file.arrayBuffer();
  const u8 = new Uint8Array(buf);
  let text = '';
  try{
    const u16 = new Uint16Array(buf);
    let cur = '';
    for(let i=0;i<u16.length;i++){
      const c = u16[i];
      if((c >= 0x4E00 && c <= 0x9FFF) || (c >= 0x3000 && c <= 0x303F) || (c >= 0x0020 && c <= 0x007E)) cur += String.fromCharCode(c);
      else { if(cur.length > 3) text += cur + '\n'; cur = ''; }
    }
    if(cur.length > 3) text += cur;
  }catch(e){}
  const lines = text.split('\n').map(s=>s.trim()).filter(s=>s.length > 4);
  if(!lines.length) throw new Error('旧版 .doc 解析受限，建议另存为 .docx 或 .xlsx');
  const parsed = lines.slice(0, 200).map(line=>({
    q: line, cat: '政治理论', reason: '', right: '', prev: '', tags: [], exp: '', source: '', wrongType: '', img: ''
  }));
  /* 进度记录（内联防御：在精简环境中缺失相关函数时静默跳过，不影响解析） */
  try{ if(typeof importProgressSet === 'function'){ let _fp = _opt.fp || ''; if(!_fp && typeof safeFileFingerprint === 'function') _fp = safeFileFingerprint(file); importProgressSet(_fp, 'parse', parsed.length, parsed.length); } }catch(e){}
  showImportPreview(parsed, 'Word', null, { fp: _opt.fp || (typeof safeFileFingerprint === 'function' ? safeFileFingerprint(file) : '') });
}

/* ============================================================
   修改轮6：Word 导入模板（可下载 .docx）+ 填写规范说明
   ------------------------------------------------------------
   模板完全由前端 JSZip 生成（无需外部依赖），生成后可直接在
   WPS / Word 中打开填写；填写后按「从 Excel/Word 导入」上传即可
   被 importFromDocx 按字段精确识别。
   ============================================================ */
/* 极小 PNG（1x1 透明）——仅作示例图片占位，不含真实题目内容 */
const DOCX_DEMO_PNG_B64 =
  'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';

function docxTplEscape(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
/* 生成一个段落 XML；opts: {bold, color, size(半磅), italic, indent} */
function docxTplP(text, opts){
  opts = opts || {};
  const rpr = [];
  if(opts.bold) rpr.push('<w:b/>');
  if(opts.italic) rpr.push('<w:i/>');
  if(opts.color) rpr.push('<w:color w:val="'+opts.color+'"/>');
  if(opts.size) rpr.push('<w:sz w:val="'+opts.size+'"/><w:szCs w:val="'+opts.size+'"/>');
  const r = '<w:r>'+(rpr.length ? '<w:rPr>'+rpr.join('')+'</w:rPr>' : '')+
    '<w:t xml:space="preserve">'+docxTplEscape(text)+'</w:t></w:r>';
  return '<w:p>'+
    (opts.indent ? '<w:pPr><w:ind w:firstLine="'+opts.indent+'"/></w:pPr>' : '')+
    r+'</w:p>';
}
/* 生成「字段名 + 内容」两列表格段落（避免用户改动字段名）
   注意：字段名这里用「␣」占位替代【】——模板里的「字段一览」是给人看的说明，
   若原样写【错题内容】会被解析器误当成真实题目。用户照着填写即可。 */
function docxTplTable(rows){
  const trs = rows.map(([k,v])=>(
    '<w:tr>'+
      '<w:tc><w:tcPr><w:tcW w:w="2200" w:type="dxa"/></w:tcPr>'+
        docxTplP(k, {bold:true, color:'C2185B'})+'</w:tc>'+
      '<w:tc><w:tcPr><w:tcW w:w="6400" w:type="dxa"/></w:tcPr>'+
        docxTplP(v)+'</w:tc>'+
    '</w:tr>'
  )).join('');
  return '<w:tbl><w:tblPr><w:tblBorders>'+
      ['top','left','bottom','right','insideH','insideV'].map(s=>
        '<w:'+s+' w:val="single" w:sz="4" w:color="DDCCD4"/>').join('')+
    '</w:tblBorders></w:tblPr>'+trs+'</w:tbl>';
}
/* 把【字段名】转成不被解析器识别的展示写法：`【错题内容】` → `错题内容`（加 ▸ 前缀） */
function docxTplFieldLabel(k){
  return '▸ ' + String(k).replace(/[【】\[\]]/g,'');
}
/* 示例图片段落（内嵌 1x1 PNG，用户可替换为真实截图） */
function docxTplImgP(rid, wPx, hPx){
  const EMU = 9525;
  return '<w:p><w:r><w:drawing>'+
    '<wp:inline distT="0" distB="0" distL="0" distR="0">'+
      '<wp:extent cx="'+Math.round(wPx*EMU)+'" cy="'+Math.round(hPx*EMU)+'"/>'+
      '<wp:docPr id="'+rid+'" name="示例图片'+rid+'"/>'+
      '<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">'+
        '<a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">'+
          '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">'+
            '<pic:nvPicPr><pic:cNvPr id="'+rid+'" name="示例图片'+rid+'"/><pic:cNvPicPr/></pic:nvPicPr>'+
            '<pic:blipFill><a:blip r:embed="rId'+rid+'"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>'+
            '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+Math.round(wPx*EMU)+'" cy="'+Math.round(hPx*EMU)+'"/></a:xfrm>'+
            '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>'+
          '</pic:pic>'+
        '</a:graphicData>'+
      '</a:graphic>'+
    '</wp:inline></w:drawing></w:r></w:p>';
}

    .forEach(k=>body.push(docxTplP(k, {bold:true, color:'C2185B'})));

  const docXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" '+
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" '+
    'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" '+
    'xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" '+
    'xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">'+
    '<w:body>'+body.join('')+
    '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1417"/></w:sectPr>'+
    '</w:body></w:document>';

  const docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image1.png"/>'+
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image2.png"/>'+
    '</Relationships>';

  const stylesXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'+
    '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="微软雅黑" w:eastAsia="微软雅黑" w:hAnsi="微软雅黑"/><w:sz w:val="24"/></w:rPr></w:rPrDefault></w:docDefaults>'+
    '</w:styles>';

  const docCt = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Default Extension="png" ContentType="image/png"/>'+
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'+
    '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'+
    '</Types>';

  const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'+
    '</Relationships>';

  const enc = new TextEncoder();
  /* 1x1 PNG 二进制 */
  const bin = atob(DOCX_DEMO_PNG_B64);
  const pngU8 = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) pngU8[i] = bin.charCodeAt(i);

  return makeZip([
    {name:'[Content_Types].xml', u8: enc.encode(docCt)},
    {name:'_rels/.rels', u8: enc.encode(rootRels)},
    {name:'word/document.xml', u8: enc.encode(docXml)},
    {name:'word/_rels/document.xml.rels', u8: enc.encode(docRels)},
    {name:'word/styles.xml', u8: enc.encode(stylesXml)},
    {name:'word/media/image1.png', u8: pngU8},
    {name:'word/media/image2.png', u8: pngU8}
  ]);
}
