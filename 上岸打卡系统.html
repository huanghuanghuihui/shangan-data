/* -------- 年报（需求 9(1) 新增） --------
   · 年份 / 近一年 两种模式切换；年份模式可手动选择历史以来有记录的年份
   · 板块：年报统计卡 / 学习热力图（按月，点月下钻该月每日）/ 年学习趋势（按月柱状）
           / 每月明细（12 行表）/ 进步分析（折线图）
   · 打卡天数按所选年份计算；总学习时长 = 该范围四大类全部时长                     */
PAGES['st-year'] = function(){
  const thisYear = new Date().getFullYear();
  const mode = S.stYearMode === 'rolling' ? 'rolling' : 'year';   // 'year' | 'rolling'(近一年)
  /* 可选年份 = 历史以来有记录的年份 + 今年 */
  const recordedYears = new Set([String(thisYear)]);
  Object.keys(S.boardLog || {}).forEach(b=>Object.keys(S.boardLog[b]||{}).forEach(d=>recordedYears.add(d.slice(0,4))));
  Object.keys(S.studyLog || {}).forEach(d=>recordedYears.add(d.slice(0,4)));
  const yearOpts = Array.from(recordedYears).sort().reverse();
  const selYear = (mode === 'year' && /^\d{4}$/.test(String(S.stYearSel))) ? String(S.stYearSel) : String(thisYear);

  /* 计算区间 */
  let d1, d2, rangeLabel;
  if(mode === 'rolling'){
    const e = new Date(); d2 = dstr(e);
    const s = new Date(); s.setDate(s.getDate() - 364); d1 = dstr(s);
    rangeLabel = '近一年（'+d1+' ~ '+d2+'）';
  }else{
    d1 = selYear+'-01-01';
    d2 = selYear === String(thisYear) ? dstr(new Date()) : selYear+'-12-31';
    rangeLabel = selYear+' 年';
  }
  const days = daysInRange(d1, d2);
  const agg = aggInRange(d1, d2);
  const ckDays = checkedCountInRange(d1, d2);

  /* 按月聚合（近一年模式取最近 12 个月，年份模式取 1~12 月） */
  const months = [];
  if(mode === 'rolling'){
    const cur = new Date(); cur.setDate(1);
    for(let i=0;i<12;i++){
      const y = cur.getFullYear(), m = cur.getMonth();
      const ms = y+'-'+pad2(m+1)+'-01', me = y+'-'+pad2(m+1)+'-'+pad2(new Date(y, m+1, 0).getDate());
      const a = aggInRange(ms, me);
      months.unshift({label:(m+1)+'月', y, m:m+1, key:y+'-'+pad2(m+1), q:a.q, sec:a.sec, days:a.days, ck:checkedCountInRange(ms,me), ms, me});
      cur.setMonth(cur.getMonth() - 1);
    }
  }else{
    for(let m=1;m<=12;m++){
      const ms = selYear+'-'+pad2(m)+'-01', me = selYear+'-'+pad2(m)+'-'+pad2(new Date(selYear, m, 0).getDate());
      const a = aggInRange(ms, me);
      months.push({label:m+'月', y:selYear, m, key:selYear+'-'+pad2(m), q:a.q, sec:a.sec, days:a.days, ck:checkedCountInRange(ms,me), ms, me});
    }
  }

  /* ① 年报统计卡 */
  const totalCard =
    '<div class="card">'+
      '<div class="card-title">'+titleIco('cal')+' 年报 <span class="sub">'+rangeLabel+'</span></div>'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">'+
        '<button class="btn sm '+(mode==='year'?'primary':'ghost')+'" id="yrModeYear">年份</button>'+
        '<button class="btn sm '+(mode==='rolling'?'primary':'ghost')+'" id="yrModeRoll">近一年</button>'+
        (mode==='year'
          ? '<select class="inp" id="yrSel" style="width:auto;padding:5px 10px;">'+
              yearOpts.map(y=>'<option value="'+y+'"'+(y===selYear?' selected':'')+'>'+y+' 年</option>').join('')+
            '</select>'
          : '')+
        '<span style="flex:1;"></span>'+
        '<span class="pill lav">打卡 '+ckDays+' 天</span>'+
      '</div>'+
      /* 【需求 5】与周报/月报统一的两行 statRow 布局 */
      statRow([
        {v:agg.q, k:'行测做题数'},
        {v:'--',  k:'平均正确率'},
        {v:agg.days, k:'学习天数'},
        {v:agg.days ? Math.round(agg.q/agg.days) : 0, k:'日均题量'}
      ])+
      statRow([
        {v:fmtClock(agg.sec), k:'总学习时长'},
        {v:fmtClock(agg.days ? Math.round(agg.sec/agg.days) : 0), k:'日均时长'}
      ])+
    '</div>';

  /* ② 学习热力图（需求 1）：
       · 默认按月 12 格，颜色按「本范围内月份时长的最大/最小值」综合比较着色
       · 点击某月 → 展开该月每日，按该月每日最大时长归一化着色
       · 最深色统一 #FF6961                                                   */
  const openMonth = (mode==='year' && S.stYearHeatMonth && String(S.stYearHeatMonth).slice(0,4)===selYear) ? S.stYearHeatMonth : null;
  let heatHtml;
  if(openMonth){
    const [oy, om] = openMonth.split('-').map(Number);
    const oms = oy+'-'+pad2(om)+'-01', ome = oy+'-'+pad2(om)+'-'+pad2(new Date(oy, om, 0).getDate());
    const odays = daysInRange(oms, ome);
    const omax = heatMaxOf(odays.map(d=>dayAgg(d).sec));
    heatHtml = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">'+
      '<button class="btn sm ghost" id="yrHeatBack">← 返回按月</button>'+
      '<b style="font-size:var(--fs-btn);color:var(--pinkDeep2);">'+oy+' 年 '+om+' 月 每日热力</b>'+
      '<span style="flex:1;"></span>'+
      '<button class="btn sm ghost" id="yrHeatPrevM">‹ 上个月</button>'+
      '<button class="btn sm ghost" id="yrHeatNextM">下个月 ›</button>'+
    '</div><div class="heat">';
    odays.forEach(d=>{
      const sec = dayAgg(d).sec;
      heatHtml += heatCell(sec, omax, d + (sec ? ' · '+fmtClock(sec) : ''));
    });
    heatHtml += '</div>';
  }else{
    /* 按月着色（需求 1）：不按整年的最大月做归一化，而是按本范围内
       「有记录月份」的最大值做基准，同时用最小值做下限参考，
       避免个别超长月把其它月全部压暗 / 或整体过深。 */
    const secs = months.map(x=>x.sec);
    const posSecs = secs.filter(s=>s > 0);
    const mmax = heatMaxOf(posSecs);
    /* R4：热力框单行 12 列，月份文字移到框外下方，框内只留紧凑时长值 */
    heatHtml = '<div class="yr-grid">'+
      months.map(x=>{
        const has = x.sec > 0;
        const bg = has ? heatColorOf(x.sec, mmax) : HEAT_EMPTY;
        /* #e4a1b6 为浅玫瑰底色，统一深玫瑰文字保证可读 */
        const fg = has ? '#6B3348' : 'var(--text3)';
        return '<div class="yr-col">'+
          '<div class="yr-mon'+(x.key===openMonth?' on':'')+'" data-yrmon="'+x.key+'" title="'+x.label+' · '+fmtClock(x.sec)+'（点击查看每日）" style="background:'+bg+';color:'+fg+';">'+
            '<div class="ym-v">'+(x.sec?fmtClockShort(x.sec):'—')+'</div>'+
          '</div>'+
          '<div class="yr-lb">'+x.label+'</div>'+
        '</div>';
      }).join('')+
    '</div>'+
    '<div style="font-size:calc(var(--fs-btn) - 2px);color:var(--text3);margin-top:10px;text-align:right;">点击月份可展开该月每日热力</div>';
  }

  /* ③ 年学习趋势：按月柱状 */
  const maxQ = Math.max(1, ...months.map(x=>x.q));
  const trendHtml = months.map(x=>
    '<div class="bar-wrap"><div class="bar" style="height:'+Math.round(x.q/maxQ*100)+'%" title="'+x.label+' · 做题 '+x.q+' · '+fmtClock(x.sec)+'"></div><div class="bar-lb" style="font-size:9px;">'+x.label+'</div></div>'
  ).join('');

  /* ④ 每月明细 */
  const monRows = months.map(x=>
    '<tr><td>'+x.y+' 年 '+x.m+' 月</td>'+
    '<td style="text-align:center;">'+x.q+'</td>'+
    '<td style="text-align:center;">--</td>'+
    '<td style="text-align:center;">'+fmtClock(x.sec)+'</td>'+
    '<td style="text-align:center;">'+x.days+'</td>'+
    '<td style="text-align:center;">'+x.ck+'</td></tr>'
  ).join('');

  /* ⑤ 进步分析：折线图（SVG）—— 用做题数趋势呈现（正确率暂无数据源，标注待接入） */
  const W=680, H=180, P=28;
  const vals = months.map(x=>x.q);
  const vmax = Math.max(1, ...vals);
  const stepX = vals.length > 1 ? (W - P*2)/(vals.length - 1) : 0;
  const pts = vals.map((v,i)=>[P + i*stepX, H - P - (v/vmax)*(H - P*2)]);
  const poly = pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;">'+
    '<line x1="'+P+'" y1="'+(H-P)+'" x2="'+(W-P)+'" y2="'+(H-P)+'" stroke="#E8D8DF" stroke-width="1"/>'+
    '<line x1="'+P+'" y1="'+(P/1.5)+'" x2="'+P+'" y2="'+(H-P)+'" stroke="#E8D8DF" stroke-width="1"/>'+
    '<polyline points="'+poly+'" fill="none" stroke="#EE9BB4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    pts.map((p,i)=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2" fill="#fff" stroke="#EE9BB4" stroke-width="2">'+
      '<title>'+months[i].label+'：'+vals[i]+' 题</title></circle>').join('')+
    months.map((x,i)=>{
      const show = (i % (mode==='rolling'?2:1) === 0);
      return show ? '<text x="'+pts[i][0]+'" y="'+(H-8)+'" font-size="9" fill="#B58E9E" text-anchor="middle">'+x.label+'</text>' : '';
    }).join('')+
  '</svg>';

  return {
    html:
      totalCard+
      '<div class="card">'+
        '<div class="card-title">'+titleIco('bolt')+' 学习热力图 <span class="sub">'+rangeLabel+'</span></div>'+
        heatHtml+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title">'+titleIco('clock2')+' 各板块学习时长明细 <span class="sub">'+rangeLabel+'</span></div>'+
        boardSecDetailTable(d1, d2)+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title">'+titleIco('chart')+' 年学习趋势 <span class="sub">按月</span></div>'+
        '<div class="bars">'+trendHtml+'</div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title">'+titleIco('doc')+' 每月明细 <span class="sub">'+rangeLabel+'</span></div>'+
        '<div class="tbl-wrap"><table class="tbl">'+
          '<thead><tr><th>月份</th><th style="text-align:center;">行测题数</th><th style="text-align:center;">正确率</th><th style="text-align:center;">时长</th><th style="text-align:center;">学习天数</th><th style="text-align:center;">打卡天数</th></tr></thead>'+
          '<tbody>'+monRows+'</tbody>'+
        '</table></div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title">'+titleIco('trophy')+' 进步分析 <span class="sub">按月趋势</span></div>'+
        svg+
        '<div style="font-size:calc(var(--fs-btn) - 2px);color:var(--text3);margin-top:8px;text-align:center;">折线：每月做题数趋势（正确率数据暂未接入，接入后自动替换为正确率趋势）</div>'+
      '</div>'+
      /* 【需求 6】复习进度与完成情况（年报：按月，1~12 月 / 近一年 12 个月） */
      reviewProgressCard({ d1: d1, d2: d2, total:1 }, 'month', mode === 'rolling' ? '近一年按月' : selYear+' 年按月')+
      encourageBar('st-year'),
    bind(){
      const mY = $('#yrModeYear'), mR = $('#yrModeRoll');
      if(mY) mY.addEventListener('click', ()=>{ S.stYearMode='year'; save(true); renderPage(); });
      if(mR) mR.addEventListener('click', ()=>{ S.stYearMode='rolling'; save(true); renderPage(); });
      const ys = $('#yrSel');
      if(ys) ys.addEventListener('change', ()=>{ S.stYearSel = ys.value; S.stYearHeatMonth = null; save(true); renderPage(); });
      $$('#content [data-yrmon]').forEach(el=>{
        el.addEventListener('click', ()=>{ S.stYearHeatMonth = el.dataset.yrmon; save(true); renderPageKeepScroll(); });
      });
      const back = $('#yrHeatBack');
      if(back) back.addEventListener('click', ()=>{ S.stYearHeatMonth = null; save(true); renderPageKeepScroll(); });
      const pm = $('#yrHeatPrevM'), nm = $('#yrHeatNextM');
      if(pm) pm.addEventListener('click', ()=>{
        const [oy, om] = String(S.stYearHeatMonth).split('-').map(Number);
        let y = oy, m = om - 1; if(m < 1){ m = 12; y--; }
        S.stYearHeatMonth = y+'-'+pad2(m); save(true); renderPageKeepScroll();
      });
      if(nm) nm.addEventListener('click', ()=>{
        const [oy, om] = String(S.stYearHeatMonth).split('-').map(Number);
        let y = oy, m = om + 1; if(m > 12){ m = 1; y++; }
        S.stYearHeatMonth = y+'-'+pad2(m); save(true); renderPageKeepScroll();
      });
    }
  };
};

/* -------- 总计 -------- */
PAGES['st-total'] = function(){
  /* 需求 9(4)：总计口径 = 全部记账日期（boardLog 各板块 + studyLog 兜底） */
  const daySet = new Set();
  Object.keys(S.boardLog || {}).forEach(b=>{
    Object.keys(S.boardLog[b] || {}).forEach(d=>{
      if(boardDayActive(S.boardLog[b][d])) daySet.add(d);
    });
  });
  Object.keys(S.studyLog).forEach(d=>{
    const x = S.studyLog[d];
    if(x && ((x.sec||0) > 0 || (x.q||0) > 0 || (x.sl||0) > 0)) daySet.add(d);
  });
  const allDays = Array.from(daySet).sort();

  // 趋势数据
  function buildWeekTrend(){
    if(!allDays.length) return [];
    const weeks = [];
    const first = new Date(allDays[0]);
    const firstSun = new Date(first); firstSun.setDate(first.getDate() - first.getDay());
    const cur = new Date(firstSun);
    const end = new Date(); end.setHours(0,0,0,0);
    while(cur <= end){
      const start = new Date(cur);
      let q = 0, sec = 0;
      for(let j=0;j<7;j++){
        const d = new Date(start); d.setDate(start.getDate()+j);
        const k = dstr(d);
        const ag = dayAgg(k);
        q += ag.q; sec += ag.sec;
      }
      weeks.push({label: shortDate(dstr(start)), q, sec});
      cur.setDate(cur.getDate() + 7);
    }
    return weeks;
  }
  function buildMonthTrend(){
    if(!allDays.length) return [];
    const months = [];
    const first = new Date(allDays[0]);
    const cur = new Date(first.getFullYear(), first.getMonth(), 1);
    const end = new Date(); end.setHours(0,0,0,0);
    while(cur <= end){
      const y = cur.getFullYear(), m = cur.getMonth();
      const last = new Date(y, m+1, 0);
      let q = 0, sec = 0;
      for(let dd=1; dd<=last.getDate(); dd++){
        const k = y+'-'+pad2(m+1)+'-'+pad2(dd);
        const ag = dayAgg(k);
        q += ag.q; sec += ag.sec;
      }
      months.push({label: (m+1)+'月', q, sec});
      cur.setMonth(cur.getMonth() + 1);
    }
    return months;
  }
  const weekTrend = buildWeekTrend();
  const monthTrend = buildMonthTrend();

  function heatDaysFor(mode){
    if(mode === 'year'){
      const y = new Date().getFullYear();
      const start = new Date(y,0,1);
      const out = [];
      const cur = new Date(start);
      const end = new Date();
      while(cur <= end){ out.push(dstr(cur)); cur.setDate(cur.getDate()+1); }
      return out;
    }
    if(!allDays.length) return [];
    const start = new Date(allDays[0]);
    const end = new Date();
    const out = [];
    const cur = new Date(start);
    while(cur <= end){ out.push(dstr(cur)); cur.setDate(cur.getDate()+1); }
    return out;
  }

  const detailDays = allDays.slice().reverse();
  const detailTotal = detailDays.length;
  const detailSize = S.totalDetailSize || 10;
  const detailPages = Math.max(1, Math.ceil(detailTotal / detailSize));
  let detailPage = S.totalDetailPage || 1;
  if(detailPage > detailPages) detailPage = detailPages;
  const detailSlice = detailDays.slice((detailPage-1)*detailSize, detailPage*detailSize);

  const trendData = S.totalTrendMode === 'month' ? monthTrend : (S.totalTrendMode === 'all' ? monthTrend : weekTrend);
  const trendTitle = S.totalTrendMode === 'week' ? '按周' : (S.totalTrendMode === 'month' ? '按月' : '历史以来（按月聚合）');
  const maxQ = Math.max(1, ...trendData.map(w=>w.q));
  let trendHtml = trendData.length
    ? trendData.map(w=>'<div class="bar-wrap"><div class="bar" style="height:'+Math.round(w.q/maxQ*100)+'%" title="做题 '+w.q+' · '+fmtClock(w.sec)+'"></div><div class="bar-lb">'+esc(w.label)+'</div></div>').join('')
    : '<div style="color:var(--text3);text-align:center;padding:20px;font-size:var(--fs-btn);">暂无数据</div>';

  /* 热力图：按本范围最大时长归一化（需求 1：最深 = #FF6961） */
  const heatDays = heatDaysFor(S.totalHeatMode);
  const heatMax = heatMaxOf(heatDays.map(d=>dayAgg(d).sec));
  let heatHtml = '<div class="heat">';
  heatDays.forEach(d=>{
    const sec = dayAgg(d).sec;
    heatHtml += heatCell(sec, heatMax, d+(sec?' · '+fmtClock(sec):''));
  });
  heatHtml += '</div>';

  let detailRows = '';
  if(detailSlice.length){
    detailSlice.forEach(d=>{
      const st = dayAgg(d);
      detailRows += '<tr><td>'+esc(d)+'</td><td style="text-align:center;">'+st.q+'</td><td style="text-align:center;">'+(st.ck?'✓':'--')+'</td><td style="text-align:center;">'+st.sl+'</td><td style="text-align:center;">'+fmtClock(st.sec)+'</td></tr>';
    });
  } else {
    detailRows = '<tr><td colspan="5" style="text-align:center;color:var(--text3);padding:20px;">暂无数据</td></tr>';
  }

  return {
    html:
      '<div class="card">'+
        '<div class="card-title">'+titleIco('trophy')+' 总计 <span class="sub">'+ (allDays[0] || todayStr()) +' 起</span></div>'+
        checkinStatCards()+
        /* 【需求 6】第 1 行保持 checkinStatCards() 不变；
           第 2 行 4 卡（statRow）、第 3 行 2 卡（statRow），任何宽度不换行 */
        statRow([
          {v:allDays.reduce((s,d)=>s+dayAgg(d).q,0), k:'行测做题数'},
          {v:'--', k:'平均正确率'},
          {v:allDays.length, k:'学习天数'},
          {v:allDays.length ? Math.round(allDays.reduce((s,d)=>s+dayAgg(d).q,0)/allDays.length) : 0, k:'日均题量'}
        ])+
        statRow([
          {v:fmtClock(allDays.reduce((s,d)=>s+dayAgg(d).sec,0)), k:'总学习时长'},
          {v:fmtClock(allDays.length ? Math.round(allDays.reduce((s,d)=>s+dayAgg(d).sec,0)/allDays.length) : 0), k:'日均时长'}
        ])+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title">'+titleIco('clock2')+' 各板块学习时长明细 <span class="sub">历史以来</span></div>'+
        boardSecDetailTable(allDays[0] || todayStr(), todayStr())+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title">'+titleIco('bolt')+' 学习热力图</div>'+
        '<div style="display:flex;justify-content:flex-end;margin-bottom:10px;">'+
          '<div class="seg" id="heatSeg">'+
            '<button data-h="year" class="'+(S.totalHeatMode==='year'?'on':'')+'">今年以来</button>'+
            '<button data-h="all" class="'+(S.totalHeatMode==='all'?'on':'')+'">历史以来</button>'+
          '</div>'+
        '</div>'+
        heatHtml+
        '<div style="font-size:calc(var(--fs-btn) - 2px);color:var(--text3);margin-top:10px;text-align:right;">颜色越深，学习时长越长</div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title">'+titleIco('chart')+' 学习趋势 <span class="sub">'+trendTitle+'</span></div>'+
        '<div style="display:flex;justify-content:flex-end;margin-bottom:10px;">'+
          '<div class="seg" id="trendSeg">'+
            '<button data-t="week" class="'+(S.totalTrendMode==='week'?'on':'')+'">按周</button>'+
            '<button data-t="month" class="'+(S.totalTrendMode==='month'?'on':'')+'">按月</button>'+
            '<button data-t="all" class="'+(S.totalTrendMode==='all'?'on':'')+'">历史以来</button>'+
          '</div>'+
        '</div>'+
        '<div class="bars">'+trendHtml+'</div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title">'+titleIco('doc')+' 明细 <span class="sub">共 '+detailTotal+' 天</span></div>'+
        '<div class="tbl-wrap"><table class="tbl">'+
          '<thead><tr><th>日期</th><th style="text-align:center;">行测题数</th><th style="text-align:center;">行测正确率</th><th style="text-align:center;">申论题数</th><th style="text-align:center;">时长</th></tr></thead>'+
          '<tbody>'+detailRows+'</tbody>'+
        '</table></div>'+
        (detailTotal > 0 ? (
          '<div class="pager">'+

/* ============================================================
   页面上部折叠控制（点侧边栏菜单后隐藏页面上部，持续上滑恢复）
   ============================================================ */
let TB_HIDDEN = false;          // 页面上部是否已折叠
let tbPeekAccum = 0;            // 上滑累积距离（持续上滑才展开，避免误触）

/* 记录"当前内容位置"锚点：展开/折叠页面上部时用它把内容钉回原处，避免跳动 */
let tbAnchorSecId = null;       // 折叠前内容区顶部所在的板块 id（第一可见板块）
function tbCaptureAnchor(){
  try{
    const sticky = $('.sticky-cd');
    const stickyH = sticky ? sticky.getBoundingClientRect().height : 0;
    const line = stickyH + 8;
    let best = null;
    (BUNNY_SECS || []).forEach(s=>{
      const el = document.getElementById(s.id);
      if(!el) return;
      if(el.getBoundingClientRect().top <= line + 4) best = s.id;
    });
    tbAnchorSecId = best || (BUNNY_SECS && BUNNY_SECS[0] ? BUNNY_SECS[0].id : null);
  }catch(e){ tbAnchorSecId = null; }
}
/* 修改轮4：折叠/展开页面上部时，用「主内容区文档绝对偏移量的变化」精确补偿滚动，
   保证视觉位置像素级不动——不再把锚点板块强行对齐到冻结栏下沿（那会导致
   "滚轮首次上滑就跳到该板块卡片最上部"）。
   原理：topbar 有 max-height 过渡（0.34s），过渡期间内容文档偏移持续变化，
   逐帧读取 content 的绝对 top（offsetTop 链，不受 scrollY 影响），把它的增量
   补偿到 scrollY 上，即可让"屏幕里看到的内容"停在原地。

   修改轮5（修复抖动/下坠）：补偿循环必须"让位"给用户自己的滚轮输入——
   一旦检测到用户产生新的滚动意图（wheel / touchmove / keydown），立即停止补偿，
   否则补偿用的 window.scrollTo 会与用户的滚动互相打架，表现为抖动 + 页面回弹下坠。
   同时把固定 40 帧改为"过渡时长自适应 + 变化量收敛即停"，避免长时间抢滚动。 */
let _tbCompensateStop = null;   // 当前补偿循环的停止函数
function tbRestoreAnchor(){
  const content = document.getElementById('content');
  if(!content){ tbRestoreAnchorBySec(); return; }
  const absTop = ()=>{
    let el = content, y = 0;
    while(el){ y += el.offsetTop || 0; el = el.offsetParent; }
    return y;
  };
  const maxScroll = ()=> Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  const atBottom = ()=>{
    const doc = document.documentElement;
    return (window.innerHeight + window.scrollY) >= (doc.scrollHeight - 2);
  };
  let prevAbs = absTop();
  let frames = 0;
  const t0 = performance.now();
  const MAX_MS = 600;                 // 与 topbar 过渡时长（0.34s）留足余量
  let stopped = false;
  const stop = ()=>{ stopped = true; };
  _tbCompensateStop = stop;
  const fix = ()=>{
    if(stopped) return;
    // 用户产生新的滚动意图 → 立即让位，避免互相打架
    if(_tbUserScrollIntent){ _tbUserScrollIntent = false; return; }
    const curAbs = absTop();
    const delta = curAbs - prevAbs;
    if(Math.abs(delta) > 0.5){
      const want = window.scrollY + delta;
      const clamped = Math.max(0, Math.min(maxScroll(), want));
      if(Math.abs(clamped - window.scrollY) > 0.5){
        _tbSuppressUserIntent = true;   // 标记：这次 scrollTo 不是用户操作
        window.scrollTo({ top: clamped, behavior: 'auto' });
        _tbSuppressUserIntent = false;
      }
      prevAbs = absTop();
    }
    frames++;
    const elapsed = performance.now() - t0;
    // 收敛即停：无变化且已过最短帧；或超时；或到达底部且还在下移
    if(elapsed < MAX_MS && !(atBottom() && delta > 0) && frames < 120 && !stopped){
      requestAnimationFrame(fix);
    }
  };
  requestAnimationFrame(fix);
}
/* 用户滚动意图标记：由 wheel/touchmove/keydown 设置，补偿循环读到后立即停止 */
let _tbUserScrollIntent = false;
let _tbSuppressUserIntent = false;
function _tbMarkUserIntent(){
  if(_tbSuppressUserIntent) return;   // 补偿自身触发的 scroll 不算用户意图
  _tbUserScrollIntent = true;
  if(_tbCompensateStop){ try{ _tbCompensateStop(); }catch(e){} }
}
/* 兜底：无 #content 时退回到"把锚点板块钉到冻结栏下沿"的旧策略 */
function tbRestoreAnchorBySec(){
  if(!tbAnchorSecId) return;
  const el = document.getElementById(tbAnchorSecId);
  if(!el) return;
  const sticky = $('.sticky-cd');
  const stickyH = sticky ? sticky.getBoundingClientRect().height : 0;
  const targetTop = stickyH + 12;
  const atBottom = ()=>{
    const doc = document.documentElement;
    return (window.innerHeight + window.scrollY) >= (doc.scrollHeight - 2);
  };
  const maxScroll = ()=> Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  let frames = 0;
  const fix = ()=>{
    const cur = document.getElementById(tbAnchorSecId);
    if(!cur) return;
    const delta = cur.getBoundingClientRect().top - targetTop;
    if(Math.abs(delta) > 0.5){
      const want = window.scrollY + delta;
      const clamped = Math.max(0, Math.min(maxScroll(), want));
      if(Math.abs(clamped - window.scrollY) > 0.5){
        window.scrollTo({ top: clamped, behavior: 'auto' });
      }
    }
    if(frames++ < 34 && !(atBottom() && delta > 0)) requestAnimationFrame(fix);
  };
  requestAnimationFrame(fix);
}

function setTopbarHidden(hide, keepAnchor, fromScroll){
  const next = !!hide;
  if(next === TB_HIDDEN){ document.body.classList.toggle('tb-hidden', TB_HIDDEN); return; }
  const tb = document.getElementById('topbar');
  const topbarH = tb ? tb.getBoundingClientRect().height : 0;
  if(keepAnchor !== false){
    const before = tbAnchorSecId;
    tbCaptureAnchor();
    if(!tbAnchorSecId) tbAnchorSecId = before;
  }
  /* 滚动触发的切换：加 tb-noanim 让高度"瞬间"到位（不做 0.34s 过渡）。
     这样 topbar 的高度变化不会跨越动画帧，浏览器来不及做原生滚动锚定补偿，
     用户也就看不到"抖动 + 下坠一段距离"。切换后一帧移除该类。 */
  const noAnim = !!fromScroll;
  if(noAnim){
    document.body.classList.add('tb-noanim');
    void document.body.offsetHeight;   // 强制重排，使 noanim 立即生效
  }
  const prevScrollY = window.scrollY;
  TB_HIDDEN = next;
  document.body.classList.toggle('tb-hidden', TB_HIDDEN);
  if(!TB_HIDDEN){ tbPeekAccum = 0; }
  applyTbPeekLabel();
  /* 折叠/展开都会改变文档高度。用"切换后的文档位移差"一次性补偿 scrollY，
     让用户看到的内容停在原地（不动画、不逐帧拉扯，因此不会抖动）。 */
  if(keepAnchor !== false){
    let el = document.getElementById('content'), absBefore = topbarH;
    // 切换后立即测量内容绝对偏移变化：新高度 - 旧高度
    void document.body.offsetHeight;
    let absAfter = 0;
    if(el){ let e = el; while(e){ absAfter += e.offsetTop || 0; e = e.offsetParent; } }
    // 仅在"未滚动触发"时做精确补偿；滚动触发用瞬间高度变化 + 不补偿，
    // 让内容自然让位（符合直觉），避免任何滚动拉扯。
    if(!fromScroll){
      const delta = (next ? -topbarH : topbarH);
      const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
      const want = Math.max(0, Math.min(maxScroll, prevScrollY + delta));
      if(Math.abs(want - window.scrollY) > 0.5){
        _tbSuppressUserIntent = true;
        window.scrollTo({ top: want, behavior: 'auto' });
        _tbSuppressUserIntent = false;
      }
    }
    _tbUserScrollIntent = false;
  }
  if(noAnim){
    requestAnimationFrame(()=>{ document.body.classList.remove('tb-noanim'); });
  }
}
/* 把手文案：折叠态「⌄ 展开 ⌄」/ 展开态「^ 隐藏 ^」 */
function applyTbPeekLabel(){
  const txt = document.getElementById('tbPeekTxt');
  const i1 = document.getElementById('tbPeekIco');
  const i2 = document.getElementById('tbPeekIco2');
  const peek = document.getElementById('tbPeek');
  if(i1) i1.textContent = TB_HIDDEN ? '⌄' : '^';
  if(i2) i2.textContent = TB_HIDDEN ? '⌄' : '^';
  if(txt) txt.textContent = TB_HIDDEN ? '展开' : '隐藏';
  if(peek) peek.title = TB_HIDDEN ? '展开页面上部' : '隐藏页面上部';
}
function bindTopbarPeek(){
  const peek = $('#tbPeek');
  const hot = $('#tbHotzone');
  applyTbPeekLabel();
  // 点把手：折叠态 → 展开（内容不动）；展开态 → 折叠（内容不动，不跳回第一个板块）
  if(peek) peek.addEventListener('click', ()=>{
    if(TB_HIDDEN) setTopbarHidden(false, true);
    else setTopbarHidden(true, true);
    // 保持把手短暂可见，便于连续切换
    document.body.classList.add('tb-peek-show');
    clearTimeout(peek._hideT);
    peek._hideT = setTimeout(()=>{ if(!hot._hovering) document.body.classList.remove('tb-peek-show'); }, 900);
  });
  // 鼠标移到页面顶部边缘（热区）时滑出把手；移开即隐藏 —— 平时完全不遮挡冻结栏
  let hideTimer = null;
  const showPeek = ()=>{
    clearTimeout(hideTimer);
    applyTbPeekLabel();
    document.body.classList.add('tb-peek-show');
  };
  const hidePeek = ()=>{
    clearTimeout(hideTimer);
    hideTimer = setTimeout(()=>{ if(!peek || !peek.matches(':hover')) document.body.classList.remove('tb-peek-show'); }, 260);
  };
  if(hot){
    hot.addEventListener('mouseenter', ()=>{ hot._hovering = true; showPeek(); });
    hot.addEventListener('mouseleave', ()=>{ hot._hovering = false; hidePeek(); });
  }
  if(peek){
    peek.addEventListener('mouseenter', ()=>{ clearTimeout(hideTimer); clearTimeout(peek._hideT); showPeek(); });
    peek.addEventListener('mouseleave', hidePeek);
  }
  // 折叠态：在页面上持续上滑（累计 90px）即展开；向下滑则保持折叠
  window.addEventListener('wheel', e=>{
    _tbMarkUserIntent();
    if(!TB_HIDDEN) return;
    if(e.deltaY < 0) tbPeekAccum += -e.deltaY;
    else tbPeekAccum = 0;
    if(tbPeekAccum >= 90){ tbPeekAccum = 0; setTopbarHidden(false, true, true); }
  }, {passive:true});
  // 触摸设备：持续下拉
  let ty0 = null;
  window.addEventListener('touchstart', e=>{
    if(!TB_HIDDEN) return;
    ty0 = e.touches[0].clientY;
  }, {passive:true});
  window.addEventListener('touchmove', e=>{
    _tbMarkUserIntent();
    if(!TB_HIDDEN || ty0 === null) return;
    const dy = e.touches[0].clientY - ty0;
    if(dy > 60){ setTopbarHidden(false, true, true); ty0 = null; }
  }, {passive:true});
  // 键盘方向键/翻页键滚动同样视为用户意图
  window.addEventListener('keydown', e=>{
    if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].indexOf(e.key) >= 0){
      _tbMarkUserIntent();
    }
  }, {passive:true});
}

/* ============================================================
   【P1】数据迁移 v1 → v2：错题图片 base64 → IndexedDB
   ------------------------------------------------------------
   铁律 4：先写新、验证、再删旧（绝不允许先删旧再写新）
   铁律 5：破坏性操作前强制备份
   铁律 2：失败完全不碰 S（不允许半新半旧）

   四阶段：
     A 预检 + 备份询问
     B 只写 IDB（S 一动不动）；任一失败 → 清理本次写入的记录并中止
     C 原子提交（改 S 的字段 + 删 base64 + 版本号置 2 + 落盘；落盘失败则回滚）
     D 收尾（清理临时映射、报告结果）
   ============================================================ */

/* 统计待迁移的图片总量（用于预检提示） */
function scanMigrationTargets(){
  const items = [];   // { w, field:'q'|'e', idx, base64 }
  (S.wrong || []).forEach(w=>{
    if(!w || typeof w !== 'object') return;
    const qs = Array.isArray(w.imgs) && w.imgs.length ? w.imgs : (w.img ? [w.img] : []);
    const es = Array.isArray(w.expImgs) && w.expImgs.length ? w.expImgs : (w.expImg ? [w.expImg] : []);
    qs.forEach((b,i)=>{ if(typeof b === 'string' && b.slice(0,5)==='data:') items.push({ w, field:'q', idx:i, base64:b }); });
    es.forEach((b,i)=>{ if(typeof b === 'string' && b.slice(0,5)==='data:') items.push({ w, field:'e', idx:i, base64:b }); });
  });
  let bytes = 0;
  items.forEach(it=>{ bytes += bytesOf(it.base64); });
  return { items, bytes, count: items.length };
}

/* 主迁移流程；返回 Promise<boolean>（true=已迁移/无需迁移，false=用户选择暂不迁移） */
async function migrateToV2(){
  if(!S || typeof S.storageVersion !== 'number' || S.storageVersion >= 2) return true;   // 幂等
  /* ★ 数据安全闸门：loadState 尚未成功落位时，绝不允许写盘——
     否则用「默认空状态」反写会覆盖 IDB 里的真实数据。
     （init 中本函数在 loadState 之后才被调度，这里是双保险）
     另：本次加载读到过损坏数据时也禁止自动落盘，防止把用户尚存的原始数据冲掉。 */
  if(!S.__loaded){ console.warn('[migrateToV2] 数据尚未加载完成，跳过'); return true; }
  if(S.__damaged){ console.warn('[migrateToV2] 数据加载异常，跳过自动落盘'); return true; }

  const scan = scanMigrationTargets();
  /* 阶段 A：无图片 → 直接置版本号，无需打扰用户 */
  if(scan.count === 0){
    S.storageVersion = 2;
    await safeSaveFull();
    return true;
  }

  // 询问用户
  const mb = (scan.bytes / 1048576).toFixed(2);
  const ok = await new Promise(resolve=>{
    openModal('📦 图片存储升级', '<p style="line-height:1.95">检测到 <b>' + scan.count + ' 张图片</b>（约 <b>' + mb + ' MB</b>）'
      + '以文本形式保存在浏览器存储中，占用了宝贵的空间。</p>'
      + '<p style="line-height:1.95;color:var(--muted)">升级后图片将改存到容量更大的「图片库」，'
      + '<b>题面与解析图片显示效果完全不变</b>，但本地存储占用会大幅下降，也能存放更多图片。</p>'
      + '<p style="line-height:1.95;color:var(--coral,#e05c5c)">升级前建议先备份，以防意外。</p>', [
      { text:'立即备份并升级', primary:true, onClick:()=>{ doEmergencyExport(); resolve(true); return false; } },
      { text:'直接升级（不备份）', onClick:()=>{ resolve(true); return false; } },
      { text:'暂不升级', onClick:()=>{ resolve(false); } }
    ]);
  });
  if(!ok) return false;

  showProgressOverlay('正在升级图片存储…', '准备中，请勿关闭页面');
  const writtenIds = [];   // 本阶段已写入 IDB 的 id（失败时用于清理）

  try{
    /* ---------- 阶段 B：只写 IDB，S 一动不动 ---------- */
    const idMap = new Map();   // base64 原文 -> id（同一张图重复时只存一份）
    const total = scan.items.length;
    for(let i=0;i<total;i++){
      const it = scan.items[i];
      let id = idMap.get(it.base64);
      if(!id){
        id = await imgStore.put(it.base64);
        writtenIds.push(id);
        idMap.set(it.base64, id);
      }
      it.id = id;
      if(i % 5 === 0 || i === total-1){
        updateProgressOverlay(Math.round((i+1)/total*100),
          '正在写入图片 ' + (i+1) + ' / ' + total + '，请勿关闭页面');
      }
    }

    /* 随机抽 10 张读回校验（铁律 6） */
    updateProgressOverlay(100, '正在校验数据…');
    const sample = Array.from(new Set(writtenIds)).slice(0, 10);
    if(sample.length){
      const m = await imgStore.getMany(sample);
      if(m.size !== sample.length){
        throw new Error('写入校验未通过（读回数量不符）');
      }
    }

    /* ---------- 阶段 C：原子提交 ---------- */
    const backup = [];   // 用于回滚：记录每道错题原始图片字段
    const touched = new Set();
    scan.items.forEach(it=>touched.add(it.w));
    touched.forEach(w=>{
      backup.push({ w, imgs: w.imgs, img: w.img, expImgs: w.expImgs, expImg: w.expImg });
    });

    // 按题聚合 id 列表（保持原顺序）
    const qIds = new Map(), eIds = new Map();
    scan.items.forEach(it=>{
      const m = it.field === 'q' ? qIds : eIds;
      if(!m.has(it.w)) m.set(it.w, []);
      m.get(it.w)[it.idx] = it.id;
    });

    touched.forEach(w=>{
      const qs = qIds.get(w) || [];
      const es = eIds.get(w) || [];
      if(qs.length){ w.imgIds = qs.filter(Boolean); w.imgId = w.imgIds[0] || ''; }
      if(es.length){ w.expImgIds = es.filter(Boolean); w.expImgId = w.expImgIds[0] || ''; }
      // 删除旧 base64 字段（先写新后删旧）
      delete w.imgs; delete w.img; delete w.expImgs; delete w.expImg;
    });

    S.storageVersion = 2;
    /* 【P2】safeSaveFull 已异步化，关键路径必须 await */
    const saved = await safeSaveFull();
    if(!saved){
      /* 落盘失败 → 回滚 S（从 backup 还原），保留 IDB（下次重试会复用） */
      backup.forEach(b=>{
        if(b.imgs !== undefined) b.w.imgs = b.imgs; else delete b.w.imgs;
        if(b.img  !== undefined) b.w.img  = b.img;  else delete b.w.img;
        if(b.expImgs !== undefined) b.w.expImgs = b.expImgs; else delete b.w.expImgs;
        if(b.expImg  !== undefined) b.w.expImg  = b.expImg;  else delete b.w.expImg;
        delete b.w.imgIds; delete b.w.imgId; delete b.w.expImgIds; delete b.w.expImgId;
      });
      S.storageVersion = 1;
      throw new Error('数据落盘失败，已回滚（现有数据未受影响）');
    }

    /* ---------- 阶段 D：收尾 ---------- */
    updateProgressOverlay(100, '升级完成 ✓');
    await new Promise(r=>setTimeout(r, 500));
    hideProgressOverlay();
    const after = storageUsage();
    toast('图片存储升级完成：' + total + ' 张图片已迁入图片库');
    return true;

  }catch(err){
    console.error('[migrateToV2] 失败', err);
    /* 清理本次写入的 IDB 记录（不影响之前就存在的记录） */
    try{ await imgStore.deleteMany(writtenIds); }catch(e){ console.warn('[migrateToV2] 清理失败', e); }
    hideProgressOverlay();
    openModal('⚠️ 图片存储升级失败', '<p style="line-height:1.9">升级过程中出现错误，<b>已完整回滚</b>。</p>'
      + '<p style="line-height:1.9;color:var(--muted)">' + esc(err && err.message ? err.message : String(err)) + '<br>'
      + '你的错题与图片<b>未受任何影响</b>，可以稍后重试，或先导出备份。</p>', [
      { text:'导出备份', primary:true, onClick:()=>{ doEmergencyExport(); return false; } },
      { text:'我知道了' }
    ]);
    return false;
  }
}

/* ============================================================
   初始化
   ============================================================ */
/* 【P2 存储架构升级】init 改为 async：
   启动顺序 = ① 探测 IDB 可用性并决定是否降级 → ② 存量迁移（localStorage→IDB）
             → ③ await loadState()（异步读盘）→ ④ 正常渲染。
   任何一步失败都只降级、不白屏（原可靠性保险丝逻辑保留）。 */
async function init(){
  /* ---------- ⓪ 探测 IndexedDB 可用性，决定走 IDB 还是降级 localStorage ---------- */
  let useIdb = true;
  try{
    /* 用主数据库连接做一次真实探测（仅判断 indexedDB 存在不够——
       隐私模式下 indexedDB 存在但 open 会失败） */
    await appIdbOpen();
  }catch(e){
    useIdb = false;
    console.warn('[init] IndexedDB 不可用，回退 localStorage', e);
    try{
      toast('当前浏览器不支持大容量存储，将继续使用旧存储模式（5MB 上限）', 4000);
    }catch(e2){}
  }
  /* 全局降级开关：loadState 会用这个值覆盖 S.__useIdb，避免跨设备配置漂移 */
  window.__useIdbGlobal = useIdb;

  /* ---------- ① 存量迁移：localStorage → IndexedDB（幂等，失败不影响使用） ---------- */
  if(useIdb){
    try{
      const r = await migrateStateToIdb();
      if(!r || !r.ok){
        /* 迁移未完成（解析失败/写入失败）→ 本次会话降级用 localStorage 跑，
           保证页面完全可用；旧数据原封不动留在 localStorage，下次打开会重试 */
        if(r && (r.reason === 'parse_error' || r.reason === 'write_error' || r.reason === 'meta_error')){
          useIdb = false;
          window.__useIdbGlobal = false;
        }
      }
    }catch(e){
      /* 迁移函数本身异常（理论上不会，因其内部全兜底）→ 降级不阻塞 */
      console.error('[init] 迁移异常，回退 localStorage', e);
      useIdb = false;
      window.__useIdbGlobal = false;
    }
  }

  /* ---------- ② 异步读盘（优先 IDB，降级时走 localStorage） ---------- */
  try{ await loadState(); }
  catch(e){
    console.error('数据加载异常，已回退默认状态', e);
    try{ S = Object.assign(defaultState(), {}); }catch(e2){}
  }
  /* 再次确认降级开关（loadState 内部按 window.__useIdbGlobal 写入） */
  try{ S.__useIdb = useIdb; }catch(e){}
  try{ document.body.dataset.font = S.font || 'medium'; }catch(e){}
  try{ $$('#fpOpts button').forEach(b=>b.classList.toggle('on', b.dataset.f === S.font)); }catch(e){}
  if(window.innerWidth < 768) S.pinned = false;
  try{ applySidebar(); }catch(e){}
  try{ renderNav(); }catch(e){ console.error(e); }
  try{ renderTopbar(); }catch(e){ console.error(e); }
  try{ renderPage(); }catch(e){ console.error(e); }
  try{ bindScrollButtons(); }catch(e){}
  try{ bindTopbarPeek(); }catch(e){}
  try{ bunnyPrime(); }catch(e){ /* 兔头导航初始化失败不影响主体 */ }
  /* 【P1】图片存储升级 v1→v2：异步执行，不阻塞首屏渲染。
     失败/用户暂不升级都不影响页面正常使用（旧 base64 结构仍可正常显示）。 */
  try{
    setTimeout(()=>{
      migrateToV2()
        .then(migrated=>{ if(migrated) try{ renderPage(); }catch(e){} })
        .catch(e=>console.error('[init] 迁移异常', e));
    }, 600);
  }catch(e){ console.warn('[init] 迁移调度失败', e); }
  // 窗口尺寸变化 → 冻结栏 + 心情栏重新自适应
  //  · 拖动过程中：立即同步字号（跟手），并临时关闭 CSS 过渡（避免"追不上手指"的滞后感）
  //  · 停手后：恢复过渡，残余误差由下面的定时器补齐
  let moodResizeEndT = null;
  window.addEventListener('resize', ()=>{
    try{ scheduleStickyFit(); }catch(e){}
    try{
      document.body.classList.add('mood-resizing');
      fitMoodRow();                       // 立即跟手，不做 80ms 延迟
      clearTimeout(moodResizeEndT);
      moodResizeEndT = setTimeout(()=>{
        document.body.classList.remove('mood-resizing');
        scheduleMoodFit();                // 停手后再精确校准一次
      }, 140);
    }catch(e){}
  }, {passive:true});

  // 快捷键
  document.addEventListener('keydown', e=>{
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if(e.code === 'Escape'){
      if($('#reviewMode').classList.contains('show')) closeReviewMode();
      else closeModal();
      return;
    }
    if($('#modal').classList.contains('show')) return;
    if($('#reviewMode').classList.contains('show')) return;
    // 套卷计时中：空格=下一部分，回车=结束套卷
    if(typeof PP !== 'undefined' && PP.running){
      if(e.code === 'Space'){ e.preventDefault(); if(!e.repeat) paperNext(); }
      if(e.code === 'Enter'){ e.preventDefault(); if(!e.repeat) paperFinish(); }
      return;
    }
    // 刷题计时中：空格=下一题，回车=结束
    if(T.running){
      if(e.code === 'Space'){ e.preventDefault(); if(!e.repeat) T_next(); }
      if(e.code === 'Enter'){ e.preventDefault(); if(!e.repeat) T_end(); }
    }
  });

  // 顶部时钟：每秒对齐系统整秒刷新（仅更新时钟文本）
  startClock();
  // 每分钟刷新倒计时等其他顶部信息
  setInterval(()=>{ try{ renderTopbar(); }catch(e){} }, 60000);

  // 欢迎
  setTimeout(()=>{
    const h = new Date().getHours();
    const greet = h < 6 ? '夜深了，注意休息'
              : (h < 11 ? '早上好'
              : (h < 14 ? '中午好'
              : (h < 18 ? '下午好' : '晚上好')));
    toast('👋 ' + greet + '，今天也要加油上岸！', 2600);
  }, 700);
}

/* ============================================================
   启动
   ------------------------------------------------------------
   【P2 存储架构升级】init 已改为 async（内部 await 迁移 + await loadState），
   这里必须正确处理返回的 Promise，避免出现「以为初始化完了其实还在飞」；
   同时补 unhandledrejection 兜底，任何异步异常都只记录日志、不白屏。
   ============================================================ */
window.addEventListener('unhandledrejection', ev=>{
  console.error('[未捕获的异步异常]', ev && ev.reason);
  try{ ev.preventDefault(); }catch(e){}
});
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', ()=>{
    Promise.resolve().then(()=>init()).catch(e=>console.error('[启动异常]', e));
  });
} else {
  Promise.resolve().then(()=>init()).catch(e=>console.error('[启动异常]', e));
}

})();
</script>
