/* ============================================================
   【P0】存储占用可视化
   localStorage 各浏览器上限约 5MB（按 UTF-16 计，即约 250 万字符）。
   >70% 橙色预警（提示可清理）；>85% 红色 + 自动展开「立即导出备份」引导。
   ============================================================ */
/* ============================================================
   【P0/P2 存储占用可视化】
   【P2 存储架构升级】数据主体已从 localStorage 迁到 IndexedDB，占用统计改为真实口径：
     · localStorage 部分：遍历求和（原实现保留，如今数据量很小）
     · IndexedDB 部分：navigator.storage.estimate() 的 usage/quota
       （usage 含图片库 + 主数据 + 同源其他存储，是浏览器给的真实口径）
     · 显示格式：「本地存储 X MB（localStorage Y KB + 应用数据库 Z MB）」
     · 上限参考值改用真实配额 quota（通常几百 MB ~ 数 GB），而非写死的 5MB
     · 预警阈值：> 80% 橙色，> 95% 红色
   ============================================================ */
const LS_LIMIT_BYTES = 5 * 1024 * 1024;   // localStorage 经验上限（约 5 MB），降级模式下作为参考
let _storageEst = { usage:0, quota:0, lsBytes:0, ok:false, ts:0 };  // 最近一次统计结果（缓存给同步调用方）

/* 异步获取真实存储占用（带 1.5s 缓存，避免频繁调用 estimate） */
async function storageEstimateInfo(force){
  const now = Date.now();
  if(!force && _storageEst.ok && (now - _storageEst.ts) < 1500) return _storageEst;
  const lsBytes = storageUsage();
  let usage = 0, quota = 0, ok = false;
  try{
    if(navigator.storage && navigator.storage.estimate){
      const est = await navigator.storage.estimate();
      usage = est.usage || 0;
      quota = est.quota || 0;
      ok = quota > 0;
    }
  }catch(e){
    /* estimate 失败（老浏览器/隐私模式）→ 回退用 localStorage 口径 */
    console.warn('[storageEstimateInfo] estimate 失败', e);
  }
  if(!ok){
    /* 降级：没有真实配额时，用 localStorage 占用 + 经验上限 */
    usage = lsBytes;
    quota = LS_LIMIT_BYTES;
  }
  _storageEst = { usage: usage, quota: quota, lsBytes: lsBytes, ok: ok, ts: now };
  return _storageEst;
}

/* 同步取「上一次」统计结果的百分比（用于渲染期即时展示，避免异步等待） */
function storageUsageInfo(){
  const used  = _storageEst.usage || storageUsage();
  const limit = _storageEst.quota || LS_LIMIT_BYTES;
  const pct = Math.min(100, Math.round(used / limit * 1000) / 10);
  return { used, limit, pct, lsBytes: _storageEst.lsBytes,
           idbBytes: Math.max(0, (_storageEst.usage||0) - (_storageEst.lsBytes||0)),
           real: !!_storageEst.ok };
}

/* 刷新设置面板中的存储占用条（DOM 不存在时静默返回，便于在任意时机调用）
   【P2】先 await 真实统计，再写 DOM；失败只提示，不抛异常。 */
async function refreshStorageMeter(){
  const bar = document.getElementById('storageMeterBar');
  const txt = document.getElementById('storageMeterTxt');
  const hint = document.getElementById('storageMeterHint');
  if(!bar || !txt) return;
  let info;
  try{
    await storageEstimateInfo(true);
    info = storageUsageInfo();
  }catch(e){
    console.error('[refreshStorageMeter]', e);
    txt.textContent = '统计失败';
    return;
  }
  const mb = (info.used / 1048576).toFixed(2);
  const limitMb = (info.limit / 1048576).toFixed(0);
  const lsKb = ((info.lsBytes || 0) / 1024).toFixed(1);
  const idbMb = ((info.idbBytes || 0) / 1048576).toFixed(2);
  /* 【P2】显示格式：总量 + 明细（localStorage / 应用数据库） */
  txt.textContent = mb + ' MB / 约 ' + limitMb + ' MB（' + info.pct + '%）';
  if(hint){
    let detail = '本地存储 <b>' + mb + ' MB</b>（localStorage ' + lsKb + ' KB + 应用数据库 ' + idbMb + ' MB）';
    if(!info.real) detail += '<br>（当前浏览器不支持精确配额统计，显示为估算值）';
    if(info.pct > 95)      detail += '<br>⚠️ 存储空间即将耗尽，请<b>立即导出备份</b>后清理不需要的数据（如旧错题图片）。';
    else if(info.pct > 80) detail += '<br>存储占用偏高，建议导出备份并清理历史数据。';
    hint.innerHTML = detail;
  }
  bar.style.width = Math.max(2, info.pct) + '%';
  let color = 'var(--green,#7bc47f)';
  if(info.pct > 95) color = '#e05c5c';
  else if(info.pct > 80) color = '#e8a33d';
  bar.style.background = color;
}

/* 存储预警的轻量提示（收集箱 / 全部错题页顶部显示，避免打扰主流程）
   【P2】阈值随真实配额：>80% 提示，>95% 危险。 */
function storageWarnStripHtml(){
  let info;
  try{ info = storageUsageInfo(); }catch(e){ return ''; }
  if(info.pct <= 80) return '';
  const mb = (info.used / 1048576).toFixed(2);
  const danger = info.pct > 95;
  return '<div style="margin:8px 0;padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.7;'
    + 'background:' + (danger ? 'rgba(224,92,92,.12)' : 'rgba(232,163,61,.12)') + ';'
    + 'border:1px solid ' + (danger ? 'rgba(224,92,92,.45)' : 'rgba(232,163,61,.45)') + ';">'
    + '⚠️ 本地存储占用 <b>' + mb + ' MB（' + info.pct + '%）</b>，'
    + (danger ? '接近上限，请尽快导出备份并清理数据。' : '建议适时导出备份。')
    + '</div>';
}

/* ============================================================
   【P1】A 类：全部数据备份 —— 导入（三段式安全流程）
   ------------------------------------------------------------
   与 B 类的区别（UI 与语义都要让用户看得懂）：
     · A 类 = 整机备份/灾难恢复，走「设置 → 数据备份」
     · B 类 = 单板块导入导出，走各功能页自己的按钮
   本函数严格按铁律 2 执行三段式：
     段 1 读取 + 解析（不碰 S）     失败 → 提示「现有数据未受影响」
     段 2 影子状态 tempState 上合并 + 图片写 IDB
     段 3 原子提交（校验 → 替换 S → 落盘；失败全量回滚）
   ============================================================ */
/* 收集备份对象中所有 base64 图片（供 A 类导入写 IDB） */
function collectBackupImages(obj){
  const list = [];
  if(!obj || !Array.isArray(obj.wrong)) return list;
  obj.wrong.forEach(w=>{
    if(!w) return;
    const q = Array.isArray(w.imgs) && w.imgs.length ? w.imgs : (w.img ? [w.img] : []);
    const e = Array.isArray(w.expImgs) && w.expImgs.length ? w.expImgs : (w.expImg ? [w.expImg] : []);
    q.forEach(b=>{ if(typeof b === 'string' && b.slice(0,5)==='data:') list.push({ w, kind:'q', base64:b }); });
    e.forEach(b=>{ if(typeof b === 'string' && b.slice(0,5)==='data:') list.push({ w, kind:'e', base64:b }); });
  });
  return list;
}

function importAllBackupFile(file){

    { text:'开始导入', primary:true, onClick:()=>{ doImportAllBackup(file); return false; } },

/* 三段式导入实体 */
function doImportAllBackup(file){
  showProgressOverlay('正在导入数据备份…', '读取文件 ' + esc(file.name));
  const reader = new FileReader();

  reader.onerror = () => {
    hideProgressOverlay();
    openModal('⚠️ 导入失败', '<p style="line-height:1.9">文件读取失败，<b>导入已取消</b>。</p>'
      + '<p style="line-height:1.9;color:var(--muted)">你现有的数据<b>未受任何影响</b>。</p>', [{text:'我知道了', primary:true}]);
  };

  reader.onload = async e => {
    /* ---------- 段 1：解析（绝不碰 S） ---------- */
    let obj = null;
    try{
      let txt = e.target.result || '';
      if(txt.charCodeAt(0) === 0xFEFF) txt = txt.slice(1);
      obj = JSON.parse(txt);
      if(!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('文件内容不是合法的数据对象');
    }catch(err){
      hideProgressOverlay();
      console.error('[备份导入] 解析失败', err);
      openModal('⚠️ 导入已取消', '<p style="line-height:1.9">文件格式不正确，<b>导入已取消</b>。</p>'
        + '<p style="line-height:1.9;color:var(--muted)">' + esc(err && err.message ? err.message : String(err)) + '<br>'
        + '你现有的数据<b>未受任何影响</b>。</p>', [{text:'我知道了', primary:true}]);
      return;
    }

    const written = [];
    const snapshot = JSON.parse(JSON.stringify(S));   // 用于回滚
    /* 【P2】导入属破坏性操作：提交前先给当前数据打一份快照（失败不阻塞） */
    await takeSnapshot('import');

    try{
      /* ---------- 段 2a：图片先写入 IDB（失败则整体中止） ---------- */
      const backupImgs = collectBackupImages(obj);
      if(backupImgs.length){
        updateProgressOverlay(5, '正在写入图片 0 / ' + backupImgs.length + '，请勿关闭页面');
        const idMap = new Map();
        for(let i=0;i<backupImgs.length;i++){
          const it = backupImgs[i];
          let id = idMap.get(it.base64);
          if(!id){
            id = await imgStore.put(it.base64);
            written.push(id);
            idMap.set(it.base64, id);
          }
          it.id = id;
          if(i % 5 === 0 || i === backupImgs.length-1){
            updateProgressOverlay(5 + Math.round((i+1)/backupImgs.length*55),
              '正在写入图片 ' + (i+1) + ' / ' + backupImgs.length + '，请勿关闭页面');
          }
        }
        /* 把 base64 字段换成 id 引用（在 obj 副本上操作，不碰 S） */
        const qMap = new Map(), eMap = new Map();
        backupImgs.forEach(it=>{
          const m = it.kind === 'q' ? qMap : eMap;
          if(!m.has(it.w)) m.set(it.w, []);
          m.get(it.w).push(it.id);
        });
        qMap.forEach((ids, w)=>{ w.imgIds = ids; w.imgId = ids[0] || ''; delete w.imgs; delete w.img; });
        eMap.forEach((ids, w)=>{ w.expImgIds = ids; w.expImgId = ids[0] || ''; delete w.expImgs; delete w.expImg; });
        /* 回读抽样校验 */
        const sample = Array.from(new Set(written)).slice(0, 10);
        if(sample.length){
          const m = await imgStore.getMany(sample);
          if(m.size !== sample.length) throw new Error('图片写入校验未通过');
        }
      }

      /* ---------- 段 2b：在影子状态上合并 ---------- */
      updateProgressOverlay(65, '正在合并数据…');
      const temp = JSON.parse(JSON.stringify(S));
      const merged = mergeBackupInto(temp, obj);

      /* ---------- 段 3：原子提交 ---------- */
      updateProgressOverlay(90, '正在保存…');
      S = temp;
      /* 【P2】safeSaveFull 已异步化，这里必须 await（关键路径） */
      if(!(await safeSaveFull())){
        S = snapshot;
        throw new Error('数据落盘失败（存储空间可能已满），已回滚');
      }
      /* 校验：随机抽 10 道错题确认文字完整 */
      try{
        const arr = S.wrong || [];
        const picks = arr.length > 10 ? arr.slice().sort(()=>Math.random()-0.5).slice(0,10) : arr;
        const bad = picks.filter(w=>!w || typeof w.id !== 'string');
        if(bad.length) throw new Error('导入后数据校验未通过');
      }catch(e){ console.warn('[备份导入] 抽样校验', e); }

      /* 记录可撤销导入（24 小时） */
      UNDO_IMPORT = { ts: Date.now(), kind:'A', snapshot: snapshot, written: written.slice() };

      updateProgressOverlay(100, '导入完成 ✓');
      await new Promise(r=>setTimeout(r, 400));
      hideProgressOverlay();
      renderPage();
      openModal('✅ 导入完成', '<p style="line-height:1.95">数据已成功合并导入。</p>'
        + '<p style="line-height:1.95;color:var(--muted)">本次新增/合并：'
        + Object.keys(merged).map(k=>k + ' ' + merged[k]).join('　') + '</p>'
        + '<p style="line-height:1.95;color:var(--muted)">若发现导入结果不符合预期，可在 <b>24 小时内撤销</b>（撤销需保持页面不关闭）。</p>', [
        { text:'撤销本次导入', onClick:()=>{ undoLastImport(); return false; } },
        { text:'完成', primary:true }
      ]);
    }catch(err){
      /* ---------- 铁律 2：完整回滚 ---------- */
      console.error('[备份导入] 失败', err);
      S = snapshot;
      try{ await imgStore.deleteMany(written); }catch(e){}
      try{ safeSaveFull(); }catch(e){}
      hideProgressOverlay();
      try{ renderPage(); }catch(e){}
      openModal('⚠️ 导入失败', '<p style="line-height:1.9">导入过程中出现错误，<b>已完整回滚</b>。</p>'
        + '<p style="line-height:1.9;color:var(--muted)">' + esc(err && err.message ? err.message : String(err)) + '<br>'
        + '你现有的数据<b>未受任何影响</b>。</p>', [
        { text:'导出当前数据', primary:true, onClick:()=>{ doEmergencyExport(); return false; } },
        { text:'我知道了' }
      ]);
    }
  };

  reader.readAsText(file);
}

/* 把备份对象合并进目标状态；返回各板块合并条数（用于结果提示） */
function mergeBackupInto(target, obj){
  const stat = {};
  const t = target;
  if(obj.studyLog && typeof obj.studyLog === 'object') Object.assign(t.studyLog, obj.studyLog);
  if(Array.isArray(obj.timerLog)) t.timerLog = t.timerLog.concat(obj.timerLog).slice(-2000);
  if(obj.moods && typeof obj.moods === 'object') Object.assign(t.moods, obj.moods);
  if(obj.boardLog && typeof obj.boardLog === 'object'){
    Object.keys(obj.boardLog).forEach(bd=>{
      if(!t.boardLog[bd]) t.boardLog[bd] = {};
      Object.keys(obj.boardLog[bd] || {}).forEach(d=>{
        const src = obj.boardLog[bd][d] || {};
        const dst = t.boardLog[bd][d] || (t.boardLog[bd][d] = {ck:0,q:0,paper:0,page:0,timer:0});
        dst.ck = dst.ck || src.ck || 0;
        dst.q = (dst.q||0) + (src.q||0);
        dst.paper = (dst.paper||0) + (src.paper||0);
        dst.page = (dst.page||0) + (src.page||0);
        dst.timer = (dst.timer||0) + (src.timer||0);
      });
    });
  }
  if(obj.boardGoalSec && typeof obj.boardGoalSec === 'object') Object.assign(t.boardGoalSec, obj.boardGoalSec);

  ['exams','pastNews','historyTags','historyReasons','historySources','historyWrongTypes'].forEach(k=>{
    if(!Array.isArray(obj[k])) return;
    if(!Array.isArray(t[k])) t[k] = [];
    let n = 0;
    if(k === 'pastNews'){
      const seen = new Set(t[k].map(x=>(x.t||'')+'|'+(x.date||'')));
      obj[k].forEach(x=>{ const key=(x.t||'')+'|'+(x.date||''); if(!seen.has(key)){ seen.add(key); t[k].push(x); n++; } });
    }else{
      const seen = new Set(t[k]);
      obj[k].forEach(x=>{ if(!seen.has(x)){ seen.add(x); t[k].push(x); n++; } });
    }
    if(n) stat[k] = n;
  });
  ['wrong','reviewLogs','resources','favorites'].forEach(k=>{
    if(!Array.isArray(obj[k])) return;
    if(!Array.isArray(t[k])) t[k] = [];
    const seen = new Set(t[k].map(x=>x && x.id));
    let n = 0;
    obj[k].forEach(x=>{ if(x && !seen.has(x.id)){ seen.add(x.id); t[k].push(x); n++; } });
    if(n) stat[k] = n;
  });
  /* 【补充】reviewTasks 也纳入合并（旧版导入漏掉了复习任务） */
  if(Array.isArray(obj.reviewTasks)){
    if(!Array.isArray(t.reviewTasks)) t.reviewTasks = [];
    const seen = new Set(t.reviewTasks.map(x=>x && x.id));
    let n = 0;
    obj.reviewTasks.forEach(x=>{ if(x && !seen.has(x.id)){ seen.add(x.id); t.reviewTasks.push(x); n++; } });
    if(n) stat.reviewTasks = n;
  }
  ['daily','weekly','monthly','overall'].forEach(k=>{
    if(!(obj.plans && Array.isArray(obj.plans[k]))) return;
    if(!Array.isArray(t.plans[k])) t.plans[k] = [];
    const seen = new Set(t.plans[k].map(x=>x && x.id));
    let n = 0;
    obj.plans[k].forEach(x=>{ if(x && !seen.has(x.id)){ seen.add(x.id); t.plans[k].push(x); n++; } });
    if(n) stat['plans.'+k] = n;
  });
  if(obj.idealByCat && typeof obj.idealByCat === 'object'){
    if(typeof t.idealByCat !== 'object' || !t.idealByCat) t.idealByCat = {};
    Object.assign(t.idealByCat, obj.idealByCat);
  }
  if(typeof obj.ganttColorMemory !== 'undefined' && Array.isArray(obj.ganttColorMemory)){
    if(!Array.isArray(t.ganttColorMemory)) t.ganttColorMemory = [];
    obj.ganttColorMemory.forEach(c=>{ if(!t.ganttColorMemory.includes(c) && t.ganttColorMemory.length < 20) t.ganttColorMemory.push(c); });
  }
  return stat;
}

/* 【P1】撤销上次导入（24 小时内，仅当次会话有效） */
/* 【P2】改为 async：内部需要 await safeSaveFull() 确保撤销结果真正落盘后再提示成功 */
async function undoLastImport(){
  if(!UNDO_IMPORT){ toast('没有可撤销的导入记录'); return; }
  const age = Date.now() - UNDO_IMPORT.ts;
  if(age > 24*3600*1000){ toast('超过 24 小时，无法撤销'); UNDO_IMPORT = null; return; }
  try{
    const snap = UNDO_IMPORT.snapshot;
    /* 防御：快照必须是完整 state 对象（含 wrong 数组），绝不能是裸数组。
       历史版本曾误存 S.wrong 数组，若遇到则拒绝执行，避免把 S 整体替换成数组。 */
    if(!snap || typeof snap !== 'object' || Array.isArray(snap) || !Array.isArray(snap.wrong)){
      toast('撤销记录已失效，未做任何改动');
      UNDO_IMPORT = null;
      return;
    }
    S = snap;
    await safeSaveFull();
    const written = UNDO_IMPORT.written || [];
    UNDO_IMPORT = null;
    if(written.length){
      imgStore.deleteMany(written).then(()=>{
        renderPage();
        toast('已撤销上次导入，数据已恢复');
      }).catch(e=>{
        console.warn('[撤销导入] 图片清理失败', e);
        renderPage();
        toast('已撤销上次导入（部分图片未清理，可稍后在数据管理清理孤立图片）');
      });
    }else{
      renderPage();
      toast('已撤销上次导入，数据已恢复');
    }
  }catch(e){
    console.error('[撤销导入] 失败', e);
    toast('撤销失败：' + (e && e.message ? e.message : '未知错误'));
  }
}

/* ============================================================
   【远程数据】设置面板「远程数据地址」输入框 + 测试连接 + 清除
   ------------------------------------------------------------
   用途：手机 / iPad 上打开 HTML 时，从 GitHub 读取定时采集的最新数据。
   保存位置：浏览器的固定位置 wb_data_url（与 HTML 文件名无关）
            同时同步一份到 S.remoteDataUrl 以兼容旧数据。
   ★ 所有分支包 try-catch，任何异常都不影响其他设置项。
   ============================================================ */
(function bindRemoteData(){
  const inp = document.getElementById('remoteDataUrl');
  const btn = document.getElementById('remoteDataTestBtn');
  const clr = document.getElementById('remoteDataClearBtn');
  const hint = document.getElementById('remoteDataHint');

  /* 地址清洗：去空格、去误粘贴的首尾引号与分号 */
  function cleanUrl(v){
    let s = String(v == null ? '' : v).trim();
    s = s.replace(/^["'`]+|["'`;]+$/g, '').trim();
    return s;
  }
  function setHint(txt, color){
    try{ if(hint){ hint.textContent = txt || ''; hint.style.color = color || 'var(--text3)'; } }catch(e){}
  }

  /* 回填已保存的地址（面板初次打开时，从固定 key 读取） */
  try{ if(inp){ const cur = wbGetRemoteUrl(); if(cur) inp.value = cur; } }catch(e){}

  /* 输入框失焦 / 回车 → 保存 */
  function persist(){
    try{
      if(!inp) return;
      const v = cleanUrl(inp.value);
      inp.value = v;
      if(wbGetRemoteUrl() === v) return;      // 无变化不写盘
      wbSetRemoteUrl(v);
      save(true);
      setHint(v ? '已保存地址' : '已清空（不启用远程数据）', v ? '#3E8A68' : 'var(--text3)');
    }catch(e){ console.warn('[远程数据] 保存失败', e); }
  }
  if(inp){
    inp.addEventListener('change', persist);
    inp.addEventListener('blur', persist);
    inp.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); persist(); inp.blur(); } });
  }

  /* 测试连接：先保存 → 立即尝试读取一次 → 结果反馈 */
  if(btn) btn.addEventListener('click', async ()=>{
    try{
      if(!inp) return;
      const v = cleanUrl(inp.value);
      inp.value = v;

      if(!v){ setHint('未填写地址', 'var(--text3)'); toast('未填写地址'); return; }

      btn.disabled = true;
      const oldText = btn.innerHTML;
      btn.innerHTML = '⏳ 正在测试…';
      setHint('正在读取…', 'var(--text3)');
      try{
        const res = await wbTestRemoteUrl(v);
        save(true);
        if(res.ok){
          const when = res.updatedAt ? ('（数据时间 ' + res.updatedAt + '）') : '';
          setHint('✅ 在线：' + res.count + ' 条' + when, '#3E8A68');
          toast('✅ 地址可用，读取到 ' + res.count + ' 条数据');
        }else{
          setHint('❌ ' + res.error, 'var(--coral)');
          toast('❌ ' + res.error);
        }
      }catch(e){
        setHint('❌ 读取失败：' + ((e && e.message) ? e.message : '未知错误'), 'var(--coral)');
        toast('❌ 读取失败');
      }finally{
        btn.disabled = false;
        btn.innerHTML = oldText;
      }
    }catch(e){ console.warn('[远程数据] 测试失败', e); }
  });

  /* 清除：清空输入框 + 抹掉固定 key 里的地址 + 同步清掉 S 里的旧值 */
  if(clr) clr.addEventListener('click', ()=>{
    try{
      if(inp) inp.value = '';
      wbSetRemoteUrl('');
      save(true);
      setHint('已清除地址，改用同目录数据 / 内置素材库', 'var(--text3)');
      toast('已清除远程数据地址');
    }catch(e){ console.warn('[远程数据] 清除失败', e); }
  });
})();

/* ============================================================
   【P2 存储架构升级】历史快照
   ------------------------------------------------------------
   用途：在「导入备份 / 迁移 / 清除数据 / 恢复快照」等破坏性操作前，
        自动把当前 S 留一份存进 IDB 的 snapshots（保留最近 5 条），
        万一操作失误可以回滚。
   ★ 快照写入失败绝不阻塞主流程，只 console.warn。
   ★ 恢复流程复用「三段式」思路：先校验快照 JSON → 再合并到影子状态 → 最后原子提交。
   ============================================================ */

/* 抢占式打快照：把当前内存 S 序列化后写入快照库。
   reason: 'migrate' | 'import' | 'manual_clear' | 'restore' | 'before_clear' */
async function takeSnapshot(reason){
  try{
    const json = JSON.stringify(S);
    const ts = await idbSnapshotsAdd(json, reason || 'manual');
    return ts;
  }catch(e){
    console.warn('[takeSnapshot] 快照写入失败（不阻塞主流程）', reason, e);
    return null;
  }
}

/* 快照原因的中文展示 */
const SNAP_REASON_LABEL = {
  migrate:'数据迁移', import:'导入备份', manual_clear:'清除全部数据',
  before_clear:'清除前留档', restore:'恢复快照前留档', manual:'手动'
};
const snapReasonLabel = r => SNAP_REASON_LABEL[r] || r || '手动';

/* 打开「历史快照」弹窗：列出快照（时间 + 原因 + 大小），每条可恢复 / 下载 */

/* 从某条快照恢复数据：
   ① 读快照 JSON → 解析校验
   ② 恢复前给「当前数据」再打一份快照（reason='restore'），保证可反悔
   ③ 影子状态合并（走 mergeStateFieldwise，与导入同一套容错逻辑）
   ④ 原子提交：替换 S → 落盘 → 重渲染
   ★ 任何一步失败都不碰现有 S（失败时只提示）。 */
async function restoreSnapshot(ts){
  openModal('⚠️ 恢复快照',
    '<div style="text-align:center;font-size:var(--fs-body);line-height:2;padding:6px 0;">'
    + '恢复会用该快照<b>覆盖当前全部数据</b>，<br>恢复前会自动留档当前数据，<br>'
    + '是否仍要<b style="color:var(--coral);">恢复</b>？</div>',
    [{ text:'确认恢复', primary:true, onClick:()=>{ doRestoreSnapshot(ts); return false; } }, { text:'取消' }]);
}

async function doRestoreSnapshot(ts){
  let rec = null;
  try{
    rec = await idbSnapshotsGet(ts);
    if(!rec || typeof rec.json !== 'string' || !rec.json) throw new Error('快照不存在或内容为空');
  }catch(e){
    console.error('[doRestoreSnapshot] 读取快照失败', e);
    openModal('恢复失败', '<p style="line-height:1.9">' + esc(e.message || '读取快照失败')
      + '</p><p style="line-height:1.9;color:var(--muted)">现有数据未受影响。</p>', [{text:'关闭', primary:true}]);
    return;
  }
  let obj = null;
  try{
    obj = JSON.parse(rec.json);
    if(!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('快照内容格式不正确');
  }catch(e){
    console.error('[doRestoreSnapshot] 解析快照失败', e);
    openModal('恢复失败', '<p style="line-height:1.9">快照内容无法解析：' + esc(e.message || '')
      + '</p><p style="line-height:1.9;color:var(--muted)">现有数据未受影响。</p>', [{text:'关闭', primary:true}]);
    return;
  }

  /* ② 先给当前数据留档（可反悔） */
  await takeSnapshot('restore');

  /* ③ 影子状态：在默认状态上做逐字段容错合并（与导入同一套逻辑，一行未改） */
  let shadowState = null;
  try{
    shadowState = defaultState();
    mergeStateFieldwise(shadowState, obj);
  }catch(e){
    console.error('[doRestoreSnapshot] 影子状态合并失败', e);
    openModal('恢复失败', '<p style="line-height:1.9">数据合并失败：' + esc(e.message || '')
      + '</p><p style="line-height:1.9;color:var(--muted)">现有数据未受影响。</p>', [{text:'关闭', primary:true}]);
    return;
  }

  /* ④ 原子提交 */
  const backupState = S;
  try{
    S = shadowState;
    S.__dirty = true;
    const ok = await safeSaveFull();
    if(!ok) throw new Error('落盘失败');
    closeModal();
    renderNav(); renderTopbar(); renderPage();
    toast('已恢复到所选快照');
  }catch(e){
    /* 回滚：恢复内存中的原 S */
    S = backupState;
    console.error('[doRestoreSnapshot] 提交失败，已回滚', e);
    openModal('恢复失败', '<p style="line-height:1.9">写入失败：' + esc(e && e.message ? e.message : '未知错误')
      + '</p><p style="line-height:1.9;color:var(--muted)">已回滚，现有数据未受影响。</p>', [{text:'关闭', primary:true}]);
  }
}

/* ============================================================
   打卡统计（兼容入口）
   ------------------------------------------------------------
   保留旧函数名，内部改用「全局汇总口径」（globalCheckinStats）：
     当日已打卡 = 任一功能菜单点了「今日打卡」 或 错题本「今日复习」开始复习
   这样所有既有调用点（顶部右侧、计划页、统计页）自动获得新口径，
   无需逐处修改。
   ============================================================ */
function calcCheckinStats(){
  return globalCheckinStats();
}
/* 旧的扁平口径（仅读 studyLog），保留供个别需要严格历史值的场景 */
function calcCheckinStatsLegacy(){
  const days = Object.keys(S.studyLog).filter(d=>{
    const x = S.studyLog[d];
    return x && ((x.sec||0) > 0 || (x.q||0) > 0 || (x.sl||0) > 0);
  }).sort();
  const total = days.length;
  let maxStreak = 0, curStk = 0, prev = null;
  days.forEach(d=>{
    if(prev){
      const pd = new Date(prev), nd = new Date(d);
      const diff = Math.round((nd - pd)/86400000);
      curStk = (diff === 1) ? curStk + 1 : 1;
    } else curStk = 1;
    if(curStk > maxStreak) maxStreak = curStk;
    prev = d;
  });
  let streak = 0;
  const set = new Set(days);
  const check = new Date();
  if(!set.has(dstr(check))) check.setDate(check.getDate() - 1);
  while(set.has(dstr(check))){ streak++; check.setDate(check.getDate() - 1); }
  return {total, maxStreak, streak};
}


/* ============================================================
   冻结栏：单行不换行 + 自适应降级
   ------------------------------------------------------------
   降级顺序（仅在 11px 后仍超宽时执行）：
     ① 取消「连续打卡」冻结项（lv1）
     ② 时间精度：年月日时分秒 → 月日时分秒 → 时分秒 → 时分（lv1~lv4）
     ③ 兜底：考试名称过长时启用内部省略号（lv5）
   页面宽度恢复时逐次升级（反向逐级还原）
   ============================================================ */
let STICKY_FIT_LV = 0;         // 0=完整 1=去周+去连续 2=月日时分秒 3=时分秒 4=时分 5=考试名省略
let STICKY_CTX = null;         // 当前冻结栏数据上下文

function stickyClockStr(level){
  const n = new Date();
  const w = '日一二三四五六'[n.getDay()];
  const y = n.getFullYear();
  const hm = pad2(n.getHours())+':'+pad2(n.getMinutes());
  const hms = hm + ':' + pad2(n.getSeconds());
  const md = (n.getMonth()+1)+'月'+n.getDate()+'日';
  const ymd = y + '年' + md;
  // 层级越宽越小（严格单调），保证降级/升级都能逐级命中：
  //  0  ：年月日 + 周 + 时分秒（完整）
  //  1  ：年月日 + 时分秒（去周，仍长；与 lv0 的差别还包含去掉「连续打卡」）
  //  2  ：月日 + 时分秒
  //  3  ：时分秒
  //  4+ ：时分
  if(level >= 4) return hm;
  if(level === 3) return hms;
  if(level === 2) return md + ' ' + hms;
  if(level === 1) return ymd + ' ' + hms;
  return ymd + ' 周' + w + ' · ' + hms;
}
function buildStickyCd(nearest, nd, st){
  STICKY_CTX = { nearest, nd, st: st || {streak:0} };
  const lv = STICKY_FIT_LV;
  let sh = '';
  if(nearest){
    const warn = nd <= 30;
    sh += '<span class="mini-cd mini-exam'+(warn?' warn':'')+'">'+icon('countdown',14)+' <span class="mx-nm">'+esc(nearest.name)+'</span> · '+(nd===0?'今天':nd+' 天')+'</span>';
  } else {
    sh += '<span class="mini-cd">'+icon('countdown',14)+' 未设置考试</span>';
  }
  sh += '<span class="mini-cd" id="clockChip">'+icon('cal',14)+' <span id="clockText">'+stickyClockStr(lv)+'</span></span>';
  if(lv === 0 && st){
    sh += '<span class="mini-cd">'+icon('bolt',14)+' 连续 '+st.streak+' 天</span>';
  }
  return sh;
}
/* 检测是否溢出：用子元素实际占用宽度之和判断
   （overflow:hidden 下 scrollWidth 恒等于 clientWidth，不可靠）。
   考试胶囊默认不截断，因此 getBoundingClientRect().width 即真实占用；
   仅在进入 lv6（截断兜底）后该胶囊才启用省略号。 */
function stickyOverflow(){
  const sc = $('#stickyCd');
  if(!sc) return false;
  const cs = getComputedStyle(sc);
  const padL = parseFloat(cs.paddingLeft)||0, padR = parseFloat(cs.paddingRight)||0;
  const gap = parseFloat(cs.columnGap || cs.gap) || 0;
  const kids = Array.from(sc.children);
  if(!kids.length) return false;
  let sum = 0;
  kids.forEach(k=>{ sum += k.getBoundingClientRect().width; });
  sum += gap * (kids.length - 1) + padL + padR;
  const avail = sc.clientWidth;
  return sum > avail + 1;
}
/* 按指定层级重建冻结栏（用于降级/升级切换） */
function renderStickyAtLevel(lv){
  const sc = $('#stickyCd');
  if(!sc || !STICKY_CTX) return;
  STICKY_FIT_LV = lv;
  // lv1 及以上：去掉「连续打卡」；其余层级仅时间精度不同
  sc.innerHTML = buildStickyCd(STICKY_CTX.nearest, STICKY_CTX.nd, STICKY_CTX.st);
  document.body.classList.toggle('sticky-tight', lv >= 5);
}
/* 先降到"刚好放下"的最高精度层级，再尝试逐级升级；宽度恢复时自动还原 */
function fitStickyCd(){
  const sc = $('#stickyCd');
  if(!sc || !STICKY_CTX) return;
  // ① 先按当前层级判断；若溢出则逐级降级（最多到 lv6）
  let guard = 0;
  while(stickyOverflow() && STICKY_FIT_LV < 5 && guard++ < 10){
    renderStickyAtLevel(STICKY_FIT_LV + 1);
  }
  // ② 若当前层级过宽，尝试逐级升级（宽度恢复时的还原），只要升级后仍不溢出就采用
  guard = 0;
  while(STICKY_FIT_LV > 0 && guard++ < 10){
    const keepLv = STICKY_FIT_LV;
    const keepHtml = sc.innerHTML;
    const keepTight = document.body.classList.contains('sticky-tight');
    renderStickyAtLevel(keepLv - 1);
    if(stickyOverflow()){
      // 升级后放不下 → 回滚
      STICKY_FIT_LV = keepLv;
      sc.innerHTML = keepHtml;
      document.body.classList.toggle('sticky-tight', keepTight);
      break;
    }
  }
}
let stickyFitTimer = null;
function scheduleStickyFit(){
  clearTimeout(stickyFitTimer);
  stickyFitTimer = setTimeout(()=>{ fitStickyCd(); }, 60);
}

function tickClock(){
  const el = document.getElementById('clockText');
  if(!el) return;

  el.textContent = stickyClockStr(typeof STICKY_FIT_LV === 'number' ? STICKY_FIT_LV : 0);

function startClock(){
  const schedule = ()=>{
    const now = new Date();
    // 距离下一个整秒的毫秒数，保证与系统时间对齐
    const delay = 1000 - (now.getMilliseconds() % 1000);
    setTimeout(()=>{
      try{ tickClock(); }catch(e){}
      startClock();
    }, delay);
  };
  schedule();
}

/* 心情栏自适应（字号驱动版）
   ============================================================
   ① 心情栏字号模型 --fs-mood（按「心情栏可用宽度」逐段插值）
   ------------------------------------------------------------
   设计约束（用户约定，经实测校准）：
     · 字号范围：最大 17px、最小 12px，随可用宽度单调变化，段内线性平滑
     · 可用宽度 420px = 「去掉小图标」的分界（窄于此去图标单行）
     · 两行态字号恒为全过程最小值 12px（用户约定：2 行字号 = 整个降级过程最小字体）
   实测校准（标签「开心/平静/忙碌/努力/摸鱼/糟糕/幸运 的一天」，
             字号口径为 --fs-mood，标签 = --fs-mood − 1px）：
     带图标单行 L0 所需最小宽度：17px→628px，12px→508px（约 24.4px 宽 / 1px 字号）
     去图标单行 L1 所需最小宽度：17px→494px，12px→408px（约 17.2px 宽 / 1px 字号）
   据此反解：
     · 要让"带图标单行"恰好在 420px 处放不下（即 420 去图标），
       该处字号须为 12.5px —— 这就是曲线在 420 点取 12.5 的原因。
     · 260px 处连 12px 的去图标单行（需 408px）都放不下 → 必然两行；
       实际"两行 → 去图标单行"的恢复点约在 408px（12px 最小字号的几何极限）。
     · ≥650px 才容得下 17px 带图标单行（topbar 中列最宽约 569px，
       故实际页面上字号上限会被"能不能放下"进一步钳制，见 ② 的二分适配）。

   分段（可用宽度 → --fs-mood 曲线上限）：
     ≥ 650px            → 17px
     650 ~ 420px 线性   → 17 ~ 12.5px
     420 ~ 260px 线性   → 12.5 ~ 12px
     ≤ 260px            → 12px（最小；两行态）
   ============================================================ */
const MOOD_FS_BREAKS = [
  { w: 260, fs: 12.0 },   // ≤260：最小 12px（也是两行态字号）
  { w: 420, fs: 12.5 },   // 420：恰好"去图标"的临界字号
  { w: 650, fs: 17.0 }    // ≥650：最大 17px
];
const MOOD_FS_MIN = 12;   // 降级全过程最小字号（= 两行态字号）
const MOOD_FS_MAX = 17;   // 降级全过程最大字号
/* 由可用宽度求字号：段内线性插值，两端钳制 */
function moodFontSizeFor(avail){
  const b = MOOD_FS_BREAKS;
  if(!(avail > 0) || !isFinite(avail)) return MOOD_FS_MAX;
  if(avail <= b[0].w) return Math.max(MOOD_FS_MIN, b[0].fs);   // 过窄 → 最小字号
  for(let i = 0; i < b.length - 1; i++){
    const lo = b[i], hi = b[i + 1];
    if(avail >= lo.w && avail <= hi.w){
      const t = (avail - lo.w) / (hi.w - lo.w);                // 0 → 1
      return lo.fs + t * (hi.fs - lo.fs);
    }
  }
  return Math.min(MOOD_FS_MAX, b[b.length - 1].fs);            // 够宽 → 最大字号
}
/* _moodFsWritten：记录已写入的字号（保留一位小数），变化 <0.1px 时不重复写，
   减少 reflow；读写都集中在 fitMoodRow 内完成。 */
let _moodFsWritten = null;

/* 离屏测量：把心情栏克隆到隐藏容器里，用真实渲染结果判断需要几行。
   为什么不用"估算字宽"：中英混排/emoji/grid 列宽的实际值与估算总有偏差，
   在临界宽度上会来回抖动；克隆渲染是零误差的，且不影响页面可见布局。 */
let _moodProbe = null;
function _getMoodProbe(){
  if(_moodProbe && document.body.contains(_moodProbe)) return _moodProbe;
  const p = document.createElement('div');
  p.setAttribute('aria-hidden','true');
  p.style.cssText = 'position:absolute!important;left:-99999px!important;top:0!important;'
    + 'visibility:hidden!important;pointer-events:none!important;z-index:-1!important;';
  document.body.appendChild(p);
  _moodProbe = p;
  return p;
}/* 返回该级别下，克隆渲染的实际行数。
   关键 1：probe 必须带上与真实心情栏相同的 --fs-mood，否则测量用的字号与实际不符，
   会在临界宽度上误判（字号越大越容易拆行）。
   关键 2：probe 必须禁用所有 transition —— 否则字号/宽度刚改完就测量，
   getBoundingClientRect 会读到过渡动画的"中间值"，造成幽灵误差。 */
function _moodProbeLines(avail, level, fsPx){
  const wrap = document.querySelector('.mood-wrap');
  const row  = $('#moodRow');
  if(!wrap || !row) return 99;
  const probe = _getMoodProbe();
  probe.className = 'mood-probe mood-wrap' + (level >= 1 ? ' mood-noico' : '') + (level >= 2 ? ' mood-split' : '');
  probe.style.width = Math.max(0, avail) + 'px';
  if(fsPx > 0) probe.style.setProperty('--fs-mood', fsPx + 'px');
  else probe.style.removeProperty('--fs-mood');
  probe.innerHTML = '<div class="mood-row">' + row.innerHTML + '</div>';
  const pr = probe.querySelector('.mood-row');
  const kids = Array.from(pr.children);
  if(!kids.length) return 99;
  // 按 top 归并成行（4px 容差，消除亚像素误差）
  const tops = [];
  kids.forEach(k=>{
    const t = k.getBoundingClientRect().top;
    if(!tops.some(x=>Math.abs(x-t) < 4)) tops.push(t);
  });
  return tops.length;
}
/* 心情栏可用宽度基准
   注意：不能直接用 .tb-center 的 clientWidth —— topbar 在 700px 有响应式断点
   （三列 → "left right / center center"），.tb-center 宽度会从 ~363px 骤变到 ~676px，
   导致心情栏级别在断点两侧 L0↔L2 来回跳。
   改用 body 上的 --cw（内容可用宽度，已随侧边栏自适应，随视口线性变化），
   再减去 topbar 的左右内边距，得到平滑、单调的可用宽度基准。 */
function moodAvailWidth(){
  const tb = document.getElementById('topbar');
  const wrap = document.querySelector('.mood-wrap');
  if(!tb) return Math.max(120, document.documentElement.clientWidth - 40);
  // ① topbar 内容盒宽度（随视口线性变化，无断点跳变）
  const ts = getComputedStyle(tb);
  const bd = (parseFloat(ts.borderLeftWidth)||0) + (parseFloat(ts.borderRightWidth)||0);
  const tbW = tb.getBoundingClientRect().width
            - (parseFloat(ts.paddingLeft)||0) - (parseFloat(ts.paddingRight)||0) - bd - 10;
  // ② center 列实际宽度（>700px 时受左右两列挤压，是真实可用宽度）
  const mid = wrap ? wrap.closest('.tb-center') : null;
  let centerW = Infinity;
  if(mid){
    const ms = getComputedStyle(mid);
    centerW = mid.clientWidth - (parseFloat(ms.paddingLeft)||0) - (parseFloat(ms.paddingRight)||0);
  }
  // 取较小值：
  //  · >700px：center 列被挤压，centerW 更小 → 用它（真实可用）
  //  · ≤700px：center 列独占整行会虚高 → tbW 更小 → 用它（平滑基准）
  // 这样既贴合真实排版，又不会在 700px 断点处出现可用宽度骤变。
  return Math.max(120, Math.min(tbW, centerW));
}
/* ② 二分适配：在 [MOOD_FS_MIN, cap] 内找出该级别下"仍能单行"的最大字号。
   用离屏克隆实测（零误差、且自动适配任何文案/字体/内边距改动）：
     · 最小字号都放不下 → 返回 -1（该级别不可用）
     · 上限字号就放得下 → 直接返回 cap（字号由平滑曲线决定）
     · 否则二分逼近临界字号
   关键：迭代次数必须够多（12 次 → 分辨率 (cap−12)/2^12 ≈ 0.0012px）。
     _moodProbeLines 对"字号"是个阶跃函数（标签要么整体放得下、要么换行），
     所以真实临界字号是台阶状的；若二分收敛不够紧，返回的 lo 会在台阶边缘
     上下浮动 ~0.08px，再经 0.1px 取整后就表现为"页面变窄、字号反而 +0.1px"的抖动。
     12 次迭代让 lo 紧贴台阶下沿，彻底消除这种亚像素抖动。
   每次 fit 最多 2×14 次离屏测量，均为 8 节点小布局，开销可忽略。 */
const MOOD_FIT_BISECT_ITERS = 12;
function _moodLargestFitting(avail, level, cap){
  if(cap < MOOD_FS_MIN) cap = MOOD_FS_MIN;
  if(_moodProbeLines(avail, level, MOOD_FS_MIN) > 1) return -1;  // 最小字号也放不下
  if(_moodProbeLines(avail, level, cap) <= 1) return cap;        // 曲线字号直接可用
  let lo = MOOD_FS_MIN, hi = cap;
  for(let i = 0; i < MOOD_FIT_BISECT_ITERS; i++){
    const mid = (lo + hi) / 2;
    if(_moodProbeLines(avail, level, mid) <= 1) lo = mid; else hi = mid;
  }
  return lo;
}
/* 心情栏降级主入口
   级别：0=带图标单行  1=去图标单行  2=两行(4+3)
   每级配各自的字号：
     · L0/L1：min(平滑曲线字号, 该宽度下实际放得下的最大字号) —— 二分实测
     · L2 ：恒为 MOOD_FS_MIN(12px)，即整个降级过程的最小字号
   降级链（变窄）：带图标单行(缩字号) → 420 附近去图标(继续缩) → 实在放不下拆两行(12px)
   升级链（变宽）：完全反向，字号逐级平滑放大

   ★ 纯函数保证（消除"路径依赖"抖动）
   字号与级别必须只由「当前可用宽度 avail」唯一决定，否则会出现同一宽度下
   先窄后宽 / 先宽后窄 得到不同字号的问题（实测：1159px 时 fs=15.2，但从更宽侧
   回落到 1159px 时 fs=14.5 —— 因为侧边栏收起/展开会让 .tb-center 列的过渡宽度
   滞后一两帧，fitMoodRow 读到了过渡中间值）。
   做法：缓存 lastAvail → {lv, fs}。avail 与上次一致（±0.5px 内视为同一宽度）时
   直接复用上次结果，不再重新二分；avail 变化时重算并更新缓存。
   这样"同宽度 → 同结果"恒成立，配合 avail 随视口单调，字号也就严格单调。 */
let _moodFitCacheAvail = null;
let _moodFitCacheLv = null;
let _moodFitCacheFs = null;
function fitMoodRow(){
  const wrap = document.querySelector('.mood-wrap');
  if(!wrap) return;
  const avail = moodAvailWidth();
  if(avail <= 0) return;
  let lv, fs;
  if(_moodFitCacheAvail !== null && Math.abs(avail - _moodFitCacheAvail) < 0.5){
    // 同一可用宽度 → 直接复用上次结果（保证"同宽度必同结果"）
    lv = _moodFitCacheLv;
    fs = _moodFitCacheFs;
  }else{
    const fsCap = moodFontSizeFor(avail);                    // 平滑曲线上限
    lv = 0; fs = _moodLargestFitting(avail, 0, fsCap);       // 先试带图标单行
    if(fs < 0){ lv = 1; fs = _moodLargestFitting(avail, 1, fsCap); }  // 再试去图标单行
    if(fs < 0){ lv = 2; fs = MOOD_FS_MIN; }                  // 最后拆两行（12px 恒定）
    _moodFitCacheAvail = avail;
    _moodFitCacheLv = lv;
    _moodFitCacheFs = fs;
  }
  // 应用级别（未变则不动类名，避免抖动）
  const cur = wrap.classList.contains('mood-split') ? 2
            : (wrap.classList.contains('mood-noico') ? 1 : 0);
  if(cur !== lv){
    wrap.classList.remove('mood-noico','mood-split');
    if(lv >= 1) wrap.classList.add('mood-noico');
    if(lv >= 2) wrap.classList.add('mood-split');
  }
  // 应用字号（向下取整到 0.1px —— 不能四舍五入！
  //   二分找出的临界字号向上取整会超过"恰好放得下"的边界，导致真实渲染溢出换行）
  const fsR = Math.floor(fs * 10) / 10;
  if(_moodFsWritten !== fsR){
    _moodFsWritten = fsR;
    wrap.style.setProperty('--fs-mood', fsR + 'px');
  }
  // 拆行态：重算「的一天」字符级对齐（字号变化后占位宽度也要跟着算）
  if(lv === 2) requestAnimationFrame(alignMoodTail);
}
/* 「的一天」字符级对齐（仅拆行态需要；单行态紧随「幸运」之后无需对齐）
   目标：
     ·「的」左缘 与「努力」中「努」的左缘对齐
     ·「一」左缘 与「努力」中「力」的左缘对齐（字号与标签一致时随上一条件自动成立）
     ·「天」允许向右超出第一行四个标签的总长度
   做法：实测「努力」文本框左缘与「的一天」当前左缘之差，换算成 margin-left 偏移；
        布局占位宽度设为"两字宽"（overflow:visible），第三字「天」溢出显示，
        因此不会把 Grid 列宽撑开、也就不会连累第一行标签被拉宽。 */
function alignMoodTail(){
  const row  = $('#moodRow');
  const wrap = row ? row.parentElement : null;
  const tail = row ? row.querySelector('.mood-tail') : null;
  if(!row || !tail || !wrap) return;
  if(!wrap.classList.contains('mood-split')){        // 单行态：清除动态样式
    tail.style.left = '';
    tail.style.width = '';
    return;
  }
  const chips = $$('#moodRow .mood-chip');
  if(!chips.length) return;
  // 「努力」= 拆行态下【第一行的最后一个】标签。
  // 注意不能简单取 chips[length-2]：DOM 顺序是
  //   开心 平静 忙碌 努力 | 摸鱼 糟糕 [幸运]  ← 幸运嵌在 .mood-last 里
  // 所以 chips[length-2] 会落到第二行的「糟糕」上。改为按视觉位置（top 最小的一行）判定。
  let firstTop = Infinity;
  chips.forEach(c => { const t = c.getBoundingClientRect().top; if(t < firstTop) firstTop = t; });
  const firstLine = chips.filter(c => Math.abs(c.getBoundingClientRect().top - firstTop) < 6);
  const effort = firstLine[firstLine.length - 1];
  if(!effort) return;
  const ecs = getComputedStyle(effort);
  const gap = parseFloat(getComputedStyle(row).columnGap) || 0;
  const chW = parseFloat(ecs.fontSize) || 11;                         // 标签字宽（等宽中文 = 字号）
  // 「努力」的文本左缩进（左内边距 + 左边框）
  const inset = (parseFloat(ecs.paddingLeft) || 0) + (parseFloat(ecs.borderLeftWidth) || 0);
  // 「的一天」自身字宽（比标签大 1px）：用于让「的」「一」「天」各字符精确落位，
  // 布局占位仍按"两字"计算（第 3 字「天」溢出显示）。
  const tailFs = parseFloat(getComputedStyle(tail).fontSize) || chW;

  // ① 布局占位宽 = "两字"（按「的一天」自身字号）：让「的一」参与 Grid 列宽，
  //    第 3 字「天」溢出显示（不换行、不裁剪），
  //    这样「天」不会撑开整列、也就不会连累第一行的标签被拉宽。
  tail.style.width = (tailFs * 2 + 1).toFixed(2) + 'px';

  // ② 纯视觉位移（position:relative + left，不参与布局流）
  //    拆行态布局固定为：
  //      第一行：[开心][平静][忙碌][努力]        ← 「努力」在第 4 列
  //      第二行：[摸鱼][糟糕] [幸运 + 的一天]     ← 「的一天」紧跟第 3 列的「幸运」
  //    「的一天」自然左缘 = 「幸运」外框右缘 = 第3列左 + chipW
  //    目标左缘           = 「努力」文本左缘 = 第4列左 + inset
  //    相减：(第4列左 + inset) - (第3列左 + chipW)
  //        = [(第3列左 + chipW + gap) + inset] - (第3列左 + chipW)
  //        = gap + inset
  //    只含"列间距"与"标签内缩"两个稳定量，与行宽/居中方式无关，一次即可精确对齐。
  //    注意「的一天」比标签大 1px，故「一」的左缘会随「的」对齐后产生 +1px 的
  //    累积偏移（「的天」右缘再多 1px）；这是"字号大 1px"的必然几何结果。
  tail.style.position = 'relative';
  tail.style.left = (gap + inset).toFixed(2) + 'px';
}

function statBox(num, label){

}
/* ============================================================
   ★ 自适应统计卡片行（需求 4/5/7：卡片缩小 · 同一行 · 字号随宽度缩放）
   ------------------------------------------------------------
   与 statBox 的区别：
     · 强制「同一行」显示（grid 固定列数，永不换行、不折到第二行）
     · 卡片内数字字号随可用宽度缩放：
         上限 = --fs-num * 0.72（与普通 stat 卡片一致，视觉统一）
         下限 = --fs-card（板块标题字号，需求明确要求的下限）
     · 标签字号同步缩放，下限 10px（保证仍清晰可辨），数字 : 标签 ≈ 1.9 : 1
   实现：用 CSS 变量 --statN 传入列数，--statScale 由 clamp 控制缩放，
        全部交给 CSS 计算，无需 JS 逐帧干预，天然平滑。
   ============================================================ */
function statRow(items, opt){
  opt = opt || {};
  const n = Math.max(1, items.length);
  const minLb = opt.minLabel || 10;      // 标签最小字号
  // 数字随宽度缩放：可用宽度越大越接近上限；下限锁死为板块标题字号
  const numCss = 'clamp(var(--fs-card), calc(var(--fs-num) * .72), calc(var(--fs-num) * .72))';
  // 用容器宽度驱动：--statN 列 → 每列宽度 ≈ 容器/N，字号按列宽线性插值
  const cells = items.map(it=>
    '<div class="stat-a" style="--lb-min:'+minLb+'px;">'+
      '<div class="num">'+it.v+'</div>'+
      '<div class="lb">'+it.k+'</div>'+
    '</div>'
  ).join('');
  return '<div class="stat-row" style="--statN:'+n+';">'+cells+'</div>';
}

  pct = Math.max(0, Math.min(100, Math.round(pct)));

   路由
   ============================================================ */
var PAGES = {};

// 换一批等操作：重渲染但保持当前页面滚动位置

  SUPPRESS_SCROLL = true;

/* ============================================================
   ★ 页面停留计时引擎（需求 7(4) / 8）
   ------------------------------------------------------------
   规则：
     · 进入某功能菜单后开始记录；连续停留超过 15 秒才开始计入
       （前 15 秒不计，避免快速切换菜单污染时长）
     · 切换功能菜单立即结算并停止记录；切回后重新满足 15 秒再继续累计
     · 刷题计时器计时中 / 套卷计时中 → 暂停页面停留计时
       （该时间已计入对应板块的 timer/paper 字段，避免重复计入）
     · 每 30 秒自动落账一次（防止意外关闭页面丢失已停留时长）
     · 页面关闭前结算（beforeunload）
   时长写入 boardLog[菜单id][今日].page 字段。
   ============================================================ */
const DWELL_THRESHOLD_SEC = 15;
const _dwell = { board:null, enterAt:0, paidAt:0, timer:null, ticker:null, lastTimerSec:0 };

/* 需求 7 / R1：以下大类的页面停留不计入学习时长
   —— 计划类（倒计时/每日计划/周计划/月计划/整体计划）与统计分析类全部菜单
   注意：菜单 id 必须与导航定义完全一致（旧版本误写 'cd'/'plan'，
   导致计划类停留被累计进各板块，R1 已修正并在 loadState 做存量清理）。 */
const DWELL_EXCLUDE = new Set([
  'countdown','daily','review','weekly','monthly','overall','gantt',
  'st-daily','st-week','st-month','st-year','st-total'
]);
function dwellExcluded(board){ return DWELL_EXCLUDE.has(board); }

/* 需求 6：刷题计时器（T）/ 套卷计时（PP）运行中 → 页面停留必须暂停
   注意：暂停判定要「实时」读 T.running / PP.running，
   不能依赖 dwellFlush 的 30s 周期，否则中途开始计时仍会被计入。 */
function dwellPaused(){
  return !!(T && T.running) || !!(PP && PP.running);
}
/* 当前这一格「未落账」的停留秒数（仅用于实时显示，不写库） */
function dwellPending(){
  if(!_dwell.board || dwellExcluded(_dwell.board) || dwellPaused()) return 0;
  const now = Date.now();
  const payFrom = Math.max(_dwell.paidAt, _dwell.enterAt + DWELL_THRESHOLD_SEC*1000);
  const v = (now - payFrom) / 1000;
  return v > 0 ? v : 0;
}
function dwellFlush(){
  if(!_dwell.board) return;
  const now = Date.now();
  if(dwellPaused() || dwellExcluded(_dwell.board)){
    _dwell.paidAt = now;                      // 暂停期 / 排除类不计（paidAt 前移跳过）
    return;
  }
  // 只计「超过 15 秒之后」的部分：计费起点 = max(paidAt, enterAt+15s)
  const payFrom = Math.max(_dwell.paidAt, _dwell.enterAt + DWELL_THRESHOLD_SEC*1000);
  const unpaid = (now - payFrom) / 1000;
  if(unpaid >= 1) addBoardSec(_dwell.board, 'page', unpaid);
  _dwell.paidAt = now;
}
function dwellEnter(board){
  if(_dwell.board === board) return;         // 同页重渲染不重置会话
  dwellLeave();
  _dwell.board = board;
  _dwell.enterAt = Date.now();
  _dwell.paidAt = Date.now();
  _dwell.timer = setInterval(dwellFlush, 30000);
}
function dwellLeave(){
  try{ dwellFlush(); }catch(e){}
  if(_dwell.timer){ clearInterval(_dwell.timer); _dwell.timer = null; }
  _dwell.board = null;
}
window.addEventListener('beforeunload', ()=>{ try{ dwellFlush(); }catch(e){} });

/* ============================================================
   【P2 存储架构升级】异步存储时代的「落盘兜底」
   ------------------------------------------------------------
   IDB 写盘是异步的，且 save() 默认有 180ms 防抖，
   因此下面两个时机必须主动兜一次，避免「刚改完就关页面 → 变更丢失」：
     · visibilitychange → hidden（切后台 / 切标签 / 关页面前）
     · beforeunload（兜底；部分浏览器不保证异步完成，但能跑就尽力写）
   策略：仅当内存脏标记 S.__dirty 为真时写一次；
        不 await（让 IDB 事务在后台继续跑），失败已由 safeSaveFull 内部提示。
   ============================================================ */
function flushDirtyNow(reason){
  try{
    if(!S || !S.__dirty) return;
    clearTimeout(saveTimer);
    /* 不 await：IDB 事务会继续执行；这里只需「发起」写入 */
    try{ safeSaveFull(); }catch(e){ console.warn('[flushDirtyNow] 调度失败', reason, e); }
  }catch(e){ console.warn('[flushDirtyNow]', e); }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden') flushDirtyNow('visibilitychange');
});
window.addEventListener('beforeunload', ()=>{ flushDirtyNow('beforeunload'); });

/* ============================================================
   需求 2：各功能菜单「今日学习时长」实时刷新
   ------------------------------------------------------------
   · 页面停留按秒累加并即时反映在卡片上，无需切换菜单或结束刷题
   · 显示值 = 已落账三源合计 + 当前未落账的停留增量
   · 只更新 DOM 文本，不重渲染整页（不影响输入框/滚动位置）
   ============================================================ */
function liveDaySecValue(board){
  const base = boardDaySec(boardDay(board, todayStr()));
  let v = base;
  if(board === _dwell.board) v += dwellPending();
  /* R3：刷题计时器运行中，本板块「今日学习时长」不停止——
     实时叠加 本次刷题已记题目秒数 + 当前题进行中秒数；
     结束刷题后时长已一次性落入 timer 字段且 T.running=false，
     此处自动归零，不会重复加计时器时长。 */
  v += timerLiveSec(board);
  return v;
}
/* R3：刷题计时器本次会话的实时秒（仅 T.running 时非 0，且只算计时器所属板块） */
function timerLiveSec(board){
  try{
    if(!T || !T.running) return 0;
    const bd = boardByModule(T.cat) || boardIdOf(cur) || 'xc';
    if(bd !== board) return 0;
    let done = 0;
    (T.qLog || []).forEach(q=>{ done += (Number(q.actualSeconds) || 0); });
    const curQ = (T.qStart > 0) ? (Date.now() - T.qStart) / 1000 : 0;
    return done + Math.max(0, curQ);
  }catch(e){ return 0; }
}
function liveTick(){
  const el = document.getElementById('liveDaySec');
  if(!el) return;
  const board = el.dataset.board;
  if(!board) return;
  const v = Math.round(liveDaySecValue(board));
  const txt = fmtClock(v);
  if(el.textContent !== txt) el.textContent = txt;
  /* 同步刷新同板块内的进度条百分比（>100% 时切彩虹） */
  try{ liveRefreshProgress(board, v); }catch(e){}
  /* R3：计时器运行中，计时器卡片「今日学习」（仅本板块计时器口径）同步实时跳动：
     已落账 timer 字段 + 本次会话实时秒；结束后 running=false，只剩已落账部分。 */
  try{
    const tm = document.getElementById('tmDaySec');
    if(tm && T && T.running){
      const bd = boardByModule(T.cat) || boardIdOf(cur) || 'xc';
      const rec = boardDay(bd, todayStr());
      const tv = Math.round((rec.timer || 0) + timerLiveSec(bd));
      const tt = fmtClock(tv);
      if(tm.textContent !== tt) tm.textContent = tt;
    }
  }catch(e){}
}
/* 只改进度条宽度与百分比文本，避免整页重渲染 */
function liveRefreshProgress(board, sec){
  const goal = boardGoalSec(board);
  if(!(goal > 0)) return;
  const raw = sec / goal * 100;
  const over = raw > 100;
  const bar = document.querySelector('#content .pbar[data-livegoal]');
  const pctEl = document.querySelector('#content [data-livepct]');
  if(bar){
    const fill = bar.querySelector('i');
    if(fill) fill.style.width = (over ? 100 : Math.max(0, Math.min(100, raw))) + '%';
    bar.classList.toggle('rainbow', over);
  }
  if(pctEl) pctEl.textContent = Math.round(raw) + '%';
  const sideEl = document.querySelector('#content [data-liveside]');
  if(sideEl) sideEl.textContent = fmtClock(sec)+' / '+fmtClock(goal);
}
function liveStart(){
  if(_dwell.ticker) return;
  _dwell.ticker = setInterval(liveTick, 1000);
}
function liveStop(){
  if(_dwell.ticker){ clearInterval(_dwell.ticker); _dwell.ticker = null; }
}

function renderPage(){
  try{ dwellEnter(boardIdOf(cur)); }catch(e){}
  try{ liveStart(); }catch(e){}
  const fn = PAGES[cur];
  const content = $('#content');
  if(!fn){
    content.innerHTML = '<div class="card"><div class="empty"><span class="eico">🚧</span>该模块正在建设中</div></div>';
    return;
  }
  try{
    const r = fn();
    /* 【P1】切页前释放上一页创建的 objectURL，防止内存累积 */
    try{ revokeImgsIn(content); }catch(e){ console.warn(e); }
    content.innerHTML = r.html;
    if(r.bind) try{ r.bind(); }catch(e){ console.warn(e); }
    /* 【P1】占位图异步补 src（页面函数保持同步，见 hydrateImgs 注释） */
    hydrateImgs(content);
  }catch(err){
    console.error(err);
    content.innerHTML = '<div class="card"><div class="empty"><span class="eico">😿</span>页面渲染出错了，请刷新重试</div></div>';
  }
  if(firstRender){
    firstRender = false;
    window.scrollTo({top: 0, behavior: 'auto'});
  } else if(SUPPRESS_SCROLL){
    SUPPRESS_SCROLL = false; // 保持当前位置，不滚动
  } else {
    requestAnimationFrame(()=>{ scrollToContentTop(false); });
  }
  try{ bunnyPrime(); }catch(e){ /* 兔头导航刷新失败不影响页面 */ }
}

PAGES.countdown = function(){
  const q = MAO_QUOTES[dayOfYear() % MAO_QUOTES.length];
  let list = '';
  if(S.exams.length === 0){
    list = emptyBox('countdown', '还没有添加考试，点击下方按钮添加吧');
  } else {
    const sorted = S.exams.slice().sort((a,b)=>{
      const da = daysUntil(a.date), db = daysUntil(b.date);
      return (da===null?99999:da) - (db===null?99999:db);
    });
    sorted.forEach(e=>{
      const d = daysUntil(e.date);
      const warn = d !== null && d <= 30 && d >= 0;
      const isPin = S.pinnedExamId === e.id;
      list += '<div class="li'+(warn?' overdue':'')+'">'+
        '<div style="flex:1;min-width:130px;">'+
          '<div style="font-weight:800;font-size:var(--fs-body);">'+esc(e.name)+'</div>'+
          '<div style="font-size:calc(var(--fs-btn) - 1px);color:var(--text2);display:flex;align-items:center;gap:4px;">'+icon('cal',12)+' '+esc(e.date)+'</div>'+
        '</div>'+
        '<span class="pill'+(warn?' coral':'')+'">'+(d===null?'--':(d<0?'已结束':(d===0?'就是今天！':d+' 天')))+'</span>'+
        '<button class="btn sm '+(isPin?'primary':'ghost')+'" data-pin="'+e.id+'">'+icon('pin',12)+' '+(isPin?'已固定':'固定')+'</button>'+
        '<button class="btn sm danger" data-del="'+e.id+'">'+icon('del',12)+'</button>'+
      '</div>';
    });
  }
  return {
    html:
      '<div class="card">'+
        '<div class="card-title">'+titleIco('book')+' 今日毛选金句 <span class="sub">每日更新</span></div>'+
        '<div style="font-size:calc(var(--fs-body) + 1px);line-height:1.9;color:var(--text);font-weight:600;">「'+esc(q.t)+'」</div>'+
        '<div style="text-align:right;color:var(--text2);font-size:var(--fs-btn);margin-top:8px;">—— '+esc(q.s)+'</div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title">'+titleIco('countdown')+' 我的考试倒计时 <span class="sub">共 '+S.exams.length+' 场</span></div>'+
        list+
        '<div class="btn-row" style="margin-top:12px;justify-content:center;">'+
          '<button class="btn primary" id="addExamBtn">'+icon('plus',14)+' 添加考试</button>'+
        '</div>'+
      '</div>'+
      encourageBar('countdown'),
    bind(){
      $('#addExamBtn').addEventListener('click', ()=>{
        openModal('⏳ 添加考试倒计时',
          '<div class="field"><label>考试名称</label><input class="inp" id="exName" placeholder="例如：2026国考"></div>'+
          '<div class="field"><label>考试日期</label><input class="inp" type="date" id="exDate" value="'+todayStr()+'"></div>',
          [{text:'添加', primary:true, onClick:()=>{
            const n = $('#exName').value.trim();
            const d = $('#exDate').value;
            if(!n){ toast('请输入考试名称'); return false; }
            if(!d){ toast('请选择考试日期'); return false; }
            S.exams.push({id:uid(), name:n, date:d});
            save(true); renderTopbar(); renderPage();
            toast('已添加考试倒计时 ⏳');
          }},{text:'取消'}]);
      });
      $$('#content [data-del]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const id = b.dataset.del;
          if(!confirm('确定删除该考试？')) return;
          S.exams = S.exams.filter(x=>x.id !== id);
          if(S.pinnedExamId === id) S.pinnedExamId = null;
          save(true); renderTopbar(); renderPage();
        });
      });
      $$('#content [data-pin]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const id = b.dataset.pin;
          S.pinnedExamId = (S.pinnedExamId === id) ? null : id;
          save(true); renderTopbar(); renderPage();
          toast(S.pinnedExamId ? '已固定到页面上部 📌' : '已取消固定');
        });
      });
    }
  };
};

/* ============================================================
   计划模块（每日 / 周 / 月 / 整体）
   ============================================================ */
const PLAN_META = {
  daily:  {name:'每日计划', icon:'daily',  key:'daily',  dateLabel:'计划日期'},
  weekly: {name:'周计划',   icon:'cal',    key:'weekly', dateLabel:'所在周（选择本周任意日期）'},
  monthly:{name:'月计划',   icon:'moon',   key:'monthly',dateLabel:'所在月（选择本月任意日期）'},
  overall:{name:'整体计划', icon:'target', key:'overall',dateLabel:'计划起始日期'}
};

function planRecordsOf(item, type){
  const recs = Array.isArray(item.records) ? item.records : [];
  if(type === 'daily'){
    const t = item.due || todayStr();
    return recs.filter(r=>r.d === t);
  }
  return recs;
}
function planDoneCount(item, type){ return planRecordsOf(item, type).filter(r=>r.ok).length; }
function planFailCount(item, type){ return planRecordsOf(item, type).filter(r=>!r.ok).length; }
function planDateLabel(it, type){
  if(type === 'daily')   return it.due    ? '📅 '+it.due    : '';
  if(type === 'weekly'){
    /* 需求 9：区间模式显示区间，单日模式显示具体日期 */
    if(it.weekDateMode === 'single' || (it.startDate && it.startDate === it.endDate))
      return it.startDate ? '🗓 单日 '+it.startDate : (it.weekOf ? '🗓 周锚点 '+it.weekOf : '');
    if(it.startDate && it.endDate) return '🗓 '+it.startDate+' ~ '+it.endDate;
    return it.weekOf ? '🗓 周锚点 '+it.weekOf : '';
  }
  if(type === 'monthly'){
    if(it.monthDateMode === 'single' || (it.startDate && it.startDate === it.endDate))
      return it.startDate ? '🌙 单日 '+it.startDate : (it.monthOf ? '🌙 月锚点 '+it.monthOf : '');
    if(it.startDate && it.endDate) return '🌙 '+it.startDate+' ~ '+it.endDate;
    return it.monthOf ? '🌙 月锚点 '+it.monthOf : '';
  }
  if(type === 'overall') return (it.startDate||it.endDate) ? ('📆 '+(it.startDate||'')+' ~ '+(it.endDate||'')) : '';
  return '';
}

/* ============================================================
   【复习计划】「实时映射」虚拟项渲染
   ------------------------------------------------------------
   渲染每日计划页 / 待办事项时，除读 S.plans.daily 外额外读 S.reviewTasks，
   把「今天到期且未完成」的复习轮次作为虚拟项插入列表最前。
   · 不向 S.plans.daily push 任何数据 → 无重复、无污染；
   · 每次 renderPage 自然同步（数据即渲染源，无需监听/定时器）；
   · 虚拟项「+1」走 reviewMarkDone 标记本轮完成（见 data-rv-plus 绑定）。
   ============================================================ */
function reviewVirtualItemHtml(rt, ctx){
  const rounds = reviewDueRounds(rt, todayStr());
  if(!rounds.length) return '';
  const st = reviewStats(rt);
  const roundTxt = rounds.map(r=>'第'+r.round+'轮').join('、');
  const cat = rt.sourceCat ? canonCat(rt.sourceCat) : '';
  const alive = reviewSourceAlive(rt);
  if(ctx === 'todo'){
    /* 待办事项卡片（行测/申论专区）里的紧凑样式 */
    return '<div class="li" style="background:#F7F2FC;border-left:3px solid ' + REVIEW_BAR_COLOR + ';border-radius:8px;">' +
      '<div class="txt">' +
        '<span style="display:inline-block;font-size:calc(var(--fs-btn) - 3px);font-weight:800;color:#7E5FA8;' +
          'background:#EDE4F7;border-radius:6px;padding:0 5px;margin-right:5px;">[复习]</span>' +
        esc(rt.sourceText) +
        '<div style="font-size:calc(var(--fs-btn) - 2px);color:#8E6FB5;font-weight:600;margin-top:2px;">' +
          '📚 ' + roundTxt + '　' + st.done + '/' + st.total + ' 轮' + (alive ? '' : '　⚠ 来源任务已删除') +
        '</div>' +
      '</div>' +
      '<div class="meta">' +
        '<span class="pill" style="background:#EDE4F7;color:#7E5FA8;">复习</span>' +
        '<button class="btn sm mint" data-rv-plus="' + rt.id + '">+1</button>' +
      '</div>' +
    '</div>';
  }
  /* 每日计划页里的完整样式（带 [复习] 前缀 + 紫色标签） */
  return '<div class="li" style="background:#F7F2FC;border-left:3px solid ' + REVIEW_BAR_COLOR + ';border-radius:8px;">' +
    '<div class="txt">' +
      '<span style="display:inline-block;font-size:calc(var(--fs-btn) - 3px);font-weight:800;color:#7E5FA8;' +
        'background:#EDE4F7;border-radius:6px;padding:0 5px;margin-right:5px;">[复习]</span>' +
      esc(rt.sourceText) +
      '<div style="font-size:calc(var(--fs-btn) - 2px);color:#8E6FB5;font-weight:600;margin-top:2px;">' +
        (cat ? '🏷 ' + esc(cat) + '　' : '') +
        '📚 ' + roundTxt + '　完成 ' + st.done + '/' + st.total + ' 轮' +
        (alive ? '' : '<span style="color:#D98BA6;">　⚠ 来源任务已删除</span>') +
      '</div>' +
    '</div>' +
    '<div class="meta">' +
      '<button class="btn sm mint" data-rv-plus="' + rt.id + '">+1 完成本轮</button>' +
      '<button class="btn sm ghost" data-rv-detail="' + rt.id + '">' + icon('edit',12) + '</button>' +
    '</div>' +
  '</div>';
}

function pagePlan(type){
  const meta = PLAN_META[type];
  const items = S.plans[type] || [];
  const isDaily = type === 'daily';
  const total = items.length;
  let done = 0, fail = 0;
  items.forEach(it=>{ done += planDoneCount(it,type); fail += planFailCount(it,type); });
  const pct = total ? Math.min(100, Math.round(done / total * 100)) : 0;

  const groups = {};
  CATS.forEach(c=>groups[c] = []);
  items.forEach(it=>{
    /* 【改动二】「申论」归入「申论小题」，保持 8 分组不丢项 */
    const c = canonCat(it.cat || '申论小题');
    if(!groups[c]) groups[c] = [];
    groups[c].push(it);
  });

  let groupHtml = '';
  CATS.forEach(c=>{
    const arr = groups[c];
    if(!arr || !arr.length) return;
    let lis = '';
    /* 【复习计划】实时映射：把「该分类下、今天待复习」的复习任务插到本组最前，
       用 [复习] 前缀 + 紫色标签与普通计划区分；不写入 S.plans，仅渲染时虚拟项。 */
    if(isDaily){
      reviewTodayList().filter(rt=> canonCat(rt.sourceCat) === c).forEach(rt=>{
        lis += reviewVirtualItemHtml(rt, 'plan');
      });
    }
    arr.forEach(it=>{
      const d = planDoneCount(it,type);
      const f = planFailCount(it,type);
      const overdue = isDaily && it.due && it.due < todayStr() && d === 0;
      /* 【复习计划】已完成打卡（≥1 次 ok）的每日任务，追加「📚 纳入复习」入口 */
      const canReview = isDaily && d > 0;
      const inReview = isDaily && reviewList().some(rt=> rt.sourceType==='daily' && rt.sourceId === it.id);
      lis += '<div class="li'+(overdue?' overdue':'')+'">'+
        '<div class="txt" style="cursor:pointer;" data-sync="'+it.id+'">'+
          esc(it.text)+
          '<div style="font-size:calc(var(--fs-btn) - 2px);color:var(--text3);font-weight:500;margin-top:2px;">'+
            (it.stage ? '🏷 '+esc(it.stage)+'　' : '')+
            planDateLabel(it,type)+
          '</div>'+
        '</div>'+
        '<div class="meta">'+
          (d ? '<span class="pill mint">✓ '+d+' 次</span>' : '')+
          (f ? '<span class="pill coral">✗ '+f+' 次</span>' : '')+
          '<button class="btn sm mint" data-plus="'+it.id+'">+1</button>'+
          '<button class="btn sm danger" data-fail="'+it.id+'">未完成</button>'+
          '<button class="btn sm ghost" data-editplan="'+it.id+'">'+icon('edit',12)+'</button>'+
          (type !== 'daily' ? '<button class="btn sm ghost" data-sync="'+it.id+'">同步</button>' : '')+
          /* 【复习计划】纳入复习按钮（仅每日计划 + 已完成打卡时出现） */
          (canReview
            ? (inReview
                ? '<button class="btn sm ghost" data-review-open="'+it.id+'" title="该任务已在复习计划中，点击查看">📚 已纳入</button>'
                : '<button class="btn sm ghost" data-review-add="'+it.id+'">📚 纳入复习</button>')
            : '')+
          '<button class="btn sm ghost" data-rm="'+it.id+'">✕</button>'+
        '</div>'+
      '</div>';
    });
    groupHtml += '<div class="acc open" style="margin-bottom:12px;">'+
      '<div class="acc-h">'+esc(c)+' <span class="sub" style="margin-left:auto;font-size:calc(var(--fs-btn) - 2px);color:var(--text3);">'+arr.length+' 项</span></div>'+
      '<div class="acc-b" style="padding-top:0;">'+lis+'</div></div>';
  });
  if(!groupHtml) groupHtml = emptyBox('doc', '还没有计划，点击右下角 ＋ 添加吧');

  // 导入/导出按钮：移到标题右侧（需求 4-2）
  const importExportBtns =
      '<button class="btn sm ghost" id="expPlan" '+(items.length?'':'disabled')+' title="导出本计划">'+icon('save',13)+' 导出</button>'+
      '<button class="btn sm ghost" id="impPlan" title="导入计划">'+icon('up',13)+' 导入</button>'+
      '<input type="file" id="impPlanFile" accept=".xls,.xlsx,.doc,.docx" style="display:none;">';

  /* 今日学习进度「已完成内容明细」（需求 4-2）
     列出当前计划中「已完成」的目标条目，让用户一眼看到完成了什么。 */
  const doneItems = items.filter(it=>planDoneCount(it,type) > 0);
  const doneDetailHtml = doneItems.length
    ? '<div class="done-detail">'+
        doneItems.map(it=>{
          const dn = planDoneCount(it,type);
          return '<div class="dd-item">'+
            '<span class="dd-ico">'+icon('check',12)+'</span>'+
            '<span class="dd-txt">'+esc(it.text)+'</span>'+
            '<span class="dd-cnt">'+dn+' 次</span>'+
          '</div>';
        }).join('')+
      '</div>'
    : '<div style="font-size:var(--fs-btn);color:var(--text3);text-align:center;padding:8px 0;">还没有已完成的内容，加油开始吧 ✨</div>';

  return {
    html:
      '<div class="card">'+
        '<div class="card-title">'+titleIco(meta.icon)+' '+meta.name+
          ' <span class="sub">共 '+total+' 项</span>'+
          '<span class="ttl-actions">'+importExportBtns+'</span>'+
        '</div>'+
        checkinStatCards()+
        statRow([
          {v: total,    k: '目标总数'},
          {v: done,     k: '已完成次数'},
          {v: fail,     k: '未完成次数'},
          {v: pct + '%',k: '完成率'}
        ])+
        progressBar(pct)+
        '<div style="text-align:center;font-size:calc(var(--fs-btn) - 1px);color:var(--text2);margin-top:8px;">整体完成进度</div>'+
        '<div style="text-align:center;font-size:calc(var(--fs-btn) - 2px);color:var(--text3);margin-top:8px;">'+
          '支持 Word / Excel 导入导出 · 表头：目标内容｜所属分类｜所属阶段｜开始日期｜结束日期'+
        '</div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title">'+titleIco('pin')+' 目标列表 <span class="sub">'+(type!=='daily'?'点击目标可同步到其他计划':'')+'</span></div>'+
        groupHtml +
      '</div>'+
      '<div class="card">'+
        '<div class="card-title">'+titleIco('chart')+' '+(type==='daily'?'今日':(type==='weekly'?'本周':(type==='monthly'?'本月':'总体')))+'学习进度 <span class="sub">已完成内容明细</span></div>'+
        progressBar(pct, pct>=80?'mint':(pct>=40?'':'coral'))+
        '<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:var(--fs-btn);color:var(--text2);">'+
          '<span>已完成 '+done+' 次</span><span>完成率 '+pct+'%</span>'+
        '</div>'+
        doneDetailHtml+
        '<div style="margin-top:12px;font-size:var(--fs-btn);color:var(--text2);">'+
          '💡 综合完成情况：'+(pct>=80?'太棒了，节奏很好！':(pct>=50?'继续加油，稳中求进～':'还有不少待完成，一起努力！'))+
        '</div>'+
      '</div>'+
      '<button class="fab" id="fabAdd" title="添加目标">＋</button>'+
      encourageBar(type),
    bind(){
      $('#fabAdd').addEventListener('click', ()=>openAddPlan(type));
      $$('#content [data-plus]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const it = (S.plans[type]||[]).find(x=>x.id===b.dataset.plus);
          if(!it) return;
          it.records = it.records || [];
          const dayKey = type==='daily' ? (it.due || todayStr()) : todayStr();
          it.records.push({d: dayKey, ts: Date.now(), ok:true});
          save(true); renderPageKeepScroll(); toast('打卡 +1 ✓');
        });
      });
      $$('#content [data-fail]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const id = b.dataset.fail;
          openModal('补充未完成原因',
            '<div class="field"><label>为什么没有完成呢？</label><textarea class="ta" id="failReason" placeholder="例如：时间不够 / 状态不好 / 任务量偏大……"></textarea></div>',
            [{text:'记录', primary:true, onClick:()=>{
              const r = ($('#failReason').value || '').trim() || '未填写原因';
              const it = (S.plans[type]||[]).find(x=>x.id===id);
              if(it){
                it.records = it.records || [];
                const dayKey = type==='daily' ? (it.due || todayStr()) : todayStr();
                it.records.push({d: dayKey, ts: Date.now(), ok:false, reason:r});
                save(true); renderPageKeepScroll(); toast('已记录未完成原因');
              }
            }},{text:'取消'}]);
        });
      });
      $$('#content [data-editplan]').forEach(b=>{
        b.addEventListener('click', ()=>openEditPlan(type, b.dataset.editplan));
      });
      /* 【复习计划】纳入复习：确认弹窗 → 写入 S.reviewTasks */
      $$('#content [data-review-add]').forEach(b=>{
        b.addEventListener('click', (e)=>{
          e.stopPropagation();
          reviewConfirmAdd(b.dataset.reviewAdd);
        });
      });
      /* 【复习计划】已在复习中：直接打开该复习任务的详情弹窗 */
      $$('#content [data-review-open]').forEach(b=>{
        b.addEventListener('click', (e)=>{
          e.stopPropagation();
          const rt = reviewList().find(x=> x.sourceType==='daily' && x.sourceId === b.dataset.reviewOpen);
          if(rt) reviewOpenEdit(rt.id); else toast('该任务已在复习计划中');
        });
      });
      /* 【复习计划】虚拟项「+1」= 标记今天到期的本轮复习完成 */
      $$('#content [data-rv-plus]').forEach(b=>{
        b.addEventListener('click', (e)=>{
          e.stopPropagation();
          const rt = reviewList().find(x=> x.id === b.dataset.rvPlus);
          if(!rt) return;
          const rounds = reviewDueRounds(rt, todayStr());
          if(!rounds.length){ toast('今天没有待复习的轮次'); return; }
          rounds.forEach(r=> reviewMarkDone(rt, r.round));   // 同一天多轮一并完成
          save(true); renderPageKeepScroll();
          const st = reviewStats(rt);
          toast('复习完成 ✓ 第 '+rounds.map(r=>r.round).join('、')+' 轮'+(st.allDone ? '（全部完成 🎉）' : ''));
        });
      });
      /* 【复习计划】虚拟项编辑按钮 → 打开复习任务详情弹窗 */
      $$('#content [data-rv-detail]').forEach(b=>{
        b.addEventListener('click', (e)=>{
          e.stopPropagation();
          reviewOpenEdit(b.dataset.rvDetail);
        });
      });
      $$('#content [data-rm]').forEach(b=>{

/* ============================================================
   计划日期字段（需求 9）
   ------------------------------------------------------------
   · 周计划 / 月计划：支持「日期区间」与「仅某天」两种填写模式
     —— 区间：选开始/结束日期，并提供「一键选整周（周一~周日）」快捷按钮
     —— 仅某天：只选一个具体日期（可一键点选今天）
   · 每日计划 / 整体计划：沿用原有输入方式
   ============================================================ */
function dateFieldsHtml(type, it){
  const dailyDate  = (it && it.due)     || todayStr();
  const weekOf     = (it && it.weekOf)  || todayStr();
  const monthOf    = (it && it.monthOf) || todayStr();
  const startDate  = (it && it.startDate) || todayStr();
  const endDate    = (it && it.endDate)   || todayStr();
  if(type === 'daily')   return '<div class="field"><label>计划日期（可选未来日期提前制定）</label><input class="inp" type="date" id="pDate" value="'+dailyDate+'"></div>';
  if(type === 'overall') return '<div class="row"><div class="field"><label>开始日期</label><input class="inp" type="date" id="pStart" value="'+startDate+'"></div><div class="field"><label>结束日期</label><input class="inp" type="date" id="pEnd" value="'+endDate+'"></div></div>';

  if(type === 'weekly' || type === 'monthly'){
    const anchor = type === 'weekly' ? weekOf : monthOf;
    /* 区间模式：周计划默认一键整周；月计划默认整月 */
    const rng = planRangeOf(type, it);
    const modeKey = type === 'weekly' ? 'weekDateMode' : 'monthDateMode';
    const mode = (it && it[modeKey]) || 'range';       // 'range' | 'single'
    const quickBtn = type === 'weekly'
      ? '<button type="button" class="btn sm mint" id="pQuickWeek">一键选整周（周一~周日）</button>'
      : '<button type="button" class="btn sm mint" id="pQuickMonth">一键选整月</button>';
    const calBtn = type === 'weekly' ? '📅 日历选周' : '📅 日历选月';
    const singleLabel = type === 'weekly' ? '计划日期（单日 · 该日计入本周）' : '计划日期（单日 · 该日计入本月）';
    return '<div class="field"><label>填写模式</label>'+
        '<div class="seg" id="pDateModeSeg">'+
          '<button type="button" data-dmode="range" class="'+(mode==='range'?'on':'')+'">日期区间</button>'+
          '<button type="button" data-dmode="single" class="'+(mode==='single'?'on':'')+'">仅某天</button>'+
        '</div>'+
      '</div>'+
      '<div id="pRangeBox" style="'+(mode==='range'?'':'display:none;')+'">'+
        '<div class="row">'+
          '<div class="field"><label>开始日期</label><input class="inp" type="date" id="pStart" value="'+rng.s+'"></div>'+
          '<div class="field"><label>结束日期</label><input class="inp" type="date" id="pEnd" value="'+rng.e+'"></div>'+
        '</div>'+
        '<div style="margin:-4px 0 10px;display:flex;gap:8px;flex-wrap:wrap;">'+quickBtn+
          '<button type="button" class="btn sm ghost" id="pCalBtn">'+calBtn+'</button>'+
        '</div>'+
        /* R2：日历式选周/选月（展开后可翻页选择本周/本月或未来任意周/月） */
        '<div id="pCalBox" class="pcal" style="display:none;"></div>'+
      '</div>'+
      '<div id="pSingleBox" style="'+(mode==='single'?'':'display:none;')+'">'+
        '<div class="field"><label>'+singleLabel+'</label>'+
          '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">'+
            '<input class="inp" type="date" id="pDate" value="'+anchor+'" style="flex:1;min-width:150px;">'+
            '<button type="button" class="btn sm ghost" id="pTodayBtn">今天</button>'+
          '</div>'+
        '</div>'+
      '</div>';
  }
  return '';
}
/* 计算某计划的默认日期区间（周：本周一~周日；月：本月 1 号~末日） */
function planRangeOf(type, it){
  const base = (it && (it.startDate || it.weekOf || it.monthOf)) || todayStr();
  if(type === 'weekly'){
    const d = new Date(base); d.setHours(0,0,0,0);
    const dow = d.getDay();
    const backToMon = (dow === 0 ? 6 : dow - 1);
    const mon = new Date(d); mon.setDate(d.getDate() - backToMon);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    return { s: dstr(mon), e: dstr(sun) };
  }
  // monthly
  const d = new Date(base);
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const last  = new Date(d.getFullYear(), d.getMonth()+1, 0);
  return { s: dstr(first), e: dstr(last) };
}
/* R2：任意基准日期所在周（周一~周日）—— weekRange 的通用版本 */
function weekRangeFromDate(base){
  const d = new Date(base); d.setHours(0,0,0,0);
  const dow = d.getDay();
  const backToMon = (dow === 0 ? 6 : dow - 1);
  const mon = new Date(d); mon.setDate(d.getDate() - backToMon);
  const out = [];
  for(let i=0;i<7;i++){ const x = new Date(mon); x.setDate(mon.getDate()+i); out.push(dstr(x)); }
  return out;
}

/* ============================================================
   R2：计划弹窗 日历式选周 / 选月
   ------------------------------------------------------------
   · 周计划：月历视图，点击任意日期 → 选定该日所在整周（周一~周日）；
     「‹ ›」翻月；「本周」一键回到当前周
   · 月计划：年历视图（12 个月格），点击任意月份 → 选定该月整月；
     「‹ ›」翻年；「本月」一键回到当前月
   · 视图状态存 _planCal（每次展开重置为当前月/年）
   ============================================================ */
const _planCal = { y:0, m:0 };   // m 为 1-12；0 表示未初始化

function planCalHtml(type){
  const now = new Date(); now.setHours(0,0,0,0);
  const today = todayStr();
  const wk = ['一','二','三','四','五','六','日'];
  if(type === 'weekly'){
    const y = _planCal.y || now.getFullYear();
    const m = _planCal.m || (now.getMonth() + 1);
    const first = new Date(y, m-1, 1);
    const dow = first.getDay();
    const back = (dow === 0 ? 6 : dow - 1);
    const start = new Date(first); start.setDate(first.getDate() - back);
    let cells = '';
    for(let i=0;i<42;i++){
      const d = new Date(start); d.setDate(start.getDate() + i);
      const ds = dstr(d);
      const dim = d.getMonth() !== (m-1);
      cells += '<button type="button" class="cell'+(dim?' dim':'')+(ds===today?' today':'')+
               '" data-wcd="'+ds+'" title="选择 '+ds+' 所在周（周一 ~ 周日）">'+d.getDate()+'</button>';
    }
    return '<div class="pcal-hd">'+
        '<button type="button" class="btn sm ghost" data-pcalnav="pvm">‹</button>'+
        '<b>'+y+' 年 '+m+' 月</b>'+
        '<button type="button" class="btn sm ghost" data-pcalnav="nxm">›</button>'+
        '<button type="button" class="btn sm mint" data-pcaltoday="1">本周</button>'+
      '</div>'+
      '<div class="pcal-grid">'+
        wk.map(w=>'<span class="hd">'+w+'</span>').join('')+
        cells+
      '</div>'+
      '<div class="pcal-tip">点击任意日期 → 选定该日所在整周（周一 ~ 周日）</div>';
  }
  // monthly：年历 12 月格
  const y = _planCal.y || now.getFullYear();
  const curKey = now.getFullYear()+'-'+pad2(now.getMonth()+1);
  let mcells = '';
  for(let m=1;m<=12;m++){
    const key = y+'-'+pad2(m);
    mcells += '<button type="button" class="mcell'+(key===curKey?' today':'')+
              '" data-wcm="'+key+'" title="选择 '+y+' 年 '+m+' 月">'+m+'月</button>';
  }
  return '<div class="pcal-hd">'+
      '<button type="button" class="btn sm ghost" data-pcalnav="pvy">‹</button>'+
      '<b>'+y+' 年</b>'+
      '<button type="button" class="btn sm ghost" data-pcalnav="nxy">›</button>'+
      '<button type="button" class="btn sm mint" data-pcaltoday="1">本月</button>'+
    '</div>'+
    '<div class="pcal-mgrid">'+mcells+'</div>'+
    '<div class="pcal-tip">点击任意月份 → 选定该月整月（1 号 ~ 月末）</div>';
}
/* 把选定的区间写入弹窗的开始/结束输入框 */
function setPlanRangeInputs(s, e){
  const si = document.getElementById('pStart'), ei = document.getElementById('pEnd');

  if(ei) ei.value = e;

/* 绑定日历内部交互（翻页 / 本周·本月 / 点选）；重绘后需重新调用 */
function bindPlanCalInner(type){
  const box = document.getElementById('pCalBox');
  if(!box) return;
  box.querySelectorAll('[data-pcalnav]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const nav = b.dataset.pcalnav;
      if(nav === 'pvm'){ _planCal.m--; if(_planCal.m < 1){ _planCal.m = 12; _planCal.y--; } }
      else if(nav === 'nxm'){ _planCal.m++; if(_planCal.m > 12){ _planCal.m = 1; _planCal.y++; } }
      else if(nav === 'pvy'){ _planCal.y--; }
      else if(nav === 'nxy'){ _planCal.y++; }
      box.innerHTML = planCalHtml(type);
      bindPlanCalInner(type);
    });
  });
  const td = box.querySelector('[data-pcaltoday]');
  if(td) td.addEventListener('click', ()=>{
    if(type === 'weekly'){
      const r = weekRangeFromDate(todayStr());
      setPlanRangeInputs(r[0], r[6]);
      toast('已选本周：'+r[0]+' ~ '+r[6]);
    }else{
      const r = planRangeOf('monthly', null);
      setPlanRangeInputs(r.s, r.e);
      toast('已选本月：'+r.s+' ~ '+r.e);
    }
    box.style.display = 'none';
  });
  box.querySelectorAll('[data-wcd]').forEach(c=>{
    c.addEventListener('click', ()=>{
      const ds = c.dataset.wcd;
      const r = weekRangeFromDate(ds);
      setPlanRangeInputs(r[0], r[6]);
      toast('已选 '+ds+' 所在周：'+r[0]+' ~ '+r[6]);
      box.style.display = 'none';
    });
  });
  box.querySelectorAll('[data-wcm]').forEach(c=>{
    c.addEventListener('click', ()=>{
      const key = c.dataset.wcm;               // 'YYYY-MM'
      const parts = key.split('-');
      const yy = Number(parts[0]), mm = Number(parts[1]);
      const s = yy+'-'+pad2(mm)+'-01';
      const e = yy+'-'+pad2(mm)+'-'+pad2(new Date(yy, mm, 0).getDate());
      setPlanRangeInputs(s, e);
      toast('已选 '+yy+' 年 '+mm+' 月：'+s+' ~ '+e);
      box.style.display = 'none';
    });
  });
}

function bindPlanCal(type){
  const box = document.getElementById('pCalBox');

/* 从弹窗读取日期模式与取值 */
function readPlanDateFields(type, item){
  const modeKey = type === 'weekly' ? 'weekDateMode' : 'monthDateMode';
  if(type === 'weekly' || type === 'monthly'){
    const seg = document.getElementById('pDateModeSeg');
    const mode = (seg && seg.dataset.mode) || 'range';
    item[modeKey] = mode;
    if(mode === 'range'){
      item.startDate = (document.getElementById('pStart')||{value:''}).value || todayStr();
      item.endDate   = (document.getElementById('pEnd')  ||{value:''}).value || todayStr();
      if(item.endDate < item.startDate){ const tmp = item.startDate; item.startDate = item.endDate; item.endDate = tmp; }
      // 锚点日期 = 开始日期（用于「所在周/月」展示与同步）
      if(type === 'weekly') item.weekOf = item.startDate;
      else item.monthOf = item.startDate;
    }else{
      const d = (document.getElementById('pDate')||{value:todayStr()}).value || todayStr();
      item.startDate = d; item.endDate = d;
      if(type === 'weekly') item.weekOf = d;
      else item.monthOf = d;
    }
    return;
  }
  if(type === 'daily')   item.due     = (document.getElementById('pDate')||{value:todayStr()}).value || todayStr();
  if(type === 'overall'){
    item.startDate = (document.getElementById('pStart')||{value:todayStr()}).value || todayStr();
    item.endDate   = (document.getElementById('pEnd')  ||{value:todayStr()}).value || todayStr();
  }
}
