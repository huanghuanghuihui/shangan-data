      tip = t.it.text+'（复习计划）\n来源分类：'+(rt.sourceCat||'—')+'　阶段：'+(rt.sourceStage||'—')+
            '\n起止：'+t.s+' ~ '+t.e+'\n进度：'+t.reviewDone+' / '+t.reviewTotal+' 轮（'+t.pct+'%）'+
            (t.allOk?'（已完成全部复习）':'')+(t.overdue?'　⚠️ 有已过期轮次':'')+
            (reviewSourceAlive(rt)?'':'\n⚠ 来源任务已删除（复习任务独立保留）')+
            '\n各轮复习时间点（图上每轮一个条，可单独点击）：\n'+lines+
            '\n颜色：'+c.toUpperCase()+(custom?'（自定义）':'（复习默认黄）')+
            '\n点击任一轮次条可查看/调整 7 轮复习日期';
    } else if(isMerged){
      tip = t.it.text+'（每日计划 · 合并行，共 '+t.bars.length+' 条）'+
            '\n合并规则：内容完全相同的每日计划合并为一行'+
            '\n点击某个条只编辑该条，不影响同行其他条'+
            '\n⠿ 拖动任务名可整行调整顺序';
    } else {
      tip = t.it.text+'（'+PLAN_META[t.type].name+'）\n分类：'+(t.it.cat||'—')+'　阶段：'+(t.it.stage||'—')+
            '\n起止：'+t.s+' ~ '+t.e+'\n进度：'+t.pct+'%'+(t.allOk?'（已完成）':'')+(t.overdue?'　⚠️ 已逾期':'')+
            '\n颜色：'+c.toUpperCase()+(custom?'（自定义）':'（分类默认）');
    }
    /* 条内文案：复习任务显示「复习 N/7」，普通任务显示进度百分比 */
    const barText = isReview
      ? (t.allOk ? '✓ ' : '') + '复习 ' + t.reviewDone + '/' + t.reviewTotal + (t.overdue ? ' ⚠' : '')
      : (t.allOk ? '✓ ' : '') + (wPx > 46 ? (t.pct+'%') : '') + (t.overdue ? ' ⚠' : '');
    const barInner =
      '<div style="position:absolute;left:0;top:0;bottom:0;width:'+t.pct+'%;'+
        'background:rgba(255,255,255,.42);border-radius:999px 0 0 999px;"></div>'+
      '<span style="position:relative;font-size:9px;color:#7A4A5A;font-weight:800;white-space:nowrap;'+
        'overflow:hidden;text-overflow:ellipsis;padding:0 6px;line-height:20px;">'+
        barText+'</span>';
    /* 复习任务行左侧色点用描边区分（与普通计划视觉上可辨） */
    const dotStyle = isReview
      ? 'background:'+c+';box-shadow:0 0 0 1.5px #fff, 0 0 0 2.5px '+c+';'
      : (custom?'box-shadow:0 0 0 1.5px #fff, 0 0 0 2.5px '+c+';':'');
    /* 行的 data-grow 主键：多条目行（复习轮次 / 合并条）取首个条 key，保证拖拽 key 唯一 */
    const rowKey = isMulti ? t.bars[0].key : (t.type+'|'+t.it.id);
    /* 右侧轨道：多条目行用通用渲染；否则沿用原单条 */
    const track = isMulti
      ? ganttBarsHtml(t.bars, meta, { laneH:16, baseTop:8, stagger:4 })
      : '<div style="flex:none;position:relative;height:100%;width:'+(meta.days*meta.pxd)+'px;">'+
          '<div data-gedit="'+t.type+'|'+t.it.id+'" title="'+esc(tip)+'" style="position:absolute;top:7px;height:22px;'+
            'left:'+offS+'px;width:'+wPx+'px;border-radius:999px;background:'+c+';'+
            (isReview?'background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.20) 0 6px,transparent 6px 12px);':'')+
            (t.allOk?'opacity:.6;':'')+(clipL?'border-top-left-radius:0;border-bottom-left-radius:0;':'')+
            'box-shadow:0 2px 8px rgba(200,130,155,.18);overflow:hidden;display:flex;align-items:center;'+
            'cursor:pointer;transition:filter .15s;" onmouseover="this.style.filter=\'brightness(1.06)\'" onmouseout="this.style.filter=\'\'">'+
            barInner+'</div>'+
        '</div>';
    return '<div class="g-row'+(isReview?' g-row-review':'')+(isMerged?' g-row-merged':'')+'" data-grow="'+rowKey+'" style="display:flex;align-items:center;height:36px;border-top:1px dashed var(--line);">'+
      '<div class="g-name" title="'+esc(tip)+'" style="position:sticky;left:0;z-index:2;flex:none;width:'+NAME_W+'px;'+
        'background:var(--card,#FFFDFC);padding:0 6px 0 2px;font-size:11px;color:var(--text1);'+
        'white-space:nowrap;overflow:hidden;border-right:1px solid var(--line);height:100%;display:flex;align-items:center;gap:3px;">'+
        '<span class="drag-handle" data-gdrag="'+rowKey+'" title="按住拖动调整顺序">⠿</span>'+
        '<span style="flex:none;width:7px;height:7px;border-radius:50%;'+dotStyle+'"></span>'+
        (isReview?'<span style="flex:none;font-size:8px;color:#8A6BB8;font-weight:800;">复习</span>':'')+
        (isMerged?'<span class="g-count" title="同内容合并了 '+t.bars.length+' 条">×'+t.bars.length+'</span>':'')+
        '<span style="overflow:hidden;text-overflow:ellipsis;">'+esc(t.it.text)+'</span></div>'+
      track+
    '</div>';
  }

  /* 今日竖线位置（当日格中央，贯穿整个甘特区域） */
  const todayOff = ganttDaysBetween(meta.start, today) * meta.pxd + meta.pxd/2;
  const todayLine = (todayOff >= 0 && todayOff <= meta.days*meta.pxd)
    ? '<div style="position:absolute;top:0;bottom:0;left:'+todayOff+'px;width:0;'+
      'border-left:2px dashed var(--pinkDeep2);opacity:.55;z-index:1;pointer-events:none;"></div>'
    : '';

  const bodyH = Math.max(120, rows.length * 36 + 4);
  const ganttArea = rows.length
    ? /* 【改动一】横向滚动容器加 id=gScroll 供快捷跳转/初始定位使用 */
      '<div id="gScroll" style="overflow-x:auto;overflow-y:auto;max-height:52vh;border:1.5px solid var(--line);border-radius:14px;background:#FFFDFC;">'+
        '<div style="position:relative;min-width:100%;width:max-content;">'+
          /* 刻度行（sticky top） */
          '<div data-tickrow style="display:flex;position:sticky;top:0;z-index:4;background:#FFF7FA;">'+
            '<div style="position:sticky;left:0;z-index:5;flex:none;width:'+NAME_W+'px;background:#FFF7FA;'+
              'border-right:1px solid var(--line);font-size:10px;color:var(--text3);'+
              'display:flex;align-items:center;padding:0 8px;height:26px;">任务 / 日期</div>'+
            '<div data-tickbox style="display:flex;height:26px;">'+ticks()+'</div>'+
          '</div>'+
          /* 任务行区（相对定位，今日竖线贯穿） */
          '<div style="position:relative;">'+todayLine+rows.map(rowOf).join('')+'</div>'+
        '</div>'+
      '</div>'
    : emptyBox('gantt', '当前筛选/时间范围内没有可展示的任务')+
      '<div style="text-align:center;margin-top:10px;">'+
        '<button class="btn primary" id="gQuickJump">'+icon('plus',14)+' 快速添加任务</button></div>';

  /* 概览统计 */
  const doneN  = tasks.filter(t=>t.allOk).length;
  const ovdN   = tasks.filter(t=>t.overdue).length;
  const doingN = tasks.length - doneN - ovdN;

  const typeBar = (key, label)=>{
    const arr = tasks.filter(t=>t.type===key);
    const dn = arr.filter(t=>t.allOk).length;
    const pct = arr.length ? Math.round(dn/arr.length*100) : 0;
    return '<div style="margin-bottom:10px;">'+
      '<div style="display:flex;justify-content:space-between;font-size:var(--fs-btn);color:var(--text2);margin-bottom:4px;">'+
        '<span>'+label+' <span style="color:var(--text3);">('+dn+'/'+arr.length+')</span></span>'+
        '<b style="color:var(--pinkDeep2);">'+pct+'%</b></div>'+
      progressBar(pct, pct>=80?'mint':(pct>=40?'':'coral'))+
    '</div>';
  };

  /* 快速添加表单（字段与 openAddPlan 一致 + 计划类型选择） */
  const catOpts  = CATS.map(c=>'<option'+(GANTT_STATE.cat===c?' selected':'')+'>'+c+'</option>').join('');
  const stageOpts= STAGES.map(s=>'<option'+(GANTT_STATE.stage===s?' selected':'')+'>'+s+'</option>').join('');
  const typeOpts = ['daily','weekly','monthly','overall'].map(k=>
    '<option value="'+k+'"'+(GANTT_STATE.addType===k?' selected':'')+'>'+PLAN_META[k].name+'</option>').join('');
  const addType = GANTT_STATE.addType || 'daily';

  /* 【改动一】快捷跳转控件文案（随 view 切换周/月/日措辞） */
  const jumpUnit = meta.unit === 'month' ? '月' : (meta.unit === 'week' ? '周' : '天');
  const jumpBar =
    '<div class="g-jump" style="display:flex;gap:6px;align-items:center;margin-bottom:8px;">'+
      '<button class="btn sm ghost" data-gjump="first" title="跳到最早期">⏮ 最早期</button>'+
      '<button class="btn sm ghost" data-gjump="prev" title="上一'+jumpUnit+'">◀ 上一'+jumpUnit+'</button>'+
      '<button class="btn sm ghost" data-gjump="today" title="回到今天">今天</button>'+
      '<button class="btn sm ghost" data-gjump="next" title="下一'+jumpUnit+'">下一'+jumpUnit+' ▶</button>'+
      '<button class="btn sm ghost" data-gjump="last" title="跳到最晚期">最晚期 ⏭</button>'+
      '<span class="g-jump-note">'+meta.note+'</span>'+
    '</div>';

  /* 【改动一】恢复默认排序按钮（放在甘特图卡片 ttl-actions） */
  const resetOrderBtn = '<button class="btn sm ghost" id="gResetOrder" title="清除全部手动拖拽顺序，回到默认排序">↺ 恢复默认排序</button>';
  /* 【需求 1】导出 PDF 按钮（弹窗选时间范围 → 新窗口打印） */
  const exportPdfBtn = '<button class="btn sm ghost" id="gExportPdf" title="导出当前筛选结果的 PDF（A4 横向，宽度自适应一页）">📄 导出 PDF</button>';

  return {
    html:
      /* ① 甘特图主视图卡片 */
      '<div class="card">'+
        '<div class="card-title">'+titleIco('gantt')+' 甘特图 · 计划可视化 '+
          '<span class="sub">'+meta.label+(isMob?' · 月视图':'')+'</span>'+
          '<span class="ttl-actions">'+
            resetOrderBtn+
            exportPdfBtn+
            '<span class="seg" id="gViewSeg">'+
              '<button type="button" data-gview="day"'+(view==='day'?' class="on"':'')+'>日</button>'+
              '<button type="button" data-gview="week"'+(view==='week'?' class="on"':'')+'>周</button>'+
              '<button type="button" data-gview="month"'+(view==='month'?' class="on"':'')+'>月</button>'+
            '</span>'+
          '</span>'+
        '</div>'+
        jumpBar+
        '<div class="g-filters">'+
          '<select class="sel" id="gFcat">'+
            '<option value="">全部分类</option>'+catOpts+'</select>'+
          '<select class="sel" id="gFstage">'+
            '<option value="">全部阶段</option>'+stageOpts+'</select>'+
          '<select class="sel" id="gFtype">'+
            '<option value="">全部类型</option>'+
            ['daily','weekly','monthly','overall'].map(k=>'<option value="'+k+'"'+(GANTT_STATE.ptype===k?' selected':'')+'>'+PLAN_META[k].name+'</option>').join('')+
            /* 【复习计划】可按「复习任务」单独筛选 */
            '<option value="review"'+(GANTT_STATE.ptype==='review'?' selected':'')+'>复习任务</option>'+
          '</select>'+
        '</div>'+
        '<div style="font-size:10px;color:var(--text3);margin-bottom:6px;display:flex;gap:10px;flex-wrap:wrap;">'+
          '<span>虚线 = 今天</span><span>条内浅色 = 打卡/复习进度</span><span>半透明 ✓ = 已完成</span><span>⚠ = 已逾期</span>'+
          '<span>点击任务条可编辑</span><span>⠿ 拖动任务名可调整顺序</span>'+
          '<span style="color:#B39A3E;">淡黄小条 = 复习任务（每轮一条，点击可调整 7 轮日期）</span>'+
          '<span style="color:#8A6BB8;">×N = 同内容合并为一行</span>'+
        '</div>'+
        ganttArea+
      '</div>'+

      /* ② 快速添加卡片（写回 S.plans[type]） */
      '<div class="card">'+
        '<div class="card-title">'+titleIco('plus')+' 快速添加任务 <span class="sub">保存后自动写入对应计划</span></div>'+
        '<div class="field"><label>计划类型</label><select class="sel" id="gAddType">'+typeOpts+'</select></div>'+
        '<div class="field"><label>任务内容</label><input class="inp" id="gText" placeholder="例如：资料分析速算练习 30 题"></div>'+
        '<div class="row">'+
          '<div class="field"><label>所属分类</label><select class="sel" id="gCat">'+catOpts+'</select></div>'+
          '<div class="field"><label>所属阶段</label><select class="sel" id="gStage">'+stageOpts+'</select></div>'+
        '</div>'+
        '<div id="gDateBox">'+dateFieldsHtml(addType, null)+'</div>'+
        /* 【改动三】快速添加卡片同步加颜色选择器（共用组件） */
        ganttColorRowHtml('gAdd', GANTT_STATE.addColor||'')+
        '<div style="text-align:center;margin-top:6px;">'+
          '<button class="btn primary" id="gAddSave">'+icon('check',14)+' 保存并画到甘特图</button>'+
        '</div>'+
      '</div>'+

      /* ④ 计划进度概览卡片 */
      '<div class="card">'+
        '<div class="card-title">'+titleIco('chart')+' 计划进度概览 <span class="sub">按当前筛选统计</span></div>'+
        statRow([
          {v: tasks.length, k:'总任务数'},
          {v: doingN,       k:'进行中'},
          {v: doneN,        k:'已完成'},
          {v: ovdN,         k:'逾期'}
        ])+
        '<div style="margin-top:14px;">'+
          typeBar('daily','每日计划')+typeBar('weekly','周计划')+
          typeBar('monthly','月计划')+typeBar('overall','整体计划')+
          /* 【复习计划】复习任务单独一条进度（按已完成轮次统计，而非整条完成） */
          typeBar('review','复习任务')+
        '</div>'+
      '</div>'+
      encourageBar('daily'),
    bind(){
      /* 视图切换（用户手动选择后固定，不再随屏宽自动切） */
      $$('#gViewSeg [data-gview]').forEach(b=>{
        b.addEventListener('click', ()=>{ GANTT_STATE.view = b.dataset.gview; GANTT_STATE.userView = true; renderPageKeepScroll(); });
      });
      /* 三个筛选器 */
      const bindSel = (id, key)=>{
        const el = $(id); if(!el) return;
        el.addEventListener('change', ()=>{ GANTT_STATE[key] = el.value; renderPageKeepScroll(); });
      };
      bindSel('#gFcat','cat'); bindSel('#gFstage','stage'); bindSel('#gFtype','ptype');
      /* 点击任务条 → 编辑弹窗 */
      $$('#content [data-gedit]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const segs = b.dataset.gedit.split('|');
          ganttOpenEdit(segs[0], segs[1]);
        });
      });
      const qj = $('#gQuickJump'); if(qj) qj.addEventListener('click', ()=>{
        const box = $('#gText'); if(box){ box.scrollIntoView({behavior:'smooth', block:'center'}); setTimeout(()=>box.focus(), 350); }
      });
      /* 快速添加：类型切换 → 重绘日期字段（复用 dateFieldsHtml / bindPlanDateFields） */
      const typeSel = $('#gAddType');
      typeSel.addEventListener('change', ()=>{
        GANTT_STATE.addType = typeSel.value;
        $('#gDateBox').innerHTML = dateFieldsHtml(typeSel.value, null);
        try{ bindPlanDateFields(typeSel.value); }catch(e){}
      });
      try{ bindPlanDateFields(addType); }catch(e){}

      /* ===== 【改动一】快捷跳转：定位甘特横向滚动容器并平滑滚动 ===== */
      const gwrap = $('#gScroll');
      const slotPx = i=>{
        if(meta.unit === 'week') return 7*meta.pxd;
        if(meta.unit === 'month'){
          const cur = new Date(+meta.start.slice(0,4), +meta.start.slice(5,7)-1+i, 1);
          return new Date(cur.getFullYear(), cur.getMonth()+1, 0).getDate()*meta.pxd;
        }
        return meta.pxd;
      };
      const offsetOfSlot = i=>{ let x=0; for(let k=0;k<i && k<meta.slots;k++) x += slotPx(k); return x; };
      /* 前缀和缓存：分块渲染每帧要算全部 slot 的起点，避免 O(n²) */
      let _sumCache = null;
      const prefixSum = ()=>{
        if(_sumCache && _sumCache.length === meta.slots+1) return _sumCache;
        const a = new Float64Array(meta.slots+1);
        for(let i=0;i<meta.slots;i++) a[i+1] = a[i] + slotPx(i);
        _sumCache = a; return a;
      };
      const offOf = i=>prefixSum()[Math.min(i, meta.slots)];
      const smoothTo = (x)=>{ if(gwrap) gwrap.scrollTo({left:Math.max(0,x), behavior:'smooth'}); };
      const centerSlot = (i)=>{
        if(!gwrap) return;
        const w = slotPx(i);
        smoothTo(offsetOfSlot(i) + w/2 - gwrap.clientWidth/2);
      };
      /* 读取当前视口中心所在的格（用于「上一格/下一格」） */
      const viewSlot = ()=>{
        if(!gwrap) return meta.curSlot;
        const cx = gwrap.scrollLeft + gwrap.clientWidth/2;
        let acc = 0;
        for(let i=0;i<meta.slots;i++){ const w=slotPx(i); if(cx < acc + w) return i; acc += w; }
        return meta.slots-1;
      };
      $$('#content [data-gjump]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const k = b.dataset.gjump;
          if(k === 'first') smoothTo(0);
          else if(k === 'last') smoothTo(offsetOfSlot(meta.slots-1));
          else if(k === 'today') centerSlot(meta.curSlot);
          else if(k === 'prev') centerSlot(Math.max(0, viewSlot()-1));
          else if(k === 'next') centerSlot(Math.min(meta.slots-1, viewSlot()+1));
          ensureTicksVisible();
        });
      });

      /* ===== 【改动一】分块渲染（虚拟滚动） =====
         总格数 > 400 时启用：只渲染视口左右各一个「块」范围，
         视口外的真实刻度会被收回成占位块，保证 DOM 节点数恒定有界。
         滚动/跳转时调用本函数做「展开视口内 + 折叠视口外」。 */
      const TICK_BUFFER = 2;             // 视口左右各多渲染几个格，滚动更顺滑
      function ensureTicksVisible(){
        if(!needVirtual || !gwrap) return;
        const tickRow = gwrap.querySelector('[data-tickrow]');
        if(!tickRow) return;
        const tickBox = tickRow.querySelector('[data-tickbox]');
        if(!tickBox) return;
        const vw = gwrap.clientWidth;
        const vL = gwrap.scrollLeft - vw*TICK_BUFFER;
        const vR = gwrap.scrollLeft + vw*(1 + TICK_BUFFER);
        /* 逐格判断：在视口附近的渲染真实刻度，之外的用占位块，
           相邻同类合并成一个节点（避免 400+ 个节点）。 */
        let html = '', phRun = null;
        const ps = prefixSum();
        for(let i=0;i<meta.slots;i++){
          const x0 = ps[i], x1 = ps[i+1];
          const near = (x1 >= vL && x0 <= vR);
          if(near){
            if(phRun){ html += tickPlaceholder(phRun[0], phRun[1]); phRun = null; }
            html += tickCellAt(i);
          } else {
            if(phRun) phRun[1] = i; else phRun = [i, i];
          }
        }
        if(phRun) html += tickPlaceholder(phRun[0], phRun[1]);
        tickBox.innerHTML = html;
      }

      /* ===== 【改动二】拖拽排序（HTML5 drag + 触摸） ===== */
      const rowEls = $$('#content .g-row');
      const ROW_META = new Map();
      /* 【需求 4】多条目行（复习轮次条 / 同内容合并条）的 data-grow 取 bars[0].key，
         故 key 生成与 rowOf 保持一致 */
      const isMultiRow = t=> Array.isArray(t.bars) && t.bars.length > 0;
      const rowKeyOf = t=> isMultiRow(t) ? t.bars[0].key : (t.type+'|'+t.it.id);
      rows.forEach((t,i)=>{ ROW_META.set(rowKeyOf(t), t); });
      const nameOf = key=>{ const t = ROW_META.get(key); return t ? t.it.text : key; };
      /* 提交新顺序：把当前 DOM 顺序写回全部「可见任务」的 order（0,1,2...）
         【复习计划】复习任务行的 order 写回 rt 原始对象（虚拟 it 是浅拷贝，
         直接写 t.it.order 不会落库），保证拖拽顺序在复习任务上也持久化。
         【需求 4】同内容合并行：组内所有 id 写相同 order（整行一起移动）。 */
      function commitOrder(){
        const keys = $$('#content .g-row').map(el=>el.dataset.grow);
        keys.forEach((key, i)=>{
          const t = ROW_META.get(key); if(!t) return;
          if(t.type === 'review'){ if(t.rt) t.rt.order = i; }
          else if(isMultiRow(t) && Array.isArray(t.groupIds)){
            /* 合并行：把整组 order 统一写成行下标，保证组内不被拆散 */
            const pool = S.plans[t.type] || [];
            t.groupIds.forEach(gid=>{
              const obj = pool.find(x=>x.id === gid);
              if(obj) obj.order = i;
            });
          }
          else t.it.order = i;                 // 写回计划对象
        });
        save(true);
        toast('顺序已保存 ✓');
      }
      let dragKey = null;
      rowEls.forEach(el=>{
        const handle = el.querySelector('.drag-handle');
        if(!handle) return;
        /* HTML5 drag（桌面） */
        handle.setAttribute('draggable','true');
        handle.addEventListener('dragstart', ev=>{
          dragKey = el.dataset.grow;
          el.classList.add('dragging');
          try{ ev.dataTransfer.setData('text/plain', dragKey); ev.dataTransfer.effectAllowed='move'; }catch(e){}
        });
        handle.addEventListener('dragend', ()=>{
          el.classList.remove('dragging');
          $$('#content .g-row').forEach(x=>x.classList.remove('drag-over'));
          if(dragKey) commitOrder();
          dragKey = null;
        });
        el.addEventListener('dragover', ev=>{
          if(!dragKey) return;
          ev.preventDefault();
          if(el.dataset.grow !== dragKey) el.classList.add('drag-over');
        });
        el.addEventListener('dragleave', ()=>el.classList.remove('drag-over'));
        el.addEventListener('drop', ev=>{
          ev.preventDefault();
          const from = $$('#content .g-row').find(x=>x.dataset.grow === dragKey);
          el.classList.remove('drag-over');
          if(from && from !== el){
            /* 判断落点在行的上/下半，决定插前还是插后 */
            const r = el.getBoundingClientRect();
            const after = (ev.clientY - r.top) > r.height/2;
            const parent = el.parentNode;
            parent.insertBefore(from, after ? el.nextSibling : el);
          }
        });
        /* 触摸拖拽（移动端）：长按把手后跟随手指移动，落到最近行位置 */
        let touchFrom = null;
        handle.addEventListener('touchstart', ev=>{
          dragKey = el.dataset.grow;
          touchFrom = el;
          el.classList.add('dragging');
          document.body.classList.add('g-dragging-touch');
        }, {passive:true});
        handle.addEventListener('touchmove', ev=>{
          if(!dragKey) return;
          ev.preventDefault();
          const t = ev.touches && ev.touches[0];
          if(!t) return;                            // 触摸点缺失（合成事件边界情况）直接跳过
          const over = document.elementFromPoint(t.clientX, t.clientY);
          const target = over && over.closest ? over.closest('.g-row') : null;
          $$('#content .g-row').forEach(x=>x.classList.remove('drag-over'));
          if(target && target.dataset.grow !== dragKey){
            target.classList.add('drag-over');
            const r = target.getBoundingClientRect();
            const after = (t.clientY - r.top) > r.height/2;
            const parent = target.parentNode;
            if(touchFrom) parent.insertBefore(touchFrom, after ? target.nextSibling : target);
          }
        }, {passive:false});
        handle.addEventListener('touchend', ()=>{
          document.body.classList.remove('g-dragging-touch');
          $$('#content .g-row').forEach(x=>{ x.classList.remove('drag-over'); x.classList.remove('dragging'); });
          if(dragKey) commitOrder();
          dragKey = null; touchFrom = null;
        });
        /* 触摸被系统取消（来电/手势打断）时同样收尾，避免卡在拖拽态 */
        handle.addEventListener('touchcancel', ()=>{
          document.body.classList.remove('g-dragging-touch');
          $$('#content .g-row').forEach(x=>{ x.classList.remove('drag-over'); x.classList.remove('dragging'); });
          dragKey = null; touchFrom = null;
        });
      });

      /* ===== 【改动二】恢复默认排序：清空全部任务的 order ===== */
      const rst = $('#gResetOrder');
      if(rst) rst.addEventListener('click', ()=>{
        if(!confirm('恢复默认排序？\n将清除所有任务的「手动拖拽顺序」，回到「阶段 → 类型 → 分类 → 创建时间」的默认排序。')) return;
        ['daily','weekly','monthly','overall'].forEach(tp=>{
          (S.plans[tp]||[]).forEach(x=>{ if('order' in x) delete x.order; });
        });
        /* 【复习计划】复习任务的拖拽顺序一并清除 */
        reviewList().forEach(rt=>{ if('order' in rt) delete rt.order; });
        save(true); renderPageKeepScroll();
        toast('已恢复默认排序 ↺');
      });

      /* ===== 【需求 1】导出 PDF：弹窗选时间范围 → 新窗口 A4 横向打印 ===== */
      const exp = $('#gExportPdf');
      if(exp) exp.addEventListener('click', ()=>{ ganttExportPdfDialog(meta, rows); });

      /* ===== 【改动三】快速添加卡片的颜色组件 ===== */
      ganttBindColorRow('gAdd',
        ()=>GANTT_STATE.addColor||'',
        v=>{ GANTT_STATE.addColor = v; });

      /* 保存 → 写 S.plans[type]（结构同 openAddPlan，保证与待办联动） */
      $('#gAddSave').addEventListener('click', ()=>{
        const type = $('#gAddType').value;
        const text = ($('#gText').value||'').trim();
        if(!text){ toast('请输入任务内容'); return; }
        /* 【改动三】颜色满 20 时阻止保存 */
        const cin = $('#gAddColorInp');
        const cval = cin && cin.value.trim() ? ganttNormColor(cin.value) : '';
        if(cin && cin.value.trim() && !cval){ toast('颜色格式不正确（支持 #RRGGBB / #RGB / rgb(...)）'); return; }
        if(cval){
          const mem = ganttColorMem();
          if(mem.indexOf(cval) < 0 && mem.length >= GANTT_COLOR_MAX){
            toast('记忆色号已满 20 个，请先删除不再使用的色号再保存');
            return;
          }
        }
        const item = { id: uid(), text, cat: $('#gCat').value, stage: $('#gStage').value, created: Date.now(), records: [] };
        if(cval) item.color = cval;              // 只在有颜色时写 color 字段
        readPlanDateFields(type, item);          // 复用现有读取：daily→due；weekly/monthly→startDate/endDate+锚点；overall→startDate/endDate
        S.plans[type].push(item);
        if(cval) ganttColorCommit(cval);         // 自动写入 / 去重记忆
        GANTT_STATE.addColor = '';
        save(true); renderPageKeepScroll();
        toast('已同步到 '+PLAN_META[type].name+' ✓'+(cval?'（颜色 '+cval+'）':''));
      });

      /* 初始滚动：【改动一】进入时自动滚到「当前周 / 当前月 / 今天」 */
      if(gwrap){
        /* 分块渲染：滚动时按视口重算刻度（节流，避免高频重排） */
        if(needVirtual){
          let tickT = null;
          gwrap.addEventListener('scroll', ()=>{
            if(tickT) return;
            tickT = setTimeout(()=>{ tickT = null; ensureTicksVisible(); }, 60);
          }, {passive:true});
        }
        requestAnimationFrame(()=>{
          centerSlot(meta.curSlot);
          ensureTicksVisible();
          /* 平滑滚动结束后再校正一次刻度窗口（滚动过程中位置在变） */
          if(needVirtual) setTimeout(ensureTicksVisible, 700);
        });
      }
    }
  };
};

/* 甘特图任务编辑弹窗（表单结构与 openEditPlan 一致，额外提供删除；
   【改动三】在「所属阶段」下方新增「任务颜色」选择行；
   【复习计划】当 type === 'review' 时不开计划编辑表单，而是转发到
   reviewOpenEdit —— 甘特条与复习计划页「查看详情」共用同一个编辑弹窗，
   因而「7 轮日期调整 / 手动标记完成 / 关闭复习 / 颜色覆盖」四处入口行为一致。 */
function ganttOpenEdit(type, id){
  if(type === 'review'){ reviewOpenEdit(id); return; }
  const it = (S.plans[type]||[]).find(x=>x.id === id);
  if(!it) return;
  const catOpts = CATS.map(c=>'<option value="'+c+'" '+(it.cat===c?'selected':'')+'>'+c+'</option>').join('');
  const stageOpts = STAGES.map(s=>'<option value="'+s+'" '+(it.stage===s?'selected':'')+'>'+s+'</option>').join('');
  /* 编辑态临时色值（保存时才写回任务并写入记忆） */
  let editColor = ganttNormColor(it.color) || '';
  openModal('✏️ 编辑任务（'+PLAN_META[type].name+'）',
    '<div class="field"><label>任务内容</label><input class="inp" id="epText" value="'+esc(it.text)+'"></div>'+
    '<div class="field"><label>所属分类</label><select class="sel" id="epCat">'+catOpts+'</select></div>'+
    '<div class="field"><label>所属阶段</label><select class="sel" id="epStage">'+stageOpts+'</select></div>'+
    /* 【改动三】颜色选择行（色块预览 + 输入框 + 系统调色盘 + 20 格记忆） */
    ganttColorRowHtml('ep', it.color||'')+
    dateFieldsHtml(type, it),
    [
      {text:'保存修改', primary:true, onClick:()=>{
        const text = ($('#epText').value||'').trim();
        if(!text){ toast('请输入任务内容'); return false; }
        /* 【改动三】校验颜色；满 20 且为新色 → 阻止保存 */
        const cin = $('#epColorInp');
        const raw = cin ? cin.value.trim() : '';
        const cval = raw ? ganttNormColor(raw) : '';
        if(raw && !cval){ toast('颜色格式不正确（支持 #RRGGBB / #RGB / rgb(...)）'); return false; }
        if(cval){
          const mem = ganttColorMem();
          if(mem.indexOf(cval) < 0 && mem.length >= GANTT_COLOR_MAX){
            toast('记忆色号已满 20 个，请先删除不再使用的色号再保存');
            return false;
          }
        }
        it.text = text;
        it.cat = $('#epCat').value;
        it.stage = $('#epStage').value;
        /* 【改动三】写回颜色：有则存大写，无则删除字段（回退分类默认色） */
        if(cval){ it.color = cval; ganttColorCommit(cval); }
        else { if('color' in it) delete it.color; }
        readPlanDateFields(type, it);
        save(true); closeModal();
        renderPageKeepScroll();
        toast('已保存修改 ✓');
      }},
      {text:'删除任务', onClick:()=>{
        if(!confirm('确定删除这条任务吗？\n「'+it.text+'」\n删除后甘特图与对应计划页同时移除。')) return;
        S.plans[type] = (S.plans[type]||[]).filter(x=>x.id !== id);
        save(true); closeModal(); renderPageKeepScroll();
        toast('任务已删除');
      }},
      {text:'取消'}
    ]);
  setTimeout(()=>{
    try{ bindPlanDateFields(type); }catch(e){}
    /* 【改动三】绑定编辑弹窗内的颜色组件 */
    try{ ganttBindColorRow('ep', ()=>editColor, v=>{ editColor = v; }); }catch(e){}
  }, 30);
}

/* —— 逻辑题库自检（可验证性保障）——
   每题配一个「独立求解器」：用穷举/计算重新推导正确选项下标，
   与题库答案自动比对，不一致时在控制台告警（含题号）。
   可随时在控制台执行 verifyLogicPool() 人工复核全部题目。 */
function verifyLogicPool(){
  const rows = n => { const out=[]; for(let m=0;m<(1<<n);m++){ const a=[]; for(let i=0;i<n;i++) a.push(!!(m>>i&1)); out.push(a); } return out; };
  const eq = (f,g) => rows(2).every(p=>f(p[0],p[1])===g(p[0],p[1]));
  const solvers = [
    // 1 天鹅：题干模型 (天鹅,白)：(天鹅→白) 且 非白 ⇒ 必非天鹅
    ()=>{ const ms=rows(2).filter(([s,w])=>(!s||w)&&!w); return ms.every(m=>!m[0])?0:-1; },
    // 2 谁说真话：甲真⟺乙假、乙真⟺丙假、丙真⟺甲乙皆假，恰一真
    ()=>{ const hits=rows(3).filter(T=>T[0]===!T[1]&&T[1]===!T[2]&&T[2]===(!T[0]&&!T[1])&&T.filter(x=>x).length===1);
      return (hits.length===1&&hits[0][1])?1:(hits.length===1?0:2); },
    // 3 逆否：题干模型 (下雨,延期)：(下雨→延期) 且 非延期 ⇒ 必非下雨
    ()=>{ const ms=rows(2).filter(([r,d])=>(!r||d)&&!d); return ms.every(m=>!m[0])?0:-1; },
    // 4 直言命题：有博士 且 有非博士 ⇒ 并非所有人都博士
    ()=>{ for(const m of rows(2)) if(m.some(x=>x)&&m.some(x=>!x)&&m.every(x=>x)) return -1; return 0; },
    // 5 A/O 矛盾：任何非空个体域上 全肯 与 特否 必一真一假（不同真不同假）
    ()=>{ for(let n=1;n<=4;n++) for(const m of rows(n)){ if(m.every(x=>x)===m.some(x=>!x)) return -1; } return 1; },
    // 6 必要条件：题干=提高→学习；A(逆否 ¬学习→¬能力)/B/C 均与题干等值 ⇒ 以上都对
    ()=>{ const stem=(l,i)=>!i||l;
      return (eq((l,i)=>l||!i,stem)&&eq((l,i)=>i?l:true,stem)&&eq((l,i)=>i?l:true,stem))?3:-1; },
    // 7 三段论：题干模型 (铜是金属,铜导电)：(金属→导电) 且 是金属 ⇒ 导电
    ()=>{ const ms=rows(2).filter(([m,c])=>(!m||c)&&m); return ms.every(m=>m[1])?0:-1; },
    // 8 颜色穷举：(红,蓝)∈{(T,F),(F,T),(F,F)}，恰一人说谎
    ()=>{ const sat=[[true,false],[false,true],[false,false]].filter(([red,blue])=>{
        const lies=[!red, red, !blue]; return lies.filter(x=>x).length===1; });
      return (sat.length===1&&sat[0][1])?1:(sat.length===1?0:-1); },
    // 9 必要条件：没有规矩→不成方圆 ⟺ 成方圆→有规矩
    ()=>{ const stem=(g,r)=>r||!g;
      return (eq((g,r)=>!g||r,stem)&&!eq((g,r)=>!r||g,stem))?0:-1; },
    // 10 容斥：最少重叠 = max(0, 30+25-45) = 10
    ()=>{ const mn=Math.max(0,30+25-45); return mn===10?0:-1; }
  ];
  const out=[];
  solvers.forEach((s,i)=>{
    const derived = s();
    const key = (LOGIC_POOL[i]||{}).a;
    const ok = (derived===key);
    out.push({题号:i+1, 求解器答案: derived<0?'校验器异常':String.fromCharCode(65+(derived<0?0:derived)), 题库答案:String.fromCharCode(65+(key||0)), 结论: ok?'✓ 一致':'✗ 不一致'});
    if(!ok) console.warn('[逻辑题库自检] 第'+(i+1)+'题答案不一致：求解器推出 '+derived+'，题库为 '+key);
  });
  const bad = out.filter(r=>r.结论!=='✓ 一致').length;
  if(bad===0) console.log('[逻辑题库自检] 全部 '+out.length+' 题答案与解析经独立求解验证一致 ✓');
  return out;
}

/* ============================================================
   通用：刷题计时器
   ============================================================ */
/* 每题倒计时模型（参考「计时器.html」）
   机制：开始后对当前题倒计时；空格=记下本题用时并进入下一题；
        回车=结束本次刷题。每题记录 实际/建议/差值。            */
const T = { running:false, cat:'政治理论', remain:0, interval:null,
            qStart:0, qLog:[], beeped:false, saved:false };
// 各板块默认建议每题时长（秒）
const TM_IDEAL_DEFAULTS = { '政治理论':50, '常识':40, '言语理解':50, '逻辑判断':90, '数量关系':120, '资料分析':90, '申论':120 };
function T_idealSec(){
  const ov = (S.idealByCat||{})[T.cat];
  if(Number(ov) > 0) return Number(ov);
  const d = TM_IDEAL_DEFAULTS[T.cat];
  return (Number(d) > 0 ? Number(d) : 120);
}
function T_reset(){
  T.running = false;
  if(T.interval){ clearInterval(T.interval); T.interval = null; }
  T.qLog = []; T.qStart = 0; T.beeped = false; T.saved = false;
  T.remain = T_idealSec();
  T_updateClock();
}
function T_updateClock(){
  const el = document.getElementById('tmClock');
  if(el){
    el.textContent = fmtClock(T.remain);
    el.classList.toggle('neg', T.remain < 0);
  }
  const lb = document.getElementById('tmLabel');
  if(lb) lb.textContent = T.cat + ' · 建议每题 ' + fmtMS(T_idealSec());
}
function T_start(){
  if(T.running) return;
  T.qLog = []; T.saved = false;
  T.qStart = Date.now();
  T.remain = T_idealSec();
  T.beeped = false;
  T.running = true;
  /* 需求 6：开始计时前先结算并暂停页面停留计时（避免与 timer 时长重复计入） */
  try{ dwellFlush(); _dwell.paidAt = Date.now(); }catch(e){}
  T_updateClock();
  if(T.interval) clearInterval(T.interval);
  T.interval = setInterval(()=>{
    if(!T.running) return;
    T.remain -= 1;
    T_updateClock();
    if(T.remain === 0 && !T.beeped){ T.beeped = true; try{ playBeep(); }catch(e){} }
  }, 1000);
  const b = document.getElementById('tmStart');
  if(b) b.textContent = '⏹ 结束刷题';
  const nx = document.getElementById('tmNext');
  if(nx) nx.disabled = false;
  toast('开始刷题 ⏵ 空格=下一题，回车=结束');
}
// 记录当前题（不结束本次刷题）
function T_logQuestion(){
  if(T.qStart === null || !T.qStart) return null;
  const real = Math.round(((Date.now() - T.qStart)/1000)*10)/10;
  const preset = T_idealSec();
  const rec = { moduleName:T.cat, presetSeconds:preset, actualSeconds:real,
                difference: Math.round((real - preset)*10)/10 };
  T.qLog.push(rec);
  T.qStart = Date.now();
  T.remain = preset;
  T.beeped = false;
  T_updateClock();
  // 同步今日做题数
  const t = todayStr();
  if(!S.studyLog[t]) S.studyLog[t] = {sec:0, q:0, sl:0};
  S.studyLog[t].q = (S.studyLog[t].q || 0) + 1;
  // 分块记账：题数记到当前板块（刷题计时器的 T.cat 映射到菜单 id）
  const bd = boardByModule(T.cat) || boardIdOf(cur) || 'xc';
  const bref = boardDayRef(bd, t);
  bref.q = (bref.q || 0) + 1;
  save();
  return rec;
}
function T_next(){
  if(!T.running) return;
  const rec = T_logQuestion();
  T_syncPanel();
  if(rec) toast('第 '+T.qLog.length+' 题完成 · 用时 '+fmtMS(rec.actualSeconds));
}
function T_syncPanel(){
  const c = document.getElementById('tmCount');
  if(c) c.textContent = T.qLog.length;
  const h = document.getElementById('tmHist');
  if(h) h.innerHTML = tmHistoryHtml(T.qLog, T.cat);
}
function T_end(){
  if(!T.running){ toast('请先开始计时'); return; }
  const rec = T_logQuestion();
  T.running = false;
  if(T.interval){ clearInterval(T.interval); T.interval = null; }
  /* 需求 6：结束刷题后，页面停留从「此刻」重新开始累计
     （计时期间不补记，彻底避免与 timer 时长重复） */
  try{ _dwell.paidAt = Date.now(); }catch(e){}
  const total = T.qLog.reduce((s,q)=>s+q.actualSeconds, 0);
  const totalPreset = T.qLog.reduce((s,q)=>s+q.presetSeconds, 0);
  const t = todayStr();
  if(!S.studyLog[t]) S.studyLog[t] = {sec:0, q:0, sl:0};
  S.studyLog[t].sec = (S.studyLog[t].sec || 0) + Math.round(total);
  if(T.qLog.length){
    // 保存本次会话全部小题明细至历史记录
    S.timerLog.push({d:t, ts:Date.now(), sec:Math.round(total), q:T.qLog.length, cat:T.cat, details: T.qLog.slice()});
    if(S.timerLog.length > 2000) S.timerLog = S.timerLog.slice(-2000);
    // 分块记账：本次刷题时长记入该板块的 timer 字段
    const bd = boardByModule(T.cat) || boardIdOf(cur) || 'xc';
    const bref = boardDayRef(bd, t);
    bref.timer = (bref.timer || 0) + Math.round(total);
    save(true);
  }
  const diff = Math.round((total - totalPreset)*10)/10;
  openModal('⏹ 本次刷题总结',
    (T.qLog.length ?
      '<div style="text-align:center;margin-bottom:12px;">'+
        '<div style="font-size:calc(var(--fs-num) * .7);font-weight:900;color:var(--pinkDeep2);">'+fmtClock(total)+'</div>'+
        '<div style="color:var(--text2);font-size:var(--fs-btn);margin-top:4px;">共 '+T.qLog.length+' 题 · 应花 '+fmtMS(totalPreset)+' · 实花 '+fmtMS(total)+' · '+
          '<b style="color:'+(diff>0?'var(--coral)':'#3E8A68')+';">'+(diff>0?'+':'')+fmtMS(Math.abs(diff))+'</b></div>'+
      '</div>'+
      tmDetailHtml(T.qLog)
      : '<div style="text-align:center;color:var(--text2);padding:14px 0;">本次未记录到题目用时</div>'),
    [{text:'好的', primary:true}]);
  // 保留 T.qLog：结束后仍显示在「本次小题记录」里，直到下次点开始
  T.qStart = 0; T.remain = T_idealSec(); T.saved = true;
  renderPage();
}
function T_resetSession(){
  T_reset();
  renderPage();
}

/* 明细行（总结 / 历史弹窗共用）：实际 / 建议 / 差值 */
function tmDetailHtml(list){
  if(!list || !list.length) return '<div style="color:var(--text3);font-size:var(--fs-btn);text-align:center;padding:8px 0;">暂无题目记录</div>';
  let h = '<div style="display:flex;justify-content:space-between;gap:8px;font-size:calc(var(--fs-btn) - 2px);color:var(--text3);padding-bottom:4px;border-bottom:1.5px solid var(--line);">'+
    '<span style="flex:none;width:52px;">题目</span><span style="flex:1;">实际用时</span><span style="flex:1;">建议时长</span><span style="flex:1;">差值</span></div>';
  h += list.map((q,i)=>{
    const d = Math.round(((q.actualSeconds||0) - (q.presetSeconds||0))*10)/10;
    const col = d > 0 ? 'var(--coral)' : '#3E8A68';
    return '<div style="display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #eee;padding:7px 0;font-size:calc(var(--fs-btn) - 1px);">'+
      '<span style="flex:none;width:52px;font-weight:700;">第 '+(i+1)+' 题</span>'+
      '<span style="flex:1;color:var(--text2);"><b style="color:var(--pinkDeep2);">'+fmtMS(q.actualSeconds)+'</b></span>'+
      '<span style="flex:1;color:var(--text2);">'+fmtMS(q.presetSeconds)+'</span>'+
      '<span style="flex:1;color:'+col+';font-weight:700;">'+(d>0?'+':'')+fmtMS(Math.abs(d))+'</span>'+
    '</div>';
  }).join('');
  const ta = list.reduce((a,q)=>a+(q.actualSeconds||0),0);
  const tp = list.reduce((a,q)=>a+(q.presetSeconds||0),0);
  const td = Math.round((ta-tp)*10)/10;
  h += '<div style="display:flex;justify-content:space-between;padding:8px 0 2px;font-size:calc(var(--fs-btn) - 1px);font-weight:800;">'+
    '<span>共 '+list.length+' 题</span>'+
    '<span>应花 '+fmtMS(tp)+' / 实花 '+fmtMS(ta)+' <span style="color:'+(td>0?'var(--coral)':'#3E8A68')+';">'+(td>0?'+':'')+fmtMS(Math.abs(td))+'</span></span></div>';
  return h;
}
// 计时器卡片内的历史记录列表
function tmHistoryHtml(list, cat){
  if(!list || !list.length) return '<div style="font-size:calc(var(--fs-btn) - 1px);color:var(--text3);text-align:center;padding:10px 0;">本次暂无题目记录，点击「开始刷题」后按空格记录每题</div>';
  const ta = list.reduce((a,q)=>a+(q.actualSeconds||0),0);
  const tp = list.reduce((a,q)=>a+(q.presetSeconds||0),0);
  const td = Math.round((ta-tp)*10)/10;
  let h = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">'+
    '<span class="pill mint">共 '+list.length+' 题</span>'+

    '<span class="pill lav">实花 '+fmtMS(ta)+'</span>'+
    '<span class="pill '+(td>0?'coral':'mint')+'">'+(td>0?'超时 +':'节省 ')+fmtMS(Math.abs(td))+'</span>'+
  '</div>';
  h += list.map((q,i)=>{
    const d = Math.round(((q.actualSeconds||0) - (q.presetSeconds||0))*10)/10;
    return '<div style="display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:6px 0;font-size:calc(var(--fs-btn) - 1px);">'+
      '<span style="flex:none;font-weight:700;">第 '+(i+1)+' 题</span>'+
      '<span style="flex:1;color:var(--text2);">实际 <b style="color:var(--pinkDeep2);">'+fmtMS(q.actualSeconds)+'</b></span>'+

      '<span style="flex:1;color:'+(d>0?'var(--coral)':'#3E8A68')+';font-weight:700;">'+(d>0?'+':'')+fmtMS(Math.abs(d))+'</span>'+
    '</div>';
  }).join('');
  return h;
}
// 历史会话记录（存 timerLog.details）：分页每页 5 条 + 导出/导入/清空

function tmHistPageOf(cat){

function tmHistSetPage(cat, p){
  const m = S.tmHistPage || (S.tmHistPage = {});

}
function tmHistTsLabel(ts){
  const d = new Date(ts);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());

function tmHistBlockHtml(cat){

      '</div>'

  /* 导入/导出/清空按钮已移至「历史记录」标题右侧（需求 7），
     此处只保留隐藏的文件选择框供导入使用。 */
  const ops = '<input type="file" id="tmHistFile" accept=".json" style="display:none;">';
  return rows + pager + ops;

function importTimerHistory(cat, file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      let txt = String(reader.result || '').replace(/^\ufeff/, '');
      const obj = JSON.parse(txt);
      const arr = Array.isArray(obj) ? obj : (Array.isArray(obj.records) ? obj.records : []);
      const valid = arr.filter(r=>r && Array.isArray(r.details) && r.details.length)
        .map(r=>({ d:String(r.d||todayStr()), ts:Number(r.ts)||Date.now(), sec:Math.round(Number(r.sec)||0),
                   q:r.details.length, cat, details:r.details.map(q=>({
                     moduleName:String(q.moduleName||cat), presetSeconds:Number(q.presetSeconds)||0,
                     actualSeconds:Number(q.actualSeconds)||0, difference:Number(q.difference)||0 })) }));
      if(!valid.length){ toast('文件中没有可导入的计时记录'); return; }
      const exist = new Set((S.timerLog||[]).map(x=>String(x.ts)+'|'+x.cat));
      let added = 0;
      valid.forEach(r=>{ const k = String(r.ts)+'|'+cat; if(exist.has(k)) return; exist.add(k); S.timerLog.push(r); added++; });
      if(S.timerLog.length > 2000) S.timerLog = S.timerLog.slice(-2000);
      save(true); renderPage();
      toast(added ? ('已导入 '+added+' 条记录 ✓') : '记录均已存在，无新增');
    }catch(e){ toast('导入失败：文件格式不正确'); }
  };
  reader.readAsText(file, 'utf-8');
}
function bindTmHistBlock(cat){
  /* 委托容器用标签卡体（含「历史记录」标题右侧按钮 + 记录列表）——
     导入/导出/清空按钮在标题行，不在 #tmHistory 内部 */
  const wrap = $('#tmHistory') ? $('#tmHistory').closest('.tm-tab-body') : null;
  if(!wrap) return;
  wrap.addEventListener('click', e=>{
    const v = e.target.closest('[data-tmview]');
    if(v){ openTimerHistDetail(v.dataset.tmview); return; }
    const act = e.target.closest('[data-thact]');
    if(!act || act.disabled) return;
    const a = act.dataset.thact;
    const all = tmHistRecords(cat);
    const totalPages = Math.max(1, Math.ceil(all.length / 5));
    const page = Math.min(tmHistPageOf(cat), totalPages);
    if(a === 'prev' && page > 1){ tmHistSetPage(cat, page-1); renderPageKeepScroll(); }
    else if(a === 'next' && page < totalPages){ tmHistSetPage(cat, page+1); renderPageKeepScroll(); }
    else if(a === 'export'){
      if(!all.length){ toast('暂无历史记录可导出'); return; }
      const content = JSON.stringify({cat, exportedAt:new Date().toISOString(), records:all}, null, 2);
      try{
        const blob = new Blob([content], {type:'application/json;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const el = document.createElement('a');
        el.href = url; el.download = '计时历史_'+cat+'_'+todayStr()+'.json';
        document.body.appendChild(el); el.click();
        setTimeout(()=>{ document.body.removeChild(el); URL.revokeObjectURL(url); }, 200);
        toast('已导出 '+all.length+' 条记录 ✓');
      }catch(err){ toast('导出失败'); }
    }
    else if(a === 'import'){ const f = $('#tmHistFile'); if(f) f.click(); }
    else if(a === 'clear'){
      if(!all.length){ toast('暂无历史记录，无需清空'); return; }
      openModal('🗑 清空「'+esc(cat)+'」历史记录',
        '<div style="text-align:center;font-size:var(--fs-body);line-height:2;padding:6px 0;">喵~真的要全部清空吗？<br>清空后再不能恢复哦~</div>',
        [{text:'确认清空', primary:true, onClick:()=>{
          S.timerLog = S.timerLog.filter(x=>x.cat !== cat);
          tmHistSetPage(cat, 1);
          save(true); closeModal(); renderPage();
          toast('已清空「'+cat+'」历史记录');
        }},{text:'取消'}]);
    }
  });
  const f = $('#tmHistFile');
  if(f) f.addEventListener('change', ()=>{
    const file = f.files && f.files[0];
    if(file) importTimerHistory(cat, file);
    f.value = '';
  });
}

    '<div style="display:flex;gap:14px;margin-top:10px;">'+

/* 学习时长进度条：<100% 用普通粉条；≥100% 用柔和马卡龙彩虹（需求 12）
   data-livegoal 标记该条是「学习时长进度」，供实时刷新定位 */
function progressBarRainbow(pct, over){
  if(over){
    return '<div class="pbar rainbow" data-livegoal><i style="width:100%"></i></div>';
  }
  pct = Math.max(0, Math.min(100, Math.round(pct)));
  return '<div class="pbar" data-livegoal><i style="width:'+pct+'%"></i></div>';
}
/* 进度卡绑定：打卡切换 + 目标时长修改（需求 5：分钟，1 位小数，≥0.1） */
function bindProgressCard(board){
  const ck = $('#ckTodayBtn');
  if(ck) ck.addEventListener('click', ()=>{
    const nowOn = toggleBoardCheckin(board);
    toast(nowOn ? '今日已打卡 ✓（计入本板块）' : '已取消今日打卡');
    renderTopbar();               // 需求 3：全局打卡统计同步刷新
    renderPageKeepScroll();
  });
  const goal = $('#boardGoalM');
  if(goal) goal.addEventListener('change', ()=>{
    let m = parseFloat(goal.value);
    if(!(m >= 0.1)) m = 240;                       // 非法输入回落默认 4 小时
    m = Math.max(0.1, Math.min(1440, m));          // 0.1 分钟 ~ 24 小时
    m = Math.round(m * 10) / 10;                   // 保留 1 位小数
    if(!S.boardGoalSec) S.boardGoalSec = {};
    S.boardGoalSec[board] = Math.round(m * 60);    // 秒存储
    goal.value = m;
    save(true); renderPageKeepScroll();
    toast('学习时长目标已设为 '+m+' 分钟');
  });
}

/* ============================================================
   待办事项卡片
   ============================================================ */
function todoCard(cat){
  const items = (S.plans.daily||[]).filter(i=>i.cat === cat);
  let lis = '';
  /* 【复习计划】实时映射：该分类下「今天待复习」的复习任务插到待办列表最前
     （同样不写 S.plans，仅渲染虚拟项，与每日计划页共用同一份数据源） */
  const rvToday = reviewTodayList().filter(rt=> canonCat(rt.sourceCat) === canonCat(cat));
  rvToday.forEach(rt=>{ lis += reviewVirtualItemHtml(rt, 'todo'); });
  if(!items.length && !rvToday.length){
    lis = '<div style="font-size:var(--fs-btn);color:var(--text3);text-align:center;padding:12px 0;">暂无待办，去「每日计划」添加吧 ✨</div>';
  } else {
    items.forEach(it=>{
      const d = planDoneCount(it,'daily');
      const f = planFailCount(it,'daily');
      /* 【复习计划】已完成打卡的待办同样提供「📚 纳入复习」入口 */
      const canReview = d > 0;
      const inReview = reviewList().some(rt=> rt.sourceType==='daily' && rt.sourceId === it.id);
      lis += '<div class="li">'+
        '<div class="txt">'+esc(it.text)+'</div>'+
        '<div class="meta">'+
          (d?'<span class="pill mint">✓ '+d+'</span>':'')+
          (f?'<span class="pill coral">✗ '+f+'</span>':'')+
          '<button class="btn sm mint" data-tp="'+it.id+'">+1</button>'+
          (canReview
            ? (inReview
                ? '<button class="btn sm ghost" data-review-open="'+it.id+'" title="该任务已在复习计划中，点击查看">📚 已纳入</button>'
                : '<button class="btn sm ghost" data-review-add="'+it.id+'">📚 纳入复习</button>')
            : '')+
        '</div>'+
      '</div>';
    });
  }
  const cnt = items.length + rvToday.length;
  return '<div class="card">'+
    '<div class="card-title">'+titleIco('check')+' 待办事项 <span class="sub">'+cnt+' 项'+
      (rvToday.length ? '（含 '+rvToday.length+' 项复习）' : '')+'</span></div>'+
    lis+
  '</div>';
}
function bindTodoButtons(){
  $$('#content [data-tp]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const it = (S.plans.daily||[]).find(x=>x.id===b.dataset.tp);
      if(!it) return;
      it.records = it.records || [];
      it.records.push({d: it.due || todayStr(), ts: Date.now(), ok:true});
      save(true); renderPageKeepScroll(); toast('打卡 +1 ✓');
    });
  });
  /* 【复习计划】待办里的纳入复习按钮 */
  $$('#content [data-review-add]').forEach(b=>{
    b.addEventListener('click', (e)=>{ e.stopPropagation(); reviewConfirmAdd(b.dataset.reviewAdd); });
  });
  $$('#content [data-review-open]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      const rt = reviewList().find(x=> x.sourceType==='daily' && x.sourceId === b.dataset.reviewOpen);
      if(rt) reviewOpenEdit(rt.id); else toast('该任务已在复习计划中');
    });
  });
  /* 【复习计划】待办里虚拟项的「+1」= 标记本轮复习完成 */
  $$('#content [data-rv-plus]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      const rt = reviewList().find(x=> x.id === b.dataset.rvPlus);
      if(!rt) return;
      const rounds = reviewDueRounds(rt, todayStr());
      if(!rounds.length){ toast('今天没有待复习的轮次'); return; }
      rounds.forEach(r=> reviewMarkDone(rt, r.round));
      save(true); renderPageKeepScroll();
      const st = reviewStats(rt);
      toast('复习完成 ✓ 第 '+rounds.map(r=>r.round).join('、')+' 轮'+(st.allDone ? '（全部完成 🎉）' : ''));
    });
  });
  $$('#content [data-rv-detail]').forEach(b=>{
    b.addEventListener('click', (e)=>{ e.stopPropagation(); reviewOpenEdit(b.dataset.rvDetail); });
  });
}

    (S.pastNews||[]).forEach(x=>{ exist[(x.u||'')+'|'+x.t] = 1; });

      S.pastNews.push({ t:n.t, d:n.d, k:n.k||[], src:n.src, sec:n.sec||'', u:n.u||srcUrl(n.src,n.t), pub:n.date||todayStr(), date: todayStr(), ts: Date.now() });

  /* 修改轮3：往期「收入日期 / 发布时间」搜索改为手动点击月历选择
     两个输入框各自挂一个日期选择器，复用 oneDateCalHtml（翻月/本月/清除，点日期即筛选） */
  (function bindNewsDateCal(){
    const box = $('#newsCalBox');
    if(!box) return;
    let calY = null, calM = null;   /* 1-based 月份，与素材页保持一致 */
    let activeInput = null;   /* 当前正在选择哪个输入框：'newsDate' 或 'newsPub' */
    const closeCal = ()=>{ box.style.display = 'none'; box.innerHTML = ''; activeInput = null; };
    function drawCal(){
      const now = new Date();
      if(calY === null){ calY = now.getFullYear(); calM = now.getMonth()+1; }
      const sel = activeInput ? (($('#'+activeInput)||{value:''}).value || '').trim() : '';
      box.style.display = 'block';
      box.innerHTML = oneDateCalHtml(calY, calM, sel);
      box.querySelectorAll('[data-mcnav]').forEach(b=>{
        b.addEventListener('click', ()=>{
          if(b.dataset.mcnav === 'pvm'){ calM--; if(calM < 1){ calM = 12; calY--; } }

          drawCal();
        });
      });
      const td = box.querySelector('[data-mctoday]');
      if(td) td.addEventListener('click', ()=>{ calY = now.getFullYear(); calM = now.getMonth()+1; drawCal(); });
      const cl = box.querySelector('[data-mcclear]');
      if(cl) cl.addEventListener('click', ()=>{ if(activeInput){ $('#'+activeInput).value = ''; } closeCal(); applyNewsSearch(); });
      box.querySelectorAll('[data-mcd]').forEach(b=>{
        b.addEventListener('click', ()=>{ if(activeInput){ $('#'+activeInput).value = b.dataset.mcd; } closeCal(); applyNewsSearch(); });
      });
    }
    function applyNewsSearch(){
      const dEl = $('#newsDate'), pEl = $('#newsPub');
      S._newsDate = dEl ? dEl.value : '';
      S._newsPub = pEl ? pEl.value : '';
      S._newsKw = ($('#newsKw')||{value:''}).value;
      S._newsTag = ($('#newsTag')||{value:''}).value;
      renderPageKeepScroll();
    }
    const db = $('#newsDateBtn'), pb = $('#newsPubBtn');
    if(db) db.addEventListener('click', ()=>{
      if(activeInput === 'newsDate'){ closeCal(); return; }   /* 再点收起 */
      activeInput = 'newsDate'; calY = null; calM = null;
      drawCal();
    });
    if(pb) pb.addEventListener('click', ()=>{
      if(activeInput === 'newsPub'){ closeCal(); return; }
      activeInput = 'newsPub'; calY = null; calM = null;
      drawCal();
    });
    /* 点击页面空白处收起日历（点选择器区域内部不收起） */
    document.addEventListener('click', e=>{
      if(box.style.display === 'none') return;
      if(box.contains(e.target)) return;
      if(e.target.closest && (e.target.closest('#newsDateBtn') || e.target.closest('#newsPubBtn') || e.target.closest('#newsDate') || e.target.closest('#newsPub'))) return;
      closeCal();
    });

// 每日常识取题：按分类轮转 + 全局去重，保证 10 条互不重复且随日期轮换
function pickDailyCommon(n){
  n = n || 10;
  const d = dayOfYear();
  const cats = ['政治','法律','地理','历史','科技','经济'];
  const byCat = {};
  cats.forEach(c=>{ byCat[c] = COMMON_POOL.filter(x=>x.c === c); });
  const chosen = [];
  const cursor = {};
  cats.forEach(c=>{ cursor[c] = byCat[c].length ? (d % byCat[c].length) : 0; });
  let ci = 0, guard = 0;
  while(chosen.length < n && guard < 300){
    const c = cats[ci % cats.length];
    const pool = byCat[c] || [];
    if(pool.length){
      // 最多遍历该分类两轮，避免死循环
      const idx = cursor[c] % pool.length;
      const item = pool[idx];
      cursor[c]++;
      if(chosen.indexOf(item) < 0) chosen.push(item);
      if(cursor[c] >= byCat[c].length * 2) cursor[c] = 0;
    }
    ci++; guard++;
  }
  return chosen.slice(0, n);
}

// 把各类文件解析成 [{t:标题, d:详细说明}] 统一结构
async function parseCommonFile(file){
  const name = (file.name || '').toLowerCase();
  const ext = name.split('.').pop();
  let table = [];   // 二维数组

  if(ext === 'xlsx' || ext === 'xls'){
    table = await commonRowsFromExcel(file);
  } else if(ext === 'docx'){
    table = await commonRowsFromDocx(file);
  } else if(ext === 'doc'){
    table = await commonRowsFromDoc(file);
  } else if(ext === 'pdf'){
    table = await commonRowsFromPdf(file);
  } else {
    throw new Error('仅支持 .xls / .xlsx / .doc / .docx / .pdf 文件');
  }
  return normalizeCommonRows(table);
}

// 识别表头并规整为 {t, d}
function normalizeCommonRows(table){
  const out = [];
  if(!table || !table.length) return out;
  // 找到表头行（包含“常识”字样的行），确定两列下标
  let ti = 0, di = 1, startRow = 0;
  for(let r=0; r<Math.min(table.length, 5); r++){
    const row = (table[r]||[]).map(c=>String(c==null?'':c).trim());
    const hit = row.findIndex(c=>c.indexOf('常识') >= 0);
    if(hit >= 0){
      ti = hit;
      const dhit = row.findIndex((c,i)=> i !== hit && (c.indexOf('详细') >= 0 || c.indexOf('说明') >= 0 || c.indexOf('内容') >= 0));
      di = (dhit >= 0) ? dhit : (hit === 0 ? 1 : 0);
      startRow = r + 1;
      break;
    }
  }
  for(let r=startRow; r<table.length; r++){
    const row = table[r] || [];
    const t = String(row[ti]==null?'':row[ti]).trim();
    const d = String(row[di]==null?'':row[di]).trim();
    if(!t) continue;
    // 跳过纯表头/序号行
    if(/^(序号|编号|no\.?|常识|详细说明)$/i.test(t)) continue;
    if(/^\d+$/.test(t) && !d) continue;
    out.push({ t, d });
  }
  if(!out.length){
    // 无表头：按「第一列标题 / 第二列说明」兜底，或整行文本
    for(let r=0; r<table.length; r++){
      const row = (table[r]||[]).map(c=>String(c==null?'':c).trim());
      const t = row[0] || '';
      const d = row.slice(1).join(' ').trim();
      if(t && !/^(序号|编号)$/.test(t)) out.push({ t, d });
    }
  }
  return out;
}

async function commonRowsFromExcel(file){
  await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  if(typeof XLSX === 'undefined') throw new Error('Excel 解析库加载失败，请检查网络');
  const buf = await file.arrayBuffer();
  const head = new Uint8Array(buf.slice(0, 512));
  let isHtml = false;
  for(let i=0;i<head.length;i++){
    const c = head[i];
    if(c===32||c===9||c===10||c===13) continue;
    isHtml = (c === 60);
    break;
  }
  const wb = isHtml
    ? XLSX.read(new TextDecoder('utf-8').decode(buf), {type:'string'})
    : XLSX.read(buf, {type:'array', cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  if(!ws) return [];
  return XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
}

async function commonRowsFromDocx(file){
  await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
  if(typeof JSZip === 'undefined') throw new Error('Word 解析库加载失败，请检查网络');
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  const docFile = zip.file('word/document.xml');
  if(!docFile) throw new Error('未找到 Word 内容');
  const xmlText = await docFile.async('text');
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const rows = [];
  findEls(doc, 'tr').forEach(tr=>{
    const cells = findEls(tr, 'tc').map(tc=> findEls(tc,'t').map(t=>t.textContent).join('').trim());
    if(cells.length) rows.push(cells);
  });
  if(rows.length) return rows;
  // 无表格：按段落，支持「标题：说明」或「标题\t说明」
  const lines = [];
  findEls(doc, 'p').forEach(p=>{
    const s = findEls(p,'t').map(t=>t.textContent).join('').trim();
    if(s){
      const m = s.split(/\t|：|:/);
      lines.push(m.length > 1 ? [m[0].trim(), m.slice(1).join('：').trim()] : [s, '']);
    }
  });
  return lines;
}

async function commonRowsFromDoc(file){
  const buf = await file.arrayBuffer();
  const u8 = new Uint8Array(buf);
  const isOle = u8.length > 8 && u8[0]===0xD0 && u8[1]===0xCF && u8[2]===0x11 && u8[3]===0xE0;
  if(!isOle){
    // UTF-8 文本型 .doc（含本系统导出的）：按 HTML 表格或文本行解析
    const text = new TextDecoder('utf-8').decode(buf).replace(/^\ufeff/,'');
    if(/<table/i.test(text)){
      const doc = new DOMParser().parseFromString(text, 'text/html');
      const rows = [];
      findEls(doc, 'tr').forEach(tr=>{
        const cells = findEls(tr, 'td').concat(findEls(tr,'th')).map(td=>td.textContent.trim());
        if(cells.length) rows.push(cells);
      });
      if(rows.length) return rows;
    }
    const lines = text.replace(/<[^>]+>/g,'\n').split('\n').map(s=>s.trim()).filter(s=>s.length>1);
    return lines.map(line=>{
      const m = line.split(/\t|：|:/);
      return m.length > 1 ? [m[0].trim(), m.slice(1).join('：').trim()] : [line, ''];
    });
  }
  // OLE 二进制 .doc：按 UTF-16 提取可读文本
  let text = '';
  try{
    const u16 = new Uint16Array(buf);
    let cur = '';
    for(let i=0;i<u16.length;i++){
      const c = u16[i];
      if((c >= 0x4E00 && c <= 0x9FFF) || (c >= 0x3000 && c <= 0x303F) || (c >= 0x0020 && c <= 0x007E)) cur += String.fromCharCode(c);
      else { if(cur.length > 2) text += cur + '\n'; cur = ''; }
    }
    if(cur.length > 2) text += cur;
  }catch(e){}
  const lines = text.split('\n').map(s=>s.trim()).filter(s=>s.length > 3);
  if(!lines.length) throw new Error('旧版 .doc 解析受限，建议另存为 .docx 或 .xlsx 后导入');
  return lines.map(line=>{
    const m = line.split(/\t|：|:/);
    return m.length > 1 ? [m[0].trim(), m.slice(1).join('：').trim()] : [line, ''];
  });
}

async function commonRowsFromPdf(file){
  // 优先用 pdf.js 提取文本；加载失败时给出明确提示
  await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');
  if(typeof pdfjsLib === 'undefined') throw new Error('PDF 解析库加载失败，请检查网络');
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }catch(e){}
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const rows = [];
  const maxPage = Math.min(pdf.numPages, 60);
  for(let p=1; p<=maxPage; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    // 按 y 坐标归行，还原表格结构
    const items = tc.items.map(it=>({s: it.str, x: it.transform[4], y: it.transform[5]}));
    const lineMap = {};
    items.forEach(it=>{
      const key = Math.round(it.y / 3) * 3;
      (lineMap[key] = lineMap[key] || []).push(it);
    });
    Object.keys(lineMap).sort((a,b)=>b-a).forEach(k=>{
      const line = lineMap[k].sort((a,b)=>a.x-b.x).map(i=>i.s.trim()).filter(s=>s);
      if(!line.length) return;
      const joined = line.join(' ');
      if(!joined.trim()) return;
      // 用较大间距判断分列
      const parts = [];
      let cur = line[0], prevX = lineMap[k].sort((a,b)=>a.x-b.x)[0].x;
      lineMap[k].sort((a,b)=>a.x-b.x).forEach((it, idx)=>{
        if(idx === 0) return;
        if(it.x - prevX > 40){ parts.push(cur); cur = it.s.trim(); }
        else cur += ' ' + it.s.trim();
        prevX = it.x;
      });
      parts.push(cur);
      rows.push(parts.length > 1 ? parts : [joined, '']);
    });
  }
  return rows;
}

// 导出数据整理（素材库 + 已收藏常识 合并去重）
function commonExportData(){
  const map = {};
  COMMON_POOL.forEach(n=>{ map[n.t] = n.d; });
  commonLibItems().forEach(f=>{ if(!map[f.title]) map[f.title] = f.content || ''; });
  return Object.keys(map).map(t=>({ t, d: map[t] }));
}

function exportCommonExcel(){
  const data = commonExportData();
  if(!data.length){ toast('暂无可导出的常识'); return; }
  let html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">'+
    '<style>td{border:1px solid #ccc;padding:6px 10px;vertical-align:top;} .ttl{font-size:18px;font-weight:bold;} .th{background:#FDEBF0;font-weight:bold;}</style></head><body>'+
    '<table>'+
      '<tr><td class="ttl" colspan="2">常识</td></tr>'+
      '<tr><td class="th">常识</td><td class="th">详细说明</td></tr>'+
      data.map(x=>'<tr><td>'+esc(x.t)+'</td><td>'+esc(x.d)+'</td></tr>').join('')+
    '</table></body></html>';
  downloadBlob(html, '常识库_'+todayStr()+'.xls', 'application/vnd.ms-excel');
  toast('已导出 Excel ✓（'+data.length+' 条）');
}

/* 修改轮2：素材发布时间——单日期点选日历（复用 pcal 样式，点击日期即筛选） */
function oneDateCalHtml(y, m, sel){
  const now = new Date(); now.setHours(0,0,0,0);
  const today = todayStr();
  const wk = ['一','二','三','四','五','六','日'];
  const first = new Date(y, m-1, 1);
  const dow = first.getDay();
  const back = (dow === 0 ? 6 : dow - 1);
  const start = new Date(first); start.setDate(first.getDate() - back);
  let cells = '';
  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    const dim = d.getMonth() !== (m-1);
    cells += '<button type="button" class="cell'+(dim?' dim':'')+(ds===today?' today':'')+(ds===sel?' sel':'')+
             '" data-mcd="'+ds+'" title="筛选 '+ds+' 发布的素材">'+d.getDate()+'</button>';
  }
  return '<div class="pcal">'+
    '<div class="pcal-hd">'+
      '<button type="button" class="btn sm ghost" data-mcnav="pvm">‹</button>'+
      '<b>'+y+' 年 '+m+' 月</b>'+
      '<button type="button" class="btn sm ghost" data-mcnav="nxm">›</button>'+
      '<button type="button" class="btn sm mint" data-mctoday="1">本月</button>'+
      '<button type="button" class="btn sm ghost" data-mcclear="1">清除</button>'+
    '</div>'+
    '<div class="pcal-grid">'+ wk.map(w=>'<span class="hd">'+w+'</span>').join('') + cells +'</div>'+
    '<div class="pcal-tip">点击日期 → 筛选该日发布的素材；「清除」取消时间筛选</div>'+
  '</div>';
}

const PAPER_DEFAULT_XC = { total:120, plan:[
  {name:'政治理论', min:10}, {name:'常识', min:10}, {name:'言语理解', min:25},
  {name:'判断推理', min:30}, {name:'数量关系', min:20}, {name:'资料分析', min:25}
]};
const PAPER_DEFAULT_SL = { total:150, plan:[
  {name:'概括题',    min:15},
  {name:'综合分析题', min:20},
  {name:'对策题',    min:20},
  {name:'公文题',    min:30},
  {name:'大作文',    min:60}
]};
const PAPER_KEY_XC = 'shangan_paper_xc_v10';
const PAPER_KEY_SL = 'shangan_paper_sl_v10';

function loadPaperPlan(type){
  const key = type === 'sl' ? PAPER_KEY_SL : PAPER_KEY_XC;
  const def = type === 'sl' ? PAPER_DEFAULT_SL : PAPER_DEFAULT_XC;
  try{
    const raw = JSON.parse(localStorage.getItem(key));
    if(raw && Array.isArray(raw.plan) && raw.plan.length){
      return {
        total: raw.total || def.total,
        plan: raw.plan.map(p=>({name:String(p.name||'自定义'), min:Number(p.min)||10, custom:!!p.custom}))
      };
    }
  }catch(e){}
  return { total: def.total, plan: JSON.parse(JSON.stringify(def.plan)) };
}
function savePaperPlan(type, p){
  const key = type === 'sl' ? PAPER_KEY_SL : PAPER_KEY_XC;
  /* 【P0 铁律 1】不再静默吞异常：配额满时给用户可见提示，避免"改了计划却没存上" */
  try{ localStorage.setItem(key, JSON.stringify(p)); }
  catch(e){
    console.error('[savePaperPlan] 写入失败', e);
    const quota = isQuotaError(e);
    openModal('⚠️ 计划未能保存', '<p style="line-height:1.9">套卷计时计划<b>未能保存到本地</b>。</p>'
      + '<p style="line-height:1.9;color:var(--muted)">' + (quota ? '浏览器本地存储空间已满，建议先导出备份并清理数据。'
                                                          : ('错误：' + (e && e.message ? e.message : e))) + '</p>', [
      { text:'立即导出备份', primary:true, onClick:()=>{ doEmergencyExport(); return false; } },
      { text:'我知道了' }
    ]);
  }
}

  const paper = loadPaperPlan(type);

function paperSetupBind(type){
  let paper = loadPaperPlan(type);
  const refresh = () => renderPage();
  bindTmHistBlock('套卷');
  /* ---- 拖拽调整做题顺序 ---- */
  let dragIdx = -1;
  $$('#content [data-row]').forEach(row=>{
    const handle = row.querySelector('[data-drag-handle]');
    if(handle){
      handle.addEventListener('mousedown', ()=>{ row.draggable = true; });
      handle.addEventListener('touchstart', ()=>{ row.draggable = true; }, {passive:true});
    }
    row.addEventListener('dragstart', e=>{
      dragIdx = +row.dataset.row;
      row.classList.add('dragging');
      try{ e.dataTransfer.setData('text/plain', 'move'); e.dataTransfer.effectAllowed = 'move'; }catch(err){}
    });
    row.addEventListener('dragend', ()=>{ row.classList.remove('dragging'); row.draggable = false; });
    row.addEventListener('dragover', e=>{ e.preventDefault(); row.classList.add('drag-over'); });
    row.addEventListener('dragleave', ()=>{ row.classList.remove('drag-over'); });
    row.addEventListener('drop', e=>{
      e.preventDefault();
      row.classList.remove('drag-over');
      const to = +row.dataset.row;
      if(dragIdx < 0 || dragIdx === to || isNaN(to)) return;
      const moved = paper.plan.splice(dragIdx, 1)[0];
      paper.plan.splice(to, 0, moved);
      dragIdx = -1;
      savePaperPlan(type, paper);
      renderPageKeepScroll();
      toast('做题顺序已调整 ✓');
    });
  });
  $('#pTotal') && $('#pTotal').addEventListener('input', e=>{ paper.total = parseFloat(e.target.value) || 0; savePaperPlan(type, paper); });
  $('#pTotal') && $('#pTotal').addEventListener('change', refresh);
  $$('#content [data-add]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const n = b.dataset.add;
      const def = type === 'sl' ? PAPER_DEFAULT_SL : PAPER_DEFAULT_XC;
      const defMin = (def.plan.find(p=>p.name === n) || {min:10}).min;
      paper.plan.push({name:n, min: n === '自定义' ? 10 : defMin, custom: n === '自定义'});
      savePaperPlan(type, paper); refresh();
    });
  });
  $$('#content [data-del]').forEach(b=>{
    b.addEventListener('click', ()=>{ paper.plan.splice(+b.dataset.del, 1); savePaperPlan(type, paper); refresh(); });
  });
  $$('#content [data-f="min"]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const p = paper.plan[+inp.dataset.i];
      if(p){ p.min = parseFloat(inp.value) || 0; savePaperPlan(type, paper); }
    });
  });
  $$('#content [data-f="name"]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const p = paper.plan[+inp.dataset.i];
      if(p){ p.name = inp.value; savePaperPlan(type, paper); }
    });
  });
  const rs = $('#pReset');
  if(rs) rs.addEventListener('click', ()=>{
    const def = type === 'sl' ? PAPER_DEFAULT_SL : PAPER_DEFAULT_XC;
    paper = { total: def.total, plan: JSON.parse(JSON.stringify(def.plan)) };
    savePaperPlan(type, paper); refresh();
  });
  const st = $('#pStart');
  if(st) st.addEventListener('click', ()=>{
    if(!(paper.total >= 1 && paper.total <= 600)){ toast('总时长请输入 1-600 分钟'); return; }
    if(!paper.plan.length){ toast('请至少添加一个部分'); return; }
    for(const p of paper.plan){
      if(!String(p.name).trim()){ toast('请填写自定义部分的名称'); return; }
      if(!(p.min > 0 && p.min <= 600)){ toast('「'+p.name+'」理想时长需大于 0'); return; }
    }
    savePaperPlan(type, paper);
    PP.sections = paper.plan.map(p=>({name:String(p.name).trim(), ideal: Math.max(1, Math.round(p.min*60))}));
    PP.totalSec = Math.round(paper.total*60);
    PP.idx = 0; PP.log = []; PP.beepSec = false; PP.beepTotal = false;
    PP.startTs = PP.secStart = Date.now();
    PP.running = true;
    if(PP.timer) clearInterval(PP.timer);
    PP.timer = setInterval(paperTick, 250);
    renderPage();
  });
}

function paperRunningBind(){
  if(PP.tickInterval) clearInterval(PP.tickInterval);
  PP.tickInterval = setInterval(()=>{
    const el = document.getElementById('ppClock');
    if(!el){ clearInterval(PP.tickInterval); return; }
    const remain = PP.totalSec - (Date.now()-PP.startTs)/1000;
    el.textContent = fmtClock(Math.max(0, remain));
    el.classList.toggle('neg', remain < 0);
    const sec = PP.sections[PP.idx];
    const secEl = (Date.now()-PP.secStart)/1000;
    const info = document.getElementById('ppSecInfo');
    if(info) info.innerHTML = ' · 已用 '+fmtClock(secEl) + (secEl > sec.ideal ? ' <span style="color:var(--coral);">已超时</span>' : '');
    const bar = document.querySelector('.card .pbar > i');
    if(bar) bar.style.width = Math.min(100, secEl/sec.ideal*100)+'%';
  }, 300);
  const nx = $('#ppNext'); if(nx) nx.addEventListener('click', paperNext);
  const ed = $('#ppEnd'); if(ed) ed.addEventListener('click', paperFinish);
}

function paperTick(){
  const el = document.getElementById('ppClock');
  if(!el) return;
  const remain = PP.totalSec - (Date.now()-PP.startTs)/1000;
  el.textContent = fmtClock(Math.max(0, remain));
  el.classList.toggle('neg', remain < 0);
  const sec = PP.sections[PP.idx];
  const secEl = (Date.now()-PP.secStart)/1000;
  const info = document.getElementById('ppSecInfo');
  if(info) info.innerHTML = ' · 已用 '+fmtClock(secEl) + (secEl > sec.ideal ? ' <span style="color:var(--coral);">已超时</span>' : '');
  let ring = false;
  if(secEl >= sec.ideal && !PP.beepSec){ PP.beepSec = true; ring = true; }
  if(remain <= 0 && !PP.beepTotal){ PP.beepTotal = true; ring = true; }
  if(ring) playBeep();
}

function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = 820; gain.gain.value = 0.2;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.6);
  }catch(e){}
}

function paperNext(){
  if(!PP.running) return;
  if(PP.idx >= PP.sections.length-1) return paperFinish();
  const sec = PP.sections[PP.idx];
  const actual = Math.round(((Date.now()-PP.secStart)/1000)*10)/10;
  PP.log.push({moduleName: sec.name, presetSeconds: sec.ideal, actualSeconds: actual, difference: Math.round((actual-sec.ideal)*10)/10});
  PP.idx++; PP.secStart = Date.now(); PP.beepSec = false;
  renderPage();
}

function paperFinish(){
  if(!PP.running) return;
  const sec = PP.sections[PP.idx];
  const actual = Math.round(((Date.now()-PP.secStart)/1000)*10)/10;
  PP.log.push({moduleName: sec.name, presetSeconds: sec.ideal, actualSeconds: actual, difference: Math.round((actual-sec.ideal)*10)/10});
  if(PP.timer) clearInterval(PP.timer);
  if(PP.tickInterval) clearInterval(PP.tickInterval);
  PP.timer = null; PP.tickInterval = null; PP.running = false;
  const sum = k => PP.log.reduce((s,q)=>s+q[k], 0);
  const totalActual = Math.round(sum('actualSeconds')*10)/10;
  const t = todayStr();
  if(!S.studyLog[t]) S.studyLog[t] = {sec:0, q:0, sl:0};
  S.studyLog[t].sec = (S.studyLog[t].sec || 0) + Math.round(totalActual);
  S.timerLog.push({d:t, ts:Date.now(), sec:Math.round(totalActual), q:PP.log.length, cat:'套卷', mode:'paper',
    details: PP.log.map(q=>({...q, moduleName:q.moduleName}))});
  if(S.timerLog.length > 2000) S.timerLog = S.timerLog.slice(-2000);
  /* 分块记账（需求 7(4)5-1）：套卷里各板块的实际做题时长，
     分别计入「对应板块」的 paper 字段（如数量关系 → math）。 */
  PP.log.forEach(q=>{
    const bd = boardByModule(q.moduleName);
    if(!bd) return;
    const bref = boardDayRef(bd, t);
    bref.paper = (bref.paper || 0) + Math.round(q.actualSeconds);
  });
  save(true);
  openModal('📝 套卷完成总结',
    '<div style="text-align:center;margin-bottom:14px;">'+
      '<div style="font-size:calc(var(--fs-num) * .8);font-weight:900;color:var(--pinkDeep2);">'+fmtClock(totalActual)+'</div>'+
      '<div style="color:var(--text2);font-size:var(--fs-btn);margin-top:4px;">套卷总时长 '+fmtClock(PP.totalSec)+' · 共 '+PP.log.length+' 部分</div>'+
    '</div>'+ tmDetailHtml(PP.log),
    [{text:'完成', primary:true}]);
  PP.log = []; PP.idx = 0;
  renderPage();
}

/* ============================================================
   错题编辑器（含来源 / 错题类型 / 历史标签错因 / 答案多选）
   ============================================================ */
/* —— 错题图片：统一取「引用数组」——
   【P1 改造】新结构（已迁移）优先返回 ID 列表；旧结构回退 base64 列表。
   两者都是字符串数组，调用方只需关心 `.length`，无需区分。
   函数名保持不变，避免改动十余处调用点。
   实现刻意「自包含」（不使用任何外部辅助函数），保证在只提取函数片段
   的环境（自动化测试沙箱）中也能独立运行。 */
function wrongImgs(w){
  if(!w) return [];
  if(Array.isArray(w.imgIds) && w.imgIds.length) return w.imgIds.filter(Boolean);
  if(Array.isArray(w.imgs) && w.imgs.length) return w.imgs.filter(Boolean);
  return w.img ? [w.img] : [];
}
function wrongExpImgs(w){
  if(!w) return [];
  if(Array.isArray(w.expImgIds) && w.expImgIds.length) return w.expImgIds.filter(Boolean);
  if(Array.isArray(w.expImgs) && w.expImgs.length) return w.expImgs.filter(Boolean);
  return w.expImg ? [w.expImg] : [];
}

/* ============================================================

/* 批量绑定：容器内所有 [data-fav-btn]；render 回调用于局部重渲染 */
