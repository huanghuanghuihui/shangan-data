/* 统一数据表导出：表头固定 目标内容|所属分类|所属阶段|开始日期|结束日期（可再导入本系统） */
function buildPlanExport(fmt, type){
  const items = S.plans[type] || [];
  const meta = PLAN_META[type];
  const ds = todayStr();
  function datePair(it){
    if(type === 'daily')   return [it.due || ds, it.due || ds];
    if(type === 'weekly')  return [it.weekOf || ds, it.weekOf || ds];
    if(type === 'monthly') return [it.monthOf || ds, it.monthOf || ds];
    return [it.startDate || ds, it.endDate || ds];
  }
  const body = items.map(it=>{
    const dd = datePair(it);
    return '<tr><td>'+esc(it.text)+'</td><td>'+esc(it.cat||'')+'</td><td>'+esc(it.stage||'')+'</td>'+
      '<td style="mso-number-format:\'\\@\';">'+dd[0]+'</td><td style="mso-number-format:\'\\@\';">'+dd[1]+'</td></tr>';
  }).join('');
  const table =
    '<table border="1" cellspacing="0" cellpadding="6" style="width:100%;border-collapse:collapse;font-size:13px;">'+
      '<thead><tr style="background:#FDEBF0;"><th>目标内容</th><th>所属分类</th><th>所属阶段</th><th>开始日期</th><th>结束日期</th></tr></thead>'+
      '<tbody>'+body+'</tbody>'+
    '</table>';
  const html = '<html><head><meta charset="utf-8"><title>'+esc(meta.name)+'</title></head><body style="font-family:sans-serif;padding:20px;">'+table+'</body></html>';
  if(fmt === 'pdf'){
    const w = window.open('', '_blank');
    if(!w){ toast('请允许弹出窗口以导出 PDF'); return; }
    w.document.write(html); w.document.close();
    setTimeout(()=>{ try{ w.print(); }catch(e){} }, 500);
    toast('已打开打印窗口，选择「另存为 PDF」即可');
    return;
  }
  const mime = fmt === 'xls' ? 'application/vnd.ms-excel' : 'application/msword';
  downloadBlob(html, meta.name+'_'+ds+(fmt === 'xls' ? '.xls' : '.doc'), mime);
  toast('已导出 ✓（导出文件可直接再导入本系统）');
}

/* ---- 四类计划：Word / Excel 导入 ---- */
function parseFlexDate(v){
  if(v == null || v === '') return '';
  if(v instanceof Date && !isNaN(v.getTime())){
    return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  }
  if(typeof v === 'number' && isFinite(v)){
    if(v >= 25569 && v <= 80000){
      const d = new Date(Math.round((v - 25569) * 86400000));
      if(!isNaN(d.getTime())) return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
    }
    return '';
  }
  const s = String(v).trim().replace(/^["']+|["']+$/g,'');
  if(/^\d+$/.test(s) && +s >= 25569 && +s <= 80000){
    const d = new Date(Math.round((+s - 25569) * 86400000));
    if(!isNaN(d.getTime())) return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
  }
  let m = s.match(/^(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日?$/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m = s.match(/^(\d{4})[.\/\-](\d{1,2})[.\/\-](\d{1,2})$/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m = s.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m = s.match(/(\d{4})[.\/\-](\d{1,2})[.\/\-](\d{1,2})/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  return '';
}

function rowsToPlanItems(type, rows){
  const items = [];
  if(!rows || !rows.length) return items;
  let hIdx = -1;
  for(let i=0;i<Math.min(rows.length, 12);i++){
    const j = (rows[i]||[]).join('|');
    if(j.indexOf('目标内容') >= 0 || (j.indexOf('目标') >= 0 && (j.indexOf('分类') >= 0 || j.indexOf('日期') >= 0))){ hIdx = i; break; }
  }
  let col = { text:0, cat:1, stage:2, d1:3, d2:4 };
  if(hIdx >= 0){
    const headers = rows[hIdx];
    const cT = guessColumn(headers, ['目标内容','目标','内容']);
    if(cT >= 0) col.text = cT;
    const cC = guessColumn(headers, ['所属分类','分类','板块']);
    if(cC >= 0) col.cat = cC;
    const cS = guessColumn(headers, ['所属阶段','阶段']);
    if(cS >= 0) col.stage = cS;
    const c1 = guessColumn(headers, ['开始日期','日期']);
    if(c1 >= 0) col.d1 = c1;
    const c2 = guessColumn(headers, ['结束日期']);
    col.d2 = c2 >= 0 ? c2 : col.d1;
  }
  for(let i = (hIdx >= 0 ? hIdx+1 : 0); i < rows.length; i++){
    const r = rows[i];
    if(!r || !r.length) continue;
    const text = String(r[col.text] != null ? r[col.text] : '').trim();
    if(!text) continue;
    const catRaw = String(r[col.cat] != null ? r[col.cat] : '').trim();
    /* 【改动二】导入归类：先精确匹配（含「申论」→小题别名），再模糊包含，兜底归入「申论小题」 */
    const cat = catIndex(catRaw) >= 0 ? canonCat(catRaw)
              : (CATS.find(c=>catRaw.indexOf(c) >= 0) || '申论小题');
    const stage = String(r[col.stage] != null ? r[col.stage] : '').trim();
    const d1 = parseFlexDate(col.d1 >= 0 ? r[col.d1] : '');
    const d2 = parseFlexDate(col.d2 >= 0 ? r[col.d2] : '');
    items.push({ text, cat, stage, d1, d2 });
  }
  return items;
}

async function plansRowsFromExcel(file){
  await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  if(typeof XLSX === 'undefined') throw new Error('Excel 解析库加载失败，请检查网络');
  const buf = await file.arrayBuffer();
  const head = new Uint8Array(buf.slice(0, 512));
  let isHtml = false;
  for(let i=0;i<head.length;i++){
    const c = head[i];
    if(c===32||c===9||c===10||c===13) continue;
    isHtml = (c === 60); // '<'
    break;
  }
  const wb = isHtml
    ? XLSX.read(new TextDecoder('utf-8').decode(buf), {type:'string'})
    : XLSX.read(buf, {type:'array', cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  if(!ws) return [];
  return XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
}

async function plansRowsFromDocx(file){
  await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
  if(typeof JSZip === 'undefined') throw new Error('Word 解析库加载失败，请检查网络');
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  const docFile = zip.file('word/document.xml');
  if(!docFile) throw new Error('未找到 Word 内容');
  const xmlText = await docFile.async('text');
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const rows = [];
  findEls(doc, 'tr').forEach(tr=>{
    const cells = findEls(tr, 'tc').map(tc=> findEls(tc,'t').map(t=>t.textContent).join('').trim());
    if(cells.length) rows.push(cells);
  });
  if(rows.length) return rows;
  // 无表格：按段落行回退
  const lines = [];
  findEls(doc, 'p').forEach(p=>{
    const s = findEls(p,'t').map(t=>t.textContent).join('').trim();
    if(s) lines.push([s]);
  });
  return lines;
}

async function plansRowsFromDocBin(file){
  const buf = await file.arrayBuffer();
  const u8 = new Uint8Array(buf);
  const isOle = u8.length > 8 && u8[0]===0xD0 && u8[1]===0xCF && u8[2]===0x11 && u8[3]===0xE0;
  if(!isOle){
    // 本系统导出的 .doc / 其他 UTF-8 文本型 .doc：按 HTML 表格或文本行解析
    const text = new TextDecoder('utf-8').decode(buf).replace(/^\ufeff/,'');
    let rows = [];
    if(/<table/i.test(text)){
      const doc = new DOMParser().parseFromString(text, 'text/html');
      findEls(doc, 'tr').forEach(tr=>{
        const tds = findEls(tr, 'td');
        const ths = findEls(tr, 'th');
        const cells = (tds.length ? tds : ths).map(c=>c.textContent.trim());
        if(cells.length) rows.push(cells);
      });
    }
    if(rows.length) return rows;
    return text.split(/\r?\n/)
      .map(l=>l.split(/\||\t+|\s{2,}/).map(s=>s.trim()).filter(Boolean))
      .filter(r=>r.length);
  }
  // 旧版二进制 .doc（OLE2）：提取中英文文本段，按分隔符拆列
  const u16 = new Uint16Array(buf);
  let text = '', cur = '';
  for(let i=0;i<u16.length;i++){
    const c = u16[i];
    if(c === 0x7C || c === 0xFF1A || (c >= 0x4E00 && c <= 0x9FFF) || (c >= 0x3000 && c <= 0x303F) || (c >= 0xFF00 && c <= 0xFFEF) || (c >= 0x0020 && c <= 0x007E)){
      cur += String.fromCharCode(c);
    } else {
      if(cur.trim().length > 2) text += cur.trim() + '\n';
      cur = '';
    }
  }
  if(cur.trim().length > 2) text += cur.trim();
  return text.split('\n')
    .map(l=>l.split(/\||\t+|\s{2,}|：\s*/).map(s=>s.trim()).filter(Boolean))
    .filter(r=>r.length);
}

async function importPlansFile(type, file){
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  let rows;
  if(ext === 'xlsx' || ext === 'xls') rows = await plansRowsFromExcel(file);
  else if(ext === 'docx') rows = await plansRowsFromDocx(file);
  else if(ext === 'doc') rows = await plansRowsFromDocBin(file);
  else throw new Error('仅支持 .xls / .xlsx / .doc / .docx 文件');
  const items = rowsToPlanItems(type, rows);
  if(!items.length) throw new Error('未识别到有效计划行（需包含「目标内容」列）');
  showPlanImportPreview(type, items, ext.toUpperCase());
}

          exist[(it.text||'')+'|'+(it.due||it.weekOf||it.monthOf||it.startDate||'')+'|'+(it.endDate||'')] = 1;
        });
        let added = 0, skipped = 0;
        items.forEach(p=>{
          const d1 = p.d1 || todayStr();
          const d2 = p.d2 || d1;
          const key = p.text+'|'+d1+'|'+d2;
          if(exist[key]){ skipped++; return; }
          exist[key] = 1;
          const item = { id: uid(), text: p.text, cat: p.cat, stage: p.stage, created: Date.now(), records: [] };

          else if(type === 'monthly') item.monthOf = d1;
          else { item.startDate = d1; item.endDate = d2; }
          S.plans[type].push(item);
          added++;
        });
        save(true); renderPage();
        toast('已导入 '+added+' 项'+(skipped? '，跳过重复 '+skipped+' 项':'')+' 📥');

    ]);
}

/* ============================================================
   复习计划页面（PAGES.review）· 艾宾浩斯记忆曲线
   ------------------------------------------------------------
   三块卡片：① 概览（statRow + 曲线说明）
             ② 【本次改动三】复习月历（7 列周一起始，替代原「复习时间线」）
             ③ 全部复习任务（7 日期小方块 + 进度 + 详情/关闭/删除 + 分页 10 条）

   ============================================================ */
/* 【本次改动三】月历运行时状态（仅内存，不持久化）：
   RV_CAL_MONTH = 当前显示的自然月下标（= 年*12 + 月-1）；RV_CAL_KW = 搜索关键词 */
let RV_CAL_MONTH = null;
let RV_CAL_KW = '';
PAGES.review = function(){
  const today = todayStr();
  const list = reviewList();
  /* 概览统计 */
  const totalN = list.length;
  const todayN = list.filter(rt=> reviewPendingOn(rt, today)).length;
  const doneN  = list.filter(rt=> reviewStats(rt).allDone).length;
  const ovdN   = list.filter(rt=> rt.active !== false && reviewOverdue(rt, today)).length;

  /* ---------- ① 概览卡片 ---------- */
  const curveChip = EBINGHAUS_OFFSETS.map((d,i)=>
    '<span style="display:inline-block;font-size:calc(var(--fs-btn) - 3px);color:#7E5FA8;background:#EDE4F7;'+
      'border-radius:6px;padding:1px 6px;margin:2px 4px 2px 0;">第'+(i+1)+'轮 +'+d+'天</span>').join('');
  const overviewCard =
    '<div class="card">'+
      '<div class="card-title">'+titleIco('review')+' 复习计划 · 概览 <span class="sub">艾宾浩斯记忆曲线</span></div>'+
      statRow([
        {v: totalN, k: '全部复习任务'},
        {v: todayN, k: '待复习（今天）'},
        {v: doneN,  k: '已完成复习'},
        {v: ovdN,   k: '已过期'}
      ])+
      '<div style="margin-top:12px;font-size:calc(var(--fs-btn) - 1px);color:var(--text2);line-height:1.8;">'+
        '依据艾宾浩斯遗忘曲线，纳入复习的任务会自动安排 7 个复习时间点'+
        '（<b style="color:var(--pinkDeep2);">1 / 2 / 4 / 7 / 15 / 30 / 60</b> 天）。'+
        '到期当天，复习任务会自动出现在「每日计划」页、对应板块的「待办事项」中，并在甘特图上以紫色任务条展示。'+
      '</div>'+
      '<div style="margin-top:6px;">'+curveChip+'</div>'+
      (totalN ? '' : '<div style="text-align:center;margin-top:12px;">'+
        '<div style="font-size:var(--fs-btn);color:var(--text3);margin-bottom:8px;">还没有复习任务～去「每日计划」给已打卡的任务点「📚 纳入复习」吧</div></div>')+
    '</div>';

  /* ---------- ② 【本次改动三】复习月历（替代原「复习时间线 · 未来 30 天」） ----------
     周一起始 7 列月历，每天格子里纵向堆叠当日复习任务（最多 3 条，超出显示「+N 更多…」）；
     三种状态色见 .rvcal-task.pending / .overdue / .done（改动四）；
     月份范围 = 最早复习日期所在月 ~ 最晚复习日期所在月；无数据时锁在当前月并禁用翻页。 */
  const CAL_WD = ['一','二','三','四','五','六','日'];
  /* 收集全部复习日期，求最早/最晚（无数据则默认当前月） */
  const calDates = [];
  list.forEach(rt=> (rt.reviewPlan||[]).forEach(r=>{ if(r.date) calDates.push(r.date); }));
  calDates.sort();
  const calFirst = calDates[0] || today;
  const calLast  = calDates[calDates.length-1] || today;
  /* 下拉/翻页时的自然月下标（0 = 最早月），默认定位到「今天」所在月 */
  const monthIdxOf = ds=> (+ds.slice(0,4))*12 + (+ds.slice(5,7) - 1);
  const mMin = monthIdxOf(calFirst), mMax = monthIdxOf(calLast);
  const mCur = Math.min(Math.max(monthIdxOf(today), mMin), mMax);
  let mShow = (typeof RV_CAL_MONTH === 'number') ? RV_CAL_MONTH : mCur;
  mShow = Math.min(Math.max(mShow, mMin), mMax);
  RV_CAL_MONTH = mShow;
  const mY = Math.floor(mShow/12), mM = mShow%12 + 1;
  const mFirstDs = mY+'-'+pad2(mM)+'-01';
  const mLastDs  = dstr(new Date(mY, mM, 0));
  /* 搜索关键词（不匹配的任务项变淡 .dim，不隐藏以保持格子大小稳定） */
  const kw = String(RV_CAL_KW||'').trim().toLowerCase();
  const hitKw = rt=> !kw || (String(rt.sourceText||'')+String(rt.sourceCat||'')).toLowerCase().indexOf(kw) >= 0;

  /* 该月 42 格（周一起始）：从当月 1 号所在周的周一开始铺 6 周 */
  const firstDow = (new Date(mFirstDs+'T00:00:00').getDay() + 6) % 7;   // 周一=0
  const gridStart = ganttAddDays(mFirstDs, -firstDow);

  let calCells = '';
  for(let i=0;i<42;i++){
    const ds = ganttAddDays(gridStart, i);
    const inMonth = ds >= mFirstDs && ds <= mLastDs;
    const isToday = ds === today;
    /* 当日复习任务（含已完成/待复习/逾期），同格内按 轮次 排序 */
    const items = [];
    list.forEach(rt=> (rt.reviewPlan||[]).forEach(r=>{
      if(r.date === ds) items.push({ rt, round: r.round, status: r.status, date: r.date, doneAt: r.doneAt });
    }));
    items.sort((a,b)=> a.round - b.round);
    const shown = items.slice(0, 3);
    const tasksHtml = shown.map(g=>{
      const isDone = g.status === 'done';
      const ovd = !isDone && g.date < today;
      const cls = isDone ? 'done' : (ovd ? 'overdue' : 'pending');
      const txt = '第'+g.round+'轮 '+String(g.rt.sourceText||'').slice(0,8);
      const tip = esc(g.rt.sourceText)+'　· 第'+g.round+'轮　· '+g.date+'　· '+
                  (isDone ? '已完成'+(g.doneAt ? '（'+dstr(new Date(g.doneAt))+'）' : '') : (ovd ? '已逾期未完成' : '待复习'));
      return '<span class="rvcal-task '+cls+(hitKw(g.rt)?'':' dim')+'" '+
             'data-rv-task="'+g.rt.id+'" data-rv-tround="'+g.round+'" title="'+tip+'">'+esc(txt)+'</span>';
    }).join('');
    const moreHtml = items.length > 3
      ? '<span class="rvcal-more" data-rvcal-day="'+ds+'">+'+(items.length-3)+' 更多…</span>' : '';
    /* 本月之外的补位格：浅色弱化、不可点击进入详情 */
    calCells += '<div class="rvcal-cell'+(inMonth?'':' out')+(isToday&&inMonth?' today':'')+'"'+
      (inMonth ? ' data-rvcal-day="'+ds+'"' : '')+'>'+
      '<div class="rvcal-d">'+String(+ds.slice(8,10))+'</div>'+tasksHtml+moreHtml+
    '</div>';
  }
  const calNav =
    '<div class="rvcal-head">'+CAL_WD.map(w=>'<span>'+w+'</span>').join('')+'</div>';
  const calCtl =
    '<div class="rvcal-ctl" style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">'+
      '<button class="btn sm ghost" data-rvcal-nav="prev"'+(mShow<=mMin?' disabled':'')+'>‹ 上一月</button>'+
      '<b style="flex:1;text-align:center;font-size:var(--fs-btn);color:var(--text1);min-width:110px;">'+mY+' 年 '+mM+' 月</b>'+
      '<button class="btn sm ghost" data-rvcal-nav="next"'+(mShow>=mMax?' disabled':'')+'>下一月 ›</button>'+
      '<button class="btn sm ghost" data-rvcal-nav="today">回到本月</button>'+
    '</div>';
  /* 【需求 5】搜索框字号自适应：
     把「图标 + 提示文字」抽出为输入框左侧独立 label（自身字号走
     --fs-rvcal-search），输入框本体只承载用户输入内容 ——
     这样提示语永远单行完整显示，不受输入框宽度挤压、也不会截断。 */
  const calSearch =
    '<div class="rvcal-search" style="display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:nowrap;">'+
      '<span class="rvcal-search-lab" title="搜索复习任务（任务名 / 来源分类）">🐾 搜索复习任务（任务名 / 来源分类）</span>'+
      '<input class="inp" id="rvCalSearch" value="'+esc(RV_CAL_KW||'')+'" style="flex:1;min-width:80px;">'+
      '<button class="btn sm ghost" id="rvCalSearchClear" style="flex:none;">清除</button>'+
    '</div>';
  const calLegend =
    '<div class="rvcal-legend">'+
      '<span><i style="background:#FFFACD;"></i>待复习</span>'+
      '<span><i style="background:#FFE4E1;"></i>逾期未完成</span>'+

        '<button class="btn sm ghost" data-rv-page="'+(page-1)+'"'+(page<=1?' disabled':'')+'>‹ 上一页</button>'+

      $$('#content [data-rv-task]').forEach(el=>{

      $$('#content [data-rvcal-day]').forEach(el=>{

      /* d. 搜索复习任务：输入即过滤（不匹配项变淡 .dim，不隐藏）；「清除搜索」复位 */
      const sBox = $('#rvCalSearch');
      if(sBox){
        let sT = null;
        sBox.addEventListener('input', ()=>{
          if(sT) clearTimeout(sT);
          sT = setTimeout(()=>{
            RV_CAL_KW = sBox.value;

          }, 320);

      if(sClr) sClr.addEventListener('click', ()=>{ RV_CAL_KW = ''; renderPageKeepScroll(); });

      /* 完成本轮复习（「全部复习任务」卡内保留；月历用「当日详情」里的按钮） */
      $$('#content [data-rv-done]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const [id, rnd] = b.dataset.rvDone.split('|');
          const rt = reviewList().find(x=> x.id === id);
          if(!rt) return;
          reviewMarkDone(rt, +rnd);
          save(true); renderPageKeepScroll();
          const st = reviewStats(rt);
          toast('第 '+rnd+' 轮复习完成 ✓'+(st.allDone ? '　全部复习完成，太棒了 🎉' : ''));

      /* 查看详情 / 关闭 / 重新启用 / 删除 */
      $$('#content [data-rv-detail]').forEach(b=>{
        b.addEventListener('click', ()=>reviewOpenEdit(b.dataset.rvDetail));
      });
      $$('#content [data-rv-close]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const rt = reviewList().find(x=> x.id === b.dataset.rvClose);

          if(!confirm('关闭这条复习任务？\n「'+rt.sourceText+'」\n关闭后不再出现在每日计划 / 待办 / 甘特图的同步列表中，但记录会保留，可随时重新启用。')) return;
          rt.active = false; save(true); renderPageKeepScroll();
          toast('已关闭复习（记录保留）');
        });
      });
      $$('#content [data-rv-reopen]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const rt = reviewList().find(x=> x.id === b.dataset.rvReopen);
          if(!rt) return;
          rt.active = true; save(true); renderPageKeepScroll();
          toast('已重新启用复习 ↺');
        });
      });
      $$('#content [data-rv-del]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const rt = reviewList().find(x=> x.id === b.dataset.rvDel);
          if(!rt) return;
          if(!confirm('确定彻底删除这条复习任务吗？\n「'+rt.sourceText+'」\n删除后复习进度不可恢复，但不会影响来源每日计划任务。')) return;
          reviewRemove(rt.id); renderPageKeepScroll();
          toast('复习任务已删除');
        });
      });
      /* 分页 */
      $$('#content [data-rv-page]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const p = +b.dataset.rvPage;
          if(p < 1 || p > totalPages) return;
          S.reviewPage = p; save(true); renderPageKeepScroll();
        });
      });
    }
  };
};

/* ============================================================
   甘特图 · 计划可视化（计划大类新菜单）
   ------------------------------------------------------------
   数据模型：不建独立数据表，直接读写 S.plans 四类计划
   （daily / weekly / monthly / overall），字段完全复用现有结构；
   可选扩展字段（向后兼容，四类通用）：
     progress: 0-100 数字进度（无则按 records 打卡次数推导）
     color:    '#RRGGBB' 自定义条色（无则按 cat 马卡龙色）
     dependsOn: [id...] 依赖的前置任务（本版本仅在详情中展示，不做连线）
   与「行测/申论待办」联动：写入 S.plans.daily 的结构
   （text/cat/stage/due/records）与 openAddPlan 完全一致，
   因此 daily 任务自动出现在对应板块 todoCard 的待办里。
   ============================================================ */
/* 8 分类马卡龙色（甘特条默认色；【改动二】申论拆分为小题/大作文） */
const GANTT_CAT_COLORS = {
  '政治理论':'#F7A8C0', '常识':'#F9C89B', '言语理解':'#F7D774',
  '逻辑判断':'#A9DFBF', '数量关系':'#A8D3F0', '资料分析':'#C3B1E1',
  '申论小题':'#F5B8CE', '申论大作文':'#E8A8C8',
  '申论':'#F5B8CE'   /* 别名兜底：旧数据 cat='申论' */
};
const ganttCatColor = c => GANTT_CAT_COLORS[c] || GANTT_CAT_COLORS[canonCat(c)] || '#F0B8C8';

/* ============================================================
   【改动三】自定义任务颜色 + 20 个色号记忆
   ------------------------------------------------------------
   · 颜色优先级：任务 color 字段 > ganttCatColor(分类)
   · 记忆库 S.ganttColorMemory：最多 20 个 #RRGGBB（统一存大写去重）
   · 新增去重（大小写统一）；删除只清记忆，不动任务颜色
   · 未满 20 保存任务时自动把新色写入记忆；已满则提示阻止保存
   ============================================================ */
const GANTT_COLOR_MAX = 20;
/* 归一化任意用户输入为 '#RRGGBB'（大写）；非法返回 null
   支持 #RRGGBB / #RGB / rgb(r,g,b) / rgb(r g b) */
function ganttNormColor(input){
  if(!input) return null;
  let s = String(input).trim().toLowerCase();
  const clamp = n => Math.max(0, Math.min(255, Math.round(n)));
  const hex2 = n => clamp(n).toString(16).padStart(2,'0');
  /* #RGB */
  let m = s.match(/^#([0-9a-f])([0-9a-f])([0-9a-f])$/);
  if(m) return ('#'+m[1]+m[1]+m[2]+m[2]+m[3]+m[3]).toUpperCase();
  /* #RRGGBB */
  m = s.match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/);
  if(m) return ('#'+m[1]+m[2]+m[3]).toUpperCase();
  /* rgb(...) */
  m = s.match(/^rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)/);
  if(m) return ('#'+hex2(+m[1])+hex2(+m[2])+hex2(+m[3])).toUpperCase();
  return null;
}
/* 记忆库读取（保证数组与上限） */
function ganttColorMem(){
  if(!Array.isArray(S.ganttColorMemory)) S.ganttColorMemory = [];
  return S.ganttColorMemory;
}
/* 写入记忆：返回 'ok' | 'dup' | 'full' */
function ganttColorRemember(hex){
  const h = ganttNormColor(hex); if(!h) return 'bad';
  const mem = ganttColorMem();
  if(mem.indexOf(h) >= 0) return 'dup';
  if(mem.length >= GANTT_COLOR_MAX) return 'full';
  mem.push(h); save(true);
  return 'ok';
}
/* 从记忆移除（只影响记忆库） */
function ganttColorForget(hex){
  const h = ganttNormColor(hex); if(!h) return;
  S.ganttColorMemory = ganttColorMem().filter(x=>x !== h);
  save(true);
}
/* 生成色号网格 HTML（每格右上角 × 删除） */
function ganttColorGridHtml(sel){
  const mem = ganttColorMem();
  if(!mem.length) return '<div style="font-size:10px;color:var(--text3);padding:6px 0;">还没有记忆色号，输入或点选颜色后保存任务即可自动记住（最多 20 个）</div>';
  return '<div style="display:flex;flex-wrap:wrap;gap:8px;padding:4px 0;">'+mem.map(h=>
    '<div class="gc-swatch'+(ganttNormColor(sel)===h?' sel':'')+'" data-gc-pick="'+h+'" title="'+h+'" style="background:'+h+';">'+
      '<span class="gc-del" data-gc-del="'+h+'" title="从记忆库删除（不影响任务颜色）">×</span></div>'
  ).join('')+'</div>';
}
/* 颜色选择行（编辑弹窗 + 快速添加卡片共用组件）
   返回 HTML 片段；变量名 amtColor / 输入框 id 通过参数区分两处 */
function ganttColorRowHtml(uidPrefix, curColor){
  const c = ganttNormColor(curColor) || '';
  return '<div class="field"><label>任务颜色 <span style="color:var(--text3);font-weight:400;">（留空 = 按分类默认色）</span></label>'+
    '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'+
      '<span id="'+uidPrefix+'Swatch" style="flex:none;width:28px;height:28px;border-radius:9px;border:1.5px solid rgba(0,0,0,.08);'+
        'background:'+(c||'repeating-linear-gradient(45deg,#EEE 0 4px,#FFF 4px 8px)')+';"></span>'+
      '<input class="inp" id="'+uidPrefix+'ColorInp" placeholder="#FF69B4 / #F6C / rgb(255,105,180)" '+
        'value="'+(c||'')+'" style="flex:1;min-width:130px;">'+
      '<input type="color" id="'+uidPrefix+'ColorNative" value="'+(c||'#F7A8C0')+'" '+
        'title="打开系统调色盘" style="flex:none;width:34px;height:30px;padding:0;border:1.5px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;">'+
      '<button type="button" class="btn sm ghost" id="'+uidPrefix+'ColorClear">清除</button>'+
    '</div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">'+
      '<span style="font-size:10px;color:var(--text3);">记忆色号（'+ganttColorMem().length+'/'+GANTT_COLOR_MAX+'，点 × 删除记忆）</span>'+
    '</div>'+
    '<div id="'+uidPrefix+'ColorGrid">'+ganttColorGridHtml(curColor)+'</div>'+
  '</div>';
}
/* 绑定颜色组件交互：输入实时预览、系统调色盘、点选记忆、清除、× 删除
   getVal() 返回当前色；setVal(hex) 回写；前缀 uidPrefix 隔离两处实例 */
function ganttBindColorRow(uidPrefix, getVal, setVal){
  const inp = document.getElementById(uidPrefix+'ColorInp');
  const nat = document.getElementById(uidPrefix+'ColorNative');
  const sw  = document.getElementById(uidPrefix+'Swatch');
  const clr = document.getElementById(uidPrefix+'ColorClear');
  const grid= document.getElementById(uidPrefix+'ColorGrid');
  const paint = (hex, blank)=>{
    if(!sw) return;
    sw.style.background = hex || (blank ? 'repeating-linear-gradient(45deg,#EEE 0 4px,#FFF 4px 8px)' : hex);
  };
  if(inp) inp.addEventListener('input', ()=>{
    const h = ganttNormColor(inp.value);
    paint(h);
    if(nat && h) nat.value = h;
    setVal(h || '');                 // 合法实时写入，非法清空
  });
  if(nat) nat.addEventListener('input', ()=>{
    const h = ganttNormColor(nat.value);
    if(h){ if(inp) inp.value = h; paint(h); setVal(h); }
  });
  if(clr) clr.addEventListener('click', ()=>{
    if(inp) inp.value=''; setVal(''); paint(null, true);
  });
  if(grid) grid.addEventListener('click', (ev)=>{
    const del = ev.target.closest('[data-gc-del]');
    if(del){
      ev.stopPropagation();
      const h = del.dataset.gcDel;
      if(confirm('从记忆色号删除 '+h+' ？\n（只删除记忆，不影响任何任务已用的颜色）')){
        ganttColorForget(h);
        grid.innerHTML = ganttColorGridHtml(getVal());
      }
      return;
    }
    const pick = ev.target.closest('[data-gc-pick]');
    if(pick){
      const h = pick.dataset.gcPick;
      if(inp) inp.value = h; if(nat) nat.value = h;
      paint(h); setVal(h);
      grid.querySelectorAll('.gc-swatch').forEach(x=>x.classList.toggle('sel', x.dataset.gcPick === h));
    }
  });
}
/* 保存时把颜色写入记忆：'ok'/'dup'/'full'/'bad'/'skip' */
function ganttColorCommit(val){
  const h = ganttNormColor(val);
  if(!h) return 'skip';
  return ganttColorRemember(h);
}

/* ============================================================
   【复习计划】艾宾浩斯记忆曲线引擎（数据 + 纯函数）
   ------------------------------------------------------------
   复习任务独立存于 S.reviewTasks，**不写入 S.plans**（避免污染与重复）；
   每日计划 / 待办事项 / 甘特图三处均在「渲染时实时映射」，因此
   reviewPlan 的日期或状态一变，三处同步生效，无需任何监听或定时器。
   ============================================================ */
/* 公认的艾宾浩斯复习周期（相对纳入当天 day0 的天数偏移），便于日后调整 */
const EBINGHAUS_OFFSETS = [1,2,4,7,15,30,60];
/* 复习任务在甘特图上的默认颜色
   【需求 3】由原薰衣草紫 #C3B1E1 改为淡柠檬黄 #FFFACD
   —— 该色更柔和，且轮次条内文字/边框改用深色保证可读性（见 CSS .g-bar.rv-bar）。 */
const REVIEW_BAR_COLOR = '#FFFACD';
/* 一轮复习提前提醒的时间线窗口（天） */
const REVIEW_TIMELINE_DAYS = 30;

/* 按「纳入当天为 day0」生成 7 个复习时间点 */
function reviewBuildPlan(day0){
  const base = day0 || todayStr();
  return EBINGHAUS_OFFSETS.map((off, i)=>({
    round: i+1,
    date: ganttAddDays(base, off),
    status: 'pending',
    doneAt: null
  }));
}
/* 复习任务列表（含结构兜底，防止旧数据缺字段导致渲染出错） */
function reviewList(){
  if(!Array.isArray(S.reviewTasks)) S.reviewTasks = [];
  return S.reviewTasks;
}
/* 某条复习任务的轮次统计：{ done, total, pct, active } */
function reviewStats(rt){
  const plan = (rt && Array.isArray(rt.reviewPlan)) ? rt.reviewPlan : [];
  const total = plan.length;
  const done = plan.filter(r=>r.status === 'done').length;
  return { done, total, pct: total ? Math.round(done/total*100) : 0,
           active: !!rt.active, allDone: total > 0 && done === total };
}

/* ================= 【需求 6】复习进度与完成情况：统计聚合 =================
   口径说明：
   · 统计单元 = 某一天（daily 粒度）；
   · 每条复习任务的每一轮（reviewPlan[i]）按其「date」归入对应天的单元；
   · done     = 该天到期且已完成（status==='done'）；
   · pending  = 该天到期且未完成，且 date >= today；
   · overdue  = 该天到期且未完成，且 date < today（逾期未完成）；
   · total    = done + pending + overdue（= 该天到期的总轮次数）；
   · rate     = done / total（无数据记 0）。
   注意：**不排除 active === false 的已关闭复习任务** —— 历史数据也应统计。
   ------------------------------------------------------------ */

/* 统计 [d1, d2] 区间的复习汇总 → { done, pending, overdue, total, rate } */
function reviewStatInRange(d1, d2){
  const today = todayStr();
  const out = { done:0, pending:0, overdue:0, total:0, rate:0 };
  if(!d1 || !d2 || d1 > d2) return out;
  reviewList().forEach(rt=>{
    const plan = Array.isArray(rt.reviewPlan) ? rt.reviewPlan : [];
    plan.forEach(r=>{
      if(!r || !r.date) return;
      if(r.date < d1 || r.date > d2) return;          // 不在区间
      out.total++;
      if(r.status === 'done') out.done++;
      else if(r.date < today) out.overdue++;          // 未完成且已过期
      else out.pending++;                             // 未完成但在未来/今天
    });
  });
  out.rate = out.total ? Math.round(out.done / out.total * 100) : 0;
  return out;
}

/* 按粒度生成序列 → [{ label, done, pending, overdue, total, rate }, ...]
   granularity: 'day'（逐日）/ 'month'（逐月）
   d1~d2 为日期字符串（含端点） */
function reviewStatSeries(granularity, d1, d2){
  const today = todayStr();
  const boxes = [];
  const idxOf = {};
  const keyDay   = ds=> ds;                              // yyyy-mm-dd
  const keyMonth = ds=> ds.slice(0,7);                   // yyyy-mm
  /* 1) 先建出全部连续单元，保证没有数据的单元也占位（柱高为 0） */
  if(granularity === 'month'){
    let cur = d1.slice(0,7) + '-01';
    const endM = d2.slice(0,7);
    while(cur.slice(0,7) <= endM){
      const k = keyMonth(cur);
      idxOf[k] = boxes.length;
      boxes.push({ label: cur.slice(0,4)+'/'+cur.slice(5,7), done:0, pending:0, overdue:0, total:0, rate:0 });
      /* 下个月 1 号 */
      const y = +cur.slice(0,4), m = +cur.slice(5,7);
      cur = (m === 12) ? (y+1)+'-01-01' : y+'-'+pad2(m+1)+'-01';
      if(cur > d2 && cur.slice(0,7) > endM) break;
    }
  } else {
    let cur = d1;
    let guard = 0;
    while(cur <= d2 && guard < 4000){
      const k = keyDay(cur);
      idxOf[k] = boxes.length;
      boxes.push({ label: cur.slice(5).replace('-','/'), done:0, pending:0, overdue:0, total:0, rate:0 });
      cur = ganttAddDays(cur, 1); guard++;
    }
  }
  /* 2) 遍历所有复习轮次，归入对应单元 */
  reviewList().forEach(rt=>{
    const plan = Array.isArray(rt.reviewPlan) ? rt.reviewPlan : [];
    plan.forEach(r=>{
      if(!r || !r.date) return;
      if(r.date < d1 || r.date > d2) return;
      const k = (granularity === 'month') ? keyMonth(r.date) : keyDay(r.date);
      const i = idxOf[k];
      if(i === undefined) return;
      const b = boxes[i];
      b.total++;
      if(r.status === 'done') b.done++;
      else if(r.date < today) b.overdue++;
      else b.pending++;
    });
  });
  boxes.forEach(b=>{ b.rate = b.total ? Math.round(b.done / b.total * 100) : 0; });
  return boxes;
}

/* 手绘 SVG 组合图：堆叠柱（已完成/待复习/逾期）+ 完成率折线（右轴）
   series: reviewStatSeries 的返回数组；opt.w 指定视口宽（自适应） */
function reviewChartSvg(series, opt){
  opt = opt || {};
  const n = series.length;
  if(!n) return '';
  const W = opt.w || 680;
  const H = opt.h || 210;
  const PL = 30, PR = 34, PT = 14, PB = 34;      // 左/右/上/下内边距（左轴+右轴）
  const cw = Math.max(60, W - PL - PR);
  const ch = Math.max(60, H - PT - PB);
  const maxTotal = Math.max(1, Math.max.apply(null, series.map(b=>b.total)));
  /* 柱宽：随柱数自适应，最多 26px，最少 3px */
  const slot = cw / n;
  const bw = Math.max(3, Math.min(26, slot * 0.62));
  const yOf = v=> PT + ch - (v / maxTotal) * ch;             // 左轴（任务数）
  const yRate = p=> PT + ch - (p / 100) * ch;                // 右轴（完成率 0~100）
  /* 左轴刻度：4 档 */
  let grid = '', ylab = '';
  for(let t=0;t<=4;t++){
    const v = Math.round(maxTotal * t / 4);
    const y = yOf(v);
    grid += '<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(PL+cw)+'" y2="'+y.toFixed(1)+
            '" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>';
    ylab += '<text x="'+(PL-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="#A7969C">'+v+'</text>';
  }
  /* 右轴刻度：0 / 50 / 100 % */
  let rlab = '';
  [0,50,100].forEach(p=>{
    const y = yRate(p);
    rlab += '<text x="'+(PL+cw+6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="start" font-size="9" fill="#C98CA3">'+p+'%</text>';
  });
  /* 柱体（自下而上：已完成 → 待复习 → 逾期） */
  let bars = '';
  series.forEach((b, i)=>{
    const cx = PL + slot*i + slot/2;
    const x  = cx - bw/2;
    let acc = 0;
    const seg = (v, color)=>{
      if(v <= 0) return '';
      const y = yOf(acc + v), h = yOf(acc) - yOf(acc + v);
      acc += v;
      return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0.5,h).toFixed(1)+
             '" fill="'+color+'" rx="1.5"/>';
    };
    bars += seg(b.done,    '#9FDCBE');   // 已完成（薄荷绿，底部）
    bars += seg(b.pending, '#FFFACD');   // 待复习（淡黄，中部）
    bars += seg(b.overdue, '#F58B7A');   // 逾期（珊瑚红，顶部）
    /* 无数据单元画一条极细底纹，保证列可见 */
    if(b.total === 0){
      bars += '<rect x="'+x.toFixed(1)+'" y="'+(PT+ch-1).toFixed(1)+'" width="'+bw.toFixed(1)+
              '" height="1" fill="#EFE7EA"/>';
    }
  });
  /* 完成率折线（仅在有数据的单元连线） */
  let pts = [];
  series.forEach((b, i)=>{
    if(b.total === 0) return;
    pts.push([PL + slot*i + slot/2, yRate(b.rate)]);
  });
  let line = '', dots = '';
  if(pts.length >= 2){
    line = '<polyline points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+
           '" fill="none" stroke="#EE9BB4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach(p=>{
    dots += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2" fill="#fff" stroke="#EE9BB4" stroke-width="2"/>';
  });
  /* X 轴标签：柱数多时抽样显示，避免重叠 */
  let xlab = '';
  const step = n > 40 ? Math.ceil(n/14) : (n > 16 ? 2 : 1);
  series.forEach((b, i)=>{
    if(i % step !== 0 && i !== n-1) return;
    xlab += '<text x="'+(PL + slot*i + slot/2).toFixed(1)+'" y="'+(PT+ch+14)+'" text-anchor="middle" font-size="9" fill="#A7969C">'+
            esc(b.label)+'</text>';
  });
  /* 轴框 */
  const axis = '<line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(PT+ch)+'" stroke="#E6DCE1" stroke-width="1"/>'+
               '<line x1="'+PL+'" y1="'+(PT+ch)+'" x2="'+(PL+cw)+'" y2="'+(PT+ch)+'" stroke="#E6DCE1" stroke-width="1"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" '+
    'style="width:100%;height:auto;max-height:'+H+'px;display:block;">'+
      grid+axis+ylab+rlab+bars+line+dots+xlab+
    '</svg>';
}

/* 复习进度卡片（五统计页共用）：标题 + 组合图 + 图例 + 汇总数字 */
function reviewProgressCard(range, granularity, hint){
  const r = range || {};
  const d1 = r.d1, d2 = r.d2;
  const agg = reviewStatInRange(d1, d2);
  const series = reviewStatSeries(granularity, d1, d2);
  const hasData = (r && (r.total || agg.total));
  const legend =
    '<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:calc(var(--fs-btn) - 1px);color:var(--text2);margin:8px 0 4px;">'+
      '<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#9FDCBE;margin-right:4px;vertical-align:-1px;"></i>已完成</span>'+
      '<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#FFFACD;margin-right:4px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10);"></i>待复习</span>'+
      '<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#F58B7A;margin-right:4px;vertical-align:-1px;"></i>逾期未完成</span>'+
      '<span><i style="display:inline-block;width:14px;height:0;border-top:2px solid #EE9BB4;margin-right:4px;vertical-align:3px;"></i>完成率（右轴）</span>'+
    '</div>';
  const summary =
    '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:calc(var(--fs-btn) - 1px);color:var(--text2);">'+
      '<span>已完成 <b style="color:#4E9E78;">'+agg.done+'</b> 项</span>'+
      '<span>待复习 <b style="color:#B39A3E;">'+agg.pending+'</b> 项</span>'+
      '<span>逾期未完成 <b style="color:#D0664F;">'+agg.overdue+'</b> 项</span>'+
      '<span>总完成率 <b style="color:var(--pinkDeep2);">'+agg.rate+'%</b></span>'+
    '</div>'+
    '<div style="font-size:10px;color:var(--text3);margin-top:6px;">'+
      (hint ? hint+'　·　' : '')+'口径：按每轮复习到期日归入统计单元，含已关闭的复习任务；完成率 = 已完成 ÷ 到期总轮次。</div>';
  const body = hasData
    ? legend + reviewChartSvg(series, { w:680, h:210 }) + summary
    : emptyBox('review', '暂无复习计划数据');
  return '<div class="card">'+
    '<div class="card-title">'+titleIco('review')+' 复习进度与完成情况 '+
      (d1 && d2 ? '<span class="sub">'+d1+' ~ '+d2+'</span>' : '')+'</div>'+
    body+
  '</div>';
}

/* 起止日期（甘特条跨第一次复习日 ~ 最后一次复习日） */
function reviewRange(rt){
  const plan = (rt && Array.isArray(rt.reviewPlan)) ? rt.reviewPlan.slice().filter(r=>r.date) : [];
  if(!plan.length) return { s: rt && rt.sourceDate || todayStr(), e: rt && rt.sourceDate || todayStr() };
  plan.sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  return { s: plan[0].date, e: plan[plan.length-1].date };
}
/* 某天到期的「待复习」轮次（用于每日计划/待办实时映射） */
function reviewDueRounds(rt, date){
  const d = date || todayStr();
  const plan = (rt && Array.isArray(rt.reviewPlan)) ? rt.reviewPlan : [];
  return plan.filter(r=> r.date === d && r.status === 'pending');
}
/* 某天是否有待复习（供同步判断） */
function reviewPendingOn(rt, date){
  if(!rt || rt.active === false) return false;
  return reviewDueRounds(rt, date).length > 0;
}
/* 今天待复习的全部复习任务 */
function reviewTodayList(date){
  const d = date || todayStr();
  return reviewList().filter(rt=> reviewPendingOn(rt, d));
}
/* 已完成全部轮次的复习任务数量 / 逾期（已过期仍未完成）数量 */
function reviewOverdue(rt, date){
  const d = date || todayStr();
  const plan = (rt && Array.isArray(rt.reviewPlan)) ? rt.reviewPlan : [];
  return plan.some(r=> r.status === 'pending' && r.date < d);
}
/* 来源每日计划是否还在（用于 tooltip 提示「来源任务已删除」） */
function reviewSourceAlive(rt){
  if(!rt || rt.sourceType !== 'daily') return true;
  return (S.plans.daily||[]).some(x=> x.id === rt.sourceId);
}
/* 标记某轮复习完成；若全部完成则自动 active=false。返回是否成功 */
function reviewMarkDone(rt, round){
  if(!rt) return false;
  const item = (rt.reviewPlan||[]).find(r=> r.round === round);
  if(!item) return false;
  if(item.status !== 'done'){ item.status = 'done'; item.doneAt = Date.now(); }
  const st = reviewStats(rt);
  if(st.allDone) rt.active = false;
  rt.curveIndex = st.done;
  return true;
}
/* 撤销某轮（编辑弹窗内可手动取消勾选） */
function reviewMarkUndo(rt, round){
  if(!rt) return false;
  const item = (rt.reviewPlan||[]).find(r=> r.round === round);
  if(!item) return false;
  item.status = 'pending'; item.doneAt = null;
  rt.curveIndex = reviewStats(rt).done;
  if(rt.curveIndex < reviewStats(rt).total) rt.active = true;   // 重新激活
  return true;
}
/* 纳入复习计划：去重 → 建对象 → 写库。返回 {ok, reason, rt, firstDays} */
function reviewAddFromDaily(it){
  if(!it) return { ok:false, reason:'notfound' };
  const list = reviewList();
  if(list.some(rt=> rt.sourceType === 'daily' && rt.sourceId === it.id))
    return { ok:false, reason:'dup' };
  const rt = {
    id: uid(),
    sourceType: 'daily',
    sourceId: it.id,
    sourceText: it.text || '',
    sourceCat: it.cat || '',
    sourceStage: it.stage || '',
    sourceColor: it.color || '',
    sourceDate: it.due || '',
    createdAt: Date.now(),
    curveIndex: 0,
    reviewPlan: reviewBuildPlan(todayStr()),
    active: true
  };
  list.push(rt);
  save(true);
  return { ok:true, rt, firstDays: EBINGHAUS_OFFSETS[0] };
}
/* 删除复习任务（彻底移除） */
function reviewRemove(id){
  S.reviewTasks = reviewList().filter(rt=> rt.id !== id);
  save(true);
}
/* 关闭/开启复习（active 切换，记录保留） */
function reviewToggleActive(id){
  const rt = reviewList().find(x=> x.id === id);
  if(!rt) return false;
  rt.active = rt.active === false;
  save(true);
  return rt.active;
}

/* ============================================================
   复习计划 · 交互逻辑（纳入确认弹窗 / 编辑弹窗 / 日期工具）
   ============================================================ */
/* 相对日期显示：今天/明天/后天，其余 MM-DD 周X */
function reviewDayLabel(date){
  const t = todayStr();
  const diff = ganttDaysBetween(t, date);
  if(diff === 0) return '今天';
  if(diff === 1) return '明天';
  if(diff === 2) return '后天';
  if(diff === -1) return '昨天';
  const dow = '日一二三四五六'[new Date(date+'T00:00:00').getDay()];
  return date.slice(5).replace('-','-') + ' 周' + dow;
}
/* 「纳入复习」确认弹窗：显示来源任务 + 7 个复习日期 */
function reviewConfirmAdd(sourceId, afterFn){
  const it = (S.plans.daily||[]).find(x=> x.id === sourceId);
  if(!it){ toast('找不到该任务'); return; }
  if(reviewList().some(rt=> rt.sourceType === 'daily' && rt.sourceId === sourceId)){
    toast('该任务已在复习计划中'); return;
  }
  const plan = reviewBuildPlan(todayStr());
  const rows = plan.map(r=>
    '<div style="display:flex;align-items:center;gap:8px;font-size:calc(var(--fs-btn) - 1px);padding:3px 0;">'+
      '<span style="flex:none;width:52px;color:var(--pinkDeep2);font-weight:800;">第 '+r.round+' 轮</span>'+
      '<span style="flex:none;width:88px;color:var(--text2);">'+r.date+'</span>'+
      '<span style="color:var(--text3);">'+reviewDayLabel(r.date)+'</span>'+
    '</div>').join('');
  openModal('📚 纳入复习计划',
    '<div class="field" style="margin-bottom:10px;">'+
      '<label>来源任务</label>'+
      '<div style="font-size:var(--fs-btn);color:var(--text1);font-weight:700;">'+esc(it.text)+'</div>'+
      '<div style="font-size:calc(var(--fs-btn) - 2px);color:var(--text3);margin-top:2px;">'+
        (it.cat ? '🏷 '+esc(it.cat)+'　' : '')+(it.stage ? esc(it.stage) : '')+'</div>'+
    '</div>'+
    '<div class="field"><label>将按艾宾浩斯曲线生成 7 个复习时间点（以今天为第 0 天）</label>'+
      '<div style="border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:#FFFDFC;">'+rows+'</div>'+
    '</div>'+
    '<div style="font-size:calc(var(--fs-btn) - 2px);color:var(--text3);line-height:1.6;">'+
      '纳入后，复习任务会在到期当天自动出现在「每日计划」页与对应板块的「待办事项」里，并在甘特图上以紫色任务条展示。'+
    '</div>',
    [
      {text:'确认纳入', primary:true, onClick:()=>{
        const r = reviewAddFromDaily(it);
        if(!r.ok){ toast(r.reason === 'dup' ? '该任务已在复习计划中' : '纳入失败'); return false; }
        closeModal();
        toast('已纳入复习计划，将在 '+(r.firstDays)+' 天后开始第一次复习 📚');
        if(typeof afterFn === 'function') afterFn();
        renderPageKeepScroll();
      }},
      {text:'取消'}
    ]);
}
/* 【本次改动三】当日复习任务详情弹窗（点月历日期格触发）
   显示该日全部复习任务（未完成 / 已完成 / 逾期），每条可一键「✓ 已完成本轮」。 */
function reviewDayDetail(ds, afterFn){
  if(!ds) return;
  const today = todayStr();
  const items = [];
  reviewList().forEach(rt=> (rt.reviewPlan||[]).forEach(r=>{
    if(r.date === ds) items.push({ rt, round: r.round, status: r.status, date: r.date, doneAt: r.doneAt });
  }));
  items.sort((a,b)=> a.round - b.round);
  const dow = '日一二三四五六'[new Date(ds+'T00:00:00').getDay()];
  const head = ds.slice(5).replace('-','/') + '（周'+dow+'）';
  const rows = items.length
    ? items.map(g=>{
        const rt = g.rt;
        const isDone = g.status === 'done';
        const ovd = !isDone && g.date < today;
        const tag = isDone
          ? '<span class="pill mint">✓ 已完成</span>'
          : (ovd ? '<span class="pill" style="background:#FFE4E1;color:#A64A55;">逾期未完成</span>'
                 : '<span class="pill" style="background:#FFFACD;color:#7A6420;">待复习</span>');
        return '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line);">'+
          '<div style="flex:1;min-width:0;">'+
            '<div style="font-size:var(--fs-btn);color:var(--text1);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'+
              (isDone?'text-decoration:line-through;color:#B9B2BC;':'')+'">'+esc(rt.sourceText)+'</div>'+
            '<div style="font-size:calc(var(--fs-btn) - 2px);color:var(--text3);margin-top:2px;">'+
              (rt.sourceCat ? '🏷 '+esc(canonCat(rt.sourceCat))+'　' : '')+
              '<b style="color:'+(ovd?'#D9738C':'#7E5FA8')+';">第 '+g.round+' 轮</b>'+'　'+tag+
              (isDone && g.doneAt ? '　完成于 '+dstr(new Date(g.doneAt)) : '')+
              (reviewSourceAlive(rt) ? '' : '　⚠ 来源任务已删除')+
            '</div>'+
          '</div>'+
          (isDone ? ''
            : '<button class="btn sm '+(ovd?'ghost':'mint')+'" data-rvdd-done="'+rt.id+'|'+g.round+'" style="flex:none;">✓ 已完成本轮</button>')+
        '</div>';
      }).join('')
    : '<div style="font-size:var(--fs-btn);color:var(--text3);text-align:center;padding:14px 0;">这一天没有复习任务</div>';

  openModal('🗓 '+head+' · 当日复习任务（'+items.length+' 项）',
    '<div>'+rows+'</div>'+
    '<div style="font-size:calc(var(--fs-btn) - 2px);color:var(--text3);margin-top:8px;">提示：点击「✓ 已完成本轮」会立即标记完成并刷新月历。</div>',
    [
      {text:'打开全部任务列表', onClick:()=>{ closeModal(); renderPageKeepScroll(); }},
      {text:'关闭'}
    ]);
  setTimeout(()=>{
    $$('#modal [data-rvdd-done]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const [id, rnd] = b.dataset.rvddDone.split('|');
        const rt = reviewList().find(x=> x.id === id);
        if(!rt) return;
        reviewMarkDone(rt, +rnd);
        save(true);
        const st = reviewStats(rt);
        toast('第 '+rnd+' 轮复习完成 ✓'+(st.allDone ? '　全部复习完成 🎉' : ''));
        reviewDayDetail(ds, afterFn);        // 原地重绘弹窗
        if(typeof afterFn === 'function') afterFn();
      });
    });
  }, 30);
}

/* 复习任务编辑弹窗（复习计划页「查看详情」与甘特图点条共用）
   可改每轮日期、可勾选/取消完成、可关闭复习、可彻底删除、含颜色选择器 */
function reviewOpenEdit(id, afterFn){
  const rt = reviewList().find(x=> x.id === id);
  if(!rt){ toast('复习任务不存在'); return; }
  const st = reviewStats(rt);
  const alive = reviewSourceAlive(rt);
  /* 编辑态工作副本：保存时才写回，取消不影响原数据 */
  let work = JSON.parse(JSON.stringify(rt.reviewPlan || []));
  let workColor = ganttNormColor(rt.color || rt.sourceColor) || '';

  const rowsHtml = ()=> work.map((r, i)=>
    '<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px dashed var(--line);">'+
      '<label style="flex:none;width:64px;display:flex;align-items:center;gap:4px;font-size:calc(var(--fs-btn) - 1px);cursor:pointer;">'+
        '<input type="checkbox" data-rv-chk="'+r.round+'"'+(r.status==='done'?' checked':'')+'> 第'+r.round+'轮</label>'+
      '<input class="inp" type="date" data-rv-date="'+r.round+'" value="'+r.date+'" style="flex:1;min-width:120px;">'+
      '<span style="flex:none;width:64px;font-size:calc(var(--fs-btn) - 2px);color:var(--text3);text-align:right;">'+reviewDayLabel(r.date)+'</span>'+
    '</div>').join('');

  function repaint(){
    const box = $('#rvRows'); if(box) box.innerHTML = rowsHtml();
  }
  openModal('📚 复习任务详情',
    '<div class="field" style="margin-bottom:10px;">'+
      '<label>来源任务</label>'+
      '<div style="font-size:var(--fs-btn);color:var(--text1);font-weight:700;">'+esc(rt.sourceText)+'</div>'+
      '<div style="font-size:calc(var(--fs-btn) - 2px);color:var(--text3);margin-top:2px;">'+
        (rt.sourceCat ? '🏷 '+esc(rt.sourceCat)+'　' : '')+
        '完成进度 <b style="color:var(--pinkDeep2);">'+st.done+' / '+st.total+' 轮</b>'+
        (st.allDone ? '　<span class="pill mint">✓ 已完成</span>' : (rt.active===false ? '　<span class="pill">已关闭</span>' : ''))+
      '</div>'+
      (alive ? '' : '<div style="font-size:calc(var(--fs-btn) - 2px);color:#D98BA6;margin-top:2px;">⚠ 来源任务已删除（复习任务独立保留）</div>')+
    '</div>'+
    '<div class="field"><label>复习时间点（可手动调整日期或勾选完成，方便放假/出差时顺延）</label>'+
      '<div id="rvRows" style="border:1.5px solid var(--line);border-radius:12px;padding:4px 10px 8px;background:#FFFDFC;">'+rowsHtml()+'</div>'+
    '</div>'+
    /* 颜色选择器：与甘特图其它任务共用同一套组件 */
    ganttColorRowHtml('rv', rt.color || ''),
    [
      {text:'保存修改', primary:true, onClick:()=>{
        const raw = $('#rvColorInp'); const rv = raw ? raw.value.trim() : '';
        const cv = rv ? ganttNormColor(rv) : '';
        if(rv && !cv){ toast('颜色格式不正确（支持 #RRGGBB / #RGB / rgb(...)）'); return false; }
        if(cv){
          const mem = ganttColorMem();
          if(mem.indexOf(cv) < 0 && mem.length >= GANTT_COLOR_MAX){
            toast('记忆色号已满 20 个，请先删除不再使用的色号再保存'); return false;
          }
        }
        rt.reviewPlan = work.map(r=>({ round:r.round, date:r.date, status:r.status, doneAt:r.doneAt }));
        { const s2 = reviewStats(rt); rt.curveIndex = s2.done; rt.active = s2.allDone ? false : rt.active; }
        if(cv){ rt.color = cv; ganttColorCommit(cv); } else { if('color' in rt) delete rt.color; }
        save(true); closeModal();
        toast('复习任务已保存 ✓');
        if(typeof afterFn === 'function') afterFn();
        renderPageKeepScroll();
      }},
      {text: (rt.active===false ? '重新启用复习' : '关闭复习'), onClick:()=>{
        const on = reviewToggleActive(rt.id);
        closeModal();
        toast(on ? '已重新启用复习 ↺' : '已关闭复习（记录保留）');
        if(typeof afterFn === 'function') afterFn();
        renderPageKeepScroll();
      }},
      {text:'彻底删除', onClick:()=>{
        if(!confirm('确定彻底删除这条复习任务吗？\n「'+rt.sourceText+'」\n删除后复习进度不可恢复，但不会影响来源每日计划任务。')) return;
        reviewRemove(rt.id); closeModal();
        toast('复习任务已删除');
        if(typeof afterFn === 'function') afterFn();
        renderPageKeepScroll();
      }},
      {text:'取消'}
    ]);
  /* 弹窗内交互绑定 */
  setTimeout(()=>{
    try{ ganttBindColorRow('rv', ()=>workColor, v=>{ workColor = v; }); }catch(e){}
    const box = $('#rvRows'); if(!box) return;
    box.addEventListener('change', ev=>{
      const chk = ev.target.closest('[data-rv-chk]');
      if(chk){
        const rd = +chk.dataset.rvChk;
        const item = work.find(r=> r.round === rd);
        if(item){
          if(chk.checked){ item.status = 'done'; item.doneAt = item.doneAt || Date.now(); }
          else { item.status = 'pending'; item.doneAt = null; }
        }
        return;
      }
      const dt = ev.target.closest('[data-rv-date]');
      if(dt){
        const rd = +dt.dataset.rvDate;
        const item = work.find(r=> r.round === rd);
        if(item && /^\d{4}-\d{2}-\d{2}$/.test(dt.value)){ item.date = dt.value; repaint(); }
      }
    });
  }, 30);
}

/* 甘特图视图/筛选状态（仅内存，不入库）。
   view 默认值按当前屏宽自适应：手机(<640px)月视图、桌面周视图；
   用户手动点过视图按钮（userView=true）后不再自动切换。 */
const GANTT_STATE = { view:null, userView:false, cat:'', stage:'', ptype:'' };
const ganttIsMobile = ()=> window.innerWidth < 640;

/* 统一计算任意计划的「实际起止日期」
   daily: due 单日；weekly/monthly: 区间模式用 startDate/endDate，
   单日模式 startDate===endDate；锚点兜底走 planRangeOf 推整周/整月；
   overall: startDate/endDate。 */
function ganttRangeOf(it, type){
  if(type === 'daily'){ const d = it.due || todayStr(); return { s:d, e:d }; }
  if(type === 'overall'){
    const s = it.startDate || todayStr();
    return { s, e: it.endDate || s };
  }
  /* weekly / monthly */
  if(it.startDate && it.endDate && it.startDate !== it.endDate) return { s:it.startDate, e:it.endDate };
  if(it.startDate && it.startDate === it.endDate) return { s:it.startDate, e:it.endDate };
  const base = it.startDate || (type === 'weekly' ? it.weekOf : it.monthOf) || todayStr();
  return planRangeOf(type, { startDate:base, weekOf:base, monthOf:base });
}
/* 进度：progress 字段优先；否则按 records 完成次数 / 计划次数（区间天数）推导 */
function ganttPctOf(it, type, rng){
  if(typeof it.progress === 'number') return Math.max(0, Math.min(100, Math.round(it.progress)));
  const recs = Array.isArray(it.records) ? it.records : [];
  const done = recs.filter(r=>r.ok).length;
  if(type === 'daily') return done >= 1 ? 100 : 0;
  const days = ganttDaysBetween(rng.s, rng.e) + 1;
  return Math.min(100, Math.round(done / Math.max(1, days) * 100));
}
function ganttDaysBetween(a, b){
  const d1 = new Date(a+'T00:00:00'), d2 = new Date(b+'T00:00:00');
  return Math.round((d2 - d1) / 86400000);
}
function ganttAddDays(ds, n){
  const d = new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return dstr(d);
}
/* 汇总四类计划为甘特任务行
   【复习计划】末尾追加复习任务虚拟行（type:'review'）——「实时映射」方案：
   复习任务不写入 S.plans，只在这里把 S.reviewTasks 读成额外的甘特行，
   因此复习日期/完成状态一变，甘特图重绘即可同步，无重复数据、无污染。
   条内进度 = 已完成轮次 / 7 轮；全部完成时 allOk=true（甘特条半透明 + ✓）。 */
/* ============================================================
   【需求 3 / 4】甘特图「多任务条」渲染通用函数
   ------------------------------------------------------------
   一行可承载多个任务条（bars），两种场景共用：
     · 需求 3：复习任务 —— 7 个轮次各一条（每条宽 = 1 天）
     · 需求 4：同内容每日计划合并行 —— 每个不同 due 日期一条
   bars 元素结构（两种场景统一）：
     { key, date, s, e, pct, allOk, overdue, tip, text, cls, color }
   meta 为 ganttViewMeta() 的返回值（含 start / days / pxd）。
   nameW 为左侧任务名列固定宽度（用于行容器对齐，不参与本函数的内联定位）。
   ============================================================ */
function ganttBarsHtml(bars, meta, opt){
  opt = opt || {};
  const laneH = opt.laneH || 16;      // 每条高度（px）
  const baseTop = opt.baseTop || 7;   // 行的垂直居中起点
  const stagger = opt.stagger || 3;   // 相邻条的上下错位幅度（避免挤在一起）
  return '<div class="g-bars" style="flex:none;position:relative;height:100%;width:'+(meta.days*meta.pxd)+'px;">'+
    bars.map((b, i)=>{
      const off = ganttDaysBetween(meta.start, b.s) * meta.pxd;
      const offE = ganttDaysBetween(meta.start, b.e) * meta.pxd + meta.pxd;
      const wPx = Math.max(6, offE - off);
      const clipped = off < 0;
      /* 奇偶错位：仅当确实有多个条时才错开，单条保持垂直居中 */
      const shift = (bars.length > 1) ? ((i % 2) ? stagger : -stagger) : 0;
      const top = baseTop + shift;
      const cls = 'g-bar ' + (b.cls || '');
      return '<div class="'+cls+'" data-gedit="'+b.key+'" title="'+esc(b.tip)+'" '+
        'style="left:'+Math.max(0, off)+'px;width:'+wPx+'px;top:'+top+'px;height:'+laneH+'px;'+
          (b.color ? 'background:'+b.color+';' : '')+
          (clipped ? 'border-top-left-radius:0;border-bottom-left-radius:0;' : '')+'">'+
        (b.pct !== undefined && b.pct !== null
          ? '<div class="g-bar-inner" style="width:'+b.pct+'%;"></div>' : '')+
        '<span class="g-bar-txt">'+esc(b.text || '')+'</span>'+
      '</div>';
    }).join('')+
  '</div>';
}

/* 汇总四类计划为甘特任务行
   ===== 【需求 4】同内容每日计划合并为一行 =====
   在汇总之后、排序之前，把 S.plans.daily 里 text 完全相同的项合并：
     · 组内只有 1 条 → 保持原来的单条渲染（s/e 区间条），行为不变；
     · 组内 >= 2 条 → 生成「合并行」，bars 按各自 due 渲染成多个条，
       点击某个条只编辑该条对应的那条计划（ganttOpenEdit('daily', bar.id)），
       拖拽排序作用于整行（commitOrder 把组内全部 id 写同一 order）。
   ===== 【需求 3】复习任务按轮次拆成多个条 =====
   不再用 reviewRange() 的单根长条；改为 bars = 该复习任务的 7 个轮次，
   每条宽 = 1 天，默认色 #FFFACD（淡柠檬黄），可被自定义色 / 来源色覆盖。 */
function ganttCollect(){
  const today = todayStr();
  const out = [];
  ['daily','weekly','monthly','overall'].forEach(type=>{
    (S.plans[type]||[]).forEach(it=>{
      const rng = ganttRangeOf(it, type);
      const recs = Array.isArray(it.records) ? it.records : [];
      const allOk = recs.length > 0 && recs.every(r=>r.ok);
      out.push({
        it, type, s:rng.s, e:rng.e,
        pct: typeof it.progress === 'number' ? Math.max(0,Math.min(100,Math.round(it.progress))) : ganttPctOf(it, type, rng),
        allOk,
        overdue: !allOk && rng.e < today
      });
    });
  });
  /* ===== 【需求 3】复习任务：一行一条，按轮次拆成 7 个条 =====
     每个条独立状态：done（低透明 + 删除线）/ 逾期（红描边）/ 待复习。
     颜色优先级：用户自定义 color > 来源任务 sourceColor > 默认 #FFFACD。 */
  reviewList().forEach(rt=>{
    if(rt.active === false) return;              // 已关闭复习的不画（与同步列表口径一致）
    const plan = (rt.reviewPlan||[]).slice().filter(r=> r && r.date)
      .sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
    if(!plan.length) return;
    const st = reviewStats(rt);
    const custom = ganttNormColor(rt.color) || ganttNormColor(rt.sourceColor) || '';
    const barColor = rt.color || REVIEW_BAR_COLOR;      // 空字符串 → CSS 里的默认淡黄
    const vit = Object.assign({}, rt, {
      text: rt.sourceText || '（复习任务）',
      cat: rt.sourceCat || '',
      stage: rt.sourceStage || '',
      color: rt.color || '',
      records: []
    });
    /* 行跨度 s/e = 首轮 ~ 末轮（供时间窗过滤与跨度扫描使用） */
    const bars = plan.map(r=>{
      const isDone = r.status === 'done';
      const ovd = !isDone && r.date < today;
      return {
        key: 'review|'+rt.id,                 // 点击任一条都打开同一条复习任务的编辑弹窗
        round: r.round,
        date: r.date,
        s: r.date, e: r.date,
        status: r.status,
        color: barColor,                      // 有自定义/来源色时直接用，否则留空走 CSS 默认淡黄
        cls: 'rv-bar' + (isDone ? ' done' : (ovd ? ' ovd' : '')),
        text: (isDone ? '✓ ' : '') + 'R' + r.round + (ovd ? '⚠' : ''),
        pct: null,                            // 轮次条不画进度层（状态已用颜色/删除线表达）
        tip: '第 '+r.round+' 轮 · '+r.date+
             (isDone ? ' · 已完成'+(r.doneAt ? '（'+dstr(new Date(r.doneAt))+'）' : '')
                     : (ovd ? ' · ⚠ 已逾期未完成' : ' · 待复习'))+
             '\n来源任务：'+String(rt.sourceText||'')+
             (custom ? '\n颜色：'+String(barColor).toUpperCase()+(ganttNormColor(rt.color)?'（自定义）':'（来源任务色）') : '\n颜色：#FFFACD（默认）')+
             (reviewSourceAlive(rt) ? '' : '\n⚠ 来源任务已删除（复习任务独立保留）')+
             '\n点击可调整 7 轮复习日期'
      };
    });
    out.push({
      it: vit, type:'review',
      s: plan[0].date, e: plan[plan.length-1].date,
      pct: st.pct, allOk: st.allDone,
      overdue: !st.allDone && reviewOverdue(rt, today),
      bars,                                   // 【需求 3】轮次条数组
      rt, reviewDone: st.done, reviewTotal: st.total,
      reviewActive: rt.active !== false
    });
  });

  /* ===== 【需求 4】同内容每日计划合并为一行 ===== */
  const merged = [];
  const dailyIdx = {};                        // text → merged 数组下标
  out.forEach(t=>{
    if(t.type !== 'daily'){ merged.push(t); return; }
    const txt = String((t.it && t.it.text) || '').trim();
    if(!txt){ merged.push(t); return; }        // 空内容不合并，避免误并
    if(dailyIdx[txt] === undefined){
      dailyIdx[txt] = merged.length;
      /* 首个进入组：先原样放入，后续若有同内容再升级为合并行 */
      merged.push(t);
    } else {
      /* 已有同内容行 → 升级为合并行 */
      const host = merged[dailyIdx[txt]];
      if(!host.bars){
        /* 首次升级：把 host 自己转成 bars[0] */
        host.groupIds = [host.it.id];
        host.bars = [{
          key: 'daily|'+host.it.id, id: host.it.id, date: host.s, s: host.s, e: host.e,
          pct: host.pct, allOk: host.allOk, overdue: host.overdue, color: host.it.color || '',
          cls: '', text: (host.allOk ? '✓ ' : '') + (host.overdue ? '⚠' : '')
        }];
      }
      host.groupIds.push(t.it.id);
      host.bars.push({
        key: 'daily|'+t.it.id, id: t.it.id, date: t.s, s: t.s, e: t.e,
        pct: t.pct, allOk: t.allOk, overdue: t.overdue, color: t.it.color || '',
        cls: '', text: (t.allOk ? '✓ ' : '') + (t.overdue ? '⚠' : '')
      });
      /* 合并行的整体跨度：取组内最早 ~ 最晚（供时间窗过滤） */
      if(host.s > t.s) host.s = t.s;
      if(host.e < t.e) host.e = t.e;
    }
  });
  /* 为合并行补齐条的 tooltip（含所属日期与状态） */
  merged.forEach(t=>{
    if(!t.bars) return;
    t.bars.forEach(b=>{
      if(b.tip) return;
      const src = (S.plans.daily||[]).find(x=>x.id === b.id) || {};
      b.tip = String(t.it.text)+'（每日计划 · 合并行 '+(t.groupIds?t.groupIds.length:1)+' 条）'+
              '\n日期：'+b.date+'\n进度：'+b.pct+'%'+(b.allOk?'（已完成）':'')+(b.overdue?'　⚠️ 已逾期':'')+
              '\n分类：'+(src.cat||'—')+'　阶段：'+(src.stage||'—')+
              '\n点击只编辑这一条';
      b.cls = 'daily-bar' + (b.allOk ? ' done' : (b.overdue ? ' ovd' : ''));
      b.text = (b.allOk ? '✓ ' : '') + (b.pct !== undefined && b.pct !== null ? b.pct+'%' : '') + (b.overdue ? ' ⚠' : '');
    });
  });
  return merged;
}

/* ============================================================
   【改动二】甘特图默认排序 + 手动拖拽
   ------------------------------------------------------------
   默认四级排序（任意级相同则进入下一级，最后以 id 兜底保证稳定）：
     ① 阶段  STAGES 顺序（未填阶段的排最后）
     ② 类型  overall → monthly → weekly → daily
     ③ 分类  CATS 顺序（未匹配的排最后）
     ④ 创建时间 created 升序（无 created 视为 0）
   手动拖拽优先级：若任务带 order 字段（数字），则 order 小者靠前，
   且所有带 order 的任务整体排在「无 order」的任务之前；
   无 order 的任务之间继续按上述默认四级排序。
   ============================================================ */
const GANTT_TYPE_ORDER = { overall:0, monthly:1, weekly:2, daily:3, review:4 };
/* 复习任务在甘特图默认排序中放在最后（GANTT_TYPE_ORDER.review=4），
   不参与「阶段」排序（复习任务本身没有阶段，只有来源阶段）。 */
function ganttDefaultCmp(a, b){
  /* ① 阶段（复习任务跳过阶段比较，统一排到同类型内） */
  const aRev = a.type === 'review', bRev = b.type === 'review';
  if(!aRev && !bRev){
    const sa = STAGES.indexOf(a.it.stage), sb = STAGES.indexOf(b.it.stage);
    const ra = sa < 0 ? 999 : sa, rb = sb < 0 ? 999 : sb;
    if(ra !== rb) return ra - rb;
  }
  /* ② 类型 */
  const ta = GANTT_TYPE_ORDER[a.type] ?? 99, tb = GANTT_TYPE_ORDER[b.type] ?? 99;
  if(ta !== tb) return ta - tb;
  /* ③ 分类（含「申论」→「申论小题」别名归一） */
  const ca = catIndex(a.it.cat), cb = catIndex(b.it.cat);
  const qa = ca < 0 ? 999 : ca, qb = cb < 0 ? 999 : cb;
  if(qa !== qb) return qa - qb;
  /* ④ 创建时间升序 */
  const da = a.it.created || 0, db = b.it.created || 0;
  if(da !== db) return da - db;
  /* 兜底：id 字典序，保证稳定 */
  return String(a.it.id) < String(b.it.id) ? -1 : (String(a.it.id) > String(b.it.id) ? 1 : 0);
}
/* 综合排序：先按 order（有 order 的在前），再按默认四级 */
function ganttSortRows(arr){
  return arr.slice().sort((a, b)=>{
    const oa = (typeof a.it.order === 'number') ? a.it.order : null;
    const ob = (typeof b.it.order === 'number') ? b.it.order : null;
    if(oa !== null && ob !== null){ if(oa !== ob) return oa - ob; return ganttDefaultCmp(a, b); }
    if(oa !== null) return -1;            // 有 order 的排前
    if(ob !== null) return 1;
    return ganttDefaultCmp(a, b);
  });
}

/* ============================================================
   【改动一】时间范围引擎：扫描「有计划以来」的全部日期
   ------------------------------------------------------------
   扫描 S.plans 四类的全部日期字段（due / weekOf / monthOf /
   startDate / endDate），取最早日期 minDate 与最晚日期 maxDate；
   并把「今天」纳入区间（至少覆盖到今天，只有未来计划时最晚日期
   也一定包含）。周/月视图据此铺满整个跨度，不再固定 12 格。
   ============================================================ */
function ganttScanSpan(){
  const today = todayStr();
  let mn = today, mx = today;          // 至少覆盖到今天
  const push = (ds)=>{
    if(!ds || typeof ds !== 'string') return;
    const d = ds.slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    if(d < mn) mn = d;
    if(d > mx) mx = d;
  };
  ['daily','weekly','monthly','overall'].forEach(type=>{
    (S.plans[type]||[]).forEach(it=>{
      push(it.due); push(it.weekOf); push(it.monthOf);
      push(it.startDate); push(it.endDate);
      /* 无显式日期的条目按其锚点推导出的真实区间参与扫描 */
      if(!it.due && !it.startDate && !it.endDate && !it.weekOf && !it.monthOf) return;
      const rng = ganttRangeOf(it, type);
      push(rng.s); push(rng.e);
    });
  });
  /* ===== 【复习计划】复习日期参与跨度扫描 =====
     艾宾浩斯曲线最后一轮在「纳入后第 60 天」，因此复习任务的结束日可能
     远晚于所有普通计划 —— 必须一并 push，周/月视图才能铺满到最晚复习日；
     同时把「纳入当天」也 push 进去，保证第一轮之前的时间轴完整。 */
  reviewList().forEach(rt=>{
    if(rt.active === false) return;               // 已关闭复习的不参与跨度
    push(rt.createdAt ? dstr(new Date(rt.createdAt)) : '');
    (rt.reviewPlan||[]).forEach(r=> push(r.date));
  });
  return { min:mn, max:mx };
}

/* ================= 【需求 1】甘特图导出 PDF =================
   设计要点：
   1) 弹窗内选时间范围（默认 = 当前视图范围），提供三个快捷按钮
      「当前视图范围 / 全部计划范围 / 自定义」；
   2) 确认后 new 一个窗口，写入一段「打印专用」HTML（A4 横向，宽度
      按 ~1047px 反算 px/天，保证整张表宽恰好一页、不横向溢出）；
   3) 纵向允许跨页，每行 page-break-inside:avoid；表头用 thead +
      display:table-header-group 让每页自动重复；
   4) 复用当前页面的筛选状态（ganttCollect 已按 GANTT_STATE 过滤）与
      排序结果（rows 参数即 ganttSortRows 输出），所见即所得；
   5) 保留：今天竖虚线、任务条色、条内进度浅色、已完成半透明、逾期 ⚠。
   注意：日期刻度行按天渲染，范围内天数很多时仅渲染间隔标签，避免过密。 */

/* A4 横向正文可用宽度（210×297mm，左右各留 10mm，按 96dpi ≈ 3.7795px/mm） */
const G_PDF_PAGE_W = Math.round((297 - 20) * 3.7795);   // ≈1047px

/* 导出弹窗：选时间范围 */
function ganttExportPdfDialog(meta, rows){
  const today = todayStr();
  const span = ganttScanSpan();
  /* 默认范围 = 当前视图范围 */
  const defS = meta.start;
  const defE = ganttAddDays(meta.start, meta.days - 1);
  const body =
    '<div style="font-size:12px;color:var(--text2);line-height:1.8;margin-bottom:10px;">'+
      '将导出 <b style="color:var(--pinkDeep2);">'+rows.length+'</b> 个任务（已应用当前筛选与排序），'+
      '版式为 <b>A4 横向</b>，宽度自适应一页。'+
    '</div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">'+
      '<button class="btn sm ghost" data-gpdf-set="view">当前视图范围</button>'+
      '<button class="btn sm ghost" data-gpdf-set="all">全部计划范围</button>'+
      '<button class="btn sm ghost" data-gpdf-set="today">最近 30 天</button>'+
    '</div>'+
    '<div class="row">'+
      '<div class="field"><label>开始日期</label><input class="inp" type="date" id="gPdfS" value="'+defS+'"></div>'+
      '<div class="field"><label>结束日期</label><input class="inp" type="date" id="gPdfE" value="'+defE+'"></div>'+
    '</div>'+
    '<div id="gPdfHint" style="font-size:11px;color:var(--text3);margin-top:8px;"></div>';
  openModal('📄 导出甘特图 PDF', body, [
    /* openModal 按钮协议：{ text, primary, onClick }（onClick 返回 false 则不关窗） */
    { text:'取消', onClick: ()=>true },
    { text:'生成并打印', primary:true, onClick: ()=>{
        const s = ($('#gPdfS')||{}).value, e = ($('#gPdfE')||{}).value;
        if(!s || !e){ toast('请选择开始与结束日期'); return false; }   // 返回 false 阻止关窗
        if(s > e){ toast('开始日期不能晚于结束日期'); return false; }
        const ok = ganttExportPdfCore(s, e, rows);
        return ok ? true : false;   // 成功关窗，失败留在弹窗
      } }
  ]);
  /* 快捷范围按钮 */
  const setRange = (s, e)=>{
    const a = $('#gPdfS'), b = $('#gPdfE');
    if(a) a.value = s; if(b) b.value = e;
    ganttPdfHint();
  };
  $$('#modal [data-gpdf-set]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const k = btn.dataset.gpdfSet;
      if(k === 'view') setRange(defS, defE);
      else if(k === 'all') setRange(span.min, span.max);
      else if(k === 'today') setRange(ganttAddDays(today,-29), today);
    });
  });
  ['#gPdfS','#gPdfE'].forEach(sel=>{ const el = $(sel); if(el) el.addEventListener('change', ganttPdfHint); });
  ganttPdfHint();
}
/* 弹窗内提示：当前范围天数 + 预计栏宽 */
function ganttPdfHint(){
  const s = ($('#gPdfS')||{}).value, e = ($('#gPdfE')||{}).value;
  const hint = $('#gPdfHint'); if(!hint) return;
  if(!s || !e || s > e){ hint.textContent = ''; return; }
  const days = ganttDaysBetween(s, e) + 1;
  const pxd  = Math.max(1, G_PDF_PAGE_W - 140) / days;   // 预留左侧 140px 任务名列
  hint.innerHTML = '共 <b>'+days+'</b> 天 · 每天约 <b>'+pxd.toFixed(2)+'</b> px · '+
    (days > 400 ? '<span style="color:#C77;">范围较大，刻度将按周/月密度抽样显示</span>' : '刻度按天显示');
}

/* 核心：生成打印 HTML 并打开新窗口 */
function ganttExportPdfCore(s, e, rows){
  const days = ganttDaysBetween(s, e) + 1;
  if(days <= 0){ toast('时间范围无效'); return false; }
  if(days > 2000){ toast('时间范围过大（上限 2000 天），请缩小范围'); return false; }
  const NAME_COL = 140;                                  // 左侧任务名列固定 140px
  const pxd = Math.max(1, G_PDF_PAGE_W - NAME_COL) / days;   // 每天像素（宽度自适应一页）
  const today = todayStr();
  const todayOff = ganttDaysBetween(s, today) * pxd + pxd/2;
  const showToday = todayOff >= 0 && todayOff <= days*pxd;

  /* 刻度标签密度：>150 天按周显示、>400 天按半月显示，避免文字重叠 */
  const tickStep = days > 400 ? 15 : (days > 150 ? 7 : (days > 60 ? 2 : 1));

  /* 刻度单元格（表头第一行） */
  const tickCell = (i)=>{
    const ds = ganttAddDays(s, i);
    const show = (i % tickStep === 0) || ds === today;
    const isToday = ds === today;
    return '<td class="tk'+(isToday?' tk-today':'')+'" style="width:'+pxd.toFixed(3)+'px;">'+
      (show ? ds.slice(5).replace('-','/') : '')+'</td>';
  };
  /* 月/年分组行（表头第一行）：按月份合并单元格 */
  let groupRow = '', gi = 0;
  while(gi < days){
    const ds = ganttAddDays(s, gi);
    const ym = ds.slice(0,7);
    let n = 0;
    while(gi + n < days && ganttAddDays(s, gi+n).slice(0,7) === ym) n++;
    const w = (pxd*n).toFixed(2);
    groupRow += '<td class="gp" colspan="'+n+'" style="width:'+w+'px;">'+ym.slice(0,4)+'年'+ym.slice(5,7)+'月</td>';
    gi += n;
  }
  const tickRow = (()=>{ let t=''; for(let i=0;i<days;i++) t += tickCell(i); return t; })();

  /* 单行任务（含多任务条 bars / 单条） */
  const rowHtml = (t)=>{
    const isReview = t.type === 'review';
    /* 多条目行：复习轮次条 / 同内容合并条都用 bars 渲染 */
    const isMulti = Array.isArray(t.bars) && t.bars.length > 0;
    const isMerged = isMulti && !isReview && Array.isArray(t.groupIds);
    const custom = !!t.it.color;
    const c = isReview
      ? (t.it.color || t.rt.sourceColor || '#FFFACD')
      : (t.it.color || ganttCatColor(t.it.cat));
    /* 条列表：带 bars 的走 bars；否则单条 */
    const barList = isMulti
      ? t.bars.map(b=>({ left: ganttDaysBetween(s, b.s)*pxd,
                         width: Math.max(6, (ganttDaysBetween(s,b.s)!==ganttDaysBetween(s,b.e))
                                              ? (ganttDaysBetween(s,b.e)-ganttDaysBetween(s,b.s)+1)*pxd
                                              : pxd),
                         pct: (b.pct===undefined||b.pct===null)?null:b.pct,
                         color: b.color || null,
                         cls: b.cls || '',
                         text: b.text || '' }))
      : [{ left: ganttDaysBetween(s, t.s)*pxd,
           width: Math.max(6, (ganttDaysBetween(s, t.e)-ganttDaysBetween(s, t.s)+1)*pxd),
           pct: t.pct,
           color: c,
           cls: (isReview?'rv':'')+(t.allOk?' allok':'')+(t.overdue?' ovd':''),
           text: isReview ? ((t.allOk?'✓ ':'')+'复习 '+t.reviewDone+'/'+t.reviewTotal+(t.overdue?' ⚠':''))
                          : ((t.allOk?'✓ ':'')+t.pct+'%'+(t.overdue?' ⚠':'')) }];
    const bars = barList.map((b, i)=>{
      const left = Math.max(0, b.left);
      const clipL = b.left < 0;
      const shift = (barList.length > 1) ? ((i%2)? 3 : -3) : 0;
      const top = 5 + shift;
      const bg = b.color || (b.cls.indexOf('rv') >= 0 ? '#FFFACD' : c);
      const isRvb = b.cls.indexOf('rv') >= 0;
      const txtColor = isRvb ? '#7A6420' : '#7A4A5A';
      const inner = (b.pct !== null && b.pct !== undefined)
        ? '<span class="bi" style="width:'+b.pct+'%;"></span>' : '';
      return '<span class="bar'+(b.cls.indexOf('allok')>=0?' allok':'')+(b.cls.indexOf('ovd')>=0?' ovd':'')+
        (isRvb?' rvb':'')+'"'+
        ' style="left:'+left.toFixed(2)+'px;width:'+b.width.toFixed(2)+'px;top:'+top+'px;'+
        'background:'+bg+';'+(clipL?'border-top-left-radius:0;border-bottom-left-radius:0;':'')+'color:'+txtColor+';">'+
        inner+'<i class="bt">'+esc(b.text)+'</i></span>';
    }).join('');
    return '<tr>'+
      '<td class="nm">'+esc(t.it.text)+
        (isReview ? ' <span class="tag rv">复习</span>' : '')+
        (isMerged ? ' <span class="tag mg">×'+t.bars.length+'</span>' : '')+
      '</td>'+
      '<td class="tr"><div class="trw" style="width:'+(days*pxd).toFixed(2)+'px;">'+
        (showToday ? '<span class="tl" style="left:'+todayOff.toFixed(2)+'px;"></span>' : '')+
        bars+
      '</div></td>'+
    '</tr>';
  };

  const bodyRows = rows.map(rowHtml).join('') ||
    '<tr><td class="nm">（无数据）</td><td class="tr"></td></tr>';

  const html =
'<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">'+
'<title>甘特图导出 '+s+' ~ '+e+'</title>'+
'<style>'+
  '@page{size:A4 landscape;margin:10mm;}'+
  '*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;}'+
  'body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#3A2E33;background:#fff;}'+
  '.hd{padding:0 0 8px;}'+
  '.hd h1{font-size:16px;margin:0 0 4px;}'+
  '.hd .mt{font-size:10px;color:#8A7A80;}'+
  'table{border-collapse:collapse;width:100%;table-layout:fixed;}'+
  'thead{display:table-header-group;}'+          /* 每页重复表头 */
  'tr{page-break-inside:avoid;break-inside:avoid;}'+
  'th,td{border:1px solid #EDE4E8;padding:0;font-size:9px;}'+
  'th.nm,td.nm{width:'+NAME_COL+'px;padding:2px 6px;font-size:10px;color:#4A3B41;'+
    'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#FFF7FA;text-align:left;}'+
  'th.nm{background:#FBEFF4;}'+
  '.tk{font-size:8px;color:#9A8A90;text-align:center;padding:1px 0;white-space:nowrap;overflow:hidden;}'+
  '.tk-today{color:#E4739A;font-weight:800;}'+
  '.gp{font-size:8px;color:#B08A9A;text-align:center;background:#FDF3F7;padding:1px 0;}'+
  'td.tr{position:relative;height:26px;vertical-align:middle;}'+
  '.trw{position:relative;height:26px;}'+
  '.tl{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed #E4739A;opacity:.7;}'+
  '.bar{position:absolute;height:16px;border-radius:999px;overflow:hidden;display:block;'+
    'box-shadow:0 1px 3px rgba(180,120,145,.20);}'+
  '.bar .bi{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.45);'+
    'border-radius:999px 0 0 999px;display:block;}'+
  '.bar .bt{position:relative;display:block;font-size:8px;font-weight:800;font-style:normal;'+
    'line-height:16px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}'+
  '.bar.allok{opacity:.55;}'+
  '.bar.ovd{border:1.5px solid #F58B7A;}'+
  '.bar.rvb{border:1px solid rgba(0,0,0,.10);}'+
  '.tag{font-size:8px;font-weight:800;border-radius:5px;padding:0 4px;}'+
  '.tag.rv{color:#8A6BB8;background:#F1EBFA;}'+
  '.tag.mg{color:#C26A8C;background:#FDEDF3;}'+
  '.ft{margin-top:8px;font-size:9px;color:#A7969C;}'+
'</style></head><body>'+
  '<div class="hd"><h1>甘特图 · 计划可视化</h1>'+
    '<div class="mt">时间范围：'+s+' ~ '+e+'（共 '+days+' 天）　任务数：'+rows.length+
    '　导出时间：'+new Date().toLocaleString('zh-CN')+'</div></div>'+
  '<table>'+
    '<thead>'+
      '<tr><th class="nm" rowspan="2">任务 / 日期</th>'+groupRow+'</tr>'+
      '<tr>'+tickRow+'</tr>'+
    '</thead>'+
    '<tbody>'+bodyRows+'</tbody>'+
  '</table>'+
  '<div class="ft">虚线 = 今天　·　条内浅色 = 打卡/复习进度　·　半透明 = 已完成　·　⚠/红框 = 逾期　·　淡黄条 = 复习任务（每轮一条）</div>'+
  '<script>window.onload=function(){setTimeout(function(){window.print();},260);};<\/script>'+
'</body></html>';

  const w = window.open('', '_blank');
  if(!w){ toast('浏览器拦截了新窗口，请允许弹窗后重试'); return false; }
  /* 写入过程整体兜底：个别环境 document.open/write 抛错时给出明确提示，
     不让异常冒泡打断主页面 */
  try{
    w.document.open();
    w.document.write(html);
    w.document.close();
  }catch(err){
    toast('打印窗口写入失败，请检查浏览器弹窗/打印设置后重试');
    return false;
  }
  toast('已生成甘特图 PDF 预览，请在打印窗口选择「另存为 PDF」');
  return true;
}

/* ---------- 时间轴视图定义（全部以「天」为最小单位线性映射像素） ----------
   day   ：固定「近 30 天」窗口（今天前 6 天 + 后 23 天）——需界面说明
   week  ：【改动一】最早计划所在周周一 → 最晚计划所在周周日（格宽 64/7 px）
   month ：【改动一】最早计划所在月 1 号 → 最晚计划所在月最后一天（2.8 px/天）
   返回值额外带 unit / slots（格数）/ curSlot（当前格下标）供刻度与滚动定位。 */
function ganttViewMeta(view){
  const today = todayStr();
  const span = ganttScanSpan();
  if(view === 'day'){
    /* 日视图保持「近 30 天」：逐日格宽 34px，跨度小、便于精读单日 */
    const start = ganttAddDays(today, -6);
    return { start, days:30, pxd:34, unit:'day', slots:30, curSlot:6,
             label:start+' ~ '+ganttAddDays(start,29), note:'固定近 30 天' };
  }
  if(view === 'week'){
    /* 【改动一】覆盖「有计划以来」全部周：最早周周一 → 最晚周周日 */
    const start = weekRangeFromDate(span.min)[0];         // 最早计划所在周的周一
    const endSun = weekRangeFromDate(span.max)[6];        // 最晚计划所在周的周日
    const days = ganttDaysBetween(start, endSun) + 1;
    const slots = Math.round(days / 7);
    const curSlot = Math.floor(ganttDaysBetween(start, weekRangeFromDate(today)[0]) / 7);
    return { start, days, pxd:64/7, unit:'week', slots, curSlot,
             label:start+' ~ '+endSun, note:'覆盖全部计划周（'+slots+' 周）' };
  }
  /* 【改动一】月视图覆盖「有计划以来」全部月：最早月 1 号 → 最晚月最后一天 */
  const mFirst = span.min.slice(0,7);                     // 最早月 YYYY-MM
  const mLast  = span.max.slice(0,7);                     // 最晚月 YYYY-MM
  const start = mFirst+'-01';
  const y = +mLast.slice(0,4), m = +mLast.slice(5,7);
  const end = dstr(new Date(y, m, 0));                    // 最晚月最后一天
  const days = ganttDaysBetween(start, end) + 1;
  const nMonths = (y - +mFirst.slice(0,4))*12 + (m - +mFirst.slice(5,7)) + 1;
  const curSlot = (+today.slice(0,4) - +mFirst.slice(0,4))*12 + (+today.slice(5,7) - +mFirst.slice(5,7));
  return { start, days, pxd:2.8, unit:'month', slots:nMonths, curSlot,
           label:mFirst+' ~ '+mLast, note:'覆盖全部计划月（'+nMonths+' 个月）' };
}

/* ---------- 甘特图页面 ---------- */
PAGES.gantt = function(){
  if(!GANTT_STATE.view || !GANTT_STATE.userView) GANTT_STATE.view = ganttIsMobile() ? 'month' : 'week';
  const view = GANTT_STATE.view;
  const meta = ganttViewMeta(view);
  const isMob = ganttIsMobile();
  const NAME_W = isMob ? 100 : 160;
  const today = todayStr();

  /* 筛选（cat / stage / ptype） */
  /* 筛选（cat / stage / ptype）
     【复习计划】复习任务行按「来源分类 / 来源阶段」参与筛选，
     但阶段筛选对「来源无阶段」的复习任务不拦截（与普通计划一致：无阶段的任务不因阶段筛选被隐藏）。 */
  const all = ganttCollect();
  const tasks = all.filter(t=>{
    if(GANTT_STATE.cat && t.it.cat !== GANTT_STATE.cat) return false;
    /* 阶段筛选：复习任务若无来源阶段则视为「不命中任何具体阶段」，仅在选「全部阶段」时显示 */
    if(GANTT_STATE.stage && t.it.stage !== GANTT_STATE.stage) return false;
    if(GANTT_STATE.ptype && t.type !== GANTT_STATE.ptype) return false;
    return true;
  });
  /* 只画与时间窗有交集的任务条；【改动二】按「order + 四级默认排序」排 */
  const winEnd = ganttAddDays(meta.start, meta.days - 1);
  const rows = ganttSortRows(tasks.filter(t=> t.s <= winEnd && t.e >= meta.start));

  /* 刻度格 —— 【改动一】覆盖全跨度。
     · 周视图：逐周 <=> 每周格 7*pxd px，显示 MM/DD（当周主色高亮）
     · 月视图：逐月 <=> 每月按实际天数 * pxd px，显示 YYYY/MM（当月主色高亮）
     · 日视图：逐日（隔 4 天显示日期，今天高亮）
     总格数 > 400 时刻度行按「分块渲染」：默认只渲染当前格前后各 CHUNK
     个，其余以占位块填充，滚动时补渲染（见下方 ensureTicks）。 */
  const TICK_CHUNK = 12;                 // 每块 12 格（用户建议的 12 格一组）
  const needVirtual = meta.slots > 400;  // >400 天/格量级才启用分块

  /* 单格刻度 HTML */
  function tickCellAt(i){
    if(meta.unit === 'week'){
      const ds = ganttAddDays(meta.start, i*7);
      const isCur = i === meta.curSlot;
      const col = isCur ? 'var(--pinkDeep2)' : 'var(--text3)';
      const txt = isCur ? '<b>'+ds.slice(5).replace('-','/')+'</b>' : ds.slice(5).replace('-','/');
      return '<div class="g-tick" style="flex:none;width:'+(7*meta.pxd)+'px;text-align:center;'+
             'border-left:1px solid var(--line);font-size:10px;color:'+col+';padding:3px 0;white-space:nowrap;overflow:hidden;">'+
             txt+'</div>';
    }
    if(meta.unit === 'month'){
      const y = +meta.start.slice(0,4), m = +meta.start.slice(5,7);
      const cur = new Date(y, m-1+i, 1);
      const dim = new Date(cur.getFullYear(), cur.getMonth()+1, 0).getDate();
      const key = cur.getFullYear()+'-'+pad2(cur.getMonth()+1);
      const isCur = i === meta.curSlot;
      const col = isCur ? 'var(--pinkDeep2)' : 'var(--text3)';
      const txt = isCur ? '<b>'+key.replace('-','/')+'</b>' : key.replace('-','/');
      return '<div class="g-tick" style="flex:none;width:'+(dim*meta.pxd)+'px;text-align:center;'+
             'border-left:1px solid var(--line);font-size:10px;color:'+col+';padding:3px 0;white-space:nowrap;overflow:hidden;">'+
             txt+'</div>';
    }
    /* day */
    const ds = ganttAddDays(meta.start, i);
    const dow = new Date(ds+'T00:00:00').getDay();
    const isToday = ds === today;
    const tickColor = isToday ? 'var(--pinkDeep2)' : 'var(--text3)';
    return '<div class="g-tick" style="flex:none;width:'+meta.pxd+'px;text-align:center;border-left:1px solid var(--line);'+
           'font-size:9px;color:'+tickColor+';padding:3px 0;white-space:nowrap;">'+
           (i%4===0 || isToday ? ds.slice(5).replace('-','/') : '&nbsp;')+'</div>';
  }
  /* 占位块宽度（未渲染的连续格合并成一个占位 div） */
  function tickPlaceholder(from, to){
    let w = 0;
    for(let i=from; i<=to; i++){
      if(meta.unit === 'week') w += 7*meta.pxd;
      else if(meta.unit === 'month'){
        const cur = new Date(+meta.start.slice(0,4), +meta.start.slice(5,7)-1+i, 1);
        w += new Date(cur.getFullYear(), cur.getMonth()+1, 0).getDate()*meta.pxd;
      } else w += meta.pxd;
    }
    return '<div class="g-tick-ph" data-ph-from="'+from+'" data-ph-to="'+to+'" style="flex:none;width:'+w+'px;height:100%;"></div>';
  }
  /* 全量刻度（不虚拟化时直接顺序渲染） */
  function ticksFull(){
    let cells = '';
    for(let i=0;i<meta.slots;i++) cells += tickCellAt(i);
    return cells;
  }
  /* 分块渲染：只渲染 [curSlot-CHUNK, curSlot+CHUNK] 及各已展开块 */
  function ticksChunked(){
    const lo = Math.max(0, meta.curSlot - TICK_CHUNK);
    const hi = Math.min(meta.slots-1, meta.curSlot + TICK_CHUNK);
    let cells = '';
    if(lo > 0) cells += tickPlaceholder(0, lo-1);
    for(let i=lo;i<=hi;i++) cells += tickCellAt(i);
    if(hi < meta.slots-1) cells += tickPlaceholder(hi+1, meta.slots-1);
    return cells;
  }
  function ticks(){ return needVirtual ? ticksChunked() : ticksFull(); }

  /* 任务条行
     【改动二】任务名前加 ⠿ 拖拽把手（.drag-handle），行元素带 data-grow
     （type|id）供拖拽排序定位；
     【改动三】条色优先取任务自定义 color，否则退回分类马卡龙色。
     【需求 3 / 4】带 bars 的行（复习轮次条 / 同内容合并条）走 ganttBarsHtml
     统一渲染多条；无 bars 的行保持原来的单条渲染，行为完全不变。 */
  function rowOf(t){
    const isReview = t.type === 'review';
    /* 复习行也带 bars（轮次条），但它属于「一轮一条」而非「同内容合并」，
       故 isMulti（多条目渲染）与 isMerged（同内容合并行）要分开判断，
       避免复习行被误标 g-row-merged / ×N 徽标。 */
    const isMulti  = Array.isArray(t.bars) && t.bars.length > 0;
    const isMerged = isMulti && !isReview && Array.isArray(t.groupIds);
    const custom = !!t.it.color;                                 // 是否自定义颜色
    /* 复习任务颜色优先级：自定义 > 来源任务色 > 默认淡柠檬黄（CSS 内定义） */
    const c = isReview
      ? (t.it.color || t.rt.sourceColor || REVIEW_BAR_COLOR)
      : (t.it.color || ganttCatColor(t.it.cat));
    const offS = Math.max(0, ganttDaysBetween(meta.start, t.s)) * meta.pxd;
    const offE = Math.min(meta.days, ganttDaysBetween(meta.start, t.e) + 1) * meta.pxd;
    const wPx = Math.max(6, offE - offS);
    const clipL = ganttDaysBetween(meta.start, t.s) < 0;         // 起点在窗口左侧被裁剪
    /* 【改动三】tooltip 追加颜色信息；【复习计划】复习任务用专属 tooltip */
    let tip;
    if(isReview){
      const rt = t.rt;
      const lines = (rt.reviewPlan||[]).map(r=>
        '  第'+r.round+'轮  '+r.date+'  '+(r.status==='done'?'✓ 已完成':'待复习')).join('\n');
